<!doctype html>
<meta charset="utf-8">
<title>Moving</title>
<script>
// Opened in a hidden frame by the arcade's main address after a player moves
// over from this one (src/move.js). Hands this address's saved data to it,
// and only to it.
(function () {
  var allowed = ['https://arcade.novalabsos.com', 'https://play.novalabsos.com']
  var to = new URLSearchParams(location.search).get('to')
  if (window.parent === window || allowed.indexOf(to) < 0) return
  var data = {}
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i)
      if (k && k.indexOf('vela:') === 0) data[k] = localStorage.getItem(k)
    }
  } catch (e) {}
  window.parent.postMessage({ source: 'vela-move', data: data }, to)
})()
</script>
