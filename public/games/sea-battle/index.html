<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Sea Battle</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --water: #16181c;
    --ship: #8a8f99;
    --miss: #5d626c;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --pad: 16px;
    --gap: 12px;
    --c: 30px;      /* cell size, set from JS */
    --lab: 16px;    /* coordinate label strip */
    --lf: 10px;     /* coordinate label font size */
    --in: 3px;      /* ship inset inside its cells */
    --d: 20px;      /* dock cell size */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .screen {
    position: fixed; inset: 0;
    display: none;
    padding: var(--pad);
    visibility: hidden;
  }
  .screen.on { display: flex; }
  .ready .screen.on { visibility: visible; }

  /* ---------- shared bits ---------- */
  .brand h1 {
    margin: 0;
    font: 600 1.05em/1 var(--font);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .brand h1::before {
    content: "";
    display: inline-block;
    width: 0.62em; height: 0.62em;
    margin-right: 0.62em;
    background: var(--brand);
    vertical-align: 0.02em;
  }
  .brand p { margin: 0.6em 0 0; color: var(--muted); font-size: 0.86em; line-height: 1.45; }
  .lab {
    display: block;
    font: 600 0.7em/1.2 var(--font);
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 3.3em;
    padding: 0 1.25em;
    border-radius: 0;
    border: 1px solid var(--outline);
    background: transparent;
    font: 600 0.76em var(--font);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), opacity 180ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.armed, .btn.armed:hover { background: var(--surface); border-color: var(--brand); color: var(--brand-hover); }
  .btn.wait { opacity: 0.6; pointer-events: none; }

  .seg { display: flex; }
  .seg button {
    flex: 1;
    height: 3em;
    border: 1px solid var(--outline);
    border-radius: 0;
    background: transparent;
    font: 600 0.76em var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer;
    transition: background 180ms var(--ease), border-color 180ms var(--ease);
  }
  .seg button + button { margin-left: -1px; }
  .seg button:hover { background: rgba(255, 255, 255, 0.08); }
  .seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; position: relative; z-index: 1; }
  .seg button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; position: relative; z-index: 2; }

  .inp {
    width: 100%; min-width: 0;
    height: 3.1em;
    padding: 0 0.85em;
    background: var(--bg);
    border: 1px solid var(--outline);
    border-radius: 0;
    outline: none;
    font: 400 0.9em var(--font);
    user-select: text; -webkit-user-select: text;
    transition: border-color 180ms var(--ease);
  }
  .inp:focus { border-color: var(--brand); }
  .inp.code { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }
  .inp:disabled { opacity: 0.35; }

  /* ---------- menu ---------- */
  #scrMenu { align-items: center; justify-content: center; }
  .menu { width: min(100%, 46em); display: grid; gap: 1.3em; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75em; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1.1em;
    display: flex; flex-direction: column; gap: 0.75em;
  }
  .panel .grow { flex: 1; }
  .panel .row { display: flex; gap: 0.5em; }
  .panel .row .btn { flex: none; }
  .panel .msg { margin: 0; min-height: 1.3em; font-size: 0.82em; line-height: 1.4; color: var(--muted); }
  .panel .msg.err { color: var(--brand-hover); }
  .panel.off .lab, .panel.off .row, .panel.off .inp { opacity: 0.5; }
  @media (max-width: 600px) {
    .panels { grid-template-columns: 1fr; }
    .menu { gap: 1em; }
    .panel { padding: 0.9em; gap: 0.6em; }
  }

  /* ---------- lobby ---------- */
  #scrLobby { align-items: center; justify-content: center; }
  .lobby { width: min(100%, 26em); display: grid; gap: 1.2em; }
  .lobby .panel { gap: 0.9em; }
  .codebig {
    font: 300 3.2em/1 var(--font-display);
    letter-spacing: 0.14em;
    font-variant-numeric: tabular-nums;
    user-select: text; -webkit-user-select: text;
  }
  .linktext {
    font-size: 0.78em; color: var(--muted);
    word-break: break-all;
    user-select: text; -webkit-user-select: text;
  }
  .lobby .btns { display: flex; gap: 0.5em; }
  .lobby .btns .btn { flex: 1; }
  .waiting { display: flex; align-items: center; gap: 0.7em; color: var(--muted); font-size: 0.86em; }
  .waiting i { width: 0.6em; height: 0.6em; background: var(--brand); animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ---------- game screen ---------- */
  #scrGame { flex-direction: column; align-items: center; justify-content: center; gap: var(--gap); }
  .gbar, .status, .note, .foot, .tabs { width: 100%; max-width: var(--maxw, 100%); flex: none; }
  .gbar { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  .gbar .brand { min-width: 0; display: flex; align-items: baseline; gap: 1em; }
  .gbar .sub { font-size: 0.8em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .gbar .btn { height: 2.9em; }

  .status {
    display: flex; align-items: center; justify-content: space-between; gap: 1em;
    min-height: 3.6em;
    padding: 0.55em 0.9em;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .st-main { min-width: 0; }
  .st-big {
    font: 300 1.65em/1.1 var(--font-display);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .st-big.hot { color: var(--brand-hover); }
  .st-big.pop { animation: pop 240ms var(--ease); }
  .st-small { font-size: 0.8em; color: var(--muted); margin-top: 0.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag {
    flex: none;
    padding: 0.5em 0.65em;
    border: 1px solid var(--outline);
    border-radius: 0;
    font: 600 0.64em/1 var(--font);
    letter-spacing: 0.16em; text-transform: uppercase;
    white-space: nowrap;
  }
  .tag.me { background: var(--brand); border-color: var(--brand); color: #fff; }
  .note {
    padding: 0.6em 0.9em;
    border: 1px solid var(--brand);
    color: var(--brand-hover);
    font: 600 0.72em/1.3 var(--font);
    letter-spacing: 0.12em; text-transform: uppercase;
  }

  .tabs { display: flex; }
  .tabs button { position: relative; }
  .tabs button.ping::after {
    content: ""; position: absolute; right: 0.7em; top: 50%;
    width: 0.5em; height: 0.5em; margin-top: -0.25em;
    background: var(--brand);
  }
  .tabs button.on.ping::after { background: #fff; }

  .field {
    flex: 0 0 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    gap: calc(var(--gap) * 2);
  }
  .field.place-col { flex-direction: column; gap: var(--gap); }
  .field.one .side { display: none; }
  .field.one.v-target .side[data-side="theirs"], .field.one.v-fleet .side[data-side="mine"] { display: block; }
  .field.place .side[data-side="theirs"] { display: none; }

  .side { flex: none; }
  .side-head {
    display: flex; align-items: center; justify-content: space-between; gap: 0.8em;
    height: 1.7em;
    margin-left: var(--lab);
    margin-bottom: 0.25em;
  }
  .side-head .lab { transition: color 180ms var(--ease); }
  .side.active .side-head .lab { color: var(--brand-hover); }
  .roster { display: flex; gap: 6px; align-items: center; }
  .roster span { display: flex; gap: 1px; }
  .roster i { width: 5px; height: 5px; background: rgba(255, 255, 255, 0.45); }
  .roster span.sunk i { background: var(--brand); }

  /* ---------- boards ---------- */
  .board {
    position: relative;
    display: grid;
    grid-template-columns: var(--lab) calc(var(--c) * 10 + 9px);
    grid-template-rows: var(--lab) calc(var(--c) * 10 + 9px);
  }
  .bx, .by { display: grid; gap: 1px; }
  .bx { grid-column: 2; grid-row: 1; grid-template-columns: repeat(10, var(--c)); }
  .by { grid-column: 1; grid-row: 2; grid-template-rows: repeat(10, var(--c)); }
  .bx span, .by span {
    display: grid; place-items: center;
    font: 600 var(--lf)/1 var(--font);
    color: rgba(255, 255, 255, 0.4);
    transition: color 120ms var(--ease);
  }
  .bx span { align-items: end; padding-bottom: 3px; }
  .by span { justify-items: end; padding-right: 5px; }
  .bx span.on, .by span.on { color: var(--brand-hover); }
  .water {
    grid-column: 2; grid-row: 2;
    position: relative;
    display: grid;
    grid-template-columns: repeat(10, var(--c));
    grid-template-rows: repeat(10, var(--c));
    gap: 1px;
    background: #0b0c0f;
    outline: 1px solid var(--line);
    touch-action: none;
    transition: outline-color 180ms var(--ease), opacity 180ms var(--ease);
  }
  .water > i { background: var(--water); }
  .side.active .water { outline-color: var(--brand); cursor: crosshair; }
  .side.idle .water { opacity: 0.72; }
  .field.place .water { cursor: default; }
  .ly { position: absolute; inset: 0; pointer-events: none; }
  .ly > * {
    position: absolute;
    left: calc(var(--x) * (var(--c) + 1px));
    top: calc(var(--y) * (var(--c) + 1px));
    width: var(--c); height: var(--c);
  }
  .ly > .h { width: calc(var(--l) * var(--c) + (var(--l) - 1) * 1px); }
  .ly > .v { height: calc(var(--l) * var(--c) + (var(--l) - 1) * 1px); }

  .band { background: rgba(255, 255, 255, 0.045); }
  .band.row { left: 0; width: 100%; }
  .band.col { top: 0; height: 100%; }
  .cur { border: 1px solid var(--brand); }

  .ship::before { content: ""; position: absolute; inset: var(--in); background: var(--ship); }
  .ship.ghosted::before { background: rgba(138, 143, 153, 0.45); }
  .ship.lift { opacity: 0.35; }
  .ship.nope::before { animation: nope 300ms linear; }
  @keyframes nope { 0%, 60% { background: var(--brand-dark); } }
  .pv::before { content: ""; position: absolute; inset: var(--in); background: rgba(138, 143, 153, 0.8); }
  .pv.bad::before { background: transparent; border: 1px solid var(--brand); }

  .mk::before { content: ""; position: absolute; }
  .mk.hit::before { inset: calc(var(--c) * 0.2); background: var(--brand); }
  .mk.miss::before { inset: calc(var(--c) * 0.39); background: var(--miss); }
  .mk.sk::before { inset: 0; background: var(--brand); }
  .mk.pend::before { inset: calc(var(--c) * 0.2); border: 1px solid var(--brand); animation: blink 0.8s steps(2, jump-none) infinite; }
  .mk.new::before { animation: pop 220ms var(--ease); }
  .sko { border: 1px solid #fff; margin: -1px 0 0 -1px; padding: 0; }
  .sko.h { width: calc(var(--l) * var(--c) + (var(--l) - 1) * 1px + 2px); height: calc(var(--c) + 2px); }
  .sko.v { height: calc(var(--l) * var(--c) + (var(--l) - 1) * 1px + 2px); width: calc(var(--c) + 2px); }
  .sko.new { animation: fadein 300ms var(--ease) both; }
  @keyframes pop { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes fadein { from { opacity: 0; } }

  .pt {
    position: absolute; left: 0; top: 0;
    width: var(--sz); height: var(--sz);
    margin: calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2);
    background: var(--pc);
    animation: splash 420ms cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
  }
  @keyframes splash {
    from { transform: translate(var(--x0), var(--y0)); opacity: 1; }
    to   { transform: translate(var(--x1), var(--y1)) rotate(var(--rot)) scale(0.4); opacity: 0; }
  }
  .board.shake { animation: shake 260ms linear; }
  @keyframes shake {
    20% { transform: translate(-3px, 1px); } 40% { transform: translate(3px, -1px); }
    60% { transform: translate(-2px, 0); } 80% { transform: translate(2px, 1px); }
  }

  /* ---------- dock (placement) ---------- */
  .dock { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6em 1.1em; flex: none; }
  .dock.side { flex-direction: column; flex-wrap: nowrap; gap: 0.75em; justify-content: center; }
  .dk { display: flex; flex-direction: column; gap: 0.35em; cursor: grab; touch-action: none; padding: 2px; }
  .dk-name { font: 600 0.66em/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .dk-ship { display: flex; gap: 1px; }
  .dk-ship i { width: var(--d); height: var(--d); background: var(--ship); }
  .dk.placed { opacity: 0.28; }
  .dk.sel .dk-name { color: var(--brand-hover); }
  .dk.sel .dk-ship { outline: 1px solid var(--brand); outline-offset: 2px; }
  .dk:hover .dk-ship i { background: #a3a8b1; }
  .dk.placed:hover .dk-ship i { background: var(--ship); }
  .ghost { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; display: flex; gap: 1px; opacity: 0.85; }
  .ghost.v { flex-direction: column; }
  .ghost i { width: var(--c); height: var(--c); background: var(--ship); }

  .foot { display: flex; gap: 0.5em; justify-content: center; }
  .foot .btn { flex: 1 1 0; max-width: 14em; }

  /* ---------- end card ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: rgba(0, 0, 0, 0.78);
    opacity: 0;
    transition: opacity 220ms var(--ease);
  }
  .overlay.show { opacity: 1; }
  .card {
    width: min(86%, 21em);
    padding: 1.4em 1.4em 1.3em;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    transform: translateY(24px);
    transition: transform 300ms var(--ease);
  }
  .overlay.show .card { transform: none; }
  .card h2 { margin: 0; font: 600 0.95em/1 var(--font); letter-spacing: 0.2em; text-transform: uppercase; }
  .card .sub { margin: 0.7em 0 0; color: var(--muted); font-size: 0.86em; line-height: 1.4; min-height: 1.2em; }
  .ov-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 1em; border: 1px solid var(--line); border-radius: 2px; }
  .ov-stats > div { padding: 0.75em 0.85em 0.8em; }
  .ov-stats > div + div { border-left: 1px solid var(--line); }
  .ov-stats .num { display: block; font: 300 2.2em/1.1 var(--font-display); font-variant-numeric: tabular-nums; margin-top: 0.1em; }
  .card .btns { display: flex; gap: 0.5em; margin-top: 1.1em; flex-wrap: wrap; }
  .card .btns .btn { flex: 1 1 8em; }

  @media (prefers-reduced-motion: reduce) {
    .mk.new::before, .sko.new, .st-big.pop { animation: none; }
    .board.shake { animation: none; }
    .pt { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <section class="screen" id="scrMenu">
    <div class="menu">
      <div class="brand">
        <h1>Sea Battle</h1>
        <p>Drag your ships onto the grid, then tap the enemy grid to fire. Sink all five ships to win.</p>
      </div>
      <div class="panels">
        <div class="panel">
          <span class="lab">Vs computer</span>
          <div class="seg" id="levelSeg" role="group" aria-label="Level">
            <button type="button" data-level="easy">Easy</button>
            <button type="button" data-level="normal">Normal</button>
            <button type="button" data-level="hard">Hard</button>
          </div>
          <p class="msg" id="levelMsg"></p>
          <div class="grow"></div>
          <div class="row">
            <button class="btn primary" id="cpuPlay" type="button" style="flex:1">Play</button>
            <button class="btn" id="cpuResume" type="button" style="flex:1" hidden>Resume</button>
          </div>
        </div>
        <div class="panel" id="onlinePanel">
          <span class="lab">Online</span>
          <input class="inp" id="nameIn" type="text" maxlength="20" placeholder="Your name" autocomplete="off" spellcheck="false" aria-label="Your name">
          <button class="btn primary" id="createBtn" type="button">Create room</button>
          <div class="row">
            <input class="inp code" id="codeIn" type="text" maxlength="6" placeholder="Code" autocomplete="off" spellcheck="false" aria-label="Room code">
            <button class="btn" id="joinBtn" type="button">Join</button>
          </div>
          <p class="msg" id="onlineMsg"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="scrLobby">
    <div class="lobby">
      <div class="brand"><h1>Sea Battle</h1></div>
      <div class="panel">
        <span class="lab">Room code</span>
        <div class="codebig" id="lobbyCode">------</div>
        <div class="linktext" id="lobbyLink"></div>
        <div class="btns">
          <button class="btn primary" id="copyBtn" type="button">Copy link</button>
          <button class="btn" id="lobbyLeave" type="button">Leave</button>
        </div>
        <div class="waiting"><i></i><span id="lobbyWait">Waiting for a second player.</span></div>
      </div>
    </div>
  </section>

  <section class="screen" id="scrGame">
    <header class="gbar">
      <div class="brand"><h1>Sea Battle</h1><span class="sub" id="gSub"></span></div>
      <button class="btn" id="menuBtn" type="button">Menu</button>
    </header>
    <div class="status" id="status" aria-live="polite">
      <div class="st-main"><div class="st-big" id="stBig"></div><div class="st-small" id="stSmall"></div></div>
      <span class="tag" id="turnTag" hidden></span>
    </div>
    <div class="note" id="note" hidden></div>
    <div class="tabs seg" id="tabs" hidden>
      <button type="button" data-view="target">Target</button>
      <button type="button" data-view="fleet">Your fleet</button>
    </div>
    <div class="field" id="field">
      <div class="side" data-side="mine" id="sideMine">
        <div class="side-head"><span class="lab">Your fleet</span><span class="roster" id="rosterMine"></span></div>
        <div class="board" id="boardMine"></div>
      </div>
      <div class="side" data-side="theirs" id="sideTheirs">
        <div class="side-head"><span class="lab" id="theirsLab">Target</span><span class="roster" id="rosterTheirs"></span></div>
        <div class="board" id="boardTheirs"></div>
      </div>
      <div class="dock" id="dock"></div>
    </div>
    <footer class="foot" id="foot"></footer>
  </section>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-live="polite">
      <h2 id="ovTitle"></h2>
      <p class="sub" id="ovSub"></p>
      <div class="ov-stats">
        <div><span class="lab">Shots</span><span class="num" id="ovShots">0</span></div>
        <div><span class="lab">Hit rate</span><span class="num" id="ovRate">0%</span></div>
      </div>
      <div class="btns" id="ovBtns"></div>
    </div>
  </div>
</div>

<script src="../_shared/bridge.js" data-game="sea-battle"></script>
<script>
(function () {
  'use strict';

  const V = window.Vela || { embedded: false, ready() {}, onPause() {} };
  const SLUG = 'sea-battle';

  /* ===== LOGIC (pure, no DOM) ===== */
  const N = 10;
  const SHIPS = [
    { id: 'carrier', name: 'Carrier', len: 5 },
    { id: 'cruiser', name: 'Cruiser', len: 4 },
    { id: 'destroyer', name: 'Destroyer', len: 3 },
    { id: 'submarine', name: 'Submarine', len: 3 },
    { id: 'patrol', name: 'Patrol boat', len: 2 },
  ];
  const SHIP = {};
  SHIPS.forEach((s) => { SHIP[s.id] = s; });
  const COLS = 'ABCDEFGHIJ';
  const coord = (x, y) => COLS[x] + (y + 1);
  const key = (x, y) => y * N + x;
  const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];

  function cellsOf(s) {
    const L = SHIP[s.id].len, out = [];
    for (let i = 0; i < L; i++) out.push(s.d === 'h' ? [s.x + i, s.y] : [s.x, s.y + i]);
    return out;
  }
  function inBounds(s) {
    const L = SHIP[s.id].len;
    if (s.x < 0 || s.y < 0) return false;
    return s.d === 'h' ? s.x + L <= N && s.y < N : s.y + L <= N && s.x < N;
  }
  // Ships may not overlap; touching is allowed.
  function fits(fleet, s) {
    if (!inBounds(s)) return false;
    const occ = new Set();
    fleet.forEach((o) => { if (o.id !== s.id) cellsOf(o).forEach(([x, y]) => occ.add(key(x, y))); });
    return cellsOf(s).every(([x, y]) => !occ.has(key(x, y)));
  }
  function validFleet(f) {
    if (!Array.isArray(f) || f.length !== SHIPS.length) return false;
    const ids = new Set(), occ = new Set();
    for (const s of f) {
      if (!s || !SHIP[s.id] || ids.has(s.id) || (s.d !== 'h' && s.d !== 'v')) return false;
      if (!Number.isInteger(s.x) || !Number.isInteger(s.y) || !inBounds(s)) return false;
      ids.add(s.id);
      for (const [x, y] of cellsOf(s)) { const k = key(x, y); if (occ.has(k)) return false; occ.add(k); }
    }
    return true;
  }
  const cleanFleet = (f) => f.map((s) => ({ id: s.id, x: s.x, y: s.y, d: s.d }));
  function shipAt(fleet, x, y) {
    return fleet.find((s) => cellsOf(s).some(([cx, cy]) => cx === x && cy === y)) || null;
  }
  function randomFleet() {
    for (;;) {
      const f = [];
      let ok = true;
      for (const sh of SHIPS) {
        let placed = false;
        for (let t = 0; t < 200 && !placed; t++) {
          const d = Math.random() < 0.5 ? 'h' : 'v';
          const s = { id: sh.id, d, x: rnd(d === 'h' ? N - sh.len + 1 : N), y: rnd(d === 'v' ? N - sh.len + 1 : N) };
          if (fits(f, s)) { f.push(s); placed = true; }
        }
        if (!placed) { ok = false; break; }
      }
      if (ok) return f;
    }
  }

  // The defender's answer to a shot at (x, y), given earlier shots at the same fleet.
  // A plain hit does not name the ship; a sinking names it and gives its position.
  function resolveShot(fleet, prior, x, y) {
    const hit = new Set();
    prior.forEach((s) => { if (s.result === 'hit' || s.result === 'sunk') hit.add(key(s.x, s.y)); });
    const ship = shipAt(fleet, x, y);
    if (!ship) return { result: 'miss' };
    hit.add(key(x, y));
    const allHit = (s) => cellsOf(s).every(([cx, cy]) => hit.has(key(cx, cy)));
    if (!allHit(ship)) return { result: 'hit' };
    return { result: 'sunk', ship: ship.id, sx: ship.x, sy: ship.y, sd: ship.d, allSunk: fleet.every(allHit) };
  }

  /* ----- computer player ----- */
  // What a shooter knows: 0 unknown, 1 miss, 2 hit (ship still afloat), 3 sunk ship.
  function knowledge(shots) {
    const k = new Array(N * N).fill(0);
    const sunk = new Set();
    for (const s of shots) {
      if (!s.result) continue;
      const i = key(s.x, s.y);
      if (s.result === 'miss') k[i] = 1;
      else if (s.result === 'hit') { if (k[i] !== 3) k[i] = 2; }
      else if (s.result === 'sunk' && SHIP[s.ship]) {
        sunk.add(s.ship);
        cellsOf({ id: s.ship, x: s.sx, y: s.sy, d: s.sd }).forEach(([x, y]) => { k[key(x, y)] = 3; });
      }
    }
    return { k, remaining: SHIPS.filter((s) => !sunk.has(s.id)).map((s) => s.len) };
  }

  function targetCells(k) {
    const at = (x, y) => (x < 0 || y < 0 || x >= N || y >= N ? -1 : k[key(x, y)]);
    const hits = [];
    for (let i = 0; i < N * N; i++) if (k[i] === 2) hits.push(i);
    if (!hits.length) return [];
    // Two or more hits in a line: keep going along that line.
    const line = new Set();
    for (const i of hits) {
      const x = i % N, y = (i / N) | 0;
      if (at(x - 1, y) === 2 || at(x + 1, y) === 2) {
        let a = x, b = x;
        while (at(a - 1, y) === 2) a--;
        while (at(b + 1, y) === 2) b++;
        if (at(a - 1, y) === 0) line.add(key(a - 1, y));
        if (at(b + 1, y) === 0) line.add(key(b + 1, y));
      }
      if (at(x, y - 1) === 2 || at(x, y + 1) === 2) {
        let a = y, b = y;
        while (at(x, a - 1) === 2) a--;
        while (at(x, b + 1) === 2) b++;
        if (at(x, a - 1) === 0) line.add(key(x, a - 1));
        if (at(x, b + 1) === 0) line.add(key(x, b + 1));
      }
    }
    if (line.size) return [...line];
    const near = new Set();
    for (const i of hits) {
      const x = i % N, y = (i / N) | 0;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { if (at(x + dx, y + dy) === 0) near.add(key(x + dx, y + dy)); });
    }
    return [...near];
  }

  // Count every way each remaining ship could lie; with live hits, only
  // placements through those hits count, weighted by how many they cover.
  function density(k, remaining) {
    const score = new Float64Array(N * N);
    const hunting = !k.includes(2);
    for (const L of remaining) {
      for (const d of ['h', 'v']) {
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          if ((d === 'h' && x + L > N) || (d === 'v' && y + L > N)) continue;
          let blocked = false, hits = 0;
          for (let j = 0; j < L; j++) {
            const v = k[d === 'h' ? key(x + j, y) : key(x, y + j)];
            if (v === 1 || v === 3) { blocked = true; break; }
            if (v === 2) hits++;
          }
          if (blocked || (!hunting && !hits)) continue;
          const w = hunting ? 1 : Math.pow(6, hits);
          for (let j = 0; j < L; j++) {
            const i = d === 'h' ? key(x + j, y) : key(x, y + j);
            if (k[i] === 0) score[i] += w;
          }
        }
      }
    }
    let best = 0, ties = [];
    for (let i = 0; i < N * N; i++) {
      if (score[i] > best) { best = score[i]; ties = [i]; }
      else if (score[i] === best && best > 0) ties.push(i);
    }
    return ties.length ? pick(ties) : -1;
  }

  function aiPick(level, shots, seed) {
    const { k, remaining } = knowledge(shots);
    const unknown = [];
    for (let i = 0; i < N * N; i++) if (k[i] === 0) unknown.push(i);
    if (!unknown.length) return null;
    const xy = (i) => ({ x: i % N, y: (i / N) | 0 });
    if (level === 'easy') return xy(pick(unknown));
    if (level === 'hard') { const i = density(k, remaining); if (i >= 0) return xy(i); }
    const t = targetCells(k);
    if (t.length) return xy(pick(t));
    // Hunt on a lattice spaced by the shortest ship still afloat.
    const step = Math.max(2, Math.min(...remaining));
    const off = seed % step;
    const lattice = unknown.filter((i) => ((i % N) + ((i / N) | 0)) % step === off);
    return xy(pick(lattice.length ? lattice : unknown));
  }
  /* ===== LOGIC END ===== */

  /* ---------- DOM ---------- */
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const app = $('app');
  const scr = { menu: $('scrMenu'), lobby: $('scrLobby'), game: $('scrGame') };
  const field = $('field'), dock = $('dock'), foot = $('foot'), tabs = $('tabs'), note = $('note');
  const sideMine = $('sideMine'), sideTheirs = $('sideTheirs');
  const stBig = $('stBig'), stSmall = $('stSmall'), turnTag = $('turnTag');
  const overlay = $('overlay');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildBoard(el) {
    let h = '<div class="bx">';
    for (let x = 0; x < N; x++) h += '<span>' + COLS[x] + '</span>';
    h += '</div><div class="by">';
    for (let y = 0; y < N; y++) h += '<span>' + (y + 1) + '</span>';
    h += '</div><div class="water">';
    for (let i = 0; i < N * N; i++) h += '<i></i>';
    h += '<div class="ly l-band"></div><div class="ly l-ship"></div><div class="ly l-mark"></div><div class="ly l-cur"></div><div class="ly l-fx"></div></div>';
    el.innerHTML = h;
    return {
      el,
      water: el.querySelector('.water'),
      lx: [...el.querySelectorAll('.bx span')],
      ly: [...el.querySelectorAll('.by span')],
      band: el.querySelector('.l-band'),
      ship: el.querySelector('.l-ship'),
      mark: el.querySelector('.l-mark'),
      cur: el.querySelector('.l-cur'),
      fx: el.querySelector('.l-fx'),
    };
  }
  const bMine = buildBoard($('boardMine'));
  const bTheirs = buildBoard($('boardTheirs'));

  const pos = (x, y) => '--x:' + x + ';--y:' + y;
  const shipStyle = (s) => pos(s.x, s.y) + ';--l:' + SHIP[s.id].len;

  // Draw one board from scratch: ships, marks, sunk ships. `fresh` holds cell
  // keys that just changed, so only those animate.
  function drawBoard(b, o) {
    const sunkSet = new Set();
    let marks = '', outlines = '';
    (o.sunk || []).forEach((s) => {
      cellsOf(s).forEach(([x, y]) => sunkSet.add(key(x, y)));
    });
    let ships = '';
    (o.ships || []).forEach((s) => {
      if (o.sunkIds && o.sunkIds.has(s.id)) return;
      const cls = 'ship ' + s.d + (o.dimShips ? ' ghosted' : '') + (o.lift === s.id ? ' lift' : '') + (o.nope === s.id ? ' nope' : '');
      ships += '<b class="' + cls + '" style="' + shipStyle(s) + '"></b>';
    });
    if (o.preview) {
      const p = o.preview;
      ships += '<b class="pv ' + p.d + (p.ok ? '' : ' bad') + '" style="' + shipStyle(p) + '"></b>';
    }
    (o.shots || []).forEach((s) => {
      if (!s.result) return;
      const k = key(s.x, s.y);
      if (sunkSet.has(k)) return;
      const nw = o.fresh && o.fresh.has(k) ? ' new' : '';
      marks += '<b class="mk ' + (s.result === 'miss' ? 'miss' : 'hit') + nw + '" style="' + pos(s.x, s.y) + '"></b>';
    });
    (o.sunk || []).forEach((s) => {
      const nw = o.fresh && cellsOf(s).some(([x, y]) => o.fresh.has(key(x, y))) ? ' new' : '';
      cellsOf(s).forEach(([x, y]) => { marks += '<b class="mk sk' + nw + '" style="' + pos(x, y) + '"></b>'; });
      outlines += '<b class="sko ' + s.d + nw + '" style="' + shipStyle(s) + '"></b>';
    });
    if (o.pending) marks += '<b class="mk pend" style="' + pos(o.pending.x, o.pending.y) + '"></b>';
    b.ship.innerHTML = ships;
    b.mark.innerHTML = marks + outlines;
  }

  function drawCursor(b, c) {
    b.lx.forEach((e, i) => e.classList.toggle('on', !!c && i === c.x));
    b.ly.forEach((e, i) => e.classList.toggle('on', !!c && i === c.y));
    if (!c) { b.band.innerHTML = ''; b.cur.innerHTML = ''; return; }
    b.band.innerHTML = '<b class="band row" style="' + pos(0, c.y) + '"></b><b class="band col" style="' + pos(c.x, 0) + '"></b>';
    b.cur.innerHTML = '<b class="cur" style="' + pos(c.x, c.y) + '"></b>';
  }

  function cellFromPoint(b, cx, cy) {
    const r = b.water.getBoundingClientRect();
    const p = (r.width + 1) / N;
    const fx = (cx - r.left) / p, fy = (cy - r.top) / p;
    return { x: Math.floor(fx), y: Math.floor(fy), inside: fx >= 0 && fy >= 0 && fx < N && fy < N };
  }

  // Small square chips thrown off a cell.
  function splash(b, x, y, kind) {
    if (reduceMotion) return;
    const c = G.c, cx = x * (c + 1) + c / 2, cy = y * (c + 1) + c / 2;
    const n = kind === 'miss' ? 5 : kind === 'sunk' ? 14 : 9;
    const cols = kind === 'miss' ? ['#5d626c', '#8a8f99', '#3a3e45'] : ['#ea5426', '#ff7a4d', '#ffffff', '#b83f19'];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.7;
      const r0 = c * 0.2, r1 = c * (kind === 'miss' ? 0.5 + Math.random() * 0.3 : 0.7 + Math.random() * (kind === 'sunk' ? 0.9 : 0.5));
      const s = document.createElement('i');
      s.className = 'pt';
      s.style.setProperty('--pc', cols[i % cols.length]);
      s.style.setProperty('--sz', Math.max(2, c * (kind === 'miss' ? 0.07 : 0.09 + Math.random() * 0.05)).toFixed(1) + 'px');
      s.style.setProperty('--x0', (cx + Math.cos(a) * r0).toFixed(1) + 'px');
      s.style.setProperty('--y0', (cy + Math.sin(a) * r0).toFixed(1) + 'px');
      s.style.setProperty('--x1', (cx + Math.cos(a) * r1).toFixed(1) + 'px');
      s.style.setProperty('--y1', (cy + Math.sin(a) * r1).toFixed(1) + 'px');
      s.style.setProperty('--rot', Math.round(Math.random() * 180 - 90) + 'deg');
      b.fx.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
    if (kind === 'sunk') {
      b.el.classList.remove('shake'); void b.el.offsetWidth; b.el.classList.add('shake');
    }
  }
  [bMine, bTheirs].forEach((b) => b.el.addEventListener('animationend', (e) => { if (e.target === b.el) b.el.classList.remove('shake'); }));

  /* ---------- app state ---------- */
  const G = {
    screen: 'menu',
    mode: null,            // 'cpu' | 'online'
    level: 'normal',
    stage: 'place',        // 'place' | 'battle'
    fleet: [],             // my ships
    locked: false,         // fleet can no longer change
    sel: null,             // dock ship picked for tap-to-place
    placeDir: 'h',
    lastShip: null,
    shots: [],             // { mine, x, y, result, ship, sx, sy, sd }
    turn: null,            // 'me' | 'them' | 'wait'
    pending: null,         // my shot waiting for the defender
    over: null,            // 'win' | 'lose'
    reveal: null,          // the other fleet, shown at the end
    event: null,           // last resolved shot, for the status line
    seen: new Set(),
    view: 'target',
    single: false,
    cursor: null,
    c: 30,
    cpu: null,
    // online
    code: null, me: null, room: null, opp: null, round: 0,
    fleetLoaded: false, fleetLoading: null,
    oppReady: false, sending: false, resolving: -1, rematchSent: false,
    err: '',
  };
  let Rooms = null;
  let onlineOk = false;
  let paused = false;
  let timers = [];
  const later = (fn, ms) => { const id = setTimeout(() => { timers = timers.filter((t) => t !== id); fn(); }, ms); timers.push(id); return id; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} },
  };
  const K_CPU = 'vela:sea-battle:cpu', K_ROOM = 'vela:sea-battle:room', K_DRAFT = 'vela:sea-battle:draft', K_NAME = 'vela:name', K_LEVEL = 'vela:sea-battle:level';

  function oppName() {
    if (G.mode === 'cpu') return 'Computer';
    const n = G.room && G.opp && G.room.names && G.room.names[G.opp];
    return n || 'Opponent';
  }

  /* ---------- screens ---------- */
  function showScreen(name) {
    if (G.screen !== name) {
      G.screen = name;
      Object.keys(scr).forEach((k) => scr[k].classList.toggle('on', k === name));

  }

  /* ---------- menu ---------- */
  const levelSeg = $('levelSeg'), nameIn = $('nameIn'), codeIn = $('codeIn');
  const createBtn = $('createBtn'), joinBtn = $('joinBtn'), onlineMsg = $('onlineMsg');
  function renderMenu() {
    levelSeg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.level === G.level));
    $('levelMsg').textContent = {

  /* ---------- placement ---------- */
  function renderDock() {
    let h = '';
    SHIPS.forEach((s) => {
      const placed = G.fleet.some((f) => f.id === s.id);
      h += '<div class="dk' + (placed ? ' placed' : '') + (G.sel === s.id ? ' sel' : '') + '" data-id="' + s.id + '"><span class="dk-name">' + s.name + '</span><span class="dk-ship">' + '<i></i>'.repeat(s.len) + '</span></div>';
    });
