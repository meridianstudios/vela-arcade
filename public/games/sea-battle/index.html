  function saveDraft() {
    if (G.mode === 'online' && G.code) store.set(K_DRAFT, { code: G.code, round: G.round, fleet: cleanFleet(G.fleet) });
    if (G.mode === 'cpu') saveCpu();
  }

  let drag = null;     // active drag of one ship
  let hoverPv = null;  // preview for tap-to-place with a mouse
  let nopeId = null;

  function flashNope(id) {
    nopeId = id;
    renderGame();
    setTimeout(() => { if (nopeId === id) { nopeId = null; if (G.stage === 'place') renderGame(); } }, 320);
  }

  function anchorFor(id, d, gi, cell) {
    const L = SHIP[id].len;
    let x = d === 'h' ? cell.x - gi : cell.x;
    let y = d === 'v' ? cell.y - gi : cell.y;
    x = clamp(0, x, d === 'h' ? N - L : N - 1);
    y = clamp(0, y, d === 'v' ? N - L : N - 1);
    return { id, d, x, y };
  }

  function tryRotate(id, gi) {
    const s = G.fleet.find((f) => f.id === id);
    if (!s) return;
    const nd = s.d === 'h' ? 'v' : 'h';
    const others = G.fleet.filter((f) => f.id !== id);
    const L = SHIP[id].len;
    const pivot = s.d === 'h' ? { x: s.x + gi, y: s.y } : { x: s.x, y: s.y + gi };
    const tries = [
      { id, d: nd, x: s.x, y: s.y },
      { id, d: nd, x: nd === 'h' ? pivot.x - gi : pivot.x, y: nd === 'v' ? pivot.y - gi : pivot.y },
    ];
    for (let k = 1; k < L; k++) tries.push(anchorFor(id, nd, 0, { x: s.x - (nd === 'h' ? k : 0), y: s.y - (nd === 'v' ? k : 0) }));
    tries.push(anchorFor(id, nd, 0, { x: s.x, y: s.y }));
    for (const t of tries) {
      if (fits(others, t)) {
        Object.assign(s, t);
        G.lastShip = id;
        saveDraft();
        renderGame();
        return;
      }
    }
    flashNope(id);
  }

  function makeGhost(id, d) {
    const g = document.createElement('div');
    g.className = 'ghost ' + d;
    g.innerHTML = '<i></i>'.repeat(SHIP[id].len);
    document.body.appendChild(g);
    return g;
  }

  function startDrag(e, info) {
    drag = Object.assign({ sx: e.clientX, sy: e.clientY, pid: e.pointerId, moved: false, cand: null, ok: false, ghost: null, last: e }, info);
    hoverPv = null;
  }

  function updateDrag(e) {
    drag.last = e;
    const c = cellFromPoint(bMine, e.clientX, e.clientY);
    // A little slack around the grid so a ship can be dropped on an edge row.
    const r = bMine.water.getBoundingClientRect();
    const near = e.clientX > r.left - G.c * 0.5 && e.clientX < r.right + G.c * 0.5 && e.clientY > r.top - G.c * 0.5 && e.clientY < r.bottom + G.c * 0.5;
    if (near) {
      const cell = { x: clamp(0, c.x, N - 1), y: clamp(0, c.y, N - 1) };
      drag.cand = anchorFor(drag.id, drag.d, drag.gi, cell);
      drag.ok = fits(G.fleet, drag.cand);
      if (drag.ghost) drag.ghost.style.display = 'none';
    } else {
      drag.cand = null; drag.ok = false;
      if (!drag.ghost || !drag.ghost.classList.contains(drag.d)) {
        if (drag.ghost) drag.ghost.remove();
        drag.ghost = makeGhost(drag.id, drag.d);
      }
      const p = G.c + 1;
      const ox = drag.d === 'h' ? (drag.gi + 0.5) * p : p / 2;
      const oy = drag.d === 'v' ? (drag.gi + 0.5) * p : p / 2;
      drag.ghost.style.display = '';
      drag.ghost.style.transform = 'translate(' + (e.clientX - ox) + 'px,' + (e.clientY - oy) + 'px)';
    }
    renderGame();
  }

  function endDrag(e, cancelled) {
    const d = drag;
    drag = null;
    if (d.ghost) d.ghost.remove();
    if (!d.moved || cancelled) {
      if (d.from === 'board' && d.moved) { G.fleet.push(d.orig); }
      if (!cancelled) {
        if (d.from === 'board') { tryRotate(d.id, d.gi); return; }
        if (d.from === 'dock') G.sel = G.sel === d.id ? null : d.id;
      }
      renderGame();
      return;
    }
    if (d.cand && d.ok) {
      G.fleet.push(d.cand);
      G.lastShip = d.id;
      G.sel = null;
    } else if (d.from === 'board' && d.cand) {
      G.fleet.push(d.orig);      // dropped on a taken spot: put it back
      flashNope(d.id);
    } else if (d.from === 'board') {
      G.lastShip = null;         // dragged off the grid: back to the dock
    }
    saveDraft();
    renderGame();
  }

  dock.addEventListener('pointerdown', (e) => {
    if (G.stage !== 'place' || G.locked || drag) return;
    const dk = e.target.closest('.dk');
    if (!dk) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    const id = dk.dataset.id;
    const placed = G.fleet.find((s) => s.id === id);
    if (placed) {
      startDrag(e, { id, d: placed.d, gi: 0, from: 'board', orig: Object.assign({}, placed) });
      return;
    }
    const shipEl = dk.querySelector('.dk-ship');
    const r = shipEl.getBoundingClientRect();
    const L = SHIP[id].len;
    const gi = clamp(0, Math.floor((e.clientX - r.left) / (r.width / L)), L - 1);
    startDrag(e, { id, d: G.placeDir, gi: G.placeDir === 'h' ? gi : 0, from: 'dock' });
  });

  bMine.water.addEventListener('pointerdown', (e) => {
    if (G.stage !== 'place' || G.locked || drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const c = cellFromPoint(bMine, e.clientX, e.clientY);
    if (!c.inside) return;
    const s = shipAt(G.fleet, c.x, c.y);
    if (s) {
      startDrag(e, { id: s.id, d: s.d, gi: s.d === 'h' ? c.x - s.x : c.y - s.y, from: 'board', orig: Object.assign({}, s) });
    } else if (G.sel) {
      drag = { tap: true, cell: c, sx: e.clientX, sy: e.clientY, pid: e.pointerId, moved: false };
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (drag && e.pointerId === drag.pid) {
      if (drag.tap) return;
      if (!drag.moved) {
        if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
        drag.moved = true;
        if (drag.from === 'board') G.fleet = G.fleet.filter((s) => s.id !== drag.id);
        G.sel = null;
      }
      updateDrag(e);
      return;
    }
    // Mouse hover preview for a picked dock ship.
    if (G.screen === 'game' && G.stage === 'place' && G.sel && !G.locked && e.pointerType === 'mouse') {
      const c = cellFromPoint(bMine, e.clientX, e.clientY);
      const was = hoverPv;
      if (c.inside) {
        const cand = anchorFor(G.sel, G.placeDir, 0, c);
        cand.ok = fits(G.fleet, cand);
        hoverPv = cand;
      } else hoverPv = null;
      if (JSON.stringify(was) !== JSON.stringify(hoverPv)) renderGame();
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (drag.tap) {
      const t = drag; drag = null;
      const c = cellFromPoint(bMine, e.clientX, e.clientY);
      if (c.inside && c.x === t.cell.x && c.y === t.cell.y && G.sel) {
        const cand = anchorFor(G.sel, G.placeDir, 0, c);
        if (fits(G.fleet, cand)) {
          G.fleet.push(cand); G.lastShip = cand.id; G.sel = null; hoverPv = null;
          saveDraft(); renderGame();
        } else flashNope(null);
      }
      return;
    }
    endDrag(e, false);
  });
  window.addEventListener('pointercancel', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (drag.tap) { drag = null; return; }
    endDrag(e, true);
  });

  function rotateKey() {
    if (G.screen !== 'game' || G.stage !== 'place' || G.locked) return;
    if (drag && drag.moved && !drag.tap) {
      drag.d = drag.d === 'h' ? 'v' : 'h';
      updateDrag(drag.last);
      return;
    }
    if (G.sel) {
      G.placeDir = G.placeDir === 'h' ? 'v' : 'h';
      if (hoverPv) { hoverPv = anchorFor(G.sel, G.placeDir, 0, hoverPv); hoverPv.ok = fits(G.fleet, hoverPv); }
      renderGame();
      return;
    }
    if (G.lastShip) tryRotate(G.lastShip, 0);
  }

  function placeRandom() {
    if (G.locked) return;
    G.fleet = randomFleet(); G.sel = null; G.lastShip = null; hoverPv = null;
    saveDraft(); renderGame();
  }
  function placeClear() {
    if (G.locked) return;
    G.fleet = []; G.sel = null; G.lastShip = null; hoverPv = null;
    saveDraft(); renderGame();
  }
  function placeReady() {
    if (G.locked || !validFleet(G.fleet)) return;
    if (G.mode === 'cpu') cpuReady();
    else onlineReady();
  }

  /* ---------- play: firing ---------- */
  function canFireAt(x, y) {
    return G.stage === 'battle' && !G.over && G.turn === 'me' && !G.shots.some((s) => s.mine && s.x === x && s.y === y);
  }
  function fire(x, y) {
    if (!canFireAt(x, y)) return;
    if (G.mode === 'cpu') cpuShoot(x, y);
    else onlineFire(x, y);
  }

  let press = null;
  bTheirs.water.addEventListener('pointerdown', (e) => {
    if (G.stage !== 'battle') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const c = cellFromPoint(bTheirs, e.clientX, e.clientY);
    if (!c.inside) return;
    press = { id: e.pointerId, x: c.x, y: c.y };
    G.cursor = { x: c.x, y: c.y };
    drawCursor(bTheirs, G.turn === 'me' ? G.cursor : null);
  });
  bTheirs.water.addEventListener('pointermove', (e) => {
    if (G.stage !== 'battle') return;
    const c = cellFromPoint(bTheirs, e.clientX, e.clientY);
    if (!c.inside) return;
    if (!G.cursor || G.cursor.x !== c.x || G.cursor.y !== c.y) {
      G.cursor = { x: c.x, y: c.y };
      drawCursor(bTheirs, G.turn === 'me' && !G.over ? G.cursor : null);
    }
  });
  bTheirs.water.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') { G.cursor = null; drawCursor(bTheirs, null); }
  });
  bTheirs.water.addEventListener('pointerup', (e) => {
    if (!press || press.id !== e.pointerId) return;
    const p = press; press = null;
    const c = cellFromPoint(bTheirs, e.clientX, e.clientY);
    if (c.inside && c.x === p.x && c.y === p.y) fire(c.x, c.y);
    if (e.pointerType !== 'mouse') { G.cursor = null; drawCursor(bTheirs, null); }
  });
  bTheirs.water.addEventListener('pointercancel', () => { press = null; });

  tabs.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    clearViewTimer();
    G.view = b.dataset.view;
    renderGame();
  });

  let viewTimer = 0;
  function clearViewTimer() { clearTimeout(viewTimer); viewTimer = 0; }
  function setViewLater(v, ms) {
    clearViewTimer();
    viewTimer = setTimeout(() => { viewTimer = 0; if (G.view !== v) { G.view = v; renderGame(); } }, ms);
  }

  /* ---------- shared state intake: both modes report shots here ---------- */
  function applyState(next, initial) {
    const wasOver = G.over;
    const fresh = [];
    next.shots.forEach((s, i) => {
      if (!s.result) return;
      const k = i + ':' + s.result;
      if (G.seen.has(k)) return;
      G.seen.add(k);
      if (!initial) fresh.push(s);
    });
    G.shots = next.shots;
    G.turn = next.turn;
    G.pending = next.pending || null;
    G.over = next.over || null;
    G.reveal = next.reveal || null;
    if (fresh.length) G.event = fresh[fresh.length - 1];
    else if (initial) { const r = G.shots.filter((s) => s.result); G.event = r.length ? r[r.length - 1] : null; }

    if (initial) {
      clearViewTimer();
      G.view = G.turn === 'me' || G.over ? 'target' : 'fleet';
    } else if (fresh.length) {
      const e = G.event;
      if (e.mine) { if (G.turn === 'them' || G.turn === 'wait') setViewLater('fleet', 850); }
      else { clearViewTimer(); G.view = 'fleet'; if (G.turn === 'me') setViewLater('target', 1100); }
    }

    const freshMine = new Set(), freshTheirs = new Set();
    fresh.forEach((s) => (s.mine ? freshMine : freshTheirs).add(key(s.x, s.y)));
    renderGame({ freshMine, freshTheirs, pop: fresh.length > 0 });
    fresh.forEach((s) => splash(s.mine ? bTheirs : bMine, s.x, s.y, s.result));

    if (G.over && !wasOver) {
      if (initial) showEnd();
      else later(showEnd, reduceMotion ? 300 : 1100);
    } else if (G.over && !overlay.hidden) renderEnd();
    if (!G.over && !overlay.hidden) hideOverlay();
  }

  function sunkShips(mine) {
    return G.shots.filter((s) => s.mine === mine && s.result === 'sunk' && SHIP[s.ship])
      .map((s) => ({ id: s.ship, x: s.sx, y: s.sy, d: s.sd }));
  }

  function renderRoster(el, sunkIds) {
    el.innerHTML = SHIPS.map((s) => '<span class="' + (sunkIds.has(s.id) ? 'sunk' : '') + '" title="' + s.name + '">' + '<i></i>'.repeat(s.len) + '</span>').join('');
  }

  /* ---------- render the game screen ---------- */
  let shape = '';
  function renderGame(fx) {
    if (G.screen !== 'game') return;
    fx = fx || {};
    const placing = G.stage === 'place';
    const online = G.mode === 'online';
    $('gSub').textContent = online
      ? 'Online, room ' + (G.code || '')
      : 'Vs computer, ' + G.level.charAt(0).toUpperCase() + G.level.slice(1);

    // status line
    let big = '', small = '', hot = false, tag = null, tagMe = false;
    if (placing) {
      if (online && G.locked) {
        big = 'Waiting for opponent';
        small = 'Your ships are set. ' + oppName() + ' is still placing ships.';
      } else {
        big = 'Place your ships';
        small = 'Drag ships onto the grid. Tap a ship or press R to rotate.';
        if (online && G.oppReady) small = oppName() + ' is ready. Drag ships onto the grid, tap to rotate.';
      }
    } else {
      const e = G.event;
      const turnText = G.over ? '' : G.turn === 'me' ? 'Your turn.' : G.turn === 'wait' ? 'Waiting for the result.' : oppName() + '\'s turn.';
      if (G.over) {
        big = G.over === 'win' ? 'You win' : 'You lose';
        hot = G.over === 'win';
        small = G.over === 'win' ? 'You sank all five ships.' : oppName() + ' sank all five of your ships.';
      } else if (G.pending) {
        big = 'Firing';
        small = 'You fired at ' + coord(G.pending.x, G.pending.y) + '. Waiting for the result.';
      } else if (e) {
        big = e.result === 'miss' ? 'Miss' : e.result === 'hit' ? 'Hit' : 'Sunk: ' + SHIP[e.ship].name;
        hot = e.result !== 'miss';
        small = (e.mine ? 'You fired at ' : oppName() + ' fired at ') + coord(e.x, e.y) + '. ' + turnText;
      } else {
        big = G.turn === 'me' ? 'Your turn' : oppName() + ' goes first';
        small = G.turn === 'me' ? 'Tap a cell on the target grid to fire.' : 'Waiting for ' + oppName() + '.';
      }
      if (!G.over) { tag = G.turn === 'me' ? 'Your turn' : 'Their turn'; tagMe = G.turn === 'me'; }
    }
    if (stBig.textContent !== big) {
      stBig.textContent = big;
      if (fx.pop) { stBig.classList.remove('pop'); void stBig.offsetWidth; stBig.classList.add('pop'); }
    }
    stBig.classList.toggle('hot', hot);
    stSmall.textContent = small;
    turnTag.hidden = !tag;
    if (tag) { turnTag.textContent = tag; turnTag.classList.toggle('me', tagMe); }

    // note bar
    let noteText = G.err || '';
    if (online && G.room && G.opp && !noteText) {
      const st = G.room.state || {};
      if (st.gone && st.gone[G.opp]) noteText = 'Opponent left';
      else if (Rooms.isAway(G.room, G.opp)) noteText = 'Opponent disconnected';
    }
    note.hidden = !noteText;
    note.textContent = noteText;

    // footer buttons
    let footKey;
    if (placing) {
      const done = validFleet(G.fleet);
      footKey = 'place:' + done + ':' + G.locked + ':' + G.sending + ':' + (G.fleet.length > 0);
      if (foot.dataset.k !== footKey) {
        foot.dataset.k = footKey;
        foot.innerHTML = '';
        addBtn(foot, 'Random', placeRandom, { disabled: G.locked });
        addBtn(foot, 'Clear', placeClear, { disabled: G.locked || !G.fleet.length });
        addBtn(foot, 'Ready', placeReady, { primary: true, disabled: !done || G.locked || G.sending });
      }
      foot.hidden = false;
    } else if (G.over && G.endShown && overlay.hidden) {
      footKey = 'over:' + endButtons().map((b) => b.label + b.disabled).join();
      if (foot.dataset.k !== footKey) {
        foot.dataset.k = footKey;
        foot.innerHTML = '';
        endButtons().forEach((b) => addBtn(foot, b.label, b.fn, b));
      }
      foot.hidden = false;
    } else {
      foot.hidden = true;
      foot.dataset.k = '';
    }

    // boards
    const sunkTheirs = sunkShips(true), sunkMine = sunkShips(false);
    const sunkTheirIds = new Set(sunkTheirs.map((s) => s.id));
    const sunkMyIds = new Set(sunkMine.map((s) => s.id));
    if (placing) {
      let preview = null, lift = null;
      if (drag && drag.moved && !drag.tap && drag.cand) preview = Object.assign({}, drag.cand, { ok: drag.ok });
      else if (hoverPv && G.sel) preview = hoverPv;
      drawBoard(bMine, { ships: G.fleet, preview, lift, nope: nopeId });
      drawCursor(bMine, null);
      renderDock();
      dock.hidden = false;
      tabs.hidden = true;
      sideMine.classList.remove('active', 'idle');
      renderRoster($('rosterMine'), new Set());
    } else {
      dock.hidden = true;
      const theirMisses = G.shots.filter((s) => !s.mine);
      drawBoard(bMine, { ships: G.fleet, shots: theirMisses, sunk: sunkMine, sunkIds: sunkMyIds, fresh: fx.freshTheirs });
      const revealShips = G.reveal && validFleet(G.reveal) ? G.reveal.filter((s) => !sunkTheirIds.has(s.id)) : [];
      drawBoard(bTheirs, { ships: revealShips, dimShips: true, shots: G.shots.filter((s) => s.mine), sunk: sunkTheirs, fresh: fx.freshMine, pending: G.pending });
      const myTurn = G.turn === 'me' && !G.over;
      sideTheirs.classList.toggle('active', myTurn);
      sideTheirs.classList.toggle('idle', !myTurn && !G.over);
      sideMine.classList.remove('active', 'idle');
      drawCursor(bTheirs, myTurn && G.cursor ? G.cursor : null);
      drawCursor(bMine, null);
      $('theirsLab').textContent = G.mode === 'cpu' ? 'Computer' : oppName();
      renderRoster($('rosterMine'), sunkMyIds);
      renderRoster($('rosterTheirs'), sunkTheirIds);
      tabs.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('on', b.dataset.view === G.view);
        b.classList.toggle('ping', b.dataset.view === 'target' && myTurn && G.view !== 'target');
      });
    }
    field.classList.toggle('v-target', G.view === 'target');
    field.classList.toggle('v-fleet', G.view === 'fleet');

    const s = G.screen + ':' + (placing ? 'place' : 'play') + ':' + !foot.hidden + ':' + !note.hidden;
    if (s !== shape) { shape = s; layout(); }
  }

  function addBtn(parent, label, fn, o) {
    o = o || {};
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (o.primary ? ' primary' : '');
    b.textContent = label;
    b.disabled = !!o.disabled;
    b.addEventListener('click', fn);
    parent.appendChild(b);
    return b;
  }

  /* ---------- end of a game ---------- */
  function endButtons() {
    if (G.mode === 'cpu') {
      return [{ label: 'Play again', primary: true, fn: () => startCpu() }, { label: 'Menu', fn: toMenu }];
    }
    const st = (G.room && G.room.state) || {};
    const gone = !!(st.gone && G.opp && st.gone[G.opp]) || !G.opp;
    if (gone) return [{ label: 'Leave', primary: true, fn: leaveRoom }];
    if (G.rematchSent || (st.rematch && st.rematch[G.me])) return [{ label: 'Waiting', disabled: true }, { label: 'Leave', fn: leaveRoom }];
    return [{ label: 'Rematch', primary: true, fn: requestRematch }, { label: 'Leave', fn: leaveRoom }];
  }
  function renderEnd() {
    const mine = G.shots.filter((s) => s.mine && s.result);
    const hits = mine.filter((s) => s.result !== 'miss').length;
    $('ovTitle').textContent = G.over === 'win' ? 'You win' : 'You lose';
    let sub = G.over === 'win' ? 'You sank all five ships.' : oppName() + ' sank all five of your ships.';
    if (G.mode === 'online') {
      const st = (G.room && G.room.state) || {};
      if (st.gone && G.opp && st.gone[G.opp]) sub = 'Opponent left.';
      else if (st.rematch && G.opp && st.rematch[G.opp] && !(st.rematch[G.me])) sub = oppName() + ' wants a rematch.';
      else if (st.rematch && st.rematch[G.me]) sub = 'Waiting for ' + oppName() + ' to agree.';
    }
    $('ovSub').textContent = sub;
    $('ovShots').textContent = mine.length;
    $('ovRate').textContent = mine.length ? Math.round((hits / mine.length) * 100) + '%' : '0%';
    const row = $('ovBtns');
    row.innerHTML = '';
    endButtons().forEach((b) => addBtn(row, b.label, b.fn || (() => {}), b));
  }
  function showEnd() {
    if (!G.over || G.screen !== 'game') return;
    renderEnd();
    G.endShown = true;
    overlay.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));
    const first = $('ovBtns').querySelector('button:not(:disabled)');
    if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (_) {} }, 60);
    renderGame();
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    overlay.hidden = true;
  }
  // Tap outside the card to look at the boards; the buttons move to the footer.
  overlay.addEventListener('pointerdown', (e) => {
    if (e.target === overlay) { hideOverlay(); renderGame(); }
  });

  /* ---------- vs computer ---------- */
  function freshPlayState() {
    G.fleet = []; G.locked = false; G.sel = null; G.lastShip = null; hoverPv = null;
    G.shots = []; G.turn = null; G.pending = null; G.over = null; G.reveal = null; G.event = null;
    G.seen = new Set(); G.view = 'target'; G.cursor = null; G.err = ''; G.endShown = false;
    clearViewTimer(); hideOverlay();
  }
  function startCpu() {
    leaveRoomQuiet();
    clearTimers();
    G.mode = 'cpu';
    freshPlayState();
    G.stage = 'place';
    G.cpu = { level: G.level, fleet: randomFleet(), shots: [], turn: 'me', seed: rnd(1e6), stage: 'place', winner: null };
    saveCpu();
    showScreen('game');
    renderGame();
  }
  function saveCpu() {
    const c = G.cpu;
    if (!c) return;
    if (c.winner) { store.del(K_CPU); return; }
    store.set(K_CPU, { level: c.level, fleet: c.fleet, mine: cleanFleet(G.fleet), shots: c.shots, turn: c.turn, seed: c.seed, stage: c.stage });
  }
  function loadCpu() {
    const s = store.get(K_CPU);
    if (!s || !validFleet(s.fleet) || !Array.isArray(s.shots) || !['easy', 'normal', 'hard'].includes(s.level)) return null;
    if (s.stage === 'battle' && !validFleet(s.mine)) return null;
    if (s.stage === 'battle' && !s.shots.length) return s;
    return s;
  }
  function resumeCpu(s) {
    leaveRoomQuiet();
    clearTimers();
    G.mode = 'cpu';
    freshPlayState();
    G.level = s.level;
    G.cpu = { level: s.level, fleet: s.fleet, shots: s.shots, turn: s.turn === 'cpu' ? 'cpu' : 'me', seed: s.seed | 0, stage: s.stage === 'battle' ? 'battle' : 'place', winner: null };
    G.stage = G.cpu.stage;
    if (Array.isArray(s.mine) && s.mine.every((f) => SHIP[f.id] && inBounds(f))) G.fleet = cleanFleet(s.mine);
    showScreen('game');
    if (G.stage === 'battle') {
      G.locked = true;
      cpuSync(true);
      if (G.cpu.turn === 'cpu') later(cpuMove, 700);
    } else renderGame();
  }
  function cpuReady() {
    const c = G.cpu;
    c.stage = 'battle';
    c.turn = 'me';
    G.stage = 'battle';
    G.locked = true;
    G.sel = null;
    saveCpu();
    cpuSync(true);
  }
  function cpuSync(initial) {
    const c = G.cpu;
    const shots = c.shots.map((s) => ({ mine: s.by === 'me', x: s.x, y: s.y, result: s.result, ship: s.ship || null, sx: s.sx, sy: s.sy, sd: s.sd }));
    applyState({
      shots,
      turn: c.winner ? null : c.turn === 'me' ? 'me' : 'them',
      over: c.winner ? (c.winner === 'me' ? 'win' : 'lose') : null,
      reveal: c.winner ? c.fleet : null,
    }, initial);
  }
  function record(by, x, y, res) {
    const s = { by, x, y, result: res.result };
    if (res.result === 'sunk') { s.ship = res.ship; s.sx = res.sx; s.sy = res.sy; s.sd = res.sd; }
    G.cpu.shots.push(s);
  }
  function cpuShoot(x, y) {
    const c = G.cpu;
    if (c.turn !== 'me' || c.winner) return;
    const res = resolveShot(c.fleet, c.shots.filter((s) => s.by === 'me'), x, y);
    record('me', x, y, res);
    if (res.allSunk) c.winner = 'me';
    else { c.turn = 'cpu'; later(cpuMove, reduceMotion ? 700 : 1500); }
    saveCpu();
    cpuSync(false);
  }
  function cpuMove() {
    const c = G.cpu;
    if (G.mode !== 'cpu' || !c || c.turn !== 'cpu' || c.winner) return;
    if (paused) { later(cpuMove, 400); return; }
    const mine = c.shots.filter((s) => s.by === 'cpu');
    const t = aiPick(c.level, mine, c.seed);
    if (!t) return;
    const res = resolveShot(G.fleet, mine, t.x, t.y);
    record('cpu', t.x, t.y, res);
    if (res.allSunk) c.winner = 'cpu';
    else c.turn = 'me';
    saveCpu();
    cpuSync(false);
  }

  function toMenu() {
    clearTimers();
    clearViewTimer();
    if (G.mode === 'cpu') saveCpu();
    G.mode = null;
    showScreen('menu');
    renderMenu();
  }

  /* ---------- online ---------- */
  function friendly(e) {
    if (Rooms && e instanceof Rooms.RoomError) return e.message;
    return 'Could not reach the game server. Try again.';
  }
  function freshRoundState(round, first) {
    return { stage: 'place', round, first, ready: {}, shots: [], turn: null, winner: null, rematch: {}, reveal: {}, gone: {} };
  }
  function myName() {
    const n = nameIn.value.trim() || store.get(K_NAME) || 'Player';
    return String(n).slice(0, 20);
  }
  function setRoomUrl(code) {
    try {
      const u = new URL(location.href);
      if (code) u.searchParams.set('room', code); else u.searchParams.delete('room');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (_) {}
  }

  async function onlineCreate() {
    if (!onlineOk) return;
    store.set(K_NAME, nameIn.value.trim());
    setOnlineBusy(true);
    menuMsg('Making a room.');
    try {
      const me = await Rooms.signIn();
      const code = await Rooms.create({ game: SLUG, maxSeats: 2, name: myName(), state: freshRoundState(1, me) });
      menuMsg('');
      enterRoom(code);
    } catch (e) {
      menuMsg(friendly(e), true);
    } finally { setOnlineBusy(false); }
  }

  async function onlineJoin(code, quiet) {
    if (!onlineOk) return;
    code = Rooms.normaliseCode(code);
    store.set(K_NAME, nameIn.value.trim());
    setOnlineBusy(true);
    menuMsg('Joining room ' + code + '.');
    try {
      await Rooms.join(code, { game: SLUG, name: myName() });
      menuMsg('');
      enterRoom(code);
    } catch (e) {
      store.del(K_ROOM);
      setRoomUrl(null);
      menuMsg(quiet ? '' : friendly(e), !quiet);
    } finally { setOnlineBusy(false); }
  }

  let unwatch = null, stopBeat = null, awayTick = 0;
  function enterRoom(code) {
    leaveRoomQuiet();
    clearTimers();
    if (G.mode === 'cpu') saveCpu();
    G.mode = 'online';
    G.code = code;
    G.me = Rooms.uid();
    G.room = null; G.opp = null; G.round = 0;
    G.leaving = false;
    freshPlayState();
    store.set(K_ROOM, { code, t: Date.now() });
    setRoomUrl(code);
    $('lobbyCode').textContent = code;
    $('lobbyLink').textContent = Rooms.inviteUrl(SLUG, code);
    $('lobbyWait').textContent = 'Connecting.';
    showScreen('lobby');
    unwatch = Rooms.watch(code, onRoom);
    stopBeat = Rooms.heartbeat(code);
    awayTick = setInterval(() => { if (G.mode === 'online' && G.screen === 'game') renderGame(); }, 5000);
  }
  // Stop listening without touching the room.
  function leaveRoomQuiet() {
    if (unwatch) { try { unwatch(); } catch (_) {} unwatch = null; }
    if (stopBeat) { stopBeat(); stopBeat = null; }
    clearInterval(awayTick);
  }
  function exitRoom(msg) {
    leaveRoomQuiet();
    clearTimers();
    clearViewTimer();
    store.del(K_ROOM);
    store.del(K_DRAFT);
    setRoomUrl(null);
    G.mode = null; G.code = null; G.room = null;
    showScreen('menu');
    renderMenu();
    menuMsg(msg || '', !!msg);
  }
  async function leaveRoom() {
    if (G.mode !== 'online') { toMenu(); return; }
    const code = G.code, me = G.me;
    G.leaving = true;
    leaveRoomQuiet();
    exitRoom(null);
    try {
      await Rooms.update(code, (r) => (r.seats.includes(me) && r.phase !== 'lobby' ? { ['state.gone.' + me]: true } : null));
    } catch (_) {}
    try { await Rooms.leave(code); } catch (_) {}
  }

  function onRoom(room) {
    if (G.mode !== 'online') return;
    if (!room) { exitRoom(G.leaving ? null : 'The room was closed.'); return; }
    G.room = room;
    const me = G.me;
    if (!room.seats.includes(me)) { exitRoom('You are no longer in that room.'); return; }
    G.opp = room.seats.find((s) => s !== me) || null;
    store.set(K_ROOM, { code: G.code, t: Date.now() });

    if (room.phase === 'lobby') {
      if (room.seats.length >= 2) {
        $('lobbyWait').textContent = 'Starting.';
        Rooms.update(G.code, (r) => (r.phase === 'lobby' && r.seats.length === 2 ? { phase: 'play' } : null)).catch(() => {});
      } else $('lobbyWait').textContent = 'Waiting for a second player.';
      showScreen('lobby');
      return;
    }

    const st = room.state || {};
    if (st.round !== G.round) newRound(st.round);
    G.oppReady = !!(st.ready && G.opp && st.ready[G.opp]);

    if (st.stage === 'place') {
      G.stage = 'place';
      if (st.ready && st.ready[me]) { G.locked = true; ensureFleet(); }
      showScreen('game');
      renderGame();
      return;
    }

    // battle or over
    G.stage = 'battle';
    G.locked = true;
    G.sel = null;
    ensureFleet();
    const raw = Array.isArray(st.shots) ? st.shots : [];
    const shots = raw.map((s) => ({ mine: s.by === me, x: s.x, y: s.y, result: s.result || null, ship: s.ship || null, sx: s.sx, sy: s.sy, sd: s.sd }));
    const last = shots[shots.length - 1];
    let turn = null;
    if (st.stage !== 'over') {
      if (last && !last.result) turn = last.mine ? 'wait' : 'them';
      else turn = st.turn === me ? 'me' : 'them';
    }
    const over = st.stage === 'over' ? (st.winner === me ? 'win' : 'lose') : null;
    const reveal = (st.reveal && G.opp && st.reveal[G.opp]) || null;
    const initial = !G.liveRound;
    G.liveRound = true;
    showScreen('game');
    applyState({ shots, turn, over, pending: last && !last.result && last.mine ? { x: last.x, y: last.y } : null, reveal }, initial);
    maybeResolve();
    if (over === 'win' && G.fleetLoaded && !(st.reveal && st.reveal[me])) {
      const fleet = cleanFleet(G.fleet);
      Rooms.update(G.code, (r) => (r.state && r.state.stage === 'over' && !(r.state.reveal && r.state.reveal[me]) ? { ['state.reveal.' + me]: fleet } : null)).catch(() => {});
    }
  }

  function newRound(round) {
    G.round = round;
    G.liveRound = false;
    G.fleetLoaded = false;
    G.fleetLoading = null;
    G.resolving = -1;
    G.rematchSent = false;
    G.sending = false;
    freshPlayState();
    G.stage = 'place';
    const d = store.get(K_DRAFT);
    if (d && d.code === G.code && d.round === round && Array.isArray(d.fleet) && d.fleet.every((f) => SHIP[f.id] && inBounds(f))) G.fleet = cleanFleet(d.fleet);
  }

  // Read my fleet back from my private document (after a reload).
  function ensureFleet() {
    if (G.fleetLoaded || G.fleetLoading) return;
    const round = G.round, code = G.code;
    G.fleetLoading = Rooms.readPrivate(code).then((d) => {
      if (G.code !== code || G.round !== round) return;
      G.fleetLoading = null;
      if (d && d.round === round && validFleet(d.fleet)) {
        G.fleet = cleanFleet(d.fleet);
        G.fleetLoaded = true;
        G.err = '';
        if (G.room) onRoom(G.room);
      } else {
        G.err = 'Your fleet could not be loaded';
        renderGame();
      }
    }).catch(() => {
      if (G.code !== code || G.round !== round) return;
      G.fleetLoading = null;
      later(ensureFleet, 3000);
    });
  }

  async function onlineReady() {
    if (G.sending || !validFleet(G.fleet)) return;
    const code = G.code, me = G.me, round = G.round;
    const fleet = cleanFleet(G.fleet);
    G.sending = true;
    G.err = '';
    renderGame();
    try {
      await Rooms.writePrivate(code, { fleet, round });
      if (G.code !== code || G.round !== round) return;
      G.fleetLoaded = true;
      await Rooms.update(code, (r) => {
        const st = r.state || {};
        if (r.phase !== 'play' || st.stage !== 'place' || st.round !== round) return null;
        const other = r.seats.find((s) => s !== me);
        const p = { ['state.ready.' + me]: true };
        if (other && st.ready && st.ready[other]) { p['state.stage'] = 'battle'; p['state.turn'] = st.first || r.hostUid; }
        return p;
      });
      if (G.code === code && G.round === round) G.locked = true;
    } catch (e) {
      G.err = 'Could not send your fleet. Try again';
    } finally {
      G.sending = false;
      if (G.code === code) renderGame();
    }
  }

  let firing = false;
  async function onlineFire(x, y) {
    if (firing) return;
    const code = G.code, me = G.me;
    firing = true;
    G.pending = { x, y };
    G.turn = 'wait';
    renderGame();
    try {
      const done = await Rooms.update(code, (r) => {
        const st = r.state || {};
        if (r.phase !== 'play' || st.stage !== 'battle' || st.turn !== me) return null;
        const shots = Array.isArray(st.shots) ? st.shots : [];
        const last = shots[shots.length - 1];
        if (last && last.result === null) return null;
        if (shots.some((s) => s.by === me && s.x === x && s.y === y)) return null;
        return { 'state.shots': shots.concat([{ by: me, x, y, result: null, ship: null }]) };
      });
      if (!done && G.room) onRoom(G.room);
    } catch (e) {
      G.err = 'Your shot did not go through. Try again';
      if (G.room) onRoom(G.room); else renderGame();
      setTimeout(() => { if (G.err.startsWith('Your shot')) { G.err = ''; renderGame(); } }, 3000);
    } finally { firing = false; }
  }

  // The defender answers a shot at its own fleet, which only it can see.
  function maybeResolve() {
    const room = G.room;
    if (!room || G.mode !== 'online') return;
    const st = room.state || {};
    if (st.stage !== 'battle' || !Array.isArray(st.shots)) return;
    const idx = st.shots.length - 1;
    const shot = st.shots[idx];
    if (!shot || shot.result !== null || shot.by === G.me) return;
    if (!G.fleetLoaded) { ensureFleet(); return; }
    if (G.resolving === idx) return;
    G.resolving = idx;
    const me = G.me, code = G.code, round = G.round;
    const prior = st.shots.slice(0, idx).filter((s) => s.by !== me && s.result);
    const res = resolveShot(G.fleet, prior, shot.x, shot.y);
    Rooms.update(code, (r) => {
      const s = r.state || {};
      if (s.stage !== 'battle' || s.round !== round || !Array.isArray(s.shots) || s.shots.length !== idx + 1) return null;
      const cur = s.shots[idx];
      if (cur.result !== null || cur.by === me || cur.x !== shot.x || cur.y !== shot.y) return null;
      const out = { by: cur.by, x: cur.x, y: cur.y, result: res.result, ship: res.ship || null };
      if (res.result === 'sunk') { out.sx = res.sx; out.sy = res.sy; out.sd = res.sd; }
      const shots = s.shots.slice();
      shots[idx] = out;
      const p = { 'state.shots': shots };
      if (res.allSunk) { p['state.stage'] = 'over'; p['state.winner'] = cur.by; p['state.turn'] = null; p.phase = 'done'; }
      else p['state.turn'] = me;
      return p;
    }).then(() => {
      if (G.resolving === idx) G.resolving = -1;
    }).catch(() => {
      if (G.resolving === idx) G.resolving = -1;
      later(maybeResolve, 2500);
    });
  }

  async function requestRematch() {
    if (G.mode !== 'online' || G.rematchSent) return;
    const code = G.code, me = G.me;
    G.rematchSent = true;
    renderEnd(); renderGame();
    try {
      await Rooms.update(code, (r) => {
        const st = r.state || {};
        if (st.stage !== 'over') return null;
        const other = r.seats.find((s) => s !== me);
        if (!other || (st.gone && st.gone[other])) return null;
        if (st.rematch && st.rematch[other]) {
          const first = st.first === r.seats[0] ? r.seats[1] : r.seats[0];
          return { phase: 'play', state: freshRoundState((st.round || 1) + 1, first) };
        }
        return { ['state.rematch.' + me]: true };
      });
    } catch (e) {
      G.rematchSent = false;
      G.err = 'Could not reach the game server. Try again';
      renderGame(); if (!overlay.hidden) renderEnd();
    }
  }

  /* ---------- copy link ---------- */
  const copyBtn = $('copyBtn');
  copyBtn.addEventListener('click', async () => {
    const url = Rooms.inviteUrl(SLUG, G.code);
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (_) {
      try {
        const t = document.createElement('textarea');
        t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        ok = document.execCommand('copy');
        t.remove();
      } catch (_) {}
    }
    copyBtn.textContent = ok ? 'Copied' : 'Copy failed';
    setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1600);
  });
  $('lobbyLeave').addEventListener('click', leaveRoom);

  /* ---------- menu button (armed confirm when leaving an online game) ---------- */
  const menuBtn = $('menuBtn');
  let armTimer = 0;
  function disarm() { clearTimeout(armTimer); menuBtn.classList.remove('armed'); menuBtn.textContent = 'Menu'; }
  menuBtn.addEventListener('click', () => {
    if (G.mode !== 'online') { toMenu(); return; }
    const st = (G.room && G.room.state) || {};
    const gone = !G.opp || !!(st.gone && st.gone[G.opp]);
    if (G.over || gone || menuBtn.classList.contains('armed')) { disarm(); leaveRoom(); return; }
    menuBtn.classList.add('armed');
    menuBtn.textContent = 'Leave game?';
    clearTimeout(armTimer);
    armTimer = setTimeout(disarm, 2600);
  });

  /* ---------- keys ---------- */
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (G.screen !== 'game') return;
    if (e.key === 'r' || e.key === 'R') { rotateKey(); return; }
    if (e.key === 'Escape') {
      if (!overlay.hidden) { hideOverlay(); renderGame(); return; }
      if (drag && !drag.tap) { endDrag(drag.last, true); return; }
      if (G.sel) { G.sel = null; hoverPv = null; renderGame(); }
      return;
    }
    if (G.stage !== 'battle' || G.over || G.turn !== 'me') return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[e.key]) {
      e.preventDefault();
      const c = G.cursor || { x: 4, y: 4 };
      G.cursor = { x: clamp(0, c.x + (G.cursor ? dirs[e.key][0] : 0), N - 1), y: clamp(0, c.y + (G.cursor ? dirs[e.key][1] : 0), N - 1) };
      if (G.single && G.view !== 'target') { clearViewTimer(); G.view = 'target'; renderGame(); }
      drawCursor(bTheirs, G.cursor);
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && G.cursor) {
      e.preventDefault();
      fire(G.cursor.x, G.cursor.y);
    }
  });

  /* ---------- layout: sized from the viewport ---------- */
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const m = Math.min(vw, vh);
    const fs = clamp(12, Math.min(vw / 30, vh / 42), 16);
    root.style.fontSize = fs + 'px';
    const pad = Math.round(clamp(10, m * 0.03, 24));
    const gap = Math.round(clamp(8, m * 0.02, 16));
    app.style.setProperty('--pad', pad + 'px');
    app.style.setProperty('--gap', gap + 'px');
    if (G.screen !== 'game') return;

    const placing = G.stage === 'place';
    const d = Math.round(clamp(14, m / 24, 24));
    app.style.setProperty('--d', d + 'px');
    app.style.setProperty('--maxw', '100%');
    const W = vw - 2 * pad;
    let used = $('scrGame').querySelector('.gbar').offsetHeight + $('status').offsetHeight + gap * 2;
    if (!note.hidden) used += note.offsetHeight + gap;
    if (!foot.hidden) used += foot.offsetHeight + gap;
    const H = vh - 2 * pad - used;
    const headH = sideMine.querySelector('.side-head').offsetHeight + 4;
    const labOf = (c) => Math.round(clamp(12, c * 0.5, 22));
    const fitC = (w, h) => {
      let c = Math.floor(Math.min((w - 18 - 9) / 10, (h - 18 - 9) / 10));
      const lab = labOf(c);
      c = Math.floor(Math.min((w - lab - 9) / 10, (h - lab - 9) / 10));
      return clamp(12, c, 60);
    };

    let c;
    field.classList.remove('place', 'place-col', 'two', 'one');
    if (placing) {
      field.classList.add('place');
      dock.hidden = false;
      dock.classList.remove('side');
      dock.style.width = Math.min(W, 34 * d) + 'px';
      field.classList.add('place-col');
      const dh = dock.offsetHeight;
      const cCol = fitC(W, H - dh - gap - headH);
      dock.classList.add('side');
      dock.style.width = '';
      field.classList.remove('place-col');
      const dw = dock.offsetWidth, dh2 = dock.offsetHeight;
      const cRow = fitC(W - dw - gap * 2, H - headH);
      if (cRow > cCol && dh2 <= H) c = cRow;
      else {
        c = cCol;
        dock.classList.remove('side');
        dock.style.width = Math.min(W, 34 * d) + 'px';
        field.classList.add('place-col');
      }
      G.single = false;
      tabs.hidden = true;
    } else {
      tabs.hidden = false;
      const tabsH = tabs.offsetHeight + gap;
      const c2 = fitC((W - gap * 2) / 2 - 2, H - headH);
      const c1 = fitC(W, H - headH - tabsH);
      const two = c2 >= c1 * 0.75 || c2 >= 34;
      c = two ? c2 : c1;
      G.single = !two;
      tabs.hidden = two;
      field.classList.add(two ? 'two' : 'one');
    }
    const lab = labOf(c);
    G.c = c;
    app.style.setProperty('--c', c + 'px');
    app.style.setProperty('--lab', lab + 'px');
    app.style.setProperty('--lf', Math.round(clamp(9, c * 0.32, 12)) + 'px');
    app.style.setProperty('--in', Math.max(2, Math.round(c * 0.1)) + 'px');
    // Keep the bars as wide as the boards so the screen reads as one block.
    const boardW = lab + 10 * c + 9;
    let blockW = boardW;
    if (placing && dock.classList.contains('side')) blockW = boardW + gap * 2 + dock.offsetWidth;
    else if (!placing && !G.single) blockW = boardW * 2 + gap * 2;
    app.style.setProperty('--maxw', Math.max(blockW, Math.min(W, 300)) + 'px');
  }

  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { shape = ''; layout(); }); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout()).catch(() => {});

  /* ---------- no scrolling, pull to refresh or zoom on the play area ---------- */
  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
  window.addEventListener('pointerdown', () => { window.focus(); }, true);
  V.onPause((p) => { paused = !!p; });

  /* ---------- boot ---------- */
  G.level = ['easy', 'normal', 'hard'].includes(store.get(K_LEVEL)) ? store.get(K_LEVEL) : 'normal';
  const savedName = store.get(K_NAME);
  if (typeof savedName === 'string') nameIn.value = savedName;
  setOnlineBusy(true);
  renderMenu();
  scr.menu.classList.add('on');
  layout();

  function offline() {
    onlineOk = false;
    $('onlinePanel').classList.add('off');
    setOnlineBusy(true);
    menuMsg('Online play is not set up yet.');
  }

  import('../_shared/rooms.js').then((mod) => {
    Rooms = mod;
    if (!Rooms.available) { offline(); return; }
    onlineOk = true;
    setOnlineBusy(false);
    const code = Rooms.codeFromUrl();
    if (code) { codeIn.value = code; onlineJoin(code, false); return; }
    const saved = store.get(K_ROOM);
    if (saved && saved.code && Date.now() - (saved.t || 0) < 6 * 3600 * 1000 && G.mode === null) onlineJoin(saved.code, true);
  }).catch(() => offline());

  // Pick up an unfinished game against the computer.
  const cpuSave = loadCpu();
  if (cpuSave && cpuSave.stage === 'battle' && !new URLSearchParams(location.search).get('room')) resumeCpu(cpuSave);

  app.classList.add('ready');
  V.ready();
})();
</script>
</body>
</html>
