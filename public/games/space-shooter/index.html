<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Space Shooter</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #000;
    --s1: #16181c;
    --line: rgba(255, 255, 255, 0.1);
    --text: #fff;
    --dim: rgba(255, 255, 255, 0.6);
    --brand: #ea5426;
    --brand-l: #ff7a4d;
    --brand-d: #b83f19;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font, "Segoe UI", system-ui, sans-serif);
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative;
    overflow: hidden;
    background: #000;
    outline: 1px solid var(--line);
  }
  canvas { display: block; }
  #ui {
    position: absolute;
    left: 0; top: 0;
    width: 480px; height: 640px;
    transform-origin: 0 0;
    pointer-events: none;
  }
  .ov {
    position: absolute;
    left: 0; right: 0; top: 48px; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.78);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s var(--ease), visibility 0s linear 0.2s;
  }
  .ov.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 0.25s var(--ease), visibility 0s;
  }
  .ov.tap { cursor: pointer; }
  .card {
    width: 100%;
    max-width: 320px;
    background: var(--s1);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 24px;
    text-align: left;
    transform: translateY(14px);
    transition: transform 0.3s var(--ease);
  }
  .ov.show .card { transform: none; }
  .label {
    font: 600 11px/1 var(--font, sans-serif);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .name {
    font: 300 44px/1 var(--font-display, sans-serif);
    letter-spacing: -0.01em;
  }
  .controls { color: var(--dim); font-size: 13px; font-weight: 400; line-height: 1.5; margin: 12px 0 24px; }
  .btn {
    display: block;
    width: 100%;
    font: 600 13px/1 var(--font, sans-serif);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    color: #fff;
    background: var(--brand);
    border: 1px solid var(--brand);
    border-radius: 0;
    padding: 14px 16px;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .btn:hover { background: var(--brand-l); border-color: var(--brand-l); }
  .btn:active { background: var(--brand-d); border-color: var(--brand-d); transform: scale(0.985); }
  .btn:focus { outline: none; }
  .btn:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
  .score-big {
    font: 300 64px/1 var(--font-display, sans-serif);
    letter-spacing: -0.02em;
    margin: 14px 0 18px;
    font-variant-numeric: tabular-nums;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
    margin-bottom: 16px;
  }
  .row b { font: 600 16px/1 var(--font-display, sans-serif); font-variant-numeric: tabular-nums; }
  .badge {
    display: none;
    font: 600 11px/1 var(--font, sans-serif);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brand-l);
    margin-left: 10px;
  }
  .badge.on { display: inline; }
  .gap { height: 18px; }
  .touch-only { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .touch-only { display: block; }
    .desk-only { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ov, .ov.show, .card, .btn { transition: none; }
    .card { transform: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Space Shooter game"></canvas>
  <div id="ui">
    <section id="ovStart" class="ov tap show">
      <div class="card">
        <div class="name">Space Shooter</div>
        <p class="controls desk-only">Arrows or A and D to move. Space to fire. P to pause.</p>
        <p class="controls touch-only">Drag to move. Fires while you touch.</p>
        <button class="btn" id="btnPlay" type="button">Play</button>
      </div>
    </section>

    <section id="ovPause" class="ov tap">
      <div class="card">
        <div class="label">Paused</div>
        <div class="gap"></div>
        <button class="btn" id="btnResume" type="button">Resume</button>
      </div>
    </section>

    <section id="ovOver" class="ov">
      <div class="card">
        <div class="label">Game over<span class="badge" id="overBadge">New best</span></div>
        <div class="score-big" id="overScore">0</div>
        <div class="row"><span class="label">Best</span><b id="overBest">0</b></div>
        <button class="btn" id="btnAgain" type="button">Play again</button>
      </div>
    </section>
  </div>
</div>

<script src="../_shared/bridge.js" data-game="space-shooter"></script>
<script>
(() => {
  'use strict';

  // ---------- Bridge (with a standalone fallback if the bridge failed to load) ----------
  const V = window.Vela || (() => {
    const key = 'vela:best:space-shooter';
    const rb = () => { try { return Number(localStorage.getItem(key)) || 0; } catch (_) { return 0; } };
    return {
      embedded: false, ready() {}, score() {}, best: rb, onPause() {},
      gameOver(n) { const p = rb(); if (n > p) { try { localStorage.setItem(key, String(n)); } catch (_) {} } return n > p; },
    };
  })();

  // ---------- Constants ----------
  const W = 480, H = 640, HUD = 48;
  const STEP = 1 / 120;                       // fixed logic step
  const PX = 2;                               // sprite pixel size (logical px)
  const PLAYER_Y = 584, PLAYER_HALF = 13, PLAYER_SPEED = 250, POINTER_SPEED = 900;
  const GROUND_Y = 608;
  const SHOT_W = 2, SHOT_H = 10, SHOT_SPEED = 620, MAX_SHOTS = 2, COOLDOWN = 0.3;
  const COLS = 11, ROWS = 5, CELL_W = 32, CELL_H = 28, SLOT_W = 24, ENEMY_H = 16;
  const STEP_DX = 6, DROP = 14, EDGE = 10;
  const SH_COLS = 22, SH_ROWS = 16, SC = 2, SHIELD_Y = 496, SHIELD_W = SH_COLS * SC, SHIELD_H = SH_ROWS * SC;
  const BONUS_Y = 60, BONUS_W = 32, BONUS_H = 14;
  const BOSS_PX = 3, BOSS_Y = 92;
  const INTRO = 1.6;
  const EXTRA_LIFE_AT = 1500;
  const MAX_PARTS = 900;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const C = {
    s1: '#16181c', line: 'rgba(255,255,255,0.1)', text: '#ffffff', dim: 'rgba(255,255,255,0.6)',
    orange: '#ea5426', light: '#ff7a4d', dark: '#b83f19', grey: '#8a8f99', white: '#ffffff',
  };
  const rootStyle = getComputedStyle(document.documentElement);
  const FONT = rootStyle.getPropertyValue('--font').trim() || '"Segoe UI", system-ui, sans-serif';
  const FONT_D = rootStyle.getPropertyValue('--font-display').trim() || FONT;

  // ---------- Pixel art ----------
  // Sprites are drawn as left halves and mirrored, so every one is exactly symmetric.
  // odd = the last column of the half is the centre column.
  function mirror(half, odd) {
    return half.map((r) => r + (odd ? r.slice(0, -1) : r).split('').reverse().join(''));
  }
  // runs: per character, flat [x, y, len, ...] horizontal runs. cells: flat [x, y, ch, ...].
  function build(rows) {
    const h = rows.length, w = rows[0].length, runs = {}, cells = [];
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      let x = 0;
      while (x < w) {
        const ch = row[x];
        if (ch === '.') { x++; continue; }
        let e = x;
        while (e < w && row[e] === ch) e++;
        (runs[ch] || (runs[ch] = [])).push(x, y, e - x);
        for (let i = x; i < e; i++) cells.push(i, y, ch);
        x = e;
      }
    }
    return { w, h, runs, cells, rows };
  }

  const SPR = {
    squid: [
      build(mirror(['...#', '..##', '.###', '##.#', '####', '..#.', '.#.#', '#.#.'])),
      build(mirror(['...#', '..##', '.###', '##.#', '####', '.#.#', '#...', '.#..'])),
    ],
    crab: [
      build(mirror(['..#...', '...#..', '..####', '.##.##', '######', '#.####', '#.#...', '...##.'], true)),
      build(mirror(['..#...', '#..#..', '#.####', '###.##', '######', '.#####', '..#...', '.#....'], true)),
    ],
    octo: [
      build(mirror(['....##', '.#####', '######', '###..#', '######', '...##.', '..##.#', '##....'])),
      build(mirror(['....##', '.#####', '######', '###..#', '######', '..###.', '.##..#', '..##..'])),
    ],
    player: build(mirror(['......#', '.....##', '.....##', '.######', '#######', '#######', '#######', '#######'], true)),
    bonus: build(mirror(['.....###', '...#####', '..######', '.##.##.#', '########', '..###..#', '...#....'])),
    boss: build(mirror([
      '..........oooooo',
      '........oooooooo',
      '......oooowwoooo',
      '....oooooowwoooo',
      '...ooooooooooooo',
      '..oooddooddooddo',
      '.ooooooooooooooo',
      'oowwwwoooooooooo',
      'oowwwwoooooooooo',
      'oooooooooooooooo',
      '..ddd..ooooo..oo',
      '..ddd...ooo...ww',
      '...d.....o....ww',
      '..............ww',
      '...............w',
    ])),
    zig: [
      build(['.#.', '#..', '.#.', '..#', '.#.', '#..', '.#.']),
      build(['.#.', '..#', '.#.', '#..', '.#.', '..#', '.#.']),
    ],
    plunger: [
      build(['###', '.#.', '.#.', '.#.', '.#.', '.#.', '.#.']),
      build(['.#.', '.#.', '.#.', '###', '.#.', '.#.', '.#.']),
      build(['.#.', '.#.', '.#.', '.#.', '.#.', '.#.', '###']),
    ],
    orb: build(['.#.', '###', '.#.']),
  };

  const TYPES = [
    { spr: SPR.squid, pts: 30, color: C.light },
    { spr: SPR.crab, pts: 20, color: C.orange },
    { spr: SPR.octo, pts: 10, color: C.dark },
  ];
  const ROW_TYPE = [0, 1, 1, 2, 2];
  const BOSS_W = SPR.boss.w * BOSS_PX, BOSS_H = SPR.boss.h * BOSS_PX;
  const BOSS_PAL = { o: C.orange, w: C.white, d: C.dark };
  // Lowest solid row in each boss column, for pixel-accurate hits from below.
  const BOSS_BOT = [];
  for (let c = 0; c < SPR.boss.w; c++) {
    let b = -1;
    for (let r = 0; r < SPR.boss.h; r++) if (SPR.boss.rows[r][c] !== '.') b = r;
    BOSS_BOT.push(b);
  }

  // A few fixed grey dots in the background.
  const DOTS = [];
  (() => {
    let s = 7;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 42; i++) DOTS.push(Math.floor(rnd() * W), Math.floor(HUD + 8 + rnd() * (GROUND_Y - HUD - 16)));
  })();

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d'), ui = $('ui');
  const ovStart = $('ovStart'), ovPause = $('ovPause'), ovOver = $('ovOver');

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const pad = V.embedded ? 0 : Math.round(Math.min(24, Math.min(vw, vh) * 0.03));
    const s = Math.max(0.1, Math.min((vw - pad * 2) / W, (vh - pad * 2) / H));
    const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    stage.style.width = cw + 'px';
    stage.style.height = ch + 'px';
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(ch * dpr);
    ui.style.transform = 'scale(' + (cw / W) + ',' + (ch / H) + ')';
  }

  // ---------- State ----------
  let state = 'title';       // title, intro, play, dying, clear, over
  let paused = false;
  let score = 0, lives = 3, wave = 1, extraGiven = false, bestCache = V.best();
  let stateT = 0, introT = 0, overT = 0;
  let enemies = [], alive = 0, fx = 0, fy = 0, fdir = 1, frame = 0, marchT = 0, fireT = 0;
  let shields = [], pshots = [], eshots = [], parts = [], floats = [], flashes = [];
  let bonus = null, bonusT = 0, boss = null;
  let shake = 0, hurt = 0, cooldown = 0;
  const player = { x: W / 2, px: W / 2 };
  const keys = { left: false, right: false, fire: false };
  let ptrTarget = null;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  const isBossWave = (n) => n % 5 === 0;
  // Number of normal waves played before this one; drives start height and speed.
  const waveK = () => (wave - 1) - Math.floor((wave - 1) / 5);

  function setScore(n) {
    score = n;
    V.score(score);
    if (!extraGiven && score >= EXTRA_LIFE_AT) {
      extraGiven = true;
      lives++;
      floats.push({ x: player.x, y: PLAYER_Y - 16, text: 'EXTRA LIFE', color: C.white, t: 0, max: 1.4 });
    }
  }
  function addPoints(n) { setScore(score + n); }

  // ---------- Setup ----------
  function makeShield(i) {
    const g = new Uint8Array(SH_COLS * SH_ROWS);
    for (let r = 0; r < SH_ROWS; r++) {
      for (let c = 0; c < SH_COLS; c++) {
        let on = true;
        if (r < 4 && (c < 4 - r || c > SH_COLS - 1 - (4 - r))) on = false;
        if (r === 12 && c >= 8 && c <= 13) on = false;
        if (r === 13 && c >= 7 && c <= 14) on = false;
        if (r >= 14 && c >= 6 && c <= 15) on = false;
        g[r * SH_COLS + c] = on ? 1 : 0;
      }
    }
    return { x: Math.round(W * (2 * i + 1) / 8 - SHIELD_W / 2), g };
  }

  function place() {
    for (const e of enemies) {
      e.x = fx + e.c * CELL_W + (SLOT_W - e.w) / 2;
      e.y = fy + e.r * CELL_H;
    }
  }

  function buildFormation() {
    enemies = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const type = ROW_TYPE[r];
        enemies.push({ r, c, type, alive: true, w: TYPES[type].spr[0].w * PX, x: 0, y: 0 });
      }
    }
    alive = enemies.length;
    fx = (W - ((COLS - 1) * CELL_W + SLOT_W)) / 2;
    fy = 92 + Math.min(waveK(), 7) * 14;
    fdir = 1; frame = 0;
    place();
    marchT = marchInterval();
  }

  function startWave(n) {
    wave = n;
    pshots = []; eshots = []; flashes = [];
    bonus = null; bonusT = rand(14, 22);
    shields = [0, 1, 2, 3].map(makeShield);
    if (isBossWave(wave)) {
      enemies = []; alive = 0;
      const num = wave / 5;
      const hp = 24 + 8 * num;
      boss = { num, hp, max: hp, x: W / 2, y: -BOSS_H - 10, t: 0, phase: 0, flash: 0, patT: 1.1, pat: 0, sched: [] };
    } else {
      boss = null;
      buildFormation();
    }
    fireT = 1.0;
    state = 'intro';
    introT = INTRO;
  }

  function newGame() {
    hideAll();
    paused = false;
    setScore(0);
    lives = 3; extraGiven = false;
    parts = []; floats = []; shake = 0; hurt = 0; cooldown = 0;
    bestCache = V.best();
    player.x = player.px = W / 2;
    startWave(1);
  }

  function endGame() {
    state = 'over';
    overT = 0;
    keys.fire = false;
    const isBest = V.gameOver(score);
    bestCache = V.best();
    $('overScore').textContent = score.toLocaleString();
    $('overBest').textContent = bestCache.toLocaleString();
    $('overBadge').classList.toggle('on', isBest && score > 0);
    show(ovOver);
  }

  // ---------- Formation ----------
  function marchInterval() {
    const frac = alive / (COLS * ROWS);
    return (0.03 + 0.5 * Math.pow(frac, 1.5)) * Math.max(0.55, 1 - 0.06 * waveK());
  }
  const fireMul = () => Math.max(0.5, 1 - 0.06 * waveK());
  const maxEnemyShots = () => (boss ? 10 + boss.num * 2 : Math.min(3 + Math.floor(waveK() / 2), 6));
  const enemyShotSpeed = () => Math.min(170 + 12 * waveK(), 270);

  function march() {
    let minX = Infinity, maxX = -Infinity;
    for (const e of enemies) if (e.alive) { minX = Math.min(minX, e.x); maxX = Math.max(maxX, e.x + e.w); }
    if (minX === Infinity) return;
    if ((fdir > 0 && maxX + STEP_DX > W - EDGE) || (fdir < 0 && minX - STEP_DX < EDGE)) {
      fy += DROP; fdir = -fdir;
    } else {
      fx += fdir * STEP_DX;
    }
    frame ^= 1;
    place();
    let lowest = 0;
    for (const e of enemies) {
      if (!e.alive) continue;
      lowest = Math.max(lowest, e.y + ENEMY_H);
      if (e.y + ENEMY_H > SHIELD_Y && e.y < SHIELD_Y + SHIELD_H) clearShieldRect(e.x, e.y, e.w, ENEMY_H);
    }
    if (lowest >= PLAYER_Y) killPlayer(true);
  }

  function updateFormation(dt) {
    marchT -= dt;
    if (marchT <= 0) {
      march();
      marchT = Math.max(0, marchT + marchInterval());
    }
    if (state !== 'play') return;
    fireT -= dt;
    if (fireT <= 0) {
      fireT = rand(0.45, 1.0) * fireMul();
      if (eshots.length < maxEnemyShots()) enemyFire();
    }
  }

  function enemyFire() {
    const low = [];
    for (const e of enemies) if (e.alive && (!low[e.c] || e.r > low[e.c].r)) low[e.c] = e;
    const list = low.filter(Boolean);
    if (!list.length) return;
    const aimed = Math.random() < 0.35;
    let pick;
    if (aimed) {
      pick = list[0];
      for (const e of list) if (Math.abs(e.x + e.w / 2 - player.x) < Math.abs(pick.x + pick.w / 2 - player.x)) pick = e;
    } else {
      pick = list[Math.floor(Math.random() * list.length)];
    }
    const x = pick.x + pick.w / 2, y = pick.y + ENEMY_H;
    eshots.push({ x, y, px: x, py: y, vx: 0, vy: enemyShotSpeed(), kind: aimed ? 'plunger' : 'zig', t: 0, dead: false });
  }

  function killEnemy(e) {
    e.alive = false;
    alive--;
    const t = TYPES[e.type];
    addPoints(t.pts);
    flashes.push({ spr: t.spr[frame], x: e.x, y: e.y, p: PX, t: 0.07, pal: { '#': t.color } });
    marchT = Math.min(marchT, marchInterval());
  }

  // ---------- Bonus ship ----------
  function updateBonus(dt) {
    if (bonus) {
      bonus.px = bonus.x;
      bonus.x += bonus.vx * dt;
      if (bonus.x < -BONUS_W - 8 || bonus.x > W + 8) bonus = null;
      return;
    }
    if (boss || alive < 8) return;
    bonusT -= dt;
    if (bonusT <= 0) {
      bonusT = rand(18, 28);
      const d = Math.random() < 0.5 ? 1 : -1;
      const x = d > 0 ? -BONUS_W : W;
      const pts = [50, 100, 100, 150, 150, 300][Math.floor(Math.random() * 6)];
      bonus = { x, px: x, vx: d * 100, pts };
    }
  }

  // ---------- Boss ----------
  function bossShot(x, y, vx, vy) {
    if (eshots.length >= maxEnemyShots()) return;
    eshots.push({ x, y, px: x, py: y, vx, vy, kind: 'orb', t: 0, dead: false });
  }

  function bossPattern() {
    const b = boss, by = b.y + BOSS_H;
    const kind = ['fan', 'aim', 'rain', 'aim'][b.pat % 4];
    b.pat++;
    if (kind === 'fan') {
      const n = Math.min(5 + b.num - 1, 9), spread = 1.1, v = 170 + 10 * b.num;
      for (let i = 0; i < n; i++) {
        const a = -spread / 2 + (spread * i) / (n - 1);
        bossShot(b.x, by - 3, Math.sin(a) * v, Math.cos(a) * v);
      }
    } else if (kind === 'aim') {
      for (let i = 0; i < 3; i++) {
        b.sched.push({ t: i * 0.16, fn: () => {
          const side = i % 2 === 0 ? -1 : 1;
          const gx = boss.x + side * 37.5, gy = boss.y + 39;
          const dx = player.x - gx, dy = PLAYER_Y + 8 - gy, d = Math.hypot(dx, dy) || 1, v = 230;
          bossShot(gx, gy, (dx / d) * v, Math.max(0.3, dy / d) * v);
        } });
      }
    } else {
      const n = 7;
      for (let i = 0; i < n; i++) {
        const off = -42 + (84 * i) / (n - 1);
        b.sched.push({ t: i * 0.07, fn: () => bossShot(boss.x + off, boss.y + 33, 0, 200) });
      }
    }
  }

  function updateBoss(dt) {
    const b = boss;
    b.t += dt;
    const f = b.hp / b.max;
    b.phase += dt * (0.55 + 0.5 * (1 - f));
    b.x = W / 2 + Math.sin(b.phase) * (W / 2 - BOSS_W / 2 - 14);
    b.y = BOSS_Y + (1 - Math.cos(b.t * 0.5)) * 14;
    b.patT -= dt;
    if (b.patT <= 0) {
      bossPattern();
      b.patT = (1.5 - 0.6 * (1 - f)) * Math.max(0.7, 1 - 0.08 * (b.num - 1));
    }
    for (let i = b.sched.length - 1; i >= 0; i--) {
      const s = b.sched[i];
      s.t -= dt;
      if (s.t <= 0) { b.sched.splice(i, 1); s.fn(); }
    }
  }

  // Shot rect against the boss bitmap, column by column. Returns the hit y or -1.
  function bossHitY(sx, sy) {
    const b = boss;
    const bx = b.x - BOSS_W / 2, by = b.y;
    if (sx + SHOT_W <= bx || sx >= bx + BOSS_W) return -1;
    const c0 = clamp(Math.floor((sx - bx) / BOSS_PX), 0, SPR.boss.w - 1);
    const c1 = clamp(Math.floor((sx + SHOT_W - 0.01 - bx) / BOSS_PX), 0, SPR.boss.w - 1);
    let bot = -1;
    for (let c = c0; c <= c1; c++) bot = Math.max(bot, BOSS_BOT[c]);
    if (bot < 0) return -1;
    const yb = by + (bot + 1) * BOSS_PX;
    return sy <= yb && sy + SHOT_H >= by ? yb : -1;
  }

  function hitBoss(x, y) {
    const b = boss;
    b.hp--;
    b.flash = 0.05;
    addPoints(5);
    sparks(x, y, 4, C.white, 1);
    if (b.hp <= 0) killBoss();
  }

  function killBoss() {
    const b = boss;
    const bonusPts = 1000 * b.num;
    burst(SPR.boss, b.x - BOSS_W / 2, b.y, BOSS_PX, BOSS_PAL, 1.2);
    addPoints(bonusPts);
    floats.push({ x: b.x, y: b.y + BOSS_H / 2, text: '+' + bonusPts.toLocaleString(), color: C.white, t: 0, max: 1.8 });
    if (!RM) shake = 0.4;
    clearEnemyShots();
    boss = null;
    state = 'clear';
    stateT = 2.2;
  }

  // ---------- Shields ----------
  function shieldHit(x, y, w, h, dir) {
    if (y + h <= SHIELD_Y || y >= SHIELD_Y + SHIELD_H) return null;
    for (const s of shields) {
      if (x + w <= s.x || x >= s.x + SHIELD_W) continue;
      const c0 = Math.max(0, Math.floor((x - s.x) / SC)), c1 = Math.min(SH_COLS - 1, Math.floor((x + w - 0.01 - s.x) / SC));
      const r0 = Math.max(0, Math.floor((y - SHIELD_Y) / SC)), r1 = Math.min(SH_ROWS - 1, Math.floor((y + h - 0.01 - SHIELD_Y) / SC));
      let best = null;
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (!s.g[r * SH_COLS + c]) continue;
          // first contact: lowest cell when moving up, highest when moving down
          if (!best || (dir < 0 ? r > best.r : r < best.r)) best = { s, r, c };
        }
      }
      if (best) return best;
    }
    return null;
  }

  function erode(hit, dir) {
    const { s, r, c } = hit;
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const rr = r + dy, cc = c + dx;
        if (rr < 0 || rr >= SH_ROWS || cc < 0 || cc >= SH_COLS) continue;
        // carve deeper along the direction of travel
        const d = Math.hypot(dx, dy - dir * 0.9);
        const p = d <= 1.05 ? 1 : d <= 2.7 ? 0.8 - (d - 1) * 0.35 : 0;
        if (Math.random() < p) s.g[rr * SH_COLS + cc] = 0;
      }
    }
    s.g[r * SH_COLS + c] = 0;
    const x = s.x + c * SC + 1, y = SHIELD_Y + r * SC + 1;
    sparks(x, y, 5, C.grey, dir < 0 ? -1 : 1);
  }

  function clearShieldRect(x, y, w, h) {
    for (const s of shields) {
      if (x + w <= s.x || x >= s.x + SHIELD_W) continue;
      const c0 = Math.max(0, Math.floor((x - s.x) / SC)), c1 = Math.min(SH_COLS - 1, Math.floor((x + w - 0.01 - s.x) / SC));
      const r0 = Math.max(0, Math.floor((y - SHIELD_Y) / SC)), r1 = Math.min(SH_ROWS - 1, Math.floor((y + h - 0.01 - SHIELD_Y) / SC));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) s.g[r * SH_COLS + c] = 0;
    }
  }

  // ---------- Player ----------
  const playerActive = () => state === 'intro' || state === 'play' || state === 'clear';

  function hitsPlayer(x, y, w, h) {
    const px = player.x;
    // turret, then hull
    return overlap(x, y, w, h, px - 3, PLAYER_Y, 6, 6) || overlap(x, y, w, h, px - PLAYER_HALF, PLAYER_Y + 6, PLAYER_HALF * 2, 10);
  }

  function updatePlayer(dt) {
    player.px = player.x;
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) player.x += dir * PLAYER_SPEED * dt;
    else if (ptrTarget !== null) {
      const m = POINTER_SPEED * dt;
      player.x += clamp(ptrTarget - player.x, -m, m);
    }
    player.x = clamp(player.x, EDGE + PLAYER_HALF, W - EDGE - PLAYER_HALF);
    cooldown = Math.max(0, cooldown - dt);
    const wantFire = keys.fire || touchId !== null || mouseId !== null;
    if (wantFire && state === 'play' && cooldown <= 0 && pshots.length < MAX_SHOTS) {
      const x = player.x - SHOT_W / 2, y = PLAYER_Y - SHOT_H + 2;
      pshots.push({ x, y, py: y, dead: false });
      cooldown = COOLDOWN;
    }
  }

  function killPlayer(invasion) {
    if (!playerActive()) return;
    lives = invasion ? 0 : Math.max(0, lives - 1);
    burst(SPR.player, player.x - PLAYER_HALF, PLAYER_Y, PX, { '#': C.white }, 1.5);
    sparks(player.x, PLAYER_Y + 8, 10, C.light, 0);
    if (!RM) shake = 0.4;
    hurt = 0.4;
    clearEnemyShots();
    if (boss) boss.sched = [];
    bonus = null;
    state = 'dying';
    stateT = lives > 0 ? 1.5 : 1.3;
  }

  function respawn() {
    player.x = player.px = W / 2;
    ptrTarget = ptrTarget === null ? null : W / 2;
    tAnchor = W / 2; if (touchId !== null) tStartX = lastTouchX;
    cooldown = 0;
    fireT = 1.0;
    if (boss) boss.patT = Math.max(boss.patT, 1.2);
    state = 'play';
  }

  function waveClear() {
    clearEnemyShots();
    bonus = null;
    state = 'clear';
    stateT = 1.4;
  }

  function clearEnemyShots() {
    for (const s of eshots) sparks(s.x, s.y + 4, 2, C.orange, 0);
    eshots = [];
  }

  // ---------- Shots ----------
  function updatePlayerShots(dt) {
    for (const s of pshots) {
      s.py = s.y;
      const n = Math.max(1, Math.ceil((SHOT_SPEED * dt) / 2));
      const sdt = dt / n;
      for (let k = 0; k < n && !s.dead; k++) {
        s.y -= SHOT_SPEED * sdt;
        if (s.y + SHOT_H < HUD + 4) { s.dead = true; sparks(s.x + 1, HUD + 4, 3, C.white, 1); break; }
        // bonus ship
        if (bonus && overlap(s.x, s.y, SHOT_W, SHOT_H, bonus.x, BONUS_Y, BONUS_W, BONUS_H)) {
          s.dead = true;
          addPoints(bonus.pts);
          burst(SPR.bonus, bonus.x, BONUS_Y, PX, { '#': C.light }, 1);
          floats.push({ x: bonus.x + BONUS_W / 2, y: BONUS_Y + 7, text: String(bonus.pts), color: C.white, t: 0, max: 1.2 });
          bonus = null;
          break;
        }
        // boss
        if (boss && state === 'play') {
          const hy = bossHitY(s.x, s.y);
          if (hy >= 0) { s.dead = true; hitBoss(s.x + 1, hy); break; }
        }
        // formation
        let hit = null;
        if (s.y < fy + ROWS * CELL_H + 4) {
          for (const e of enemies) {
            if (e.alive && overlap(s.x, s.y, SHOT_W, SHOT_H, e.x, e.y, e.w, ENEMY_H)) { hit = e; break; }
          }
        }
        if (hit) { s.dead = true; killEnemy(hit); break; }
        // enemy shots (boss orbs pass through, so they cannot soak up fire aimed at the boss)
        for (const es of eshots) {
          if (es.dead || es.kind === 'orb') continue;
          if (overlap(s.x, s.y, SHOT_W, SHOT_H, es.x - 2, es.y, 4, 14)) {
            s.dead = true; es.dead = true;
            sparks(s.x + 1, s.y, 6, C.light, 0);
            break;
          }
        }
        if (s.dead) break;
        // shields, from below
        const sh = shieldHit(s.x, s.y, SHOT_W, SHOT_H, -1);
        if (sh) { s.dead = true; erode(sh, -1); break; }
      }
    }
    pshots = pshots.filter((s) => !s.dead);
    eshots = eshots.filter((s) => !s.dead);
  }

  function updateEnemyShots(dt) {
    let hitPlayer = false;
    for (const s of eshots) {
      s.px = s.x; s.py = s.y; s.t += dt;
      const hw = s.kind === 'orb' ? 3 : 2, hh = s.kind === 'orb' ? 6 : 14;
      const n = Math.max(1, Math.ceil((Math.hypot(s.vx, s.vy) * dt) / 2));
      const sdt = dt / n;
      for (let k = 0; k < n; k++) {
        s.x += s.vx * sdt; s.y += s.vy * sdt;
        if (!hitPlayer && playerActive() && hitsPlayer(s.x - hw, s.y, hw * 2, hh)) { s.dead = true; hitPlayer = true; break; }
        const sh = shieldHit(s.x - hw, s.y, hw * 2, hh, 1);
        if (sh) { s.dead = true; erode(sh, 1); break; }
        if (s.y + hh >= GROUND_Y) { s.dead = true; sparks(s.x, GROUND_Y - 1, 4, C.orange, -1); break; }
        if (s.x < -12 || s.x > W + 12) { s.dead = true; break; }
      }
    }
    eshots = eshots.filter((s) => !s.dead);
    if (hitPlayer) killPlayer(false);
  }

  // ---------- Particles ----------
  function burst(spr, x, y, p, pal, power) {
    const cx = x + (spr.w * p) / 2, cy = y + (spr.h * p) / 2;
    const cells = spr.cells, stride = RM ? 6 : 3;
    for (let i = 0; i < cells.length; i += stride) {
      if (parts.length >= MAX_PARTS) return;
      const px = x + (cells[i] + 0.5) * p, py = y + (cells[i + 1] + 0.5) * p;
      const dx = px - cx, dy = py - cy;
      parts.push({
        x: px, y: py,
        vx: dx * rand(3, 7) * power + rand(-40, 40),
        vy: dy * rand(3, 7) * power + rand(-60, 20),
        life: rand(0.35, 0.75), max: 0.75, size: p, color: pal[cells[i + 2]] || C.orange, g: 0.35,
      });
    }
  }

  function sparks(x, y, n, color, dir) {
    if (RM) n = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      if (parts.length >= MAX_PARTS) return;
      parts.push({
        x, y, vx: rand(-90, 90),
        vy: dir < 0 ? rand(-140, -30) : dir > 0 ? rand(30, 140) : rand(-90, 90),
        life: rand(0.15, 0.32), max: 0.32, size: rand(1.5, 2.5), color, g: 0.25,
      });
    }
  }

  function updateFx(dt) {
    const damp = Math.max(0, 1 - 2.2 * dt);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      p.vx *= damp; p.vy = p.vy * damp + 600 * p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.t -= dt;
      if (f.t <= 0) { flashes.splice(i, 1); burst(f.spr, f.x, f.y, f.p, f.pal, 1); }
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt; f.y -= 18 * dt;
      if (f.t >= f.max) floats.splice(i, 1);
    }
    if (boss && boss.flash > 0) boss.flash = Math.max(0, boss.flash - dt);
    shake = Math.max(0, shake - dt);
    hurt = Math.max(0, hurt - dt);
  }

  // ---------- Update ----------
  function update(dt) {
    updateFx(dt);
    if (state === 'over' || state === 'title') { overT += dt; return; }
    if (state !== 'dying') updatePlayer(dt);
    updatePlayerShots(dt);
    updateEnemyShots(dt);
    if (state === 'intro') {
      introT -= dt;
      if (boss) {
        const e = Math.pow(Math.max(0, introT / INTRO), 2);
        boss.y = BOSS_Y - (BOSS_Y + BOSS_H + 10) * e;
      }
      if (introT <= 0) state = 'play';
    } else if (state === 'play') {
      if (boss) updateBoss(dt); else updateFormation(dt);
      if (state === 'play') updateBonus(dt);
      if (state === 'play' && !boss && alive === 0) waveClear();
    } else if (state === 'dying') {
      stateT -= dt;
      if (stateT <= 0) { if (lives > 0) respawn(); else endGame(); }
    } else if (state === 'clear') {
      stateT -= dt;
      if (stateT <= 0) startWave(wave + 1);
    }
  }

  // ---------- Render ----------
  // Pixel art is drawn in device pixels with rounded edges, so every square is crisp
  // at any scale. K = device px per logical px, OX/OY = shake offset (logical px).
  let K = 1, OX = 0, OY = 0;
  function addRect(x, y, w, h) {
    const x0 = Math.round((x + OX) * K), y0 = Math.round((y + OY) * K);
    ctx.rect(x0, y0, Math.round((x + w + OX) * K) - x0, Math.round((y + h + OY) * K) - y0);
  }
  function addRuns(runs, x, y, p) {
    if (!runs) return;
    for (let i = 0; i < runs.length; i += 3) addRect(x + runs[i] * p, y + runs[i + 1] * p, runs[i + 2] * p, p);
  }
  function fillPath(color) { ctx.fillStyle = color; ctx.fill(); }

  function render(alpha) {
    K = cv.width / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);

    OX = 0; OY = 0;
    if (shake > 0 && !paused) { const m = (shake / 0.4) * 6; OX = Math.round(rand(-m, m)); OY = Math.round(rand(-m, m)); }

    // background dots
    ctx.beginPath();
    for (let i = 0; i < DOTS.length; i += 2) addRect(DOTS[i], DOTS[i + 1], 1, 1);
    fillPath('rgba(138,143,153,0.35)');
    // ground
    ctx.beginPath(); addRect(0, GROUND_Y, W, 1); fillPath('rgba(255,255,255,0.18)');

    drawShields();
    drawEnemies();
    drawBoss();
    drawBonus(alpha);
    drawEnemyShots(alpha);
    drawPlayerShots(alpha);
    drawPlayer(alpha);
    drawParticles();

    ctx.setTransform(K, 0, 0, K, OX * K, OY * K);
    drawFloats();

    OX = 0; OY = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (hurt > 0) {
      ctx.fillStyle = 'rgba(234,84,38,' + (hurt / 0.4) * 0.12 + ')';
      ctx.fillRect(0, Math.round(HUD * K), cv.width, cv.height);
    }
    drawHUD();
    drawBossBar();
    drawBanner();
  }

  function drawShields() {
    ctx.beginPath();
    for (const s of shields) {
      for (let r = 0; r < SH_ROWS; r++) {
        let c = 0;
        while (c < SH_COLS) {
          if (!s.g[r * SH_COLS + c]) { c++; continue; }
          let e = c;
          while (e < SH_COLS && s.g[r * SH_COLS + e]) e++;
          addRect(s.x + c * SC, SHIELD_Y + r * SC, (e - c) * SC, SC);
          c = e;
        }
      }
    }
    fillPath(C.grey);
  }

  function drawEnemies() {
    for (let t = 0; t < TYPES.length; t++) {
      const spr = TYPES[t].spr[frame];
      ctx.beginPath();
      for (const e of enemies) if (e.alive && e.type === t) addRuns(spr.runs['#'], e.x, e.y, PX);
      fillPath(TYPES[t].color);
    }
    if (flashes.length) {
      ctx.beginPath();
      for (const f of flashes) addRuns(f.spr.runs['#'], f.x, f.y, f.p);
      fillPath(C.white);
    }
  }

  function drawBoss() {
    if (!boss) return;
    const x = boss.x - BOSS_W / 2, y = boss.y;
    if (boss.flash > 0) {
      ctx.beginPath();
      for (const k in SPR.boss.runs) addRuns(SPR.boss.runs[k], x, y, BOSS_PX);
      fillPath(C.white);
      return;
    }
    for (const k in SPR.boss.runs) {
      ctx.beginPath();
      addRuns(SPR.boss.runs[k], x, y, BOSS_PX);
      fillPath(BOSS_PAL[k]);
    }
  }

  function drawBonus(alpha) {
    if (!bonus) return;
    const x = bonus.px + (bonus.x - bonus.px) * alpha;
    ctx.beginPath(); addRuns(SPR.bonus.runs['#'], x, BONUS_Y, PX); fillPath(C.light);
  }

  function drawEnemyShots(alpha) {
    if (!eshots.length) return;
    ctx.beginPath();
    for (const s of eshots) {
      if (s.kind === 'orb') continue;
      const x = s.px + (s.x - s.px) * alpha, y = s.py + (s.y - s.py) * alpha;
      const frames = SPR[s.kind];
      const spr = frames[Math.floor(s.t * 12) % frames.length];
      addRuns(spr.runs['#'], x - 3, y, PX);
    }
    fillPath(C.orange);
    ctx.beginPath();
    for (const s of eshots) {
      if (s.kind !== 'orb') continue;
      const x = s.px + (s.x - s.px) * alpha, y = s.py + (s.y - s.py) * alpha;
      addRuns(SPR.orb.runs['#'], x - 3, y, PX);
    }
    fillPath(C.light);
  }

  function drawPlayerShots(alpha) {
    if (!pshots.length) return;
    ctx.beginPath();
    for (const s of pshots) addRect(s.x, s.py + (s.y - s.py) * alpha, SHOT_W, SHOT_H);
    fillPath(C.white);
  }

  function drawPlayer(alpha) {
    if (!(playerActive() || state === 'title')) return;
    const x = player.px + (player.x - player.px) * alpha;
    ctx.beginPath(); addRuns(SPR.player.runs['#'], x - PLAYER_HALF, PLAYER_Y, PX); fillPath(C.white);
  }

  function drawParticles() {
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.life / p.max) * 1.6));
      ctx.beginPath();
      addRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      fillPath(p.color);
    }
    ctx.globalAlpha = 1;
  }

  function spaced(px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px; }
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 4);

  function drawFloats() {
    if (!floats.length) return;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 11px ' + FONT;
    spaced('1.5px');
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, Math.min(1, (f.max - f.t) / 0.3, f.t / 0.06));
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, clamp(f.x, 50, W - 50), f.y);
    }
    ctx.globalAlpha = 1;
    spaced('0px');
  }

  function drawHUD() {
    ctx.setTransform(K, 0, 0, K, 0, 0);
    ctx.fillStyle = C.s1;
    ctx.fillRect(0, 0, W, HUD);
    ctx.fillStyle = C.line;
    ctx.fillRect(0, HUD - 1, W, 1);
    ctx.textBaseline = 'alphabetic';
    const label = (t, x, align) => {
      ctx.font = '600 9.5px ' + FONT; ctx.fillStyle = C.dim; ctx.textAlign = align;
      spaced('1.5px'); ctx.fillText(t, x, 18); spaced('0px');
    };
    const value = (t, x, align, col) => {
      ctx.font = '600 19px ' + FONT_D; ctx.fillStyle = col || C.text; ctx.textAlign = align;
      ctx.fillText(t, x, 39);
    };
    label('SCORE', 16, 'left'); value(score.toLocaleString(), 16, 'left');
    label('BEST', 124, 'left'); value(Math.max(bestCache, score).toLocaleString(), 124, 'left', C.dim);
    label('WAVE', 268, 'center'); value(String(wave), 268, 'center');
    label('LIVES', W - 16, 'right');
    // lives as small ship icons, right aligned
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const slots = Math.max(3, lives), ip = 1.2, iw = SPR.player.w * ip;
    const shown = state === 'title' ? 3 : lives;
    for (let i = 0; i < slots; i++) {
      const x = W - 16 - iw - i * (iw + 5);
      ctx.beginPath(); addRuns(SPR.player.runs['#'], x, 28, ip);
      fillPath(i < shown ? C.white : 'rgba(255,255,255,0.18)');
    }
  }

  function drawBossBar() {
    if (!boss || !(state === 'intro' || state === 'play' || state === 'dying')) return;
    ctx.setTransform(K, 0, 0, K, 0, 0);
    const w = 240, h = 6, x = (W - w) / 2, y = 62;
    ctx.font = '600 9.5px ' + FONT; ctx.fillStyle = C.dim; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    spaced('1.5px'); ctx.fillText('BOSS', x - 10, y + h / 2 + 0.5); spaced('0px');
    ctx.fillStyle = C.s1; ctx.fillRect(x, y, w, h);
    const f = state === 'intro' ? easeOut(1 - introT / INTRO) : boss.hp / boss.max;
    ctx.fillStyle = C.orange; ctx.fillRect(x, y, Math.round(w * f), h);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function drawBanner() {
    if (state !== 'intro') return;
    ctx.setTransform(K, 0, 0, K, 0, 0);
    const t = INTRO - introT;
    const a = Math.min(easeOut(t / 0.3), clamp(introT / 0.3, 0, 1));
    const dy = RM ? 0 : (1 - easeOut(t / 0.3)) * 12;
    ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.text; ctx.font = '300 32px ' + FONT_D;
    ctx.fillText('Wave ' + wave, W / 2, 430 + dy);
    if (isBossWave(wave)) {
      ctx.fillStyle = C.light; ctx.font = '600 10px ' + FONT;
      spaced('2px'); ctx.fillText('BOSS', W / 2 + 1, 458 + dy); spaced('0px');
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Overlays + pause ----------
  function show(el) { el.classList.add('show'); }
  function hideAll() {
    for (const el of [ovStart, ovPause, ovOver]) el.classList.remove('show');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  const canPause = () => state === 'intro' || state === 'play' || state === 'dying' || state === 'clear';

  function setPaused(p) {
    if (p) {
      if (paused || !canPause()) return;
      paused = true;
      keys.left = keys.right = keys.fire = false;
      releasePointers();
      show(ovPause);
    } else {
      if (!paused) return;
      paused = false;
      ovPause.classList.remove('show');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
  }

  // The arcade hiding the game always pauses; the player resumes when ready.
  V.onPause((p) => { if (p) setPaused(true); });

  // ---------- Input ----------
  function logicalX(clientX) {
    const r = cv.getBoundingClientRect();
    return ((clientX - r.left) / (r.width || 1)) * W;
  }

  let touchId = null, tStartX = 0, tAnchor = 0, lastTouchX = 0, mouseId = null;
  const TOUCH_GAIN = 1.25;

  function releasePointers() { touchId = null; mouseId = null; ptrTarget = null; }

  window.addEventListener('pointerdown', (e) => {
    try { window.focus(); } catch (_) {}
    if (e.target.closest && e.target.closest('.ov.show')) return;
    if (paused || state === 'title' || state === 'over') return;
    if (e.pointerType === 'touch') {
      if (touchId !== null) return;
      touchId = e.pointerId;
      tStartX = lastTouchX = e.clientX; tAnchor = player.x;
      ptrTarget = player.x;
    } else if (e.button === 0) {
      mouseId = e.pointerId;
      ptrTarget = logicalX(e.clientX);
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (paused) return;
    if (e.pointerType === 'touch') {
      if (e.pointerId !== touchId) return;
      lastTouchX = e.clientX;
      const r = cv.getBoundingClientRect();
      const per = W / (r.width || 1);
      const lo = EDGE + PLAYER_HALF, hi = W - EDGE - PLAYER_HALF;
      const want = tAnchor + (e.clientX - tStartX) * per * TOUCH_GAIN;
      const clamped = clamp(want, lo, hi);
      // Re-anchor at the walls so reversing direction responds immediately.
      if (clamped !== want) tAnchor = clamped - (e.clientX - tStartX) * per * TOUCH_GAIN;
      ptrTarget = clamped;
    } else if (e.pointerId === mouseId) {
      ptrTarget = logicalX(e.clientX);
    }
  });

  function endPointer(e) {
    if (e.pointerId === touchId) touchId = null;
    if (e.pointerId === mouseId) mouseId = null;
    if (touchId === null && mouseId === null) ptrTarget = null;
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  const isFireKey = (e) => e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp' || e.code === 'KeyW';

  window.addEventListener('keydown', (e) => {
    const k = e.key, code = e.code;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ' || code === 'Space' || k === 'Enter') e.preventDefault();
    if (k === 'ArrowLeft' || code === 'KeyA') { keys.left = true; return; }
    if (k === 'ArrowRight' || code === 'KeyD') { keys.right = true; return; }
    if (isFireKey(e) || k === 'Enter') {
      if (e.repeat) return;
      if (state === 'title') { newGame(); return; }
      if (state === 'over') { if (overT > 0.5) newGame(); return; }
      if (paused) { if (k === 'Enter') setPaused(false); return; }
      if (isFireKey(e)) keys.fire = true;
      return;
    }
    if (e.repeat) return;
    if (code === 'KeyP' || k === 'Escape') {
      if (paused) setPaused(false); else setPaused(true);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.key === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (isFireKey(e)) keys.fire = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = keys.fire = false; releasePointers(); });

  ovStart.addEventListener('click', () => { if (state === 'title') newGame(); });
  ovPause.addEventListener('click', () => setPaused(false));
  $('btnAgain').addEventListener('click', () => { if (state === 'over') newGame(); });

  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  // ---------- Main loop ----------
  let last = performance.now(), acc = 0;
  function frameLoop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    if (!paused) {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 16) { update(STEP); acc -= STEP; n++; }
      if (n >= 16) acc = 0;
    }
    render(paused ? 1 : Math.min(1, acc / STEP));
    requestAnimationFrame(frameLoop);
  }

  // ---------- Boot ----------
  resize();
  wave = 1;
  shields = [0, 1, 2, 3].map(makeShield);
  buildFormation();
  state = 'title';

  // Wait for the shared type (Segoe UI or bundled Selawik) before the first canvas text draw.
  let started = false;
  function start() {
    if (started) return;
    started = true;
    requestAnimationFrame((t) => { last = t; frameLoop(t); });
    V.ready();
  }
  try {
    const f = document.fonts;
    const loads = [
      f.load('300 32px ' + FONT_D), f.load('600 19px ' + FONT_D),
      f.load('400 13px ' + FONT), f.load('600 10px ' + FONT),
    ];
    Promise.all(loads).catch(() => {}).then(() => f.ready).then(start, start);
    setTimeout(start, 2500);
  } catch (_) { start(); }
})();
</script>
</body>
</html>
