<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Checkers</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --faint: rgba(255, 255, 255, 0.35);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --light: #2a2d33;
    --dark: #121418;
    --ink: #0b0c0f;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --S: 360px;
    --q: 45px;
    --side: 280px;
    --g: 8px;
    --step-ms: 200ms;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- layout ---------- */
  .game { display: grid; visibility: hidden; }
  .game.ready { visibility: visible; }
  .game.col { grid-template-columns: var(--S); row-gap: var(--g); }
  .game.row { grid-template-columns: var(--S) var(--side); column-gap: calc(var(--g) * 2.5); align-items: stretch; }
  .bcol { display: grid; grid-template-columns: var(--S); row-gap: var(--g); }

  /* ---------- player bars ---------- */
  .pbar {
    display: flex; align-items: center; gap: 0.6em;
    height: 2.4em; min-width: 0;
    color: var(--muted);
    transition: color 180ms var(--ease);
  }
  .pbar.on { color: var(--text); }
  .chip { width: 0.8em; height: 0.8em; flex: none; border: 1px solid var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .chip.c1 { background: #fff; }
  .chip.c0 { background: var(--brand); }
  .pbar.on .chip { box-shadow: 0 0 0 1px var(--text); }
  .pname { font-weight: 600; font-size: 0.92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .pname small { font-weight: 400; color: var(--muted); margin-left: 0.5em; font-size: 0.9em; }
  .caps { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; overflow: hidden; height: 100%; }
  .caps svg { width: 1.05em; height: 1.05em; flex: none; margin-right: -0.42em; }
  .caps .n { font-size: 0.78em; font-weight: 600; color: var(--muted); margin-left: 0.7em; font-variant-numeric: tabular-nums; }
  .away { flex: none; font: 600 0.66em/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-hover); }
  .left-n {
    flex: none; min-width: 2.6em; height: 100%;
    display: grid; place-items: center; padding: 0 0.5em;
    background: var(--surface); border: 1px solid var(--line);
    font: 300 1.15em/1 var(--font-display); font-variant-numeric: tabular-nums;
    color: var(--muted);
    transition: background 180ms var(--ease), color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .pbar.on .left-n { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* ---------- board ---------- */
  .board {
    position: relative;
    width: var(--S); height: var(--S);
    box-shadow: 0 0 0 1px var(--line);
    touch-action: none;
    outline: none;
  }
  .squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; background: var(--light); }
  .sq.d { background: var(--dark); }
  .sq::before { content: ""; position: absolute; inset: 0; background: var(--brand); opacity: 0; transition: opacity 150ms var(--ease); }
  .sq.last::before { opacity: 0.16; }
  .sq.sel::before { opacity: 0.38; }
  .sq.hover::before { opacity: 0.3; }
  .sq.must { box-shadow: inset 0 0 0 calc(max(2px, var(--q) * 0.05)) var(--brand-hover); }
  .sq .dot {
    position: absolute; left: 50%; top: 50%;
    width: 24%; height: 24%;
    transform: translate(-50%, -50%);
    background: var(--brand); opacity: 0.75;
  }
  .sq .ring { position: absolute; inset: 0; box-shadow: inset 0 0 0 calc(var(--q) * 0.07) var(--brand); opacity: 0.8; }
  .co {
    position: absolute; z-index: 1; left: 0.25em; top: 0.2em;
    font: 600 max(8px, calc(var(--q) * 0.17))/1 var(--font);
    color: rgba(255, 255, 255, 0.22);
    pointer-events: none;
  }
  .pieces { position: absolute; inset: 0; pointer-events: none; }
  .pc {
    position: absolute; left: 0; top: 0;
    width: var(--q); height: var(--q);
    padding: calc(var(--q) * 0.09);
    will-change: transform;
    transition: opacity 180ms var(--ease);
  }
  .pc.anim { transition: transform var(--step-ms) var(--ease), opacity 180ms var(--ease); }
  .pc.mover { z-index: 3; }
  .pc.drag { z-index: 5; }
  .pc.drag svg { transform: scale(1.12); }
  .pc.gone { opacity: 0.28; }
  .pc.fade { opacity: 0; }
  .pc.pop svg { animation: pop 300ms var(--ease); }
  @keyframes pop { 0% { transform: scale(1.28); } 100% { transform: scale(1); } }
  .pc svg { display: block; width: 100%; height: 100%; overflow: visible; transition: transform 120ms var(--ease); }
  .p0 { --f: #ea5426; --e: #b83f19; --r: #b83f19; }
  .p1 { --f: #ffffff; --e: #8f939b; --r: #c2c5cb; }
  svg .e { fill: var(--e); }
  svg .f { fill: var(--f); }
  svg .r { fill: none; stroke: var(--r); stroke-width: 3; }
  svg .k { fill: var(--ink); }
  .board.mine { cursor: pointer; }

  /* ---------- side ---------- */
  .side { display: flex; flex-direction: column; gap: var(--g); min-width: 0; min-height: 0; }
  .game.row .side { height: 100%; }
  .status {
    min-height: 1.6em;
    display: flex; align-items: center; gap: 0.6em;
    font-size: 0.95em; font-weight: 600;
  }
  .status::before { content: ""; width: 0.55em; height: 0.55em; background: var(--brand); flex: none; }
  .status.idle::before { background: var(--faint); }
  .game.row .status { font-size: 1.15em; font-weight: 300; font-family: var(--font-display); min-height: 2.2em; }
  .moves {
    background: var(--surface); border: 1px solid var(--line);
    font-size: 0.86em; font-variant-numeric: tabular-nums;
    min-height: 0;
  }
  .game.row .moves { flex: 1 1 auto; overflow-y: auto; padding: 0.4em 0; display: grid; grid-template-columns: 3em 1fr 1fr; align-content: start; }
  .game.col .moves { height: 2.5em; overflow-x: auto; overflow-y: hidden; white-space: nowrap; display: flex; align-items: center; padding: 0 0.6em; scrollbar-width: none; }
  .game.col .moves::-webkit-scrollbar { display: none; }
  .moves .n { color: var(--faint); padding: 0.28em 0 0.28em 0.9em; }
  .moves .m { padding: 0.28em 0.5em; color: var(--muted); }
  .moves .m.cur { color: var(--text); background: var(--surface-2); box-shadow: inset 2px 0 0 var(--brand); }
  .game.col .moves .n { padding: 0 0.15em 0 0.5em; }
  .game.col .moves .n:first-child { padding-left: 0; }
  .game.col .moves .m { padding: 0.3em 0.35em; }
  .moves .empty { color: var(--faint); padding: 0.3em 0.9em; grid-column: 1 / -1; }
  .game.col .moves .empty { padding: 0; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4em; }
  .game.row .actions { grid-template-columns: 1fr 1fr; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.55em;
    height: 3.3em; padding: 0 1.1em; min-width: 0;
    border-radius: 0; border: 1px solid var(--outline);
    background: transparent;
    font: 600 0.74em var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; white-space: nowrap;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), opacity 180ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .btn svg { width: 1.35em; height: 1.35em; flex: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.armed, .btn.armed:hover { background: var(--surface); border-color: var(--brand); color: var(--brand-hover); }
  .actions .btn { padding: 0 0.4em; letter-spacing: 0.1em; }
  .narrow .actions .btn svg { display: none; }

  /* ---------- result card ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0; transition: opacity 220ms var(--ease);
  }
  .overlay.show { opacity: 1; }
  .card {
    width: min(86%, 20em);
    padding: 1.3em 1.3em 1.2em;
    background: var(--surface); border: 1px solid var(--line);
    transform: translateY(24px); transition: transform 300ms var(--ease);
  }
  .overlay.show .card { transform: none; }
  .card h2 { margin: 0; font: 300 2em/1.1 var(--font-display); }
  .card p { margin: 0.45em 0 0; color: var(--muted); font-size: 0.92em; }
  .card .rows { margin-top: 0.9em; border-top: 1px solid var(--line); }
  .card .rw { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.5em 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.88em; }
  .card .rw b { color: var(--text); font: 300 1.5em/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .card .badge { margin-left: 0.7em; font: 600 0.78em var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-hover); }
  .card .btns { display: flex; gap: 0.5em; margin-top: 1.2em; flex-wrap: wrap; }
  .card .btns .btn { flex: 1 1 7em; }

  /* ---------- menu ---------- */
  .menu {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    overflow-y: auto;
    padding: 16px;
  }
  .panel { width: min(100%, 23em); margin: auto 0; display: flex; flex-direction: column; gap: 0.6em; }
  .panel h1 {
    margin: 0 0 0.1em;
    font: 300 2.6em/1 var(--font-display);
    display: flex; align-items: center; gap: 0.32em;
  }
  .panel h1::before { content: ""; width: 0.3em; height: 0.3em; background: var(--brand); flex: none; margin-top: 0.06em; }
  .panel h2 { margin: 0 0 0.2em; font: 300 1.9em/1.1 var(--font-display); }
  .panel .sub { margin: 0 0 0.9em; color: var(--muted); font-size: 0.92em; line-height: 1.45; }
  .lab {
    display: block; margin-top: 0.5em;
    font: 600 0.7em/1.2 var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .tile {
    display: flex; align-items: center; gap: 0.9em;
    height: 3.6em; padding: 0 1.1em;
    border: 1px solid var(--outline); border-radius: 0;
    background: var(--surface);
    font: 600 1em var(--font); text-align: left;
    cursor: pointer;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), transform 150ms var(--ease);
  }
  .tile::after { content: ""; margin-left: auto; width: 0.5em; height: 0.5em; border: solid var(--muted); border-width: 2px 2px 0 0; transform: rotate(45deg); }
  .tile:hover { background: var(--surface-2); border-color: var(--brand); }
  .tile:active { transform: scale(0.985); }
  .tile:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .tile.primary { background: var(--brand); border-color: var(--brand); }
  .tile.primary::after { border-color: #fff; }
  .tile.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .tile:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
  .tile small { font-weight: 400; color: var(--muted); }
  .tile.primary small { color: rgba(255, 255, 255, 0.85); }
  .note { margin: 0; color: var(--muted); font-size: 0.85em; }
  .seg { display: flex; }
  .seg button {
    flex: 1 1 0; height: 2.7em; min-width: 0;
    border: 1px solid var(--outline); border-radius: 0;
    background: transparent; cursor: pointer;
    font-weight: 600; font-size: 0.9em;
    transition: background 150ms var(--ease), border-color 150ms var(--ease);
  }
  .seg button + button { margin-left: -1px; }
  .seg button:hover { background: rgba(255, 255, 255, 0.06); }
  .seg button.on { background: var(--brand); border-color: var(--brand); position: relative; z-index: 1; }
  .seg button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; position: relative; z-index: 2; }
  .field {
    height: 2.9em; width: 100%; padding: 0 0.8em;
    border: 1px solid var(--outline); border-radius: 0;
    background: var(--surface); outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .field:focus { border-color: var(--brand); }
  .field.link { color: var(--muted); font-size: 0.85em; height: 2.6em; }
  .field.code { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 600; }
  .rowb { display: flex; gap: 0.5em; }
  .rowb > * { flex: 1 1 0; }
  .rowb .btn { height: 3.6em; }
  .block { border-top: 1px solid var(--line); padding-top: 0.6em; margin-top: 0.4em; display: flex; flex-direction: column; gap: 0.5em; }
  .err { margin: 0; min-height: 1.2em; color: var(--brand-hover); font-size: 0.88em; }
  .bigcode {
    font: 300 3.2em/1 var(--font-display);
    letter-spacing: 0.14em;
    padding: 0.35em 0 0.3em;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    user-select: text; -webkit-user-select: text;
  }
  .wait { display: flex; align-items: center; gap: 0.6em; color: var(--muted); font-size: 0.92em; }
  .wait i { width: 0.55em; height: 0.55em; background: var(--brand); animation: blink 1.2s steps(2, end) infinite; flex: none; }
  @keyframes blink { 50% { opacity: 0.2; } }

  @media (prefers-reduced-motion: reduce) {
    .pc.anim, .pc { transition-duration: 1ms; }
    .pc.pop svg { animation: none; }
    .overlay, .card, .sq::before { transition: none; }
    .wait i { animation: none; }
  }
</style>
</head>
<body>
<div class="game col" id="game">
  <div class="bcol">
    <div class="pbar" id="barTop"></div>
    <div class="board" id="board" tabindex="-1" aria-label="Checkers board">
      <div class="squares" id="squares"></div>
      <div class="pieces" id="pieces"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="card" role="dialog" aria-live="polite">
          <h2 id="ovTitle"></h2>
          <p id="ovText"></p>
          <div class="rows" id="ovRows" hidden></div>
          <div class="btns" id="ovButtons"></div>
        </div>
      </div>
    </div>
    <div class="pbar" id="barBot"></div>
  </div>
  <aside class="side" id="side">
    <div class="status" id="status"></div>
    <div class="moves" id="moves"></div>
    <div class="actions" id="actions"></div>
  </aside>
</div>

<div class="menu" id="menu">
  <div class="panel" data-view="home">
    <h1>Checkers</h1>
    <p class="sub">Drag a piece, or tap it and then tap a square.</p>
    <button class="tile primary" id="contBtn" type="button" hidden>Continue <small id="contInfo"></small></button>
    <button class="tile" type="button" data-go="cpu">Vs computer</button>
    <button class="tile" type="button" data-go="pass">Pass and play</button>
    <button class="tile" type="button" data-go="online" id="onlineTile">Online</button>
    <p class="note" id="onlineNote" hidden>Online play is not set up yet.</p>
  </div>

  <div class="panel" data-view="cpu" hidden>
    <h2>Vs computer</h2>
    <span class="lab">Level</span>
    <div class="seg" id="segLevel">
      <button type="button" data-v="1">Easy</button><button type="button" data-v="2">Normal</button><button type="button" data-v="3">Hard</button>
    </div>
    <span class="lab">Play as</span>
    <div class="seg" id="segCpuColor">
      <button type="button" data-v="0">Orange</button><button type="button" data-v="1">White</button><button type="button" data-v="r">Random</button>
    </div>
    <div class="rowb" style="margin-top:0.9em">
      <button class="btn" type="button" data-go="home">Back</button>
      <button class="btn primary" type="button" id="cpuStart">Start</button>
    </div>
  </div>

  <div class="panel" data-view="online" hidden>
    <h2>Online</h2>
    <span class="lab">Your name</span>
    <input class="field" id="nameIn" maxlength="20" autocomplete="off" spellcheck="false" placeholder="Player">
    <div class="block">
      <span class="lab">New room</span>
      <div class="seg" id="segOnColor">
        <button type="button" data-v="0">Orange</button><button type="button" data-v="1">White</button><button type="button" data-v="r">Random</button>
      </div>
      <button class="btn primary" type="button" id="createBtn">Create room</button>
    </div>
    <div class="block">
      <span class="lab">Join a room</span>
      <div class="rowb">
        <input class="field code" id="codeIn" maxlength="6" autocomplete="off" spellcheck="false" placeholder="Code">
        <button class="btn" type="button" id="joinBtn" style="height:auto">Join</button>
      </div>
    </div>
    <p class="err" id="onErr"></p>
    <button class="btn" type="button" data-go="home">Back</button>
  </div>

  <div class="panel" data-view="lobby" hidden>
    <span class="lab">Room code</span>
    <div class="bigcode" id="lobbyCode"></div>
    <input class="field link" id="lobbyLink" readonly aria-label="Invite link">
    <div class="wait"><i></i><span id="lobbyWait">Waiting for an opponent</span></div>
    <p class="note" id="lobbyInfo"></p>
    <div class="rowb" style="margin-top:0.6em">
      <button class="btn" type="button" id="lobbyLeave">Leave</button>
      <button class="btn primary" type="button" id="copyBtn">Copy link</button>
    </div>
  </div>

  <div class="panel" data-view="joining" hidden>
    <h2>Online</h2>
    <div class="wait"><i></i><span id="joinWait">Joining room</span></div>
  </div>
</div>

<script src="../_shared/bridge.js" data-game="checkers"></script>
<script>
(function () {
  'use strict';

  const V = window.Vela || { embedded: false, ready() {}, score() {}, gameOver() { return false; }, best() { return 0; }, onPause() {} };

  /* ===== CORE START (rules; also runs inside the engine worker) ===== */
  function CheckersCore() {
    'use strict';
    // 32 dark squares, 0..31 = standard numbers 1..32. Row 0 is the top of the
    // board. Orange starts on 1-12 at the top and moves first; White starts on
    // 21-32 at the bottom.
    const OM = 1, OK = 2, WM = 5, WK = 6;
    const ROW = new Int8Array(32), COL = new Int8Array(32), SQ = new Int8Array(64).fill(-1);
    for (let s = 0; s < 32; s++) {
      const r = s >> 2, c = ((s & 3) << 1) + ((r & 1) ? 0 : 1);
      ROW[s] = r; COL[s] = c; SQ[r * 8 + c] = s;
    }
    // Directions: 0 up-left, 1 up-right, 2 down-left, 3 down-right.
    const NB = new Int8Array(128).fill(-1), JP = new Int8Array(128).fill(-1);
    const DR = [-1, -1, 1, 1], DC = [-1, 1, -1, 1];
    for (let s = 0; s < 32; s++) {
      for (let d = 0; d < 4; d++) {
        const r1 = ROW[s] + DR[d], c1 = COL[s] + DC[d], r2 = r1 + DR[d], c2 = c1 + DC[d];
        if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) NB[d * 32 + s] = SQ[r1 * 8 + c1];
        if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) JP[d * 32 + s] = SQ[r2 * 8 + c2];
      }
    }
    const sideOf = (p) => p >> 2;            // 0 orange, 1 white
    const isKing = (p) => (p & 3) === 2;
    const crownRow = (side, s) => (side ? s < 4 : s >= 28);
    const DRAW_PLIES = 80;                   // 40 moves each without a capture or a man moving

    let seed = 0x6d2b79f5;
    function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
    const ZL = new Int32Array(7 * 32), ZH = new Int32Array(7 * 32);
    for (let i = 0; i < ZL.length; i++) { ZL[i] = rnd(); ZH[i] = rnd(); }
    const ZSL = rnd(), ZSH = rnd();

    function Move(f, path, caps, crown) {
      this.f = f; this.t = path[path.length - 1]; this.path = path; this.caps = caps; this.crown = crown;
    }
    function note(m) {
      const sep = m.caps.length ? 'x' : '-';
      let s = String(m.f + 1);
      for (let i = 0; i < m.path.length; i++) s += sep + (m.path[i] + 1);
      return s;
    }

    function Pos() {
      this.b = new Int8Array(32);

    for (let i = 0; i < 64; i++) {
      const s = sqOfIndex(i), el = sqEls[i];
      el.className = 'sq' + (s >= 0 ? ' d' : '');
      el.innerHTML = s >= 0 ? '<span class="co">' + (s + 1) + '</span>' : '';
    }
    squaresFlipped = S.flipped;
  }

  /* ---------- selection ---------- */
  function cands() {
    if (S.sel < 0) return [];
    return legalNow.filter((m) => m.f === S.sel && S.steps.every((s, i) => m.path[i] === s));
  }
  function nextTargets() {
    const out = new Map();
    for (const m of cands()) if (m.path.length > S.steps.length) out.set(m.path[S.steps.length], m.caps.length > 0);
    return out;
  }
  function curSq() { return S.steps.length ? S.steps[S.steps.length - 1] : S.sel; }
  function clearSel() { S.sel = -1; S.steps = []; }

  /* ---------- rendering ---------- */
  let pieceEls = new Map(); // square -> element
  let moverEl = null;
  let animTimers = [], animUntil = 0;
  const STEP_MS = reduceMotion ? 0 : 230;
  function stopAnim() { animTimers.forEach(clearTimeout); animTimers = []; animUntil = 0; }
  const animating = () => Date.now() < animUntil;

  function lastMove() { return game.moves.length ? game.moves[game.moves.length - 1] : null; }

  function renderSquares() {
    if (squaresFlipped !== S.flipped) paintSquares();
    const lm = lastMove();
    const last = new Set(lm && !S.steps.length ? [lm.f, ...lm.path] : []);
    const targets = nextTargets();
    const must = new Set();
    if (canMove() && legalNow.length && legalNow[0].caps.length && S.sel < 0) for (const m of legalNow) must.add(m.f);
    const cur = curSq();
    for (let i = 0; i < 64; i++) {
      const s = sqOfIndex(i), el = sqEls[i];
      if (s < 0) continue;
      el.classList.toggle('last', last.has(s));
      el.classList.toggle('sel', s === cur && cur >= 0);
      el.classList.toggle('must', must.has(s));
      el.classList.remove('hover');
      const old = el.querySelector('.dot, .ring');
      if (old) old.remove();
      if (targets.has(s)) {
        const mk = document.createElement('i');
        mk.className = targets.get(s) ? 'ring' : 'dot';
        el.appendChild(mk);
      }
    }
  }

  function placeEl(el, s) {
    const [x, y] = xyOfSq(s);
    el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  function makePiece(p, s) {
    const el = document.createElement('div');
    el.className = 'pc';
    el.innerHTML = pieceSvg(p);
    placeEl(el, s);
    piecesEl.appendChild(el);
    return el;
  }

  // Redraw every piece. anim = { p, np, pts, caps, cp, k0, k1, final }: the mover hops
  // pts[k0] -> pts[k1] one landing at a time, and each jumped piece fades as it is passed.
  function renderPieces(anim) {
    if (!anim && animating()) return;
    stopAnim();
    piecesEl.textContent = '';
    pieceEls = new Map();
    moverEl = null;
    const b = game.pos.b;
    const partial = !anim && S.sel >= 0 && S.steps.length > 0;
    const skip = new Set();
    let pts = null, caps = null, cp = null, p = 0, k0 = 0, k1 = 0, fadeTo = 'fade';
    if (anim && anim.final) {
      ({ pts, caps, cp, p, k0 } = anim);
      k1 = pts.length - 1;
      skip.add(pts[k1]);
    } else if (partial || (anim && !anim.final)) {
      pts = [S.sel, ...S.steps];
      caps = []; for (let i = 1; i < pts.length; i++) caps.push(midOf(pts[i - 1], pts[i]));
      cp = caps.map((c) => b[c]);
      p = b[S.sel];
      k1 = pts.length - 1;
      k0 = anim ? anim.k0 : k1;
      fadeTo = 'gone';
      skip.add(S.sel); caps.forEach((c) => skip.add(c));
    }
    for (let s = 0; s < 32; s++) {
      if (!b[s] || skip.has(s)) continue;
      pieceEls.set(s, makePiece(b[s], s));
    }
    if (!pts) return;
    const ghosts = [];
    for (let i = 0; i < caps.length; i++) {
      if (anim && anim.final && i < k0) { ghosts.push(null); continue; }
      const el = makePiece(cp[i], caps[i]);
      if (i < k0) el.classList.add(fadeTo);
      ghosts.push(el);
    }
    moverEl = makePiece(p, pts[k0]);
    moverEl.classList.add('mover');
    pieceEls.set(pts[k1], moverEl);
    const finish = () => {
      if (anim && anim.final && anim.np !== p) {
        moverEl.innerHTML = pieceSvg(anim.np);
        if (!reduceMotion) moverEl.classList.add('pop');
      }
    };
    if (k0 === k1) { finish(); return; }
    if (!STEP_MS) {
      placeEl(moverEl, pts[k1]);
      for (let i = k0; i < k1; i++) if (ghosts[i]) ghosts[i].classList.add(fadeTo);
      finish();
      return;
    }
    void piecesEl.offsetWidth;
    moverEl.classList.add('anim');
    for (let i = k0; i < k1; i++) {
      const t = (i - k0) * STEP_MS;
      const go = () => placeEl(moverEl, pts[i + 1]);
      if (t === 0) go(); else animTimers.push(setTimeout(go, t));
      if (ghosts[i]) animTimers.push(setTimeout(() => ghosts[i].classList.add(fadeTo), t + STEP_MS * 0.45));
    }
    const total = (k1 - k0) * STEP_MS;
    animTimers.push(setTimeout(finish, total - 30));
    animUntil = Date.now() + total;
  }

  function nameFor(color) {
    if (S.mode === 'cpu') return color === S.my ? 'You' : 'Computer<small>' + LEVEL_NAME[S.level] + '</small>';
    if (S.mode === 'online' && ON.room) {
      const uid = uidOf(ON.room.state, color);
      return esc((ON.room.names || {})[uid] || 'Player') + (uid === ON.me ? '<small>You</small>' : '');
    }
    return colorName(color);
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderBars() {
    const bottom = S.flipped ? 0 : 1, top = bottom ^ 1;
    const turn = game.pos.turn;
    [[barTop, top], [barBot, bottom]].forEach(([el, color]) => {
      const taken = 12 - game.pos.count(color ^ 1);
      let caps = '';
      const enemy = color ? C.OM : C.WM;
      for (let i = 0; i < taken; i++) caps += pieceSvg(enemy);
      if (taken) caps += '<span class="n">' + taken + '</span>';
      let html = '<span class="chip c' + color + '"></span><span class="pname">' + nameFor(color) + '</span><span class="caps">' + caps + '</span>';
      if (S.mode === 'online' && ON.room) {
        const uid = uidOf(ON.room.state, color);
        if (uid !== ON.me && ON.room.phase !== 'lobby' && (hasLeft(uid) || Rooms.isAway(ON.room, uid))) html += '<span class="away">' + (hasLeft(uid) ? 'Left' : 'Away') + '</span>';
      }
      html += '<span class="left-n" title="Pieces left">' + game.pos.count(color) + '</span>';
      el.innerHTML = html;
      el.classList.toggle('on', !S.result && turn === color);
    });
  }

  function renderMoves() {
    const notes = game.notes;
    let html = '';
    if (!notes.length) html = '<span class="empty">No moves yet</span>';
    for (let i = 0; i < notes.length; i++) {
      if (i % 2 === 0) html += '<span class="n">' + (i / 2 + 1) + '.</span>';
      html += '<span class="m' + (i === notes.length - 1 ? ' cur' : '') + '">' + notes[i] + '</span>';
    }
    if (notes.length % 2 === 1 && gameEl.classList.contains('row')) html += '<span></span>';
    movesEl.innerHTML = html;
    if (gameEl.classList.contains('row')) movesEl.scrollTop = movesEl.scrollHeight;
    else movesEl.scrollLeft = movesEl.scrollWidth;
  }

  const colorName = (c) => (c === 0 ? 'Orange' : 'White');
  function resultText(r) {
    const loser = r.winner === null ? null : r.winner ^ 1;
    const youLose = (S.mode === 'cpu' || S.mode === 'online') && r.winner !== null && r.winner !== S.my;
    const who = () => (S.mode === 'pass' ? colorName(loser) + ' has' : youLose ? 'You have' : S.mode === 'cpu' ? 'The computer has' : 'Your opponent has');
    if (r.reason === 'taken') return who() + ' no pieces left';
    if (r.reason === 'blocked') return who() + ' no legal move';
    if (r.reason === 'forty') return '40 moves each without a capture or a man moving';
    if (r.reason === 'repetition') return 'Same position three times';
    if (r.reason === 'agreement') return 'Draw agreed';
    if (r.reason === 'left') return 'Your opponent left';
    if (r.reason === 'resign') {
      if (S.mode === 'pass') return colorName(loser) + ' resigned';
      return youLose ? 'You resigned' : (S.mode === 'cpu' ? 'The computer resigned' : 'Your opponent resigned');
    }
    return '';
  }
  function resultTitle(r) {
    if (r.winner === null) return 'Draw';
    if (S.mode === 'pass') return colorName(r.winner) + ' wins';
    return r.winner === S.my ? 'You win' : 'You lose';
  }

  function statusText() {
    const turn = game.pos.turn;
    const mustJump = legalNow.length && legalNow[0].caps.length;
    if (S.result) return resultTitle(S.result) + '. ' + resultText(S.result);
    if (S.steps.length) return 'Keep jumping';
    if (S.mode === 'cpu') {
      if (turn !== S.my) return 'Computer is thinking';
      return mustJump ? 'You must jump' : 'Your move';
    }
    if (S.mode === 'online' && ON.room) {
      const st = ON.room.state;
      const opp = uidOf(st, S.my ^ 1);
      if (hasLeft(opp)) return 'Your opponent left';
      if (Rooms.isAway(ON.room, opp)) return 'Opponent disconnected';
      if (st.drawOffer !== null && st.drawOffer !== undefined && st.drawOffer !== S.my) return 'Your opponent offers a draw';
      if (turn !== S.my) return "Opponent's move";
      return mustJump ? 'You must jump' : 'Your move';
    }
    return colorName(turn) + (mustJump ? ' must jump' : ' to move');
  }

  let flash = '', flashTimer = 0;
  function showFlash(t) { flash = t; clearTimeout(flashTimer); flashTimer = setTimeout(() => { flash = ''; renderStatus(); }, 3200); renderStatus(); }
  function renderStatus() {
    statusEl.textContent = flash || statusText();
    statusEl.classList.toggle('idle', !!S.result);
  }

  /* ---------- action buttons ---------- */
  const ICON = {
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/>',
    flip: '<path d="M7 3v17"/><path d="m3 16 4 4 4-4"/><path d="M17 21V4"/><path d="m21 8-4-4-4 4"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h13l-3 4.5 3 4.5H5"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    draw: '<path d="M5 9h14"/><path d="M5 15h14"/>',
    exit: '<path d="M14 4H5v16h9"/><path d="M10 12h11"/><path d="m17 8 4 4-4 4"/>',
    again: '<path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 10a8 8 0 0 0-14.5-3L4 10"/><path d="M4 14a8 8 0 0 0 14.5 3L20 14"/>',
  };
  function btnHtml(id, icon, label, cls) {
    return '<button class="btn' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">' + ICON[icon] + '</svg><span>' + label + '</span></button>';
  }
  let armed = '', armTimer = 0;
  function arm(id) { armed = id; clearTimeout(armTimer); armTimer = setTimeout(() => { armed = ''; renderActions(); }, 2600); renderActions(); }
  function disarm() { if (armed) { armed = ''; clearTimeout(armTimer); } }
  const hasOffer = (st) => st.drawOffer === 0 || st.drawOffer === 1;

  function renderActions() {
    let html = '';
    const inPlay = !S.result;
    if (S.mode === 'online') {
      const st = ON.room ? ON.room.state : null;
      if (st) {
        if (S.result) {
          const opp = uidOf(st, S.my ^ 1);
          const asked = (st.rematch || []).includes(ON.me), offered = (st.rematch || []).includes(opp);
          html += btnHtml('rematch', 'again', asked ? 'Asked' : offered ? 'Accept rematch' : 'Rematch', offered && !asked ? 'primary' : '');
        } else if (hasOffer(st) && st.drawOffer !== S.my) html += btnHtml('accept', 'draw', 'Accept draw', 'primary');
        else html += btnHtml('draw', 'draw', st.drawOffer === S.my ? 'Offered' : 'Draw');
        html += btnHtml('resign', 'flag', armed === 'resign' ? 'Sure?' : 'Resign', armed === 'resign' ? 'armed' : '');
        html += btnHtml('flip', 'flip', 'Flip');
        html += btnHtml('leave', 'exit', armed === 'leave' ? 'Sure?' : 'Leave', armed === 'leave' ? 'armed' : '');
      }
    } else {
      html += btnHtml('undo', 'undo', 'Undo');
      html += btnHtml('flip', 'flip', 'Flip');
      html += btnHtml('resign', 'flag', armed === 'resign' ? 'Sure?' : 'Resign', armed === 'resign' ? 'armed' : '');
      html += btnHtml('new', 'plus', 'New game', inPlay ? '' : 'primary');
    }
    actionsEl.innerHTML = html;
    const q = (a) => actionsEl.querySelector('[data-act="' + a + '"]');
    if (S.mode !== 'online') {
      q('undo').disabled = !canUndo();
      q('resign').disabled = !inPlay || !game.moves.length;
    } else if (ON.room) {
      const st = ON.room.state;
      q('resign').disabled = !inPlay;
      const d = q('draw'); if (d) d.disabled = !inPlay || hasOffer(st) || game.moves.length < 2;
      const rm = q('rematch'); if (rm) rm.disabled = (st.rematch || []).includes(ON.me) || anyLeft();
    }
  }
  function canUndo() {
    if (S.mode === 'online' || !game.moves.length) return false;
    if (S.result && S.result.reason === 'resign') return false;
    if (S.mode === 'cpu') return game.notes.some((_, i) => (i % 2) === S.my);
    return true;
  }

  actionsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'flip') { flip(); return; }
    if (a === 'undo') { disarm(); undo(); return; }
    if (a === 'new') { disarm(); openMenu('home'); return; }
    if (a === 'resign') {
      if (armed !== 'resign') { arm('resign'); return; }
      disarm();
      if (S.mode === 'online') onlineResign(); else resignLocal();
      return;
    }
    if (a === 'leave') {
      if (!S.result && armed !== 'leave') { arm('leave'); return; }
      disarm(); onlineLeave(); return;
    }
    if (a === 'draw') { onlineDraw('offer'); return; }
    if (a === 'accept') { onlineDraw('accept'); return; }
    if (a === 'rematch') { onlineRematch(); return; }
  });
  function flip() {
    S.flipped = !S.flipped;
    saveLocal();
    stopAnim();
    render();
  }

  function render(anim) {
    legalNow = S.result ? [] : game.pos.gen();
    if (S.sel >= 0 && !cands().length) clearSel();
    renderSquares();
    renderPieces(anim);
    renderBars();
    renderMoves();
    renderStatus();
    renderActions();
    board.classList.toggle('mine', canMove());
  }

  /* ---------- moving ---------- */
  function canMove() {
    if (S.result || !overlay.hidden) return false;
    const turn = game.pos.turn;
    if (S.mode === 'pass') return true;
    if (S.mode === 'cpu') return !thinking && turn === S.my;
    if (S.mode === 'online') return !!ON.room && ON.room.phase === 'play' && !ON.pending && turn === S.my;
    return false;
  }
  const movable = (s) => legalNow.some((m) => m.f === s);

  // A landing square was chosen for the selected piece.
  function stepTo(s, dragged) {
    const k0 = S.steps.length;
    S.steps.push(s);
    const cs = cands();
    if (!cs.length) { S.steps.pop(); return false; }
    const start = dragged ? k0 + 1 : k0;
    const done = cs.find((m) => m.path.length === S.steps.length);
    if (done) { commit(done, start); return true; }
    if (cs.length === 1 || cs.every((m) => m.t === cs[0].t && m.path.length === cs[0].path.length && m.caps.every((c) => cs[0].caps.includes(c)))) {
      commit(cs[0], start);
      return true;
    }
    // Several ways to carry on: wait for the next landing square.
    renderSquares();
    renderPieces(dragged ? null : { final: false, k0 });
    renderStatus();
    return true;
  }

  // Play m. k0: how many of its landings are already shown on the board (null: no animation).
  function commit(m, k0) {
    disarm();
    const b = game.pos.b;
    const p = b[m.f], cp = m.caps.map((c) => b[c]);
    const n = C.note(m);
    game.play(m);
    clearSel();
    const anim = k0 === null ? null : { final: true, p, np: game.pos.b[m.t], pts: [m.f, ...m.path], caps: m.caps, cp, k0 };
    if (S.mode === 'online') {
      ON.pending = true;
      render(anim);
      sendMove(n);
      return;
    }
    const st = game.status();
    if (st.over) S.result = { winner: st.winner, reason: st.reason };
    render(anim);
    saveLocal();
    if (S.result) { finishLocal(); return; }
    if (S.mode === 'cpu' && game.pos.turn !== S.my) askEngine();
  }

  function finishLocal() {
    stopEngine();
    store.set(SAVE_KEY, null);
    if (S.mode === 'cpu' && S.level === 3) {
      const won = S.result.winner === S.my;
      const prev = hardStreak();
      const n = won ? (S.undone ? prev : prev + 1) : 0;
      setHardStreak(n);
      S.streak = { n, counted: !won || !S.undone, isBest: V.gameOver(n) && n > 0 };
    } else S.streak = null;
    setTimeout(() => showResult(), Math.max(reduceMotion ? 50 : 420, animUntil - Date.now() + 250));
  }

  function resignLocal() {
    if (S.result) return;
    stopEngine();
    stopAnim();
    clearSel();
    const loser = S.mode === 'cpu' ? S.my : game.pos.turn;
    S.result = { winner: loser ^ 1, reason: 'resign' };
    render();
    finishLocal();
  }

  function undo() {
    if (!canUndo()) return;
    stopEngine();
    stopAnim();
    hideOverlay();
    let n = game.notes.length - 1;
    if (S.mode === 'cpu') {
      // back to the last position where it was my move, with one of my moves removed
      while (n > 0 && n % 2 !== S.my) n--;
      if (n % 2 !== S.my) return;
      if (S.level === 3) S.undone = true;
    }
    game = Game.fromNotes(game.notes.slice(0, n)) || new Game();
    S.result = null; S.streak = null; S.lastShownResult = '';
    clearSel();
    render();
    saveLocal();
  }

  /* ---------- pointer input ---------- */
  let drag = null;
  board.addEventListener('pointerdown', (e) => {
    if (!overlay.hidden || animating()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const s = sqAt(e.clientX, e.clientY);
    if (s < 0) { if (S.sel >= 0) { clearSel(); renderSquares(); renderPieces(); renderStatus(); } return; }
    if (S.sel >= 0 && nextTargets().has(s)) { stepTo(s, false); return; }
    const cur = curSq();
    if (canMove() && (s === cur || (C.sideOf(game.pos.b[s]) === game.pos.turn && game.pos.b[s] && movable(s)))) {
      const was = s === cur;
      if (!was) {
        const hadSteps = S.steps.length;
        S.sel = s; S.steps = [];
        if (hadSteps) renderPieces();
        renderSquares(); renderStatus();
      }
      const el = was && moverEl ? moverEl : pieceEls.get(s);
      drag = { id: e.pointerId, sq: s, el, x: e.clientX, y: e.clientY, moved: false, was, hover: -1 };
      try { board.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
      return;
    }
    if (S.sel >= 0) {
      const had = S.steps.length;
      clearSel(); renderSquares(); if (had) renderPieces(); renderStatus();
    }
  });
  board.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < Math.max(4, layoutInfo.q * 0.12)) return;
    if (!drag.moved) { drag.moved = true; if (drag.el) { drag.el.classList.add('drag'); drag.el.classList.remove('anim'); } }
    const r = board.getBoundingClientRect();
    const half = layoutInfo.q / 2;
    if (drag.el) drag.el.style.transform = 'translate(' + (e.clientX - r.left - half) + 'px,' + (e.clientY - r.top - half) + 'px)';
    const over = sqAt(e.clientX, e.clientY);
    if (over !== drag.hover) {
      if (drag.hover >= 0) sqEls[indexOfSq(drag.hover)].classList.remove('hover');
      drag.hover = over;
      if (over >= 0 && nextTargets().has(over)) sqEls[indexOfSq(over)].classList.add('hover');
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (d.hover >= 0) sqEls[indexOfSq(d.hover)].classList.remove('hover');
    if (d.el) d.el.classList.remove('drag');
    if (d.moved) {
      const to = e.type === 'pointerup' ? sqAt(e.clientX, e.clientY) : -1;
      if (to >= 0 && nextTargets().has(to) && stepTo(to, true)) return;
      if (d.el) { d.el.classList.add('anim'); placeEl(d.el, d.sq); }
      return;
    }
    // a plain tap on the selected piece (before any jump) deselects it
    if (d.was && !S.steps.length) { clearSel(); renderSquares(); renderStatus(); }
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);
  board.addEventListener('lostpointercapture', (e) => { if (drag && e.pointerId === drag.id) endDrag({ pointerId: e.pointerId, type: 'pointercancel' }); });
  board.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('touchmove', (e) => { if (!e.target.closest('.moves, .menu')) e.preventDefault(); }, { passive: false });
  window.addEventListener('pointerdown', () => { window.focus(); }, true);

  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!menu.hidden) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (S.mode !== 'online') undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { if (S.sel >= 0) { const had = S.steps.length; clearSel(); renderSquares(); if (had) renderPieces(); renderStatus(); } return; }
    if (e.key === 'f' || e.key === 'F') { flip(); return; }
    if ((e.key === 'u' || e.key === 'U') && S.mode !== 'online') { undo(); return; }
  });

  /* ---------- result overlay ---------- */
  function showResult() {
    if (!S.result) return;
    const key = (ON.room ? ON.room.state.n : 0) + ':' + game.notes.length + ':' + S.result.reason;
    if (S.lastShownResult === key) return;
    S.lastShownResult = key;
    $('ovTitle').textContent = resultTitle(S.result);
    $('ovText').textContent = resultText(S.result);
    const rows = $('ovRows');
    if (S.mode === 'cpu' && S.streak) {
      const k = S.streak;
      rows.innerHTML =
        '<div class="rw"><span>Hard streak' + (k.counted ? '' : '<span class="badge">Undo used</span>') + '</span><b>' + k.n + '</b></div>' +
        '<div class="rw"><span>Best' + (k.isBest ? '<span class="badge">New best</span>' : '') + '</span><b>' + V.best() + '</b></div>';
      rows.hidden = false;
    } else { rows.hidden = true; rows.innerHTML = ''; }
    const row = $('ovButtons');
    row.textContent = '';
    const btns = [];
    if (S.mode === 'online') {
      btns.push({ label: 'Rematch', primary: true, onClick: () => { hideOverlay(); onlineRematch(); }, off: anyLeft() });
      btns.push({ label: 'View board', onClick: hideOverlay });
    } else {
      btns.push({ label: 'Play again', primary: true, onClick: () => { hideOverlay(); playAgain(); } });
      btns.push({ label: 'View board', onClick: hideOverlay });
    }
    let first = null;
    for (const b of btns) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn' + (b.primary ? ' primary' : '');
      el.textContent = b.label;
      el.disabled = !!b.off;
      el.addEventListener('click', b.onClick);
      row.appendChild(el);
      if (!first) first = el;
    }
    overlay.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));
    if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (_) {} }, 60);
    render();
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    overlay.hidden = true;
    board.classList.toggle('mine', canMove());
  }

  /* ---------- starting games ---------- */
  function startLocal(mode, opts) {
    stopEngine();
    stopAnim();
    hideOverlay(); disarm();
    // Walking away from an unfinished Hard game counts as a loss for the streak.
    const prev = store.get(SAVE_KEY);
    if (!opts.resume && prev && prev.mode === 'cpu' && prev.level === 3 && Array.isArray(prev.notes) && prev.notes.some((_, i) => i % 2 === prev.my)) setHardStreak(0);
    S.mode = mode;
    S.result = null; S.streak = null; S.lastShownResult = '';
    clearSel();
    game = opts.notes ? (Game.fromNotes(opts.notes) || new Game()) : new Game();
    S.undone = !!opts.undone;
    if (mode === 'cpu') {
      S.level = opts.level;
      S.cpuPref = opts.cpuPref;
      S.my = opts.my !== undefined ? opts.my : (opts.cpuPref === 'r' ? (Math.random() < 0.5 ? 0 : 1) : Number(opts.cpuPref));
      S.flipped = opts.flipped !== undefined ? opts.flipped : S.my === 0;
    } else {
      S.flipped = !!opts.flipped;
    }
    closeMenu();
    const st = game.status();
    if (st.over) S.result = { winner: st.winner, reason: st.reason };
    render();
    saveLocal();
    if (S.mode === 'cpu' && !S.result && game.pos.turn !== S.my) askEngine();
  }
  function playAgain() {
    if (S.mode === 'cpu') startLocal('cpu', { level: S.level, cpuPref: S.cpuPref });
    else startLocal('pass', {});
  }

  /* ---------- menu ---------- */
  function openMenu(view) {
    if (S.mode === 'cpu') stopEngine();
    menu.hidden = false;
    showView(view || 'home');
  }
  function closeMenu() { menu.hidden = true; }
  function showView(v) {
    menu.querySelectorAll('.panel').forEach((p) => { p.hidden = p.dataset.view !== v; });
    if (v === 'home') refreshHome();
    if (v === 'online') { $('nameIn').value = prefs.name || ''; $('onErr').textContent = onlineError; onlineError = ''; }
    const first = menu.querySelector('.panel:not([hidden]) button:not([hidden]):not(:disabled)');
    if (first && !('ontouchstart' in window)) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (_) {} }, 30);
  }
  function refreshHome() {
    const sv = store.get(SAVE_KEY);
    const ok = sv && (sv.mode === 'cpu' || sv.mode === 'pass') && Array.isArray(sv.notes);
    $('contBtn').hidden = !ok;
    if (ok) $('contInfo').textContent = sv.mode === 'cpu' ? 'Vs computer, ' + (LEVEL_NAME[sv.level] || '') : 'Pass and play';
    const tile = $('onlineTile'), note = $('onlineNote');
    if (Rooms === undefined) { tile.disabled = true; note.hidden = true; }
    else if (!Rooms || !Rooms.available) { tile.disabled = true; note.hidden = false; note.textContent = Rooms ? 'Online play is not set up yet.' : 'Online play is not available right now.'; }
    else { tile.disabled = false; note.hidden = true; }
  }

  function bindSeg(id, key, cast) {
    const el = $(id);
    const paint = () => el.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(prefs[key]) === b.dataset.v));
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      prefs[key] = cast ? cast(b.dataset.v) : b.dataset.v;
      store.set(PREF_KEY, prefs);
      paint();
    });
    paint();
  }
  bindSeg('segLevel', 'level', Number);
  bindSeg('segCpuColor', 'cpuColor');
  bindSeg('segOnColor', 'onColor');

  menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (!b || b.disabled) return;
    const go = b.dataset.go;
    if (go === 'pass') { startLocal('pass', {}); return; }
    showView(go);
  });
  $('contBtn').addEventListener('click', () => {
    const sv = store.get(SAVE_KEY);
    if (!sv) { refreshHome(); return; }
    const base = { notes: sv.notes, flipped: sv.flipped, undone: sv.undone, resume: true };
    startLocal(sv.mode, sv.mode === 'cpu' ? Object.assign(base, { level: sv.level, cpuPref: sv.cpuPref, my: sv.my }) : base);
  });
  $('cpuStart').addEventListener('click', () => startLocal('cpu', { level: prefs.level, cpuPref: String(prefs.cpuColor) }));

  /* ---------- online ---------- */
  let Rooms; // undefined while loading, null if it could not load
  const ON = { code: null, room: null, me: null, unsub: null, stopBeat: null, pending: false, n: -1 };
  let onlineError = '';

  function friendly(e) {
    if (Rooms && e instanceof Rooms.RoomError) return e.message;
    return 'Could not reach the game server. Try again.';
  }
  function myName() {
    const v = $('nameIn').value.replace(/\s+/g, ' ').trim().slice(0, 20);
    if (v) { prefs.name = v; store.set(PREF_KEY, prefs); }
    return v || prefs.name || 'Player';
  }
  function setBusy(on) { ['createBtn', 'joinBtn'].forEach((id) => { $(id).disabled = on; }); }

  $('createBtn').addEventListener('click', async () => {
    if (!Rooms || !Rooms.available) return;
    $('onErr').textContent = '';
    setBusy(true);
    try {
      const code = await Rooms.create({ game: 'checkers', maxSeats: 2, name: myName(), state: { pref: String(prefs.onColor) } });
      enterRoom(code);
    } catch (e) { $('onErr').textContent = friendly(e); }
    setBusy(false);
  });
  async function joinRoom(code, quiet) {
    code = Rooms.normaliseCode(code);
    if (code.length !== 6) { $('onErr').textContent = 'Room codes are six letters and numbers.'; return; }
    if (quiet) { menu.hidden = false; showView('joining'); }
    $('onErr').textContent = '';
    setBusy(true);
    try {
      await Rooms.join(code, { game: 'checkers', name: quiet ? (prefs.name || 'Player') : myName() });
      enterRoom(code);
    } catch (e) {
      store.set(ROOM_KEY, null);
      setUrlRoom(null);
      if (quiet === 'saved') showView('home');
      else { onlineError = friendly(e); showView('online'); }
    }
    setBusy(false);
  }
  $('joinBtn').addEventListener('click', () => joinRoom($('codeIn').value, false));
  $('codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom($('codeIn').value, false); });
  $('codeIn').addEventListener('input', (e) => { const v = Rooms ? Rooms.normaliseCode(e.target.value) : e.target.value; if (v !== e.target.value) e.target.value = v; });

  function setUrlRoom(code) {
    try {
      const u = new URL(location.href);
      if (code) u.searchParams.set('room', code); else u.searchParams.delete('room');
      history.replaceState(null, '', u.toString());
    } catch (_) {}
  }

  function enterRoom(code) {
    leaveRoomLocal();
    stopEngine();
    ON.code = code; ON.me = Rooms.uid(); ON.room = null; ON.pending = false; ON.n = -1;
    store.set(ROOM_KEY, { code, at: Date.now() });
    setUrlRoom(code);
    $('lobbyCode').textContent = code;
    $('lobbyLink').value = Rooms.inviteUrl('checkers', code);
    $('lobbyWait').textContent = 'Connecting';
    $('lobbyInfo').textContent = '';
    menu.hidden = false;
    showView('lobby');
    ON.unsub = Rooms.watch(code, onRoom, () => {
      if (S.mode === 'online') showFlash('Connection lost. Reconnecting.');
      else $('lobbyWait').textContent = 'Reconnecting';
    });
    ON.stopBeat = Rooms.heartbeat(code);
  }
  function leaveRoomLocal() {
    if (ON.unsub) { try { ON.unsub(); } catch (_) {} }
    if (ON.stopBeat) ON.stopBeat();
    ON.unsub = null; ON.stopBeat = null; ON.code = null; ON.room = null; ON.pending = false;
  }

  function onRoom(room) {
    if (!ON.code) return;
    if (!room) {
      leaveRoomLocal();
      store.set(ROOM_KEY, null);
      setUrlRoom(null);
      S.mode = null;
      onlineError = 'The room has closed.';
      hideOverlay();
      menu.hidden = false;
      showView('online');
      return;
    }
    ON.room = room;
    if (room.phase === 'lobby') {
      const st = room.state || {};
      const host = room.hostUid === ON.me;
      const pref = st.pref === '0' ? 0 : st.pref === '1' ? 1 : null;
      $('lobbyInfo').textContent = pref === null ? 'Colours are picked at random.' : 'You play ' + colorName(host ? pref : pref ^ 1).toLowerCase() + '.';
      $('lobbyWait').textContent = room.seats.length >= 2 ? 'Starting' : 'Waiting for an opponent';
      if (S.mode === 'online') S.mode = null;
      menu.hidden = false;
      if (menu.querySelector('[data-view="lobby"]').hidden) showView('lobby');
      // the host starts the game; the guest steps in only if the host is gone
      clearTimeout(startTimer);
      if (room.seats.length >= 2 && room.seats.includes(ON.me)) {
        if (host) startTimer = setTimeout(startOnline, 900); else startTimer = setTimeout(() => { if (ON.room && ON.room.phase === 'lobby') startOnline(); }, 6000);
      }
      return;
    }
    if (!room.seats.includes(ON.me)) {
      leaveRoomLocal(); store.set(ROOM_KEY, null); setUrlRoom(null);
      onlineError = 'That game has already started.'; menu.hidden = false; showView('online');
      return;
    }
    syncOnline(room);
  }

  const uidOf = (st, color) => (color === 0 ? st.orange : st.white);
  function freshState(prev, orange, white, n) {
    return { pref: prev.pref || 'r', orange, white, n, moves: [], turn: 0, result: null, drawOffer: null, rematch: [] };
  }
  let starting = false, startTimer = 0;
  async function startOnline() {
    if (starting) return;
    starting = true;
    try {
      await Rooms.update(ON.code, (room) => {
        if (room.phase !== 'lobby' || room.seats.length < 2) return null;
        const host = room.hostUid, guest = room.seats.find((u) => u !== host);
        let hc = room.state && room.state.pref;
        hc = hc === '0' ? 0 : hc === '1' ? 1 : (Math.random() < 0.5 ? 0 : 1);
        const orange = hc === 0 ? host : guest, white = hc === 0 ? guest : host;
        return { phase: 'play', state: freshState(room.state || {}, orange, white, 1) };
      });
    } catch (_) {}
    starting = false;
  }

  function syncOnline(room) {
    const st = room.state;
    const firstView = S.mode !== 'online';
    if (firstView) {
      stopEngine();
      S.mode = 'online';
      closeMenu();
      hideOverlay(); disarm();
      S.lastShownResult = '';
      S.streak = null;
    }
    S.my = st.orange === ON.me ? 0 : 1;
    let anim = null;
    const newGame = st.n !== ON.n;
    const moves = st.moves || [];
    const ahead = ON.pending && game.notes.length > moves.length;
    const same = !newGame && game.notes.length === moves.length && game.notes.every((u, i) => u === moves[i]);
    if (!ahead && !same) {
      const prevLen = newGame ? -1 : game.notes.length;
      const prevB = game.pos.b.slice();
      const g = Game.fromNotes(moves);
      if (g) {
        if (prevLen >= 0 && moves.length === prevLen + 1 && game.notes.every((u, i) => u === moves[i])) {
          const m = g.moves[g.moves.length - 1];
          anim = { final: true, p: prevB[m.f], np: g.pos.b[m.t], pts: [m.f, ...m.path], caps: m.caps, cp: m.caps.map((c) => prevB[c]), k0: 0 };
        }
        game = g;
      }
      clearSel();
      stopAnim();
    }
    if (newGame) {
      ON.n = st.n;
      S.flipped = S.my === 0;
      S.lastShownResult = '';
      stopAnim();
      hideOverlay();
    }
    S.result = st.result || null;
    if (!st.result && !ahead) {
      const s2 = game.status();
      if (s2.over) S.result = { winner: s2.winner, reason: s2.reason };
    }
    render(anim);
    if (S.result) setTimeout(showResult, Math.max(60, animUntil - Date.now() + 250));
  }

  // room.left: { uid: ms } for players who left mid-game (written by rooms.js)
  function hasLeft(uid) { return !!(ON.room && ON.room.left && ON.room.left[uid]); }
  function anyLeft() { return !!(ON.room && ON.room.left && Object.keys(ON.room.left).length); }
  function myColorIn(st) { return st.orange === ON.me ? 0 : st.white === ON.me ? 1 : null; }

  async function sendMove(n) {
    const code = ON.code;
    let ok = false;
    try {
      const r = await Rooms.update(code, (room) => {
        const st = room.state;
        if (room.phase !== 'play' || !st || st.result) return null;
        const col = myColorIn(st);
        if (col === null || st.turn !== col) return null;
        const g = Game.fromNotes(st.moves || []);
        if (!g || g.pos.turn !== col) return null;
        const m = g.find(n);
        if (!m) return null;
        g.play(m);
        const s = g.status();
        const result = s.over ? { winner: s.winner, reason: s.reason } : null;
        return {
          phase: result ? 'done' : 'play',
          state: Object.assign({}, st, { moves: g.notes, turn: g.pos.turn, result, drawOffer: null }),
        };
      });
      ok = !!r;
    } catch (e) {
      if (ON.code === code) showFlash('Move not sent. Check your connection.');
    }
    if (ON.code !== code) return;
    ON.pending = false;
    if (!ok && ON.room) {
      // rejected: snap back to the room's position
      game = Game.fromNotes(ON.room.state.moves || []) || new Game();
      syncOnline(ON.room);
    } else render();
  }

  async function onlineResign() {
    try {
      await Rooms.update(ON.code, (room) => {
        const st = room.state, col = myColorIn(st);
        if (col === null || st.result || room.phase !== 'play') return null;
        return { phase: 'done', state: Object.assign({}, st, { result: { winner: col ^ 1, reason: 'resign' }, drawOffer: null }) };
      });
    } catch (e) { showFlash(friendly(e)); }
  }
  async function onlineDraw(kind) {
    try {
      await Rooms.update(ON.code, (room) => {
        const st = room.state, col = myColorIn(st);
        if (col === null || st.result || room.phase !== 'play') return null;
        if (kind === 'offer') {
          if (hasOffer(st)) return null;
          return { state: Object.assign({}, st, { drawOffer: col }) };
        }
        if (hasOffer(st) && st.drawOffer !== col) {
          return { phase: 'done', state: Object.assign({}, st, { drawOffer: null, result: { winner: null, reason: 'agreement' } }) };
        }
        return null;
      });
    } catch (e) { showFlash(friendly(e)); }
  }
  async function onlineRematch() {
    try {
      await Rooms.update(ON.code, (room) => {
        const st = room.state;
        if (!st.result || myColorIn(st) === null || (room.left && Object.keys(room.left).length)) return null;
        const want = new Set(st.rematch || []);
        want.add(ON.me);
        if (room.seats.length === 2 && room.seats.every((u) => want.has(u))) {
          // colours swap every rematch
          return { phase: 'play', state: freshState(st, st.white, st.orange, (st.n || 1) + 1) };
        }
        return { state: Object.assign({}, st, { rematch: Array.from(want) }) };
      });
    } catch (e) { showFlash(friendly(e)); }
  }
  async function onlineLeave() {
    const code = ON.code;
    const room = ON.room;
    leaveRoomLocal();
    if (code && room) {
      try {
        if (room.phase !== 'lobby') {
          // leaving a game in progress resigns it; rooms.js marks room.left
          await Rooms.update(code, (r) => {
            const st = r.state, col = myColorIn(st);
            if (col === null || st.result || r.phase !== 'play') return null;
            return { phase: 'done', state: Object.assign({}, st, { result: { winner: col ^ 1, reason: 'resign' }, drawOffer: null }) };
          });
        }
        await Rooms.leave(code);
      } catch (_) {}
    }
    leaveRoomLocal();
    store.set(ROOM_KEY, null);
    setUrlRoom(null);
    S.mode = null;
    hideOverlay();
    openMenu('home');
  }
  $('lobbyLeave').addEventListener('click', onlineLeave);
  $('lobbyLink').addEventListener('focus', (e) => { try { e.target.select(); } catch (_) {} });
  $('copyBtn').addEventListener('click', async () => {
    if (!ON.code) return;
    const url = Rooms.inviteUrl('checkers', ON.code);
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (_) {
      try {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
        ta.remove();
      } catch (_) {}
    }
    const b = $('copyBtn');
    b.textContent = ok ? 'Copied' : 'Copy the link above';
    if (!ok) { try { $('lobbyLink').focus(); $('lobbyLink').select(); } catch (_) {} }
    setTimeout(() => { b.textContent = 'Copy link'; }, 1600);
  });

  // The opponent's away state.
  setInterval(() => {
    if (S.mode !== 'online' || !ON.room) return;
    renderBars(); renderStatus();
  }, 3000);

  /* ---------- layout: everything sized from the viewport ---------- */
  const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
  const layoutInfo = { q: 45 };
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const m = Math.min(vw, vh);
    const pad = clamp(8, m * 0.03, 24);
    const fs = clamp(12, Math.min(vw / 30, vh / 44), 16);
    document.documentElement.style.fontSize = fs + 'px';
    const g = clamp(6, m * 0.014, 12);
    gameEl.style.setProperty('--g', g + 'px');
    const set = (S0) => { gameEl.style.setProperty('--S', S0 + 'px'); };

    // column: measure what is not board
    gameEl.classList.add('col'); gameEl.classList.remove('row', 'narrow');
    set(300);
    const extraCol = gameEl.offsetHeight - 300;
    const sCol = Math.min(vw - 2 * pad, vh - 2 * pad - extraCol);

    // row: board column beside a side panel
    const side = clamp(220, vw * 0.26, 300);
    gameEl.classList.add('row'); gameEl.classList.remove('col');
    gameEl.style.setProperty('--side', side + 'px');
    const extraRow = gameEl.querySelector('.bcol').offsetHeight - 300;
    const sRow = Math.min(vh - 2 * pad - extraRow, vw - 2 * pad - side - g * 2.5);

    const useRow = vw >= 600 && sRow > sCol * 1.05;
    const S0 = Math.floor(clamp(160, useRow ? sRow : sCol, 900) / 8) * 8;
    gameEl.classList.toggle('row', useRow);
    gameEl.classList.toggle('col', !useRow);
    gameEl.classList.toggle('narrow', !useRow && S0 < 400);
    set(S0);
    layoutInfo.q = S0 / 8;
    gameEl.style.setProperty('--q', layoutInfo.q + 'px');
    stopAnim();
    renderPieces();
    renderMoves();
  }
  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout).catch(() => {});

  /* ---------- boot ---------- */
  render();
  layout();
  gameEl.classList.add('ready');
  showView('home');
  V.ready();

  import('../_shared/rooms.js').then((mod) => {
    Rooms = mod;
    refreshHome();
    if (!Rooms.available) return;
    const urlCode = Rooms.codeFromUrl();
    const saved = store.get(ROOM_KEY);
    if (urlCode) joinRoom(urlCode, 'url');
    else if (saved && saved.code && Date.now() - (saved.at || 0) < 1000 * 60 * 60 * 24) joinRoom(saved.code, 'saved');
  }).catch(() => {
    Rooms = null;
    refreshHome();
  });
})();
</script>
</body>
</html>
