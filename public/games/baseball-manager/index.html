<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Baseball Manager</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --faint: rgba(255, 255, 255, 0.35);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --pad: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { touch-action: manipulation; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num, td, th { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto auto 1fr; grid-template-columns: 100%; visibility: hidden; }
  .app.ready { visibility: visible; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px var(--pad); border-bottom: 1px solid var(--line); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand .sq { width: 10px; height: 10px; background: var(--brand); flex: none; }
  .brand .ab { font: 600 15px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; }
  .brand .rec { font: 300 20px/1 var(--font-display); }
  .brand .ph { font: 600 11px/1.2 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; flex: none; padding: 0; border: 1px solid var(--outline); border-radius: 0; background: transparent; transition: background 180ms var(--ease); }
  .icon-btn:hover { background: rgba(255,255,255,0.08); }
  .icon-btn svg { width: 18px; height: 18px; }

  .actions { display: flex; gap: 8px; padding: 10px var(--pad); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; }
  @media (max-width: 420px) { .actions { gap: 6px; } .actions .btn { font-size: 11px; letter-spacing: 0.06em; padding: 0 4px; } }
  .actions .msg { flex: 1 1 100%; font: 600 11px/1.2 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand-hover); }

  .tabs { display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; height: 42px; padding: 0 14px; border: 0; background: transparent; color: var(--muted); font: 600 12px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; position: relative; white-space: nowrap; transition: color 150ms var(--ease); }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: var(--brand); }
  .tabs button .dot { display: inline-block; width: 6px; height: 6px; background: var(--brand); margin-left: 6px; vertical-align: 2px; }

  main { overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: var(--pad); min-height: 0; }
  main.enter > * { animation: rise 240ms var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (min-width: 900px) {
    .app { grid-template-columns: 200px 1fr; grid-template-rows: auto auto 1fr; }
    .top { grid-column: 1 / -1; }
    .actions { grid-column: 1 / -1; }
    .actions .btn { flex: 0 0 auto; min-width: 140px; }
    .tabs { grid-row: 3; grid-column: 1; flex-direction: column; overflow: auto; border-bottom: 0; border-right: 1px solid var(--line); padding: 8px 0; }
    .tabs button { height: 40px; text-align: left; padding: 0 var(--pad); }
    .tabs button[aria-selected="true"]::after { left: 0; right: auto; top: 8px; bottom: 8px; width: 3px; height: auto; }
    .tabs button[aria-selected="true"] { background: rgba(255,255,255,0.04); }
    main { grid-row: 3; grid-column: 2; padding: 20px 24px; }
  }

  /* ---------- blocks ---------- */
  .lab { font: 600 11px/1.2 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  h3 { margin: 22px 0 10px; font: 600 12px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  h3::before { content: ""; width: 8px; height: 8px; background: var(--brand); flex: none; }
  h3:first-child { margin-top: 0; }
  h3 .sp { flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .card { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
  .card .v { display: block; margin-top: 4px; font: 300 26px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 6px; background: var(--line); margin-top: 8px; position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); }
  .meter.w i { background: #fff; }
  .meter b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #fff; }
  .arm { display: inline-block; width: 44px; height: 6px; background: var(--line); position: relative; vertical-align: 1px; }
  .arm i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
  .arm.hot i { background: var(--brand); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px 24px; }
  @media (min-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

  .seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--outline); margin-bottom: 12px; max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: 0; background: transparent; font: 600 11px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; transition: background 150ms var(--ease); }
  .seg button + button { box-shadow: -1px 0 0 var(--line); }
  .seg button:hover { background: rgba(255,255,255,0.08); }
  .seg button[aria-pressed="true"] { background: var(--brand); box-shadow: none; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .sp { flex: 1; }
  .row .seg { margin-right: 4px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 0; border: 1px solid var(--outline); background: transparent; font: 600 12px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; transition: background 160ms var(--ease), border-color 160ms var(--ease), transform 120ms var(--ease), opacity 160ms var(--ease); }
  .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.6); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn:focus-visible, .icon-btn:focus-visible, .tabs button:focus-visible, .seg button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: -2px; }

  /* ---------- tables ---------- */
  .tw { overflow: auto; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 0 9px; height: 34px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { height: 32px; font: 600 10.5px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface); position: sticky; top: 0; z-index: 1; user-select: none; }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--text); }
  th.on { color: var(--brand-hover); }
  th.l, td.l { text-align: left; }
  td.n, th.n { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  th.n { z-index: 2; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--surface-2); }
  tr.me td { color: #fff; }
  tr.me td.n { box-shadow: inset 3px 0 0 var(--brand); }
  tr.tot td { font-weight: 600; background: var(--surface-2); }
  tr.cut td { border-top: 1px solid var(--outline); }
  td.dim, span.dim { color: var(--faint); }
  .tag { display: inline-block; padding: 3px 5px; background: var(--brand); color: #fff; font: 600 9.5px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; vertical-align: 1px; }
  .tag.w { background: #fff; color: #000; }
  .tag.o { background: transparent; box-shadow: inset 0 0 0 1px var(--outline); color: var(--muted); }
  .r { display: inline-block; min-width: 26px; padding: 3px 0; text-align: center; font-weight: 600; }
  .r.a { background: var(--brand); color: #fff; }
  .r.b { background: rgba(234, 84, 38, 0.35); }
  .r.c { background: rgba(255, 255, 255, 0.08); }
  .r.d { color: var(--faint); }
  .ck { width: 16px; height: 16px; border: 1px solid var(--outline); display: inline-block; vertical-align: -3px; }
  .ck.on { background: var(--brand); border-color: var(--brand); box-shadow: inset 0 0 0 3px var(--surface); }
  select.sel, select.mini { height: 38px; padding: 0 10px; border: 1px solid var(--outline); border-radius: 0; background: var(--surface); }
  select.mini { height: 28px; padding: 0 4px; font-size: 12px; }

  .list { border: 1px solid var(--line); background: var(--surface); }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .li.click { cursor: pointer; transition: background 150ms var(--ease); }
  .li.click:hover { background: var(--surface-2); }
  .li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .d { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .wl { display: inline-block; width: 20px; text-align: center; font-weight: 700; }
  .wl.w { color: var(--brand-hover); }
  .wl.l { color: var(--faint); }

  .step { display: inline-flex; align-items: center; border: 1px solid var(--outline); }
  .step button { width: 30px; height: 28px; border: 0; background: transparent; font-size: 16px; line-height: 1; }
  .step button:hover { background: rgba(255,255,255,0.08); }
  .step span { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  .arrows { display: inline-flex; gap: 4px; }
  .arrows button { width: 28px; height: 28px; border: 1px solid var(--line); background: transparent; display: inline-grid; place-items: center; padding: 0; }
  .arrows button:hover { background: rgba(255,255,255,0.08); }
  .arrows svg { width: 14px; height: 14px; }

  /* bracket */
  .bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .bracket > div { display: flex; flex-direction: column; }
  .bcol { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
  .ser { border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: background 150ms var(--ease); }
  .ser:hover { background: var(--surface-2); }
  .ser div { display: flex; justify-content: space-between; padding: 7px 10px; gap: 8px; }
  .ser div + div { border-top: 1px solid var(--line); }
  .ser .win { color: var(--brand-hover); font-weight: 600; }
  .ser .me { box-shadow: inset 3px 0 0 var(--brand); }
  .ser.empty { cursor: default; color: var(--faint); }

  .tside { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (min-width: 760px) { .tside { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .sum { margin-top: 14px; border: 1px solid var(--line); background: var(--surface); }
  .sum .li { padding: 8px 12px; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,0.82); opacity: 0; transition: opacity 220ms var(--ease); }
  .overlay[hidden] { display: none; }
  .overlay.show { opacity: 1; }
  .sheet { width: min(100%, 26em); max-height: 100%; overflow: auto; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; transform: translateY(24px); transition: transform 300ms var(--ease); overscroll-behavior: contain; }
  .sheet.wide { width: min(100%, 980px); }
  .overlay.show .sheet { transform: none; }
  .sheet h2 { margin: 0; font: 600 14px/1.2 var(--font); letter-spacing: 0.18em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .sheet h2::before { content: ""; width: 10px; height: 10px; background: var(--brand); flex: none; }
  .sheet .line { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .shead { display: flex; align-items: center; gap: 10px; }
  .shead h2 { flex: 1; min-width: 0; }
  .btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btns .btn { flex: 1 1 8em; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); margin-top: 10px; }
  .slot .t { flex: 1; min-width: 0; }
  .slot .t b { display: block; font-weight: 600; }
  .slot .t span { color: var(--muted); font-size: 12px; }
  .pbig { display: flex; gap: 0; margin-top: 14px; border: 1px solid var(--line); }
  .pbig > div { flex: 1; padding: 10px 12px; min-width: 0; }
  .pbig > div + div { border-left: 1px solid var(--line); }
  .pbig .v { display: block; font: 300 30px/1.1 var(--font-display); }
  .bars { display: grid; grid-template-columns: 1fr; gap: 7px 22px; margin-top: 14px; }
  @media (min-width: 560px) { .bars { grid-template-columns: 1fr 1fr; } }
  .bar { display: grid; grid-template-columns: 74px 1fr 28px; align-items: center; gap: 10px; }
  .bar .meter { margin: 0; }
  .bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 30; padding: 12px 16px; background: #fff; color: #000; font: 600 12px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 240ms var(--ease); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .ov-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; border: 1px solid var(--line); }
  .ov-stats > div { padding: 10px 12px; }
  .ov-stats > div:nth-child(even) { border-left: 1px solid var(--line); }
  .ov-stats > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .ov-stats .n { display: block; margin-top: 2px; font: 300 28px/1.1 var(--font-display); }
  .teampick { margin-top: 12px; }

  /* ---------- live game ---------- */
  .live { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: grid; grid-template-rows: auto auto minmax(0, 1fr); opacity: 0; transition: opacity 200ms var(--ease); }
  .live[hidden] { display: none; }
  .live.show { opacity: 1; }
  .lv-head { display: flex; align-items: center; gap: 10px; padding: 10px var(--pad); border-bottom: 1px solid var(--line); }
  .lv-head .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lsc { overflow-x: auto; border-bottom: 1px solid var(--line); }
  .lsc table { font-size: 13px; width: auto; min-width: min(100%, 520px); }
  @media (min-width: 900px) { .lsc th, .lsc td { min-width: 36px; } .lsc table { font-size: 14px; } }
  .lsc th, .lsc td { height: 28px; padding: 0 6px; text-align: center; min-width: 24px; }
  .lsc td.tm, .lsc th.tm { text-align: left; padding-left: var(--pad); font-weight: 600; letter-spacing: 0.08em; min-width: 54px; }
  .lsc td.rr { font-weight: 700; }
  .lsc td.cur { background: rgba(234, 84, 38, 0.18); }
  .lsc td.pop { animation: pop 420ms var(--ease); }
  @keyframes pop { 0% { background: var(--brand); color: #fff; } 100% { background: transparent; } }
  .lv-body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .lv-play { padding: 12px var(--pad); display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
  .lv-vis { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
  .diamond { width: 100%; max-width: 150px; height: auto; justify-self: center; display: block; }
  .diamond .bs { fill: transparent; stroke: rgba(255,255,255,0.45); stroke-width: 1.5; transition: fill 200ms var(--ease); }
  .diamond .bs.on { fill: var(--brand); stroke: var(--brand); }
  .diamond .ln { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .diamond .hp { fill: rgba(255,255,255,0.6); }
  .cnt { display: grid; gap: 6px; justify-items: start; }
  .cnt .row2 { display: flex; align-items: center; gap: 6px; }
  .cnt .row2 .lab { width: 14px; }
  .cnt i { width: 11px; height: 11px; border: 1px solid var(--outline); display: inline-block; transition: background 160ms var(--ease), border-color 160ms var(--ease); }
  .cnt i.on { background: #fff; border-color: #fff; }
  .cnt i.on.o { background: var(--brand); border-color: var(--brand); }
  .inn { font: 300 22px/1 var(--font-display); white-space: nowrap; }
  .zone { width: 100%; max-width: 130px; height: auto; justify-self: center; display: block; }
  .zone .zr { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.5); stroke-width: 0.03; }
  .zone .zg { stroke: rgba(255,255,255,0.1); stroke-width: 0.02; }
  .zone circle { stroke-width: 0.06; transform-box: fill-box; transform-origin: center; animation: dot 260ms var(--ease); }
  .zone circle.s { fill: var(--brand); stroke: var(--brand); }
  .zone circle.b { fill: var(--bg); stroke: #fff; }
  .zone circle.f { fill: var(--bg); stroke: var(--brand); }
  .zone circle.x { fill: #fff; stroke: #fff; }
  .zone text { font: 600 0.2px/1 var(--font); fill: #000; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .zone circle.b + text, .zone circle.f + text { fill: #fff; }
  @keyframes dot { from { transform: scale(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
  .mu { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); background: var(--surface); }
  .mu > div { padding: 8px 10px; min-width: 0; }
  .mu > div + div { border-left: 1px solid var(--line); }
  .mu b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .mu span.s { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .lastp { font: 600 12px/1.2 var(--font); letter-spacing: 0.08em; text-transform: uppercase; min-height: 15px; color: var(--muted); }
  .lastp.hot { color: var(--brand-hover); }
  .lv-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lv-ctl .seg { margin: 0; }
  .lv-ctl .seg button { padding: 0 10px; }
  .lv-ctl .btn { flex: 1 1 auto; padding: 0 10px; }
  .feed { overflow: auto; overscroll-behavior: contain; min-height: 0; }
  .feed .fi { padding: 7px var(--pad); border-bottom: 1px solid var(--line); font-size: 13px; animation: rise 220ms var(--ease); }
  .feed .fi.kp { color: var(--muted); font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
  .feed .fi.ki { font: 600 11px/1.2 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
  .feed .fi.ks { color: var(--brand-hover); }
  .feed .fi.run { box-shadow: inset 3px 0 0 var(--brand); }
  .feed .fi .sc { float: right; color: var(--muted); font-size: 12px; }
  .live.shake .lsc { animation: shake 360ms var(--ease); }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-4px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-2px); } }
  @media (min-width: 900px) {
    .lv-body { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .lv-play { border-bottom: 0; border-right: 1px solid var(--line); align-content: start; padding: 18px 20px; gap: 16px; }
    .diamond { max-width: 180px; }
    .zone { max-width: 160px; }
  }
  @media (max-height: 640px) and (max-width: 899px) {
    .lv-play { gap: 8px; padding-top: 8px; padding-bottom: 8px; }
    .diamond { max-width: 110px; }
    .zone { max-width: 96px; }
  }

  @media (prefers-reduced-motion: reduce) {

  }
</style>

<script src="engine.js"></script>
<script src="../_shared/bridge.js" data-game="baseball-manager"></script>
<script>
(function () {
'use strict';
const B = BSM;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const M = (amt) => (amt < 0 ? '-' : '') + '$' + (Math.abs(amt) / 1000).toFixed(1) + 'M';
const f1 = (x) => (Number.isFinite(x) ? x.toFixed(1) : '-');
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
const r3 = (x) => (Number.isFinite(x) ? x.toFixed(3).replace(/^0/, '') : '-');

let S = null;
let slot = 0;
let tab = 'home';
const sub = { roster: 'stats', rosterSet: 'active', games: 'mine', stand: '0', stats: 'leaders', statsTeam: 'all', hist: 'champs', legends: 'bat', fa: 'all', draft: 'board' };
const sorts = {};
let leagueDay = -1;
let simming = null;
let paused = false;
let trade = { tid: -1, give: [], get: [], msg: '', ok: null };
let toastT = 0;

/* ---------------- storage ---------------- */
const META = 'bsm:meta';
const SLOTS = [1, 2, 3];
function readMeta() { try { return JSON.parse(localStorage.getItem(META)) || { slots: {} }; } catch (_) { return { slots: {} }; } }
function writeMeta(m) { try { localStorage.setItem(META, JSON.stringify(m)); } catch (_) {} }
let saveT = 0;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 350); }
function save() {
  clearTimeout(saveT);
  if (!S || !slot) return;
  const key = 'bsm:slot:' + slot;
  const tryStore = () => { try { localStorage.setItem(key, B.compress(B.pack())); return true; } catch (_) { return false; } };
  let ok = tryStore();
  if (!ok) { for (const g of S.games) if (g.h !== S.user && g.a !== S.user) { g.b = null; g.ln = null; } ok = tryStore(); }
  if (!ok) { for (const g of S.games) { g.b = null; g.ln = null; } S.news.length = Math.min(S.news.length, 40); ok = tryStore(); }
  const t = S.teams[S.user];
  const m = readMeta();
  m.slots[slot] = { abbr: t.abbr, team: t.city + ' ' + t.name, season: S.season, w: S.career.w + (inSeason() ? t.rec.w : 0), l: S.career.l + (inSeason() ? t.rec.l : 0), titles: S.career.titles, fired: S.fired, t: Date.now() };
  m.last = slot;
  writeMeta(m);
  if (!ok) toast('Save failed');
}
function inSeason() { return S.phase === 'regular' || S.phase === 'playoffs'; }
function loadSlot(n) {
  try {
    const raw = localStorage.getItem('bsm:slot:' + n);
    if (!raw) return false;
    B.unpack(B.decompress(raw));
    S = B.getState();
    slot = n;
    return true;
  } catch (e) { console.error(e); return false; }
}
function deleteSlot(n) {
  try { localStorage.removeItem('bsm:slot:' + n); } catch (_) {}
  const m = readMeta(); delete m.slots[n]; if (m.last === n) delete m.last; writeMeta(m);
}

/* ---------------- helpers ---------------- */
const T = (tid) => S.teams[tid];
const P = (id) => B.P(id);
const name = (p) => p.fn + ' ' + p.ln;
const short = (p) => p.fn[0] + '. ' + p.ln;
const tName = (tid) => T(tid).city + ' ' + T(tid).name;
const isP = (p) => B.isP(p);
function rcls(v) { return v >= 70 ? 'a' : v >= 58 ? 'b' : v >= 45 ? 'c' : 'd'; }
function rcell(v) { return `<span class="r ${rcls(v)}">${v}</span>`; }
function scout(p) { return p.tid === -3 ? { ovr: p.ovr + p.fz, pot: p.pot + p.fz } : { ovr: p.ovr, pot: p.pot }; }
function line(p, po) { return B.seasonLine(p, po); }
function avg(o) { return o && o.ab ? o.h / o.ab : 0; }
function obp(o) { if (!o) return 0; const d = o.ab + o.bb + o.hbp + o.sf; return d ? (o.h + o.bb + o.hbp) / d : 0; }
function slg(o) { return o && o.ab ? (o.h + o.d + 2 * o.tr + 3 * o.hr) / o.ab : 0; }
function ops(o) { return obp(o) + slg(o); }
function ipStr(outs) { return Math.floor(outs / 3) + '.' + (outs % 3); }
function eraN(o) { return o && o.outs ? o.er * 27 / o.outs : 0; }
function whipN(o) { return o && o.outs ? (o.h + o.bb) * 3 / o.outs : 0; }
function eraS(o) { return o && o.outs ? eraN(o).toFixed(2) : '-'; }
function whipS(o) { return o && o.outs ? whipN(o).toFixed(2) : '-'; }
function bt(p) { return (p.bats || 'R') + '/' + (p.thr || 'R'); }
function armCell(p) { const f = Math.round(p.fat || 0); return `<span class="arm${f > 26 ? ' hot' : ''}"><i style="width:${Math.min(100, f)}%"></i></span>`; }
function phaseLabel() {
  if (S.phase === 'regular') return `${S.season} Day ${S.day + 1}`;
  if (S.phase === 'playoffs') { const r = B.curRound(); return `${S.season} ${r >= 0 ? B.ROUNDS[r] : 'Playoffs'}`; }
  if (S.phase === 'draft') return `${S.season} Draft`;
  if (S.phase === 'resign') return `${S.season} Re-sign`;
  if (S.phase === 'fa') return `${S.season} Free agency Day ${S.faDay + 1}`;
  return '';
}
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1800);
}
const ICON = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 9l6 6 6-6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
function teamGames() { return Math.max(1, ...S.teams.map((t) => t.rec.w + t.rec.l)); }
function injTag(p) { return p.inj ? ` <span class="tag o">${p.inj.d}d</span>` : ''; }
function farmTag(p) { return p.fm ? ' <span class="tag o">Farm</span>' : ''; }

/* ---------------- generic table ---------------- */
function table(id, cols, rows, opt) {
  opt = opt || {};
  const st = sorts[id] || (opt.sort ? { k: opt.sort, d: opt.dir || -1 } : null);
  let rs = rows.slice();
  if (st) {
    const col = cols.find((c) => c.k === st.k);
    if (col) {
      const v = col.v || col.f;
      rs.sort((a, b) => {
        const x = v(a), y = v(b);
        if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y)) * st.d;
        return ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) * st.d;
      });
    }
  }
  if (opt.limit) rs = rs.slice(0, opt.limit);
  const head = cols.map((c) => `<th class="${c.c || ''}${c.ns ? '' : ' sort'}${st && st.k === c.k ? ' on' : ''}" ${c.ns ? '' : `data-sort="${id}:${c.k}"`}>${c.l}</th>`).join('');
  const body = rs.map((r, i) => {
    const attr = opt.click ? opt.click(r) : '';
    const cls = (opt.rowCls ? opt.rowCls(r, i) : '') + (attr ? ' click' : '');
    return `<tr class="${cls}" ${attr}>${cols.map((c) => `<td class="${c.c || ''}">${c.f(r)}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td class="l dim" colspan="${cols.length}">None</td></tr>`}${opt.foot || ''}</tbody></table></div>`;
}
function seg(key, opts, cur) {
  return `<div class="seg">${opts.map(([v, l]) => `<button type="button" data-seg="${key}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
}
function card(l, v, s) { return `<div class="card"><span class="lab">${l}</span><span class="v">${esc(v)}</span>${s ? `<span class="s">${esc(s)}</span>` : ''}</div>`; }

/* ---------------- header + actions ---------------- */
const TABS = [['home', 'Home'], ['roster', 'Roster'], ['lineup', 'Lineup'], ['pitching', 'Pitching'], ['games', 'Schedule'], ['stand', 'Standings'], ['stats', 'Stats'], ['trade', 'Trade'], ['fa', 'Free agents'], ['draft', 'Draft'], ['fin', 'Finances'], ['hist', 'History']];
function renderTabs() {
  const dot = { fa: S.phase === 'resign' || S.phase === 'fa', draft: S.phase === 'draft' };
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}${dot[k] ? '<i class="dot"></i>' : ''}</button>`).join('');
}
function renderHead() {
  const t = T(S.user);
  $('hAbbr').textContent = t.abbr;
  $('hRec').textContent = t.rec.w + '-' + t.rec.l;
  $('hPhase').textContent = phaseLabel();
}
function userAlive() { return S.phase === 'playoffs' && B.curRound() >= 0 && S.series.some((s) => s.r === B.curRound() && s.win < 0 && (s.hi === S.user || s.lo === S.user)); }
function renderActions() {
  const el = $('actions');
  if (simming) {
    el.innerHTML = `<button class="btn" type="button" data-act="stop">Stop</button><span class="lab">${esc(phaseLabel())}</span>`;
    return;
  }
  let btns = [], msg = '';
  const ph = S.phase;
  if (S.fired) btns = [['fired', 'Career over', true, true]];
  else if (ph === 'regular') {
    btns = [['play', 'Play game', true], ['day', 'Sim day'], ['week', 'Sim week'], ['endreg', 'To playoffs']];
    const why = B.canSim();
    if (why) { msg = why; btns = btns.map(([a, l, p]) => [a, l, p, true]); if (/below|Need/.test(why)) btns.unshift(['fill', 'Fill roster', true]); }
  } else if (ph === 'playoffs') {
    btns = userAlive() ? [['play', 'Play game', true], ['day', 'Sim day'], ['round', 'Sim round'], ['endpo', 'Sim playoffs']] : [['day', 'Sim day', true], ['round', 'Sim round'], ['endpo', 'Sim playoffs']];
    const why = B.canSim();
    if (why && userAlive()) { msg = why; btns = btns.map(([a, l, p]) => [a, l, p, true]); }
  } else if (ph === 'draft') {
    const pk = B.onClock();
    const mine = S.draft.order.slice(S.draft.idx).includes(S.user);
    if (!mine) btns = [['enddraft', 'Finish draft', true]];
    else if (pk && pk.tid === S.user) btns = [['autopick', 'Auto pick'], ['enddraft', 'Finish draft']];
    else btns = [['tomypick', 'To my pick', true], ['enddraft', 'Finish draft']];
  } else if (ph === 'resign') btns = [['tofa', 'To free agency', true]];
  else if (ph === 'fa') {
    const why = B.canStartSeason();
    btns = [['faday', 'Next day'], ['startseason', 'Start season', true]];
    if (why) { msg = why; btns[1] = btns[1].concat([true]); if (/below|Need/.test(why)) btns.unshift(['fill', 'Fill roster', true]); }
  }
  el.innerHTML = btns.map(([a, l, pri, dis]) => `<button class="btn${pri ? ' primary' : ''}" type="button" data-act="${a}" ${dis ? 'disabled' : ''}>${l}</button>`).join('') + (msg ? `<span class="msg">${esc(msg)}</span>` : '');
}

/* ---------------- sim control ---------------- */
function simLoop(cond, done) {
  if (simming) return;
  simming = { stop: false };
  renderActions();
  const step = () => {
    if (!simming) return;
    if (paused) { setTimeout(step, 200); return; }
    const t0 = performance.now();
    let more = true;
    while (performance.now() - t0 < 30) {
      if (simming.stop || !cond()) { more = false; break; }
      B.simDay();
      if (S.fired) { more = false; break; }
    }
    renderHead();
    if (simming.stop) more = false;
    if (more && cond()) { renderActions(); setTimeout(step, 0); }
    else { simming = null; afterSim(); if (done) done(); }
  };
  setTimeout(step, 0);
}
function afterSim() {
  S = B.getState();
  render();
  save();
  checkEvents();
}
let lastScoredSeason = 0;
function checkEvents() {
  const h = S.hist[S.hist.length - 1];
  if (h && h.y !== lastScoredSeason && S.phase === 'draft' && S.draft && S.draft.idx === 0) {
    lastScoredSeason = h.y;
    Vela.gameOver(S.lastScore || B.careerScore());
    if (h.champ === S.user) toast(`${S.season} Champions`);
    else showSeasonEnd(h);
  }
  if (S.fired) showFired();
}
function userGamesPlayed() { return S.games.filter((g) => g.h === S.user || g.a === S.user).length; }
function act(a) {
  if (simming && a !== 'stop') return;
  if (a === 'stop') { if (simming) simming.stop = true; return; }
  if (a === 'play') {
    if (B.canSim()) return;
    if (B.userGameToday()) { openLive(); return; }
    const ph = S.phase;
    simLoop(() => S.phase === ph && !B.userGameToday() && (ph !== 'playoffs' || userAlive()), () => { if (S.phase === ph && B.userGameToday()) openLive(); });
  } else if (a === 'day') { B.simDay(); afterSim(); }
  else if (a === 'week') { const d = S.day + 7; simLoop(() => S.phase === 'regular' && S.day < d); }
  else if (a === 'endreg') simLoop(() => S.phase === 'regular');
  else if (a === 'round') { const r = B.curRound(); simLoop(() => S.phase === 'playoffs' && B.curRound() === r); }
  else if (a === 'endpo') simLoop(() => S.phase === 'playoffs');
  else if (a === 'tomypick') { B.draftUntilUser(false); afterSim(); }
  else if (a === 'autopick' || a === 'enddraft') { B.draftUntilUser(true); afterSim(); }
  else if (a === 'tofa') { B.endResign(); afterSim(); }
  else if (a === 'faday') { B.faNextDay(); afterSim(); }
  else if (a === 'fill') { const n = B.fillRoster(); toast(n ? 'Added ' + n : 'No one available'); afterSim(); }
  else if (a === 'startseason') { if (!B.canStartSeason()) { B.startSeason(); tab = 'home'; leagueDay = -1; afterSim(); } }
}

/* ---------------- render ---------------- */
function render(anim) {
  S = B.getState();
  renderHead(); renderTabs(); renderActions();
  const main = $('main');
  const keep = main.scrollTop;
  main.innerHTML = (VIEWS[tab] || VIEWS.home)();
  if (anim) { main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter'); main.scrollTop = 0; }
  else main.scrollTop = keep;
}
const VIEWS = {};

/* ----- home ----- */
function jobSecurity() { return Math.max(0, Math.min(1, (B.ownerTotal() + 1) / 3)); }
function divRank(tid) { return B.standings(T(tid).div).findIndex((t) => t.tid === tid) + 1; }
VIEWS.home = function () {
  const t = T(S.user);
  const rk = divRank(S.user);
  const ovrRank = S.teams.map((x) => [x.tid, B.teamOvr(x.tid)]).sort((a, b) => b[1] - a[1]).findIndex((x) => x[0] === S.user) + 1;
  const pay = B.payroll(S.user);
  const sec = jobSecurity();
  let next = '';
  if (S.phase === 'regular') {
    const g = S.sched.find((x) => !x.g && (x.h === S.user || x.a === S.user));
    if (g) { const opp = g.h === S.user ? g.a : g.h; next = card('Next game', (g.h === S.user ? 'vs ' : 'at ') + T(opp).abbr, `${T(opp).rec.w}-${T(opp).rec.l}  Ovr ${B.teamOvr(opp)}  Day ${g.d + 1}`); }
  } else if (S.phase === 'playoffs') {
    const s = S.series.filter((x) => x.hi === S.user || x.lo === S.user).pop();
    if (s) { const me = s.hi === S.user ? 0 : 1; const opp = me ? s.hi : s.lo; next = card(B.ROUNDS[s.r], `${s.w[me]}-${s.w[1 - me]}`, `vs ${T(opp).abbr}${s.win >= 0 ? (s.win === S.user ? '  Won' : '  Lost') : ''}`); }
    else if (S.seeds && S.seeds.some((x) => x[0] === S.user)) next = card('Playoffs', 'Bye', B.ROUNDS[1]);
    else next = card('Playoffs', 'Out', '');
  } else if (S.phase === 'draft') {
    const mine = S.draft.order.map((tid, i) => [tid, i + 1]).filter(([tid, n]) => tid === S.user && n > S.draft.idx).map((x) => '#' + x[1]);
    next = card('Your picks', mine.length ? mine.join(' ') : 'None', '');
  } else next = card('Budget room', M(Math.max(0, t.budget - pay)), `Active ${B.rosterCount(S.user)} / ${B.ROSTER_MAX}`);
  let h = `<div class="cards">
    ${card('Record', t.rec.w + '-' + t.rec.l, `${B.DIVS[t.div]} ${t.rec.w + t.rec.l ? ord(rk) : ''}  Streak ${t.rec.str > 0 ? 'W' + t.rec.str : t.rec.str < 0 ? 'L' + -t.rec.str : '-'}`)}
    ${next}
    ${card('Team ovr', B.teamOvr(S.user), `${ord(ovrRank)} of ${B.NT}`)}
    ${card('Payroll', M(pay), `Budget ${M(t.budget)}`)}
    <div class="card"><span class="lab">Job security</span><span class="v">${Math.round(sec * 100)}%</span><div class="meter"><i style="width:${sec * 100}%"></i></div></div>
    ${card('Career wins', B.careerScore(), `Titles ${S.career.titles}  Seasons ${S.career.seasons}`)}
  </div>`;
  const games = S.games.filter((g) => g.h === S.user || g.a === S.user).slice(-6).reverse();
  h += `<div class="grid2" style="margin-top:22px"><div><h3>Results</h3><div class="list">${games.map(gameLi).join('') || '<div class="li"><span class="t dim">None</span></div>'}</div></div>`;
  const bats = B.active(S.user).filter((p) => !isP(p)).map((p) => ({ p, o: line(p, false) })).sort((a, b) => (b.o ? b.o.pa : 0) - (a.o ? a.o.pa : 0) || b.p.ovr - a.p.ovr).slice(0, 6);
  h += `<div><h3>Hitters</h3>${table('homeB', [
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + injTag(r.p), ns: 1 },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, ns: 1 },
    { k: 'avg', l: 'AVG', f: (r) => (r.o && r.o.ab ? r3(avg(r.o)) : '-'), ns: 1 },
    { k: 'hr', l: 'HR', f: (r) => (r.o ? r.o.hr : 0), ns: 1 },
    { k: 'rbi', l: 'RBI', f: (r) => (r.o ? r.o.rbi : 0), ns: 1 },
    { k: 'ops', l: 'OPS', f: (r) => (r.o && r.o.pa ? r3(ops(r.o)) : '-'), ns: 1 },
  ], bats, { click: (r) => `data-player="${r.p.id}"` })}</div></div>`;
  const pits = B.active(S.user).filter((p) => isP(p)).map((p) => ({ p, o: line(p, false) })).sort((a, b) => (b.o ? b.o.outs : 0) - (a.o ? a.o.outs : 0) || b.p.ovr - a.p.ovr).slice(0, 6);
  h += `<div class="grid2" style="margin-top:22px"><div><h3>Pitchers</h3>${table('homeP', [
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + injTag(r.p), ns: 1 },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, ns: 1 },
    { k: 'wl', l: 'W-L', f: (r) => (r.o ? r.o.w + '-' + r.o.l : '0-0'), ns: 1 },
    { k: 'era', l: 'ERA', f: (r) => eraS(r.o), ns: 1 },
    { k: 'ip', l: 'IP', f: (r) => (r.o ? ipStr(r.o.outs) : '0.0'), ns: 1 },
    { k: 'so', l: 'K', f: (r) => (r.o ? r.o.so : 0), ns: 1 },

    const played = S.games.filter((g) => g.h === S.user || g.a === S.user);

    const rows = played.map((g) => ({ g, played: true })).concat(upcoming.map((g) => ({ g, played: false })));
    h += table('mygames', [
      { k: 'd', l: 'Day', c: 'l', f: (r) => (r.g.po ? '<span class="tag o">PO</span>' : r.g.d + 1), ns: 1 },
      { k: 'o', l: 'Opponent', c: 'n', f: (r) => (r.g.h === S.user ? 'vs ' : 'at ') + esc(tName(r.g.h === S.user ? r.g.a : r.g.h)), ns: 1 },
      { k: 'r', l: 'Result', f: (r) => { if (!r.played) return '<span class="dim">-</span>'; const home = r.g.h === S.user; const us = home ? r.g.hs : r.g.as, th = home ? r.g.as : r.g.hs; return `<span class="wl ${us > th ? 'w' : 'l'}">${us > th ? 'W' : 'L'}</span> ${us}-${th}${r.g.x ? ' F/' + r.g.x : ''}`; }, ns: 1 },
      { k: 'rec', l: 'Opp', f: (r) => { const o = r.g.h === S.user ? r.g.a : r.g.h; return T(o).rec.w + '-' + T(o).rec.l; }, ns: 1 },
    ], rows, { click: (r) => (r.played ? `data-box="${r.g.id}"` : '') });
  } else {
    const days = [...new Set(S.games.map((g) => (g.po ? 1000 : 0) + g.d))];
    if (!days.length) return h + '<div class="list"><div class="li"><span class="t dim">None</span></div></div>';
    if (!days.includes(leagueDay)) leagueDay = days[days.length - 1];

    h += `<div class="list">${games.map((g) => `<div class="li click" data-box="${g.id}"><span class="t">${esc(T(g.a).abbr)} <b>${g.as}</b> at ${esc(T(g.h).abbr)} <b>${g.hs}</b>${g.x ? ' F/' + g.x : ''}</span>${g.h === S.user || g.a === S.user ? '<span class="tag">You</span>' : ''}</div>`).join('')}</div>`;

  const seedTop = (d) => (S.seeds ? T(S.seeds[d][0]).abbr : '-');
  const cols = [
    ['East wild card', box(ser(0, 0))], ['East series', box(ser(1, 0), seedTop(0))], ['Championship', box(ser(2, -1))],
    ['West series', box(ser(1, 1), seedTop(1))], ['West wild card', box(ser(0, 1))],
  ];
  return `<div class="bracket">${cols.map(([l, c]) => `<div><div class="lab" style="margin-bottom:8px">${l}</div><div class="bcol">${c}</div></div>`).join('')}</div>`;
}
function serBox(s) {
  const row = (tid, seed, w) => `<div class="${s.win === tid ? 'win' : ''} ${tid === S.user ? 'me' : ''}"><span>${seed ? `<span class="dim">${seed}</span> ` : ''}${esc(T(tid).abbr)}</span><span>${w}</span></div>`;
  return `<div class="ser" data-series="${S.series.indexOf(s)}">${row(s.hi, s.hs, s.w[0])}${row(s.lo, s.ls, s.w[1])}</div>`;
}

/* ----- stats ----- */
VIEWS.stats = function () {
  let h = `<div class="row">${seg('stats', [['leaders', 'Leaders'], ['batting', 'Batting'], ['pitching', 'Pitching'], ['teams', 'Teams']], sub.stats)}</div>`;
  const G = teamGames();
  if (sub.stats === 'leaders') {
    const bl = S.players.filter((p) => !isP(p) && p.tid !== -3).map((p) => ({ p, o: line(p, false) })).filter((x) => x.o && x.o.pa > 0);
    const pl = S.players.filter((p) => isP(p) && p.tid !== -3).map((p) => ({ p, o: line(p, false) })).filter((x) => x.o && x.o.outs > 0);
    const qb = bl.filter((x) => x.o.pa >= G * 3.1), qp = pl.filter((x) => x.o.outs >= G * 3);
    const cats = [
      ['AVG', (x) => avg(x.o), qb, r3], ['HR', (x) => x.o.hr, bl, String], ['RBI', (x) => x.o.rbi, bl, String],
      ['OBP', (x) => obp(x.o), qb, r3], ['OPS', (x) => ops(x.o), qb, r3], ['SB', (x) => x.o.sb, bl, String],
      ['ERA', (x) => -eraN(x.o), qp, (v) => (-v).toFixed(2)], ['W', (x) => x.o.w, pl, String], ['K', (x) => x.o.so, pl, String],
      ['WHIP', (x) => -whipN(x.o), qp, (v) => (-v).toFixed(2)], ['SV', (x) => x.o.sv, pl, String], ['IP', (x) => x.o.outs, pl, ipStr],
    ];
    h += `<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${cats.map(([l, f, pool, fmt]) => {
      const top = pool.slice().sort((a, b) => f(b) - f(a)).slice(0, 5);
      return `<div class="card"><span class="lab">${l}</span>${top.map((x, i) => `<div class="li click" data-player="${x.p.id}" style="padding:6px 0;border-bottom:${i < 4 ? '1px solid var(--line)' : '0'}"><span class="t">${esc(short(x.p))} <span class="dim">${x.o.t >= 0 ? esc(T(x.o.t).abbr) : ''}</span></span><span class="num">${fmt(f(x))}</span></div>`).join('') || '<span class="s">-</span>'}</div>`;
    }).join('')}</div>`;
  } else if (sub.stats === 'batting' || sub.stats === 'pitching') {
    const pit = sub.stats === 'pitching';
    h += `<div class="row">${seg('statsTeam', [['all', 'All'], ['qual', 'Qualified'], ['mine', 'Mine']], sub.statsTeam)}</div>`;
    let rows = S.players.filter((p) => isP(p) === pit && (sub.statsTeam === 'mine' ? p.tid === S.user : p.tid !== -3)).map((p) => ({ p, o: line(p, false) })).filter((x) => x.o && (pit ? x.o.outs > 0 : x.o.pa > 0));
    if (sub.statsTeam === 'qual') rows = rows.filter((x) => (pit ? x.o.outs >= G * 3 : x.o.pa >= G * 3.1));
    const base = [
      { k: 'name', l: 'Player', c: 'n', f: (r) => esc(short(r.p)), v: (r) => r.p.ln },
      { k: 'tm', l: 'Team', c: 'l', f: (r) => (r.o.t >= 0 ? T(r.o.t).abbr : '-'), v: (r) => (r.o.t >= 0 ? T(r.o.t).abbr : 'ZZZ') },
      { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => B.BPOS.indexOf(r.p.pos) },
    ];
    h += table('all-' + sub.stats, base.concat(pit ? pitStatCols(false) : batStatCols()), rows, { sort: pit ? 'ip' : 'pa', limit: 200, click: (r) => `data-player="${r.p.id}"`, rowCls: (r) => (r.p.tid === S.user ? 'me' : '') });
  } else {
    const ts = teamStats();
    h += table('teamstats', [
      { k: 'n', l: 'Team', c: 'n', f: (r) => esc(T(r.tid).abbr), v: (r) => T(r.tid).abbr },
      { k: 'w', l: 'W', f: (r) => T(r.tid).rec.w, v: (r) => T(r.tid).rec.w },
      { k: 'rpg', l: 'R/G', f: (r) => f1(T(r.tid).rec.rs / Math.max(1, T(r.tid).rec.w + T(r.tid).rec.l)), v: (r) => T(r.tid).rec.rs },
      { k: 'avg', l: 'AVG', f: (r) => r3(avg(r.b)), v: (r) => avg(r.b) },
      { k: 'obp', l: 'OBP', f: (r) => r3(obp(r.b)), v: (r) => obp(r.b) },
      { k: 'slg', l: 'SLG', f: (r) => r3(slg(r.b)), v: (r) => slg(r.b) },
      { k: 'hr', l: 'HR', f: (r) => r.b.hr, v: (r) => r.b.hr },
      { k: 'sb', l: 'SB', f: (r) => r.b.sb, v: (r) => r.b.sb },
      { k: 'ra', l: 'RA/G', f: (r) => f1(T(r.tid).rec.ra / Math.max(1, T(r.tid).rec.w + T(r.tid).rec.l)), v: (r) => -T(r.tid).rec.ra },
      { k: 'era', l: 'ERA', f: (r) => eraS(r.p), v: (r) => -eraN(r.p) },
      { k: 'whip', l: 'WHIP', f: (r) => whipS(r.p), v: (r) => -whipN(r.p) },
      { k: 'so', l: 'K', f: (r) => r.p.so, v: (r) => r.p.so },
      { k: 'phr', l: 'HRA', f: (r) => r.p.hr, v: (r) => -r.p.hr },
    ], ts, { sort: 'w', rowCls: (r) => (r.tid === S.user ? 'me' : '') });
  }
  return h;
};
function teamStats() {
  const acc = S.teams.map((t) => ({ tid: t.tid, b: { pa: 0, ab: 0, h: 0, d: 0, tr: 0, hr: 0, bb: 0, hbp: 0, sf: 0, sb: 0, so: 0 }, p: { outs: 0, er: 0, h: 0, bb: 0, so: 0, hr: 0 } }));
  for (const p of S.players) {
    for (const r of p.s) {
      if (r.y !== S.season || r.po || r.t < 0 || !acc[r.t]) continue;
      const a = acc[r.t];
      if (isP(p)) for (const k of Object.keys(a.p)) a.p[k] += r[k] || 0;
      else for (const k of Object.keys(a.b)) a.b[k] += r[k] || 0;
    }
  }
  return acc;
}

/* ----- trade ----- */
VIEWS.trade = function () {
  const closed = B.tradeOpen();
  if (trade.tid < 0 || trade.tid === S.user) trade.tid = S.user === 0 ? 1 : 0;
  const opts = S.teams.filter((t) => t.tid !== S.user).map((t) => `<option value="${t.tid}" ${t.tid === trade.tid ? 'selected' : ''}>${esc(t.city + ' ' + t.name)}  ${t.rec.w}-${t.rec.l}</option>`).join('');
  const valid = (arr, tid) => { const a = B.tradeAssets(tid).players.map((p) => p.id); return arr.filter((id) => a.includes(id)); };
  trade.give = valid(trade.give, S.user); trade.get = valid(trade.get, trade.tid);
  const strat = T(trade.tid).strat;
  let h = `<div class="row" style="margin-bottom:12px"><select class="sel" id="tradeTeam" aria-label="Team">${opts}</select><span class="lab">${strat === 'contend' ? 'Contending' : strat === 'rebuild' ? 'Rebuilding' : ''}</span><span class="sp"></span>${closed ? `<span class="lab" style="color:var(--brand-hover)">${esc(closed)}</span>` : ''}</div>`;
  h += `<div class="tside"><div><h3>You give</h3>${assetTable('tg', S.user, trade.give)}</div><div><h3>You get</h3>${assetTable('tr', trade.tid, trade.get)}</div></div>`;
  const yr = B.payYear();
  const sal = (ids) => ids.reduce((s, id) => { const p = P(id); return s + (p.c.exp >= yr && !(p.fm && p.c.amt <= B.MINC) ? p.c.amt : 0); }, 0);
  const out = sal(trade.give), inn = sal(trade.get);
  const pu = B.payroll(S.user) - out + inn, pt = B.payroll(trade.tid) + out - inn;
  const ev = trade.give.length + trade.get.length ? B.evalTrade(trade.tid, trade.give, trade.get) : null;
  const ratio = ev && ev.vout > 0 ? Math.max(0, Math.min(2, (ev.vin || 0) / ev.vout)) : 0;
  const act = (ids) => ids.filter((id) => !P(id).fm).length;
  h += `<div class="sum">
    <div class="li"><span class="lab t">Salary out / in</span><span class="num">${M(out)} / ${M(inn)}</span></div>
    <div class="li"><span class="lab t">Your payroll after</span><span class="num" style="color:${pu > T(S.user).budget ? 'var(--brand-hover)' : ''}">${M(pu)} / ${M(T(S.user).budget)}</span></div>
    <div class="li"><span class="lab t">${esc(T(trade.tid).abbr)} payroll after</span><span class="num">${M(pt)} / ${M(T(trade.tid).budget)}</span></div>
    <div class="li"><span class="lab t">Active after</span><span class="num">${B.rosterCount(S.user) - act(trade.give) + act(trade.get)} / ${B.rosterCount(trade.tid) + act(trade.give) - act(trade.get)}</span></div>
    <div class="li"><span class="lab" style="width:90px">Their view</span><div class="meter t" style="margin:0;flex:1"><i style="width:${ratio * 50}%;${ratio >= 1 && ev && ev.ok ? '' : 'background:#fff'}"></i><b style="left:50%"></b></div></div>
  </div>`;
  h += `<div class="btns"><button class="btn" type="button" data-act2="balance" ${closed ? 'disabled' : ''}>What works</button><button class="btn" type="button" data-act2="tclear">Clear</button><button class="btn primary" type="button" data-act2="propose" ${closed || !ev ? 'disabled' : ''}>Propose</button></div>`;
  if (trade.msg) h += `<div class="lab" style="margin-top:12px;color:${trade.ok ? 'var(--text)' : 'var(--brand-hover)'}">${esc(trade.msg)}</div>`;
  else if (ev && !ev.ok && ev.reason !== 'Not enough value') h += `<div class="lab" style="margin-top:12px;color:var(--brand-hover)">${esc(ev.reason)}</div>`;
  return h;
};
function assetTable(id, tid, sel) {
  const rows = B.tradeAssets(tid).players.map((p) => ({ p }));
  const on = (r) => sel.includes(r.p.id);
  return table(id, [
    { k: 'c', l: '', c: 'l', f: (r) => `<span class="ck ${on(r) ? 'on' : ''}"></span>`, ns: 1 },
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + injTag(r.p) + farmTag(r.p), v: (r) => r.p.ln },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => (isP(r.p) ? 10 : 0) + B.BPOS.indexOf(r.p.pos) },
    { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
    { k: 'ovr', l: 'Ovr', f: (r) => rcell(r.p.ovr), v: (r) => r.p.ovr },
    { k: 'pot', l: 'Pot', f: (r) => rcell(r.p.pot), v: (r) => r.p.pot },
    { k: 'sal', l: 'Salary', f: (r) => M(r.p.c.amt), v: (r) => r.p.c.amt },
    { k: 'exp', l: 'Thru', f: (r) => r.p.c.exp, v: (r) => r.p.c.exp },
  ], rows, { sort: 'ovr', click: (r) => `data-tp="${id}:${r.p.id}"`, rowCls: (r) => (on(r) ? 'me' : '') });
}

/* ----- free agents / re-sign ----- */
VIEWS.fa = function () {
  const t = T(S.user);
  const pay = B.payroll(S.user);
  let h = `<div class="cards" style="margin-bottom:16px">${card('Payroll', M(pay), `${B.payYear()} season`)}${card('Budget room', M(Math.max(0, t.budget - pay)), `Budget ${M(t.budget)}`)}${card('Active', B.rosterCount(S.user) + ' / ' + B.ROSTER_MAX, `Min ${B.ROSTER_MIN}`)}${card('Farm', B.farmCount(S.user) + ' / ' + B.FARM_MAX, '')}</div>`;

    const ex = B.expiring(S.user);
    h += `<h3>Expiring</h3>` + table('resign', [

      { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, ns: 1 },
      { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
      { k: 'ovr', l: 'Ovr', f: (r) => rcell(r.p.ovr), v: (r) => r.p.ovr },
      { k: 'pot', l: 'Pot', f: (r) => rcell(r.p.pot), v: (r) => r.p.pot },
      { k: 'cur', l: 'Current', f: (r) => M(r.p.c.amt), v: (r) => r.p.c.amt },
      { k: 'ask', l: 'Ask', f: (r) => M(B.askFor(r.p, S.user, B.prefYears(r.p))), v: (r) => B.askFor(r.p, S.user, B.prefYears(r.p)) },
      { k: 'y', l: 'Yrs', f: (r) => B.prefYears(r.p), ns: 1 },

    ], ex.map((p) => ({ p })), { sort: 'ovr', click: (r) => `data-player="${r.p.id}"` });
  }
  const open = S.phase === 'fa' || S.phase === 'regular';
  h += `<h3>Free agents<span class="sp"></span>${open ? '' : '<span class="lab">Closed</span>'}</h3><div class="row">${seg('fa', [['all', 'All'], ['bat', 'Hitters'], ['pit', 'Pitchers']], sub.fa)}</div>`;
  const fas = S.players.filter((p) => p.tid === -1 && (sub.fa === 'all' || (sub.fa === 'pit') === isP(p)));
  h += table('fa', [
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + injTag(r.p), v: (r) => r.p.ln },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => (isP(r.p) ? 10 : 0) + B.BPOS.indexOf(r.p.pos) },
    { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
    { k: 'ovr', l: 'Ovr', f: (r) => rcell(r.p.ovr), v: (r) => r.p.ovr },
    { k: 'pot', l: 'Pot', f: (r) => rcell(r.p.pot), v: (r) => r.p.pot },
    { k: 'ask', l: 'Ask', f: (r) => M(B.askFor(r.p, S.user, B.prefYears(r.p))), v: (r) => B.askFor(r.p, S.user, B.prefYears(r.p)) },
    { k: 'y', l: 'Yrs', f: (r) => B.prefYears(r.p), v: (r) => B.prefYears(r.p) },
    { k: 'ex', l: 'Last', c: 'l', f: (r) => (r.p.ex != null && r.p.ex >= 0 ? T(r.p.ex).abbr : ''), ns: 1 },
  ], fas.map((p) => ({ p })), { sort: 'ovr', limit: 120, click: (r) => `data-player="${r.p.id}"` });
  return h;
};

/* ----- draft ----- */
VIEWS.draft = function () {
  const inDraft = S.phase === 'draft' && S.draft;
  const y = inDraft ? S.draft.y : S.season;
  let h = `<div class="row" style="margin-bottom:12px">${seg('draft', [['board', 'Prospects'], ['order', 'Order']], sub.draft)}<span class="sp"></span><span class="lab">${y} Draft  Farm ${B.farmCount(S.user)} / ${B.FARM_MAX}</span></div>`;
  const pk = inDraft ? B.onClock() : null;
  if (pk) h += `<div class="list" style="margin-bottom:12px"><div class="li"><span class="lab">On the clock</span><span class="t">#${pk.n}  Round ${pk.rd}  ${esc(tName(pk.tid))}</span>${pk.tid === S.user ? '<span class="tag">You</span>' : ''}</div></div>`;
  if (sub.draft === 'order') {
    let rows;
    if (inDraft) rows = S.draft.order.map((tid, i) => { const m = S.draft.made.find((x) => x.n === i + 1); return { n: i + 1, tid, pid: m ? m.pid : null }; });
    else {
      const proj = S.teams.slice().sort((a, b) => B.wp(a.rec) - B.wp(b.rec) || (a.rec.rs - a.rec.ra) - (b.rec.rs - b.rec.ra));
      rows = proj.map((t, i) => ({ n: i + 1, tid: t.tid, pid: null }));
    }
    h += table('dorder', [
      { k: 'n', l: 'Pick', c: 'l', f: (r) => r.n, ns: 1 },
      { k: 't', l: 'Team', c: 'n', f: (r) => esc(T(r.tid).abbr), ns: 1 },
      { k: 'p', l: 'Player', c: 'l', f: (r) => (r.pid && P(r.pid) ? `<span data-player="${r.pid}" style="cursor:pointer">${esc(name(P(r.pid)))}</span> <span class="dim">${P(r.pid).pos}</span>` : ''), ns: 1 },
    ], rows, { rowCls: (r) => (r.tid === S.user ? 'me' : '') + ((r.n - 1) % B.NT === 0 && r.n > 1 ? ' cut' : '') });
    return h;
  }
  const pros = B.prospects();
  const userOn = pk && pk.tid === S.user;
  const cols = [
    { k: 'rk', l: '#', c: 'l', f: (r) => r.rk, v: (r) => r.rk },
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)), v: (r) => r.p.ln },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => (isP(r.p) ? 10 : 0) + B.BPOS.indexOf(r.p.pos) },
    { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
    { k: 'ovr', l: 'Ovr', f: (r) => rcell(scout(r.p).ovr), v: (r) => scout(r.p).ovr },
    { k: 'pot', l: 'Pot', f: (r) => rcell(scout(r.p).pot), v: (r) => scout(r.p).pot },
    { k: 'r1', l: 'Con/Vel', f: (r) => rcell(isP(r.p) ? r.p.r.vel + r.p.fz : r.p.r.con + r.p.fz), ns: 1 },
    { k: 'r2', l: 'Pow/Ctl', f: (r) => rcell(isP(r.p) ? r.p.r.ctl + r.p.fz : r.p.r.pow + r.p.fz), ns: 1 },
    { k: 'r3', l: 'Eye/Mov', f: (r) => rcell(isP(r.p) ? r.p.r.mov + r.p.fz : r.p.r.eye + r.p.fz), ns: 1 },
    { k: 'r4', l: 'Spd/Sta', f: (r) => rcell(isP(r.p) ? r.p.r.sta + r.p.fz : r.p.r.spd + r.p.fz), ns: 1 },
  ];
  if (userOn) cols.unshift({ k: 'go', l: '', c: 'l', f: (r) => `<button class="btn sm primary" type="button" data-draft="${r.p.id}">Draft</button>`, ns: 1 });
  const ranked = pros.slice().sort((a, b) => (scout(b).pot * 0.62 + scout(b).ovr * 0.38) - (scout(a).pot * 0.62 + scout(a).ovr * 0.38)).map((p, i) => ({ p, rk: i + 1 }));
  h += table('pros', cols, ranked, { sort: 'rk', dir: 1, click: (r) => `data-player="${r.p.id}"` });
  return h;
};

/* ----- finances ----- */
VIEWS.fin = function () {
  const t = T(S.user);
  const pay = B.payroll(S.user);
  const yr = B.payYear();
  const scale = Math.max(t.budget * 1.2, pay * 1.05);
  let h = `<div class="cards">${card('Payroll', M(pay), yr + ' season')}${card('Budget', M(t.budget), pay > t.budget ? 'Over by ' + M(pay - t.budget) : 'Room ' + M(t.budget - pay))}${card('Cash', M(t.cash), '')}${card('Market', t.pop >= 6 ? 'Large' : t.pop >= 3.5 ? 'Mid' : 'Small', '')}</div>`;
  h += `<div class="list" style="padding:14px 12px 10px;margin-top:-1px"><div class="meter" style="height:14px;margin:0"><i style="width:${Math.min(100, pay / scale * 100)}%"></i><b style="left:${t.budget / scale * 100}%"></b></div><div class="row" style="margin-top:8px"><span class="lab">Payroll ${M(pay)}</span><span class="sp"></span><span class="lab">Budget ${M(t.budget)}</span></div></div>`;
  const o = S.owner;
  const ob = (l, v) => `<div class="bar"><span class="lab">${l}</span><div class="meter${v < 0 ? ' w' : ''}"><i style="left:${v < 0 ? (50 + v / 3 * 50) : 50}%;width:${Math.abs(v) / 3 * 50}%"></i><b style="left:50%"></b></div><span>${(v > 0 ? '+' : '') + v.toFixed(1)}</span></div>`;
  h += `<div class="grid2"><div><h3>Owner</h3><div class="list" style="padding:12px"><div class="bars" style="grid-template-columns:1fr;margin:0">${ob('Wins', o.w)}${ob('Playoffs', o.p)}${ob('Finances', o.m)}${ob('Overall', o.w + o.p + o.m)}</div><div class="row" style="margin-top:12px"><span class="lab">Job security</span><span class="sp"></span><span class="num">${Math.round(jobSecurity() * 100)}%</span></div></div></div>`;
  const f = t.fin;
  const rev = f.gate + f.merch + f.tv + f.po, exp = f.sal + f.ops;

function lvTick() {

  if (!LV) return;
  const G = LV.G;
  if (a === 'pause') { LV.run = !LV.run; lvRender(); if (LV.run) lvSchedule(150); return; }
  if (a === 'end') {
    B.playToEnd(G);
    lvRender();
    lvEnd();
    return;
  }
  if (a === 'pit' || a === 'ph') { lvPick(a); return; }
  if (a === 'box') {
    const res = B.result(G);
    const g = { a: G.a, h: G.h, as: res.as, hs: res.hs, ln: res.ln, ae: [res.hits[0], res.err[0]], he: [res.hits[1], res.err[1]], b: res.box, po: G.po };
    openOv(`<div class="shead"><h2>${esc(T(g.a).abbr)} ${g.as}  at  ${esc(T(g.h).abbr)} ${g.hs}</h2>${closeBtn}</div>` + boxHtml(g), true, 'box');
    return;
  }
  if (a === 'done') {
    const home = G.h === S.user;
    const us = home ? G.sc[1] : G.sc[0], them = home ? G.sc[0] : G.sc[1];
    B.liveFinish(G);
    closeLive();
    afterSim();
    toast(`${us > them ? 'W' : 'L'} ${us}-${them} ${home ? 'vs' : 'at'} ${T(home ? G.a : G.h).abbr}`);
  }
}
function closeLive() {
  if (LV) clearTimeout(LV.timer);
  LV = null;
  const el = $('live');
  el.classList.remove('show');
  setTimeout(() => { if (!LV) el.hidden = true; }, 220);
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-player], [data-box], [data-team], [data-series], tr[data-tp], [data-job], th[data-sort], tr[data-pickteam], tr[data-lvpick]');
  if (!el) { if (e.target === $('ov')) closeOv(); return; }
  const d = el.dataset;
  if (d.close !== undefined) { forceClose(); return; }
  if (d.lv) { lvAction(d.lv); return; }
  if (d.lvpick) {
    const [k, id] = d.lvpick.split(':');
    B.liveQueue(LV.G, k === 'pit' ? 'pit' : 'ph', +id);
    LV.run = true;
    forceClose();
    lvRender();
    toast(k === 'pit' ? 'Change before next batter' : 'Hits next');
    return;
  }
  if (d.tab) { tab = d.tab; trade.msg = ''; render(true); return; }
  if (d.act) { act(d.act); return; }
  if (d.sa) { slotAction(d.sa, +d.slot); return; }
  if (d.pickteam) { startNew(+d.pickteam); return; }
  if (d.job) { B.newJob(+d.job); S = B.getState(); forceClose(); tab = 'home'; save(); render(true); return; }
  if (d.sort) {
    const [id, k] = d.sort.split(':');
    const cur = sorts[id];
    sorts[id] = cur && cur.k === k ? { k, d: -cur.d } : { k, d: -1 };
    if (ovOpen && ovKind === 'teams') showTeams(pendingSlot); else if (ovOpen && ovKind === 'team') showTeam(+id.split('-')[1]); else render();
    return;
  }
  if (d.seg) { segChange(d.seg, d.v); return; }
  if (d.tp) {
    const [side, id] = d.tp.split(':');
    const arr = side === 'tg' ? trade.give : trade.get;
    const i = arr.indexOf(+id); if (i >= 0) arr.splice(i, 1); else arr.push(+id);
    trade.msg = '';
    render();
    return;
  }
  if (d.player) { showPlayer(+d.player); return; }
  if (d.box) { showBox(+d.box); return; }
  if (d.team) { showTeam(+d.team); return; }
  if (d.series) { showSeries(+d.series); return; }
  if (d.ord) { B.moveOrder(+d.ord, +d.d); render(); saveSoon(); return; }
  if (d.stf) { B.moveStaff(+d.stf, +d.d); render(); saveSoon(); return; }
  if (d.topen) { B.toPen(+d.topen); render(); saveSoon(); return; }
  if (d.torot) { B.toRotation(+d.torot); render(); saveSoon(); return; }
  if (d.ticket) { const t = T(S.user); t.ticket = Math.max(10, Math.min(150, t.ticket + +d.ticket)); render(); saveSoon(); return; }
  if (d.resign) { offerState = null; showOffer(+d.resign, true); return; }
  if (d.offer) { offerState = null; showOffer(+d.offer, false); return; }
  if (d.promote) { const r = B.promote(+d.promote); if (r) toast(r); else { forceClose(); save(); render(); } return; }
  if (d.demote) { const r = B.demote(+d.demote); if (r) toast(r); else { forceClose(); save(); render(); } return; }
  if (d.release) { const p = P(+d.release); const dead = p.c.exp >= B.payYear() && p.c.amt > B.MINC && !(p.fm && p.c.amt <= B.MINC); confirmBox('Release ' + short(p), dead ? `${M(p.c.amt)} thru ${p.c.exp} stays on payroll` : '', 'Release', 'release:' + p.id); return; }
  if (d.tradefor) { const p = P(+d.tradefor); trade = { tid: p.tid, give: [], get: [p.id], msg: '', ok: null }; forceClose(); tab = 'trade'; render(true); return; }
  if (d.tradeoff) { const p = P(+d.tradeoff); trade.give = [p.id]; trade.msg = ''; forceClose(); tab = 'trade'; render(true); return; }
  if (d.tradeteam) { trade = { tid: +d.tradeteam, give: [], get: [], msg: '', ok: null }; forceClose(); tab = 'trade'; render(true); return; }
  if (d.draft) { B.draftPick(+d.draft); B.draftUntilUser(false); afterSim(); return; }
  if (d.amt) {
    const p = P(offerState.id);
    if (d.amt === 'ask') offerState.amt = B.askFor(p, S.user, offerState.y);
    else if (d.amt === 'min') offerState.amt = B.MINC;
    else offerState.amt = Math.max(B.MINC, Math.min(B.MAXC, offerState.amt + +d.amt));
    offerState.msg = '';
    showOffer(offerState.id);
    return;
  }
  if (d.act2) { act2(d.act2); return; }
  if (el.id === 'menuBtn') { if (!simming && !LV) { save(); showStart(); } return; }
  if (d.lday !== undefined && d.lday !== '') { leagueDay = +d.lday; render(); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'tradeTeam') { trade = { tid: +t.value, give: trade.give, get: [], msg: '', ok: null }; render(); return; }
  if (t.dataset.lpos !== undefined) { B.setPos(+t.dataset.lpos, t.value); render(); saveSoon(); return; }
  if (t.dataset.subin !== undefined && t.value !== '') { B.subIn(+t.value, +t.dataset.subin); render(); saveSoon(); }
});
function segChange(key, v) {
  if (key === 'auto') { B.setAuto(v === '1'); render(); saveSoon(); return; }
  if (key === 'autoP') { B.setAutoP(v === '1'); render(); saveSoon(); return; }
  if (key === 'lvspeed') { if (LV) { LV.speed = v; lvRender(); } return; }
  if (key === 'offy') { offerState.y = +v; offerState.amt = B.askFor(P(offerState.id), S.user, +v); offerState.msg = ''; showOffer(offerState.id); return; }
  sub[key] = v;
  render(true);
}
function act2(a) {
  if (a === 'propose') {
    const ev = B.doTrade(trade.tid, trade.give, trade.get);
    if (ev.ok) { trade.msg = 'Accepted'; trade.ok = true; trade.give = []; trade.get = []; toast('Trade accepted'); save(); }
    else { trade.msg = ev.reason === 'Not enough value' ? 'Rejected' : ev.reason; trade.ok = false; }
    render();
  } else if (a === 'balance') {
    const r = B.balanceTrade(trade.tid, trade.give, trade.get);
    trade.give = r.give;
    trade.msg = r.ok ? 'Balanced' : (r.reason || 'No deal');
    trade.ok = r.ok;
    render();
  } else if (a === 'tclear') { trade.give = []; trade.get = []; trade.msg = ''; render(); }
  else if (a === 'dooffer') {
    const o = offerState;
    const r = B.offer(o.id, o.amt, o.y);
    if (r.ok) { toast('Signed ' + short(P(o.id))); forceClose(); offerState = null; save(); render(); }
    else { o.msg = r.msg; showOffer(o.id); }
  } else if (a === 'doresign') {
    const o = offerState;
    const r = B.resign(o.id, o.y);
    if (r.ok) { toast('Re-signed ' + short(P(o.id))); forceClose(); offerState = null; save(); render(); }
    else { o.msg = r.msg || 'Failed'; showOffer(o.id, true); }
  } else if (a.startsWith('release:')) {
    B.release(+a.split(':')[1]); forceClose(); save(); render();
  }
}
function slotAction(a, n) {
  if (a === 'load') { if (loadSlot(n)) { lastScoredSeason = S.hist.length ? S.hist[S.hist.length - 1].y : 0; forceClose(); tab = 'home'; leagueDay = -1; render(true); if (S.fired) showFired(); } else toast('Save unreadable'); }
  else if (a === 'new') { preview = null; showTeams(n); }
  else if (a === 'del') { if (n === slot) { S = null; slot = 0; } deleteSlot(n); showStart(); }
  else if (a === 'back') { preview = null; if (S) B.setState(S); showStart(); }
  else if (a === 'resume') { forceClose(); render(); }
  else if (a === 'again') { const n2 = slot; preview = null; showTeams(n2); }
  else if (a === 'menu') { save(); showStart(); }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ovOpen) { closeOv(); return; }
  if (ovOpen || !S || e.target.tagName === 'SELECT') return;
  if (LV) {
    if (e.key === ' ') { e.preventDefault(); if (LV.final) lvAction('done'); else lvAction('pause'); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    const b = $('actions').querySelector('.btn.primary:not(:disabled)');
    if (b && document.activeElement && !document.activeElement.closest('main')) { e.preventDefault(); b.click(); }
  }
});
window.addEventListener('pointerdown', () => window.focus());
Vela.onPause((p) => { paused = p; });

/* ---------------- boot ---------------- */
document.fonts.ready.then(() => {
  $('app').classList.add('ready');
  const m = readMeta();
  if (m.last && m.slots[m.last] && loadSlot(m.last)) {
    lastScoredSeason = S.hist.length ? S.hist[S.hist.length - 1].y : 0;
    render(true);
  }
  showStart();
  Vela.ready();
});
})();
</script>
</body>
