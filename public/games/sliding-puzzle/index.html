<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sliding Puzzle</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #000000;
    --bg-2: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --surface-3: #2a2e35;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --gap: 12px;
    --t: 80px;        /* tile size, set from JS */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; }

  /* ---------- layout ---------- */
  .app {
    display: flex; flex-direction: column; align-items: center;
    gap: var(--gap);
    visibility: hidden;
  }
  .app.ready { visibility: visible; }

  .head { display: grid; gap: 0.5em; align-items: stretch; min-width: 0; }
  .app.wide .head {
    grid-template-columns: 1fr auto auto auto auto;
    grid-template-areas: "brand moves time size new";
  }
  .app.narrow .head {
    grid-template-columns: 1fr 1fr auto auto;
    grid-template-areas: "brand brand brand brand" "moves time size new";
  }
  html.vela-embedded .app.narrow .head { grid-template-areas: "moves time size new"; }
  html.vela-embedded .app.narrow .brand { display: none; }

  .brand { grid-area: brand; align-self: center; min-width: 0; padding-right: 0.5em; }
  .brand h1 {
    margin: 0;
    font: 600 1.05em/1 var(--font);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .brand h1::before {
    content: "";
    display: inline-block;
    width: 0.62em; height: 0.62em;
    margin-right: 0.62em;
    background: var(--brand);
    vertical-align: 0.02em;
  }
  .app.narrow .brand { padding: 0.15em 0 0.25em; }

  .st-moves { grid-area: moves; }
  .st-time { grid-area: time; }
  .b-size { grid-area: size; }
  .b-new { grid-area: new; }

  .stat {
    min-width: 5.6em;
    padding: 0.5em 0.85em 0.55em;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .app.narrow .stat { min-width: 0; }
  .lab {
    display: block;
    font: 600 clamp(11px, 0.66em, 12px)/1.2 var(--font);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .num {
    display: block;
    font: 600 1.4em/1.15 var(--font-display);
    font-variant-numeric: tabular-nums;
    margin-top: 0.15em;
    white-space: nowrap;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.6em;
    min-height: 3.3em;
    padding: 0 1.25em;
    border-radius: 0;
    border: 1px solid var(--outline);
    background: transparent;
    font: 600 clamp(11px, 0.76rem, 13px) var(--font);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .btn svg { width: 1.35em; height: 1.35em; flex: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .app.narrow .head .btn { padding: 0 0.9em; }

  /* ---------- board ---------- */
  .stage { display: flex; align-items: center; justify-content: center; }
  .board {
    position: relative;
    background: #000;
    border: 1px solid var(--line);
    touch-action: none;
    outline: none;
    cursor: pointer;
  }
  .tile {
    position: absolute;
    left: 0; top: 0;
    width: var(--t); height: var(--t);
    display: grid; place-items: center;
    background: var(--surface-2);
    border-radius: 2px;
    font: 300 calc(var(--t) * 0.42)/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    transition: transform 150ms var(--ease), background-color 200ms var(--ease);
    will-change: transform;
  }
  .board.n5 .tile { font-size: calc(var(--t) * 0.4); }
  .board.noanim .tile { transition: none; }
  @media (hover: hover) {
    .tile.can:hover { background: var(--surface-3); }
  }
  .tile::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: max(2px, calc(var(--t) * 0.045));
    background: var(--brand);
    transform: scaleX(0);
    transition: transform 200ms var(--ease);
  }
  .tile.home::after { transform: scaleX(1); }
  .tile.done { background: var(--brand); transition: transform 150ms var(--ease), background-color 220ms var(--ease) var(--d, 0ms); }
  .tile.done::after { transform: scaleX(0); }
  .board.solved { cursor: default; }

  /* ---------- overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding: 12px;
    overflow: auto;
    background: rgba(0, 0, 0, 0.7);
    opacity: 0;
    transition: opacity 220ms var(--ease);
  }
  .overlay[hidden] { display: none; }
  .overlay.show { opacity: 1; }
  .card {
    width: min(100%, 23em);
    padding: 1.4em 1.4em 1.3em;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    text-align: left;
    transform: translateY(24px);
    transition: transform 300ms var(--ease);
  }
  .card[hidden] { display: none; }
  .overlay.show .card { transform: none; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75em; min-height: 1.6em; }
  .card h2 {
    margin: 0;
    font: 600 0.95em/1.1 var(--font);
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .card h2::before {
    content: "";
    display: inline-block;
    width: 0.62em; height: 0.62em;
    margin-right: 0.62em;
    background: var(--brand);
    vertical-align: 0.02em;
  }
  .card .tag {
    padding: 0.45em 0.6em;
    border-radius: 2px;
    background: var(--brand);
    color: #fff;
    font: 600 11px/1 var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .card .tag[hidden] { display: none; }
  .card .line { margin: 0.7em 0 0; color: var(--muted); font-size: 0.9em; line-height: 1.45; }
  .group { margin-top: 1.05em; }
  .group .lab { margin-bottom: 0.45em; }
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    border: 1px solid var(--outline);
  }
  .seg button {
    height: 2.9em;
    min-width: 0;
    padding: 0 0.2em;
    border: 0;
    border-radius: 0;
    background: transparent;
    font: 600 clamp(11px, 0.76em, 13px) var(--font);
    letter-spacing: 0.08em; text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    transition: background 150ms var(--ease), color 150ms var(--ease);
  }
  .seg button + button { box-shadow: -1px 0 0 var(--line); }
  .seg button:hover { background: rgba(255, 255, 255, 0.08); }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; box-shadow: none; }
  .seg button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: -3px; }
  .ov-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    margin-top: 1.1em;
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .ov-stats > div { padding: 0.75em 0.85em 0.8em; min-width: 0; }
  .ov-stats > div:nth-child(2n) { border-left: 1px solid var(--line); }
  .ov-stats > div:nth-child(n + 3) { border-top: 1px solid var(--line); }
  .ov-stats .num { font-size: 2em; font-weight: 300; line-height: 1.1; }
  .ov-stats .num.none { font-size: 1.3em; line-height: 1.7; color: var(--muted); }
  .card .btns { display: flex; gap: 0.5em; margin-top: 1.2em; flex-wrap: wrap; }
  .card .btns .btn { flex: 1 1 8em; }
  .card .btns .btn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .tile, .tile::after, .tile.done { transition: none; }
    .overlay, .card { transition: none; }
  }
</style>
</head>
<body>
<div class="app narrow" id="app">
  <header class="head" id="head">
    <div class="brand"><h1>Sliding Puzzle</h1></div>
    <div class="stat st-moves"><span class="lab">Moves</span><span class="num" id="moves">0</span></div>
    <div class="stat st-time"><span class="lab">Time</span><span class="num" id="time">0:00</span></div>
    <button class="btn b-size" id="sizeBtn" type="button" aria-haspopup="dialog">
      <span id="sizeName">4 x 4</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="btn primary b-new" id="newBtn" type="button">New game</button>
  </header>
  <main class="stage" id="stage">
    <div class="board" id="board" role="grid" aria-label="Puzzle"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="menuCard" role="dialog" aria-labelledby="menuTitle" hidden>
    <h2 id="menuTitle">Sliding Puzzle</h2>
    <p class="line">Put the tiles in order. Tap a tile in line with the gap to slide it. Arrow keys and swipes also work.</p>
    <div class="group">
      <span class="lab">Size</span>
      <div class="seg" id="sizeSeg">
        <button type="button" data-v="3">3 x 3</button>
        <button type="button" data-v="4">4 x 4</button>
        <button type="button" data-v="5">5 x 5</button>
      </div>
    </div>
    <div class="ov-stats">
      <div><span class="lab">Best moves</span><span class="num" id="menuBestMoves">0</span></div>
      <div><span class="lab">Best time</span><span class="num" id="menuBestTime">0:00.0</span></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="playBtn" type="button">Play</button>
      <button class="btn" id="resumeBtn" type="button" hidden>Resume</button>
    </div>
  </div>
  <div class="card" id="resultCard" role="dialog" aria-live="polite" hidden>
    <div class="card-top"><h2>You win</h2><span class="tag" id="resTag" hidden>New best</span></div>
    <p class="line" id="resSub">4 x 4</p>
    <div class="ov-stats">
      <div><span class="lab">Moves</span><span class="num" id="resMoves">0</span></div>
      <div><span class="lab">Time</span><span class="num" id="resTime">0:00.0</span></div>
      <div><span class="lab">Best moves</span><span class="num" id="resBestMoves">0</span></div>
      <div><span class="lab">Best time</span><span class="num" id="resBestTime">0:00.0</span></div>
    </div>
    <div class="btns">
      <button class="btn primary" id="againBtn" type="button">Play again</button>
      <button class="btn" id="menuBtn" type="button">Menu</button>
    </div>
  </div>
</div>

<script src="../_shared/bridge.js" data-game="sliding-puzzle"></script>
<script>
(function () {
  'use strict';

  const V = window.Vela || { embedded: false, ready() {}, onPause() {} };

  /* ---------- storage ---------- */
  const SIZES = [3, 4, 5];
  const KEY_SIZE = 'vela:sliding-puzzle:size';
  const KEY_MOVES = 'vela:sliding-puzzle:best-moves:';
  const KEY_TIME = 'vela:sliding-puzzle:best-time:';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
  function readNum(k) { const v = Number(lsGet(k)); return Number.isFinite(v) && v > 0 ? v : 0; }
  function bestMoves(n) { return readNum(KEY_MOVES + n + 'x' + n); }
  function bestTime(n) { return readNum(KEY_TIME + n + 'x' + n); }

  const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
  const sizeText = (n) => n + ' x ' + n;

  function fmtClock(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function fmtTime(ms) { return fmtClock(ms) + '.' + Math.floor((ms % 1000) / 100); }

  /* ===== LOGIC START ===== */
  // a: tile at each cell, 0 is the gap. Solved is 1..N-1 then the gap.
  function isSolved(a) {
    for (let i = 0; i < a.length - 1; i++) if (a[i] !== i + 1) return false;
    return a[a.length - 1] === 0;
  }

  // Standard parity rule. Odd width: inversions even. Even width: inversions
  // plus the gap's row counted from the bottom (1-based) is odd.
  function isSolvable(a, n) {
    let inv = 0;
    for (let i = 0; i < a.length; i++) {
      if (!a[i]) continue;
      for (let j = i + 1; j < a.length; j++) if (a[j] && a[i] > a[j]) inv++;
    }
    if (n % 2 === 1) return inv % 2 === 0;
    const rowFromBottom = n - Math.floor(a.indexOf(0) / n);
    return (inv + rowFromBottom) % 2 === 1;
  }

  // Uniform over solvable positions: shuffle, then fix parity by swapping two
  // tiles. Reject positions that are solved or nearly solved.
  function shuffleTiles(n, rnd) {
    rnd = rnd || Math.random;
    const N = n * n;
    for (;;) {
      const a = [];
      for (let i = 0; i < N; i++) a.push(i);
      for (let i = N - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      if (!isSolvable(a, n)) {
        let p = -1, q = -1;
        for (let i = 0; i < N && q < 0; i++) {
          if (!a[i]) continue;
          if (p < 0) p = i; else q = i;
        }
        const t = a[p]; a[p] = a[q]; a[q] = t;
      }
      let home = 0;
      for (let i = 0; i < N; i++) if (a[i] === i + 1) home++;
      if (!isSolved(a) && home <= Math.floor(N / 3)) return a;
    }
  }

  // Slide every tile between the gap and cell `from` one step toward the gap.
  // Returns the number of tiles moved (0 if `from` is not in line with the gap).
  function slide(a, n, from) {
    const gap = a.indexOf(0);
    if (from === gap || from < 0 || from >= a.length) return 0;
    const fr = Math.floor(from / n), fc = from % n;
    const gr = Math.floor(gap / n), gc = gap % n;
    let step;
    if (fr === gr) step = from > gap ? 1 : -1;
    else if (fc === gc) step = from > gap ? n : -n;
    else return 0;
    let g = gap, moved = 0;
    while (g !== from) {
      const next = g + step;
      a[g] = a[next]; a[next] = 0;
      g = next;
      moved++;
    }
    return moved;
  }

  // The cell whose tile moves in direction (dr, dc) into the gap, or -1.
  function cellToward(a, n, dr, dc) {
    const gap = a.indexOf(0);
    const r = Math.floor(gap / n) - dr, c = gap % n - dc;
    if (r < 0 || r >= n || c < 0 || c >= n) return -1;
    return r * n + c;
  }
  /* ===== LOGIC END ===== */

  /* ---------- DOM ---------- */
  const $ = (id) => document.getElementById(id);
  const app = $('app'), head = $('head'), board = $('board');
  const movesEl = $('moves'), timeEl = $('time');
  const overlay = $('overlay'), menuCard = $('menuCard'), resultCard = $('resultCard');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let n = SIZES.indexOf(Number(lsGet(KEY_SIZE))) >= 0 ? Number(lsGet(KEY_SIZE)) : 4;
  let menuSize = n;
  let tiles = [];         // tile number at each cell
  let tileEls = [];       // element for each tile number
  let moves = 0;
  let status = 'idle';    // idle (not started), ready, playing, won
  let elapsed = 0, startedAt = 0, running = false;
  let paused = false, overlayOpen = false;
  let tileSize = 80, tileGap = 4, boardPad = 4;
  let resultTimer = 0;

  /* ---------- timer ---------- */
  function getElapsed() { return running ? elapsed + (performance.now() - startedAt) : elapsed; }
  function syncTimer() {
    const should = status === 'playing' && !paused && !overlayOpen;
    if (should && !running) { startedAt = performance.now(); running = true; }
    else if (!should && running) { elapsed += performance.now() - startedAt; running = false; }
  }
  let shownClock = '';
  function tick() {
    const t = fmtClock(getElapsed());
    if (t !== shownClock) { timeEl.textContent = t; shownClock = t; }
  }
  setInterval(tick, 200);

  /* ---------- board ---------- */
  function buildBoard() {
    board.textContent = '';
    board.className = 'board n' + n;
    tileEls = [];
    const frag = document.createDocumentFragment();
    for (let v = 1; v < n * n; v++) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.textContent = v;
      el.dataset.v = v;
      tileEls[v] = el;
      frag.appendChild(el);
    }
    board.appendChild(frag);
  }

  function place(noAnim) {
    if (noAnim) board.classList.add('noanim');
    const gap = tiles.indexOf(0);
    const gr = Math.floor(gap / n), gc = gap % n;
    for (let i = 0; i < tiles.length; i++) {
      const v = tiles[i];
      if (!v) continue;
      const el = tileEls[v];
      const r = Math.floor(i / n), c = i % n;
      const x = boardPad + c * (tileSize + tileGap), y = boardPad + r * (tileSize + tileGap);
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      el.dataset.i = i;
      el.classList.toggle('home', v === i + 1 && status !== 'won');
      el.classList.toggle('can', status !== 'won' && (r === gr || c === gc));
    }
    if (noAnim) { void board.offsetWidth; board.classList.remove('noanim'); }
  }

  function updateHud() {
    movesEl.textContent = moves;
    $('sizeName').textContent = sizeText(n);
  }

  /* ---------- game flow ---------- */
  function newGame(size) {
    clearTimeout(resultTimer); resultTimer = 0;
    if (size) { n = size; lsSet(KEY_SIZE, String(n)); }
    tiles = shuffleTiles(n);
    moves = 0;
    status = 'ready';
    elapsed = 0; running = false; shownClock = '';
    buildBoard();
    hideOverlay();
    layout();
    place(true);
    updateHud();
    tick();
  }

  function doSlide(from) {
    if (status !== 'ready' && status !== 'playing') return;
    if (overlayOpen) return;
    const moved = slide(tiles, n, from);
    if (!moved) return;
    if (status === 'ready') status = 'playing';
    if (paused) paused = false;
    syncTimer();
    moves += moved;
    place(false);
    updateHud();
    if (isSolved(tiles)) win();
  }

  function win() {
    status = 'won';
    syncTimer();
    const t = Math.max(1, Math.round(getElapsed()));
    elapsed = t;
    tick();
    board.classList.add('solved');
    place(false);
    for (let i = 0; i < tiles.length; i++) {
      const v = tiles[i];
      if (!v) continue;
      const el = tileEls[v];
      el.style.setProperty('--d', (reduceMotion ? 0 : (Math.floor(i / n) + i % n) * 45) + 'ms');
      el.classList.add('done');
    }
    const pm = bestMoves(n), pt = bestTime(n);
    const newMoves = !pm || moves < pm, newTime = !pt || t < pt;
    if (newMoves) lsSet(KEY_MOVES + n + 'x' + n, String(moves));
    if (newTime) lsSet(KEY_TIME + n + 'x' + n, String(t));
    resultTimer = setTimeout(() => showResult(t, newMoves || newTime), reduceMotion ? 300 : 900);
  }

  /* ---------- overlay ---------- */
  function openOverlay(card) {
    menuCard.hidden = card !== menuCard;
    resultCard.hidden = card !== resultCard;
    overlayOpen = true;
    syncTimer();
    overlay.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));
  }
  function hideOverlay() {
    overlayOpen = false;
    overlay.classList.remove('show');
    overlay.hidden = true;
    syncTimer();
  }

  function setNum(el, v, text) {
    el.textContent = v ? text : 'None';
    el.classList.toggle('none', !v);
  }

  function showResult(t, isBest) {
    resultTimer = 0;
    $('resTag').hidden = !isBest;
    $('resSub').textContent = sizeText(n);
    $('resMoves').textContent = moves;
    $('resTime').textContent = fmtTime(t);
    const bm = bestMoves(n), bt = bestTime(n);
    setNum($('resBestMoves'), bm, String(bm));
    setNum($('resBestTime'), bt, fmtTime(bt));
    openOverlay(resultCard);
    setTimeout(() => { try { $('againBtn').focus({ preventScroll: true }); } catch (_) {} }, 60);
  }

  function renderMenu() {
    $('sizeSeg').querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', Number(b.dataset.v) === menuSize ? 'true' : 'false');
    });
    const bm = bestMoves(menuSize), bt = bestTime(menuSize);
    setNum($('menuBestMoves'), bm, String(bm));
    setNum($('menuBestTime'), bt, fmtTime(bt));
    const canResume = (status === 'ready' || status === 'playing') && menuSize === n && tiles.length > 0;
    $('resumeBtn').hidden = !canResume;
  }

  function openMenu() {
    clearTimeout(resultTimer); resultTimer = 0;
    menuSize = n;
    renderMenu();
    openOverlay(menuCard);
    setTimeout(() => {
      try { $('playBtn').focus({ preventScroll: true }); } catch (_) {}
    }, 60);
  }

  $('sizeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    menuSize = Number(b.dataset.v);
    renderMenu();
  });
  $('playBtn').addEventListener('click', () => newGame(menuSize));
  $('resumeBtn').addEventListener('click', hideOverlay);
  $('againBtn').addEventListener('click', () => newGame(n));
  $('menuBtn').addEventListener('click', openMenu);
  $('sizeBtn').addEventListener('click', openMenu);
  $('newBtn').addEventListener('click', () => newGame(n));
  overlay.addEventListener('pointerdown', (e) => {
    if (e.target === overlay && !menuCard.hidden && !$('resumeBtn').hidden) hideOverlay();
  });

  /* ---------- layout ---------- */
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const m = Math.min(vw, vh);
    const pad = Math.round(clamp(8, m * 0.03, 24));
    const gap = Math.round(clamp(8, m * 0.022, 14));
    const fs = clamp(12, m / 42, 16);
    document.documentElement.style.fontSize = fs + 'px';
    app.style.padding = pad + 'px';
    app.style.setProperty('--gap', gap + 'px');
    const availW = vw - 2 * pad;

    function boardFor(headH) {
      const availH = vh - 2 * pad - headH - gap;
      return Math.max(120, Math.floor(Math.min(availW, availH, 640)));
    }
    function trial(narrow) {
      app.classList.toggle('narrow', narrow);
      app.classList.toggle('wide', !narrow);
      head.style.width = availW + 'px';
      let S = boardFor(head.offsetHeight);
      const hw = Math.min(availW, Math.max(S, 320));
      head.style.width = hw + 'px';
      S = boardFor(head.offsetHeight);
      return { S, hw };
    }
    app.classList.add('wide'); app.classList.remove('narrow');
    head.style.width = 'max-content';
    const wideNeed = head.offsetWidth;
    let r = trial(false);
    if (wideNeed > r.hw) r = trial(true);

    // Whole-pixel tiles so numbers stay crisp.
    const S = r.S;
    tileGap = Math.max(2, Math.round(S / n * 0.045));
    boardPad = tileGap;
    tileSize = Math.floor((S - 2 - 2 * boardPad - (n - 1) * tileGap) / n);
    const inner = 2 * boardPad + n * tileSize + (n - 1) * tileGap;
    board.style.width = (inner + 2) + 'px';
    board.style.height = (inner + 2) + 'px';
    board.style.setProperty('--t', tileSize + 'px');
    head.style.width = Math.min(availW, Math.max(inner + 2, 320)) + 'px';
    if (tiles.length) place(true);
  }

  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout).catch(() => {});

  /* ---------- pointer input ---------- */
  // Tap a tile in line with the gap to slide it and everything between.
  // Swipe on a tile toward the gap does the same; a swipe anywhere else moves
  // the one tile next to the gap in that direction.
  let ptr = null;
  function cellFromEvent(e) {
    const el = e.target && e.target.closest ? e.target.closest('.tile') : null;
    return el && board.contains(el) ? Number(el.dataset.i) : -1;
  }

  board.addEventListener('pointerdown', (e) => {
    window.focus();
    if (paused) { paused = false; syncTimer(); }
    if (overlayOpen) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (ptr) { ptr = null; return; }
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, cell: cellFromEvent(e) };
    e.preventDefault();
  });
  window.addEventListener('pointerup', (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const p = ptr;
    ptr = null;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    const thresh = Math.max(14, tileSize * 0.22);
    if (dx * dx + dy * dy < thresh * thresh) {
      if (p.cell >= 0) doSlide(p.cell);
      return;
    }
    let dr = 0, dc = 0;
    if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1; else dr = dy > 0 ? 1 : -1;
    if (p.cell >= 0) {
      const gap = tiles.indexOf(0);
      const sr = Math.floor(p.cell / n), sc = p.cell % n;
      const gr = Math.floor(gap / n), gc = gap % n;
      const toward = (dr === 0 && sr === gr && Math.sign(gc - sc) === dc) ||
                     (dc === 0 && sc === gc && Math.sign(gr - sr) === dr);
      if (toward) { doSlide(p.cell); return; }
    }
    const c = cellToward(tiles, n, dr, dc);
    if (c >= 0) doSlide(c);
  });
  window.addEventListener('pointercancel', (e) => { if (ptr && e.pointerId === ptr.id) ptr = null; });
  board.addEventListener('contextmenu', (e) => e.preventDefault());
  board.addEventListener('dragstart', (e) => e.preventDefault());

  // No page scroll, rubber-banding or pull to refresh.
  document.addEventListener('touchmove', (e) => {
    if (overlayOpen && overlay.contains(e.target)) return;
    e.preventDefault();
  }, { passive: false });

  /* ---------- keyboard ---------- */
  // Arrow keys move a tile in that direction into the gap.
  const DIRS = {
    ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0],
    a: [0, -1], d: [0, 1], w: [-1, 0], s: [1, 0], A: [0, -1], D: [0, 1], W: [-1, 0], S: [1, 0],
  };
  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (overlayOpen) {
      if (e.key === 'Escape' && !menuCard.hidden && !$('resumeBtn').hidden) { e.preventDefault(); hideOverlay(); }
      return;
    }
    if (paused) { paused = false; syncTimer(); }
    const d = DIRS[e.key];
    if (d) {
      e.preventDefault();
      const c = cellToward(tiles, n, d[0], d[1]);
      if (c >= 0) doSlide(c);
      return;
    }
    if ((e.key === 'n' || e.key === 'N') && !e.repeat) { newGame(n); return; }
    if (e.key === 'Escape') { e.preventDefault(); openMenu(); }
  });

  V.onPause((p) => { paused = !!p; syncTimer(); ptr = null; });

  /* ---------- boot ---------- */
  status = 'idle';
  layout();
  updateHud();
  // Show a solved board behind the start menu until a game starts.
  tiles = [];
  for (let i = 1; i < n * n; i++) tiles.push(i);
  tiles.push(0);
  buildBoard();
  place(true);
  status = 'idle';
  app.classList.add('ready');
  openMenu();
  V.ready();
})();
</script>
</body>
</html>
