<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Falling Blocks</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #000;
    --board-bg: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #fff;
    --muted: rgba(255, 255, 255, 0.6);
    --brand: #ea5426;
    --brand-h: #ff7a4d;
    --brand-d: #b83f19;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --pp: 8px;            /* panel padding, set from JS */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font, "Segoe UI", system-ui, sans-serif);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  button { font: inherit; color: inherit; }

  /* ---------- layout (grid set from JS) ---------- */
  #app { display: grid; visibility: hidden; align-items: start; }
  #app.ready { visibility: visible; }
  #left, #right { display: flex; flex-direction: column; gap: var(--gap, 10px); min-width: 0; }
  #left { grid-area: left; }
  #right { grid-area: right; }
  #boardCell { grid-area: board; }
  #pad { grid-area: pad; }

  .title {
    margin: 0;
    font: 600 0.95em/1.4 var(--font);
    letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap;
  }
  #app.wide .title { display: flex; align-items: flex-start; font-size: 0.85em; letter-spacing: 0.14em; white-space: normal; }
  #app.wide .title::before { flex: none; margin-top: 0.4em; }
  .title::before {
    content: ""; display: inline-block;
    width: 0.62em; height: 0.62em; margin-right: 0.62em;
    background: var(--brand); vertical-align: 0.02em;
  }

  .lab {
    display: block;
    font: 600 clamp(11px, 0.72em, 12px)/1.2 var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .panel {
    display: block; width: 100%;
    padding: var(--pp);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    text-align: left;
  }
  .panel canvas { display: block; margin-top: calc(var(--pp) * 0.7); }
  button.panel { cursor: pointer; transition: border-color 150ms var(--ease), background-color 150ms var(--ease); }
  button.panel:hover { border-color: rgba(255, 255, 255, 0.3); }
  button.panel:active { background: var(--surface-2); }
  button.panel:focus-visible, .btn:focus-visible, .pb:focus-visible { outline: 1px solid var(--brand-h); outline-offset: 2px; }

  #stats { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 2px; }
  .stat { position: relative; padding: calc(var(--pp) * 0.75) var(--pp); }
  .stat + .stat { border-top: 1px solid var(--line); }
  .num {
    display: block;
    font: 600 1.25em/1.15 var(--font-display, var(--font));
    font-variant-numeric: tabular-nums;
    margin-top: 0.12em;
    white-space: nowrap;
  }
  #app.wide .num { font-size: 1.9em; font-weight: 300; }
  .num.bump { animation: bump 300ms var(--ease); }
  @keyframes bump { 0% { color: var(--brand-h); } 100% { color: var(--text); } }
  .plus {
    position: absolute; right: var(--pp); top: calc(var(--pp) * 0.6);
    font: 600 0.75em var(--font);
    color: var(--brand-h);
    pointer-events: none;
    animation: rise 650ms cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  @keyframes rise { from { opacity: 1; transform: translateY(0.4em); } to { opacity: 0; transform: translateY(-1.2em); } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.55em;
    height: 2.9em; padding: 0 1.1em;
    border-radius: 0; border: 1px solid var(--outline); background: transparent;
    font: 600 clamp(11px, 0.74em, 13px) var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; white-space: nowrap;
    transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-h); border-color: var(--brand-h); }
  .btn.primary:active { background: var(--brand-d); border-color: var(--brand-d); }
  .btn svg { width: 1.2em; height: 1.2em; flex: none; }
  #pauseBtn { width: 100%; background: var(--surface); border-color: var(--line); }
  #pauseBtn:hover { border-color: rgba(255, 255, 255, 0.3); }

  /* ---------- board ---------- */
  #board {
    position: relative;
    background: var(--board-bg);
    box-shadow: 0 0 0 1px var(--line);
    border-radius: 0;
    touch-action: none;
    outline: none;
  }
  #cv { display: block; }
  /* stepped so the board only sits on whole pixels and the canvas stays crisp */
  #board.hit { animation: hit 180ms step-end; }
  @keyframes hit {
    25% { transform: translate(0, 3px); }
    55% { transform: translate(-1px, -1px); }
    80% { transform: translate(1px, 0); }
  }

  #pops {
    position: absolute; left: 0; right: 0; top: 26%;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none; z-index: 2;
  }
  .pop {
    padding: 0.4em 0.7em;
    background: #000; border: 1px solid var(--line);
    font: 600 clamp(11px, 0.72em, 12px)/1 var(--font);
    letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap;
    animation: pop 1000ms var(--ease) forwards;
  }
  .pop.lines { background: var(--brand); border-color: var(--brand); }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(6px); }
    15% { opacity: 1; transform: none; }
    75% { opacity: 1; transform: none; }
    100% { opacity: 0; transform: translateY(-6px); }
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; padding: 8px;
    background: rgba(0, 0, 0, 0.8);
    visibility: hidden; opacity: 0; pointer-events: none;
    transition: opacity 200ms var(--ease), visibility 0s linear 200ms;
  }
  .overlay.show { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity 200ms var(--ease); }
  .card {
    width: 100%; max-width: 17em; text-align: center;
    background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--brand);
    border-radius: 0;
    padding: 1.3em 1.1em 1.2em;
    transform: translateY(12px);
    transition: transform 300ms var(--ease);
  }
  .overlay.show .card { transform: none; }
  .name {
    font-weight: 700; font-size: 1.15em; line-height: 1.25;
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .line { margin: 0.9em 0 0; font-size: 0.86em; line-height: 1.5; color: var(--muted); }
  .card .btn { margin-top: 1.1em; min-width: 9em; }
  .card .btns { display: flex; flex-direction: column; gap: 0.5em; margin-top: 1.1em; }
  .card .btns .btn { margin-top: 0; width: 100%; }
  .go-score {
    margin-top: 0.3em;
    font: 300 2.6em/1.05 var(--font-display, var(--font));
    font-variant-numeric: tabular-nums;
  }
  .go-best { margin-top: 0.8em; }
  .go-best .v { color: var(--text); margin-left: 0.5em; font-variant-numeric: tabular-nums; }
  .tag {
    display: none; margin: 0.7em auto 0; width: max-content;
    padding: 0.45em 0.6em; background: var(--brand); color: #fff;
    font: 600 0.62em/1 var(--font); letter-spacing: 0.16em; text-transform: uppercase;
  }
  .tag.show { display: block; }

  /* ---------- touch buttons ---------- */
  #pad { display: none; gap: 4px; }
  html.touch #pad { display: flex; }
  .pb {
    flex: 1 1 0; min-width: 0;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 2px;
    color: rgba(255, 255, 255, 0.8);
    touch-action: none; cursor: pointer; padding: 0;
    font: 600 11px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase;
    transition: background-color 120ms var(--ease), border-color 120ms var(--ease);
  }
  .pb svg { width: 22px; height: 22px; display: block; }
  .pb.flip svg { transform: scaleX(-1); }
  .pb.down { background: var(--brand); border-color: var(--brand); color: #fff; transition: none; }
  .pb.sep { margin-left: 6px; }

  html.touch .keys-only { display: none !important; }
  html:not(.touch) .touch-only { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    #board.hit { animation: none; }
    .pop { animation-name: popfade; }
    @keyframes popfade { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
    .card { transform: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <h1 class="title" id="title">Falling Blocks</h1>
    <div id="stats">
      <div class="stat" id="scoreBox"><span class="lab">Score</span><span class="num" id="score">0</span></div>
      <div class="stat"><span class="lab">Level</span><span class="num" id="level">1</span></div>
      <div class="stat"><span class="lab">Lines</span><span class="num" id="lines">0</span></div>
    </div>
  </div>

  <div id="boardCell">
    <div id="board" tabindex="-1" aria-label="Game board">
      <canvas id="cv"></canvas>
      <div id="pops" aria-live="polite"></div>

      <div class="overlay show" id="startOv">
        <div class="card">
          <div class="name">Falling Blocks</div>
          <p class="line keys-only">Arrows move, Up rotates, Space drops, C holds, P pauses.</p>
          <p class="line touch-only">Drag to move, tap to rotate, swipe down to drop.</p>
          <button class="btn primary" id="playBtn" type="button">Play</button>
        </div>
      </div>

      <div class="overlay" id="pauseOv">
        <div class="card">
          <div class="lab">Paused</div>
          <div class="btns">
            <button class="btn primary" id="resumeBtn" type="button">Resume</button>
            <button class="btn" id="restartBtn" type="button">New game</button>
          </div>
        </div>
      </div>

      <div class="overlay" id="overOv">
        <div class="card" role="dialog" aria-live="polite">
          <div class="lab">Game over</div>
          <div class="go-score" id="goScore">0</div>
          <div class="tag" id="goNew">New best</div>
          <div class="lab go-best">Best<span class="v" id="goBest">0</span></div>
          <button class="btn primary" id="againBtn" type="button">Play again</button>
        </div>
      </div>
    </div>
  </div>

  <div id="right">
    <button class="panel" id="holdBox" type="button" aria-label="Hold piece"><span class="lab">Hold</span><canvas id="holdCv"></canvas></button>
    <div class="panel" id="nextBox"><span class="lab">Next</span><canvas id="nextCv"></canvas></div>
    <button class="btn" id="pauseBtn" type="button" aria-label="Pause">
      <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="2" width="3" height="10" fill="currentColor"/><rect x="8.5" y="2" width="3" height="10" fill="currentColor"/></svg>
      <span>Pause</span>
    </button>
  </div>

  <div id="pad" aria-hidden="true">
    <button class="pb" data-act="left" type="button" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M15 5L8 12L15 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg></button>
    <button class="pb" data-act="down" type="button" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M5 9L12 16L19 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg></button>
    <button class="pb" data-act="right" type="button" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M9 5L16 12L9 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg></button>
    <button class="pb sep" data-act="hold" type="button" tabindex="-1">Hold</button>
    <button class="pb sep flip" data-act="ccw" type="button" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 19A7 7 0 1 1 19 12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 9L19 12.5L22.5 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg></button>
    <button class="pb" data-act="cw" type="button" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 19A7 7 0 1 1 19 12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 9L19 12.5L22.5 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg></button>
    <button class="pb" data-act="hard" type="button" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M6 5L12 11L18 5M6 11L12 17L18 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/><path d="M5 20.5H19" stroke="currentColor" stroke-width="2.2"/></svg></button>
  </div>
</div>

<script src="../_shared/bridge.js" data-game="falling-blocks"></script>
<script>
(function () {
  'use strict';

  const V = window.Vela || {
    embedded: window.parent !== window,
    ready() {}, score() {}, gameOver() { return false; }, best() { return 0; }, onPause() {},
  };

  /* ===== LOGIC START (pure, no DOM) ===== */
  const W = 10;            // columns
  const H = 40;            // total rows, 20 hidden above the field
  const VIS = 20;          // visible rows
  const TOP = H - VIS;     // first visible row index
  const TYPES = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];

  // Spawn orientation inside its bounding box (x right, y down).
  const BASE = {
    I: [4, [[0, 1], [1, 1], [2, 1], [3, 1]]],
    J: [3, [[0, 0], [0, 1], [1, 1], [2, 1]]],
    L: [3, [[2, 0], [0, 1], [1, 1], [2, 1]]],
    O: [2, [[0, 0], [1, 0], [0, 1], [1, 1]]],
    S: [3, [[1, 0], [2, 0], [0, 1], [1, 1]]],
    T: [3, [[1, 0], [0, 1], [1, 1], [2, 1]]],
    Z: [3, [[0, 0], [1, 0], [1, 1], [2, 1]]],
  };

  // SHAPES[type][rot]: rot 0 spawn, 1 right (clockwise), 2 upside down, 3 left.
  // SRS rotation is plain rotation inside the bounding box.
  const SHAPES = {};
  TYPES.forEach((t) => {
    const n = BASE[t][0];
    const rots = [BASE[t][1]];
    for (let r = 1; r < 4; r++) rots.push(rots[r - 1].map(([x, y]) => [n - 1 - y, x]));
    SHAPES[t] = rots;
  });

  // SRS wall kicks, written as in the guideline (x right, y UP). Converted on use.
  const KICKS = {
    '01': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '10': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '12': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '21': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '23': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    '32': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '30': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '03': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  };
  const KICKS_I = {
    '01': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '10': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '12': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    '21': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '23': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '32': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '30': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '03': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  };

  function emptyRow() { return new Array(W).fill(0); }
  function emptyBoard() { const b = []; for (let y = 0; y < H; y++) b.push(emptyRow()); return b; }

  function collides(board, type, rot, x, y) {
    const s = SHAPES[type][rot];
    for (let i = 0; i < 4; i++) {
      const cx = x + s[i][0], cy = y + s[i][1];
      if (cx < 0 || cx >= W || cy < 0 || cy >= H) return true;
      if (board[cy][cx]) return true;
    }
    return false;
  }

  // dir +1 clockwise, -1 counter-clockwise. Returns the moved piece (with the
  // kick test index used) or null when every test fails.
  function tryRotate(board, p, dir) {
    const to = (p.rot + dir + 4) % 4;
    const tests = p.type === 'O' ? [[0, 0]] : (p.type === 'I' ? KICKS_I : KICKS)['' + p.rot + to];
    for (let i = 0; i < tests.length; i++) {
      const nx = p.x + tests[i][0], ny = p.y - tests[i][1];
      if (!collides(board, p.type, to, nx, ny)) return { type: p.type, rot: to, x: nx, y: ny, kick: i };
    }
    return null;
  }

  function fullRows(board) {
    const rows = [];
    for (let y = 0; y < H; y++) if (board[y].every((v) => v)) rows.push(y);
    return rows;
  }

  function clearRows(board, rows) {
    const keep = board.filter((_, y) => rows.indexOf(y) < 0);
    while (keep.length < H) keep.unshift(emptyRow());
    return keep;
  }

  function makeBag(rand) {
    let bag = [];
    return function next() {
      if (!bag.length) {
        bag = TYPES.slice();
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
        }
      }
      return bag.pop();
    };
  }

  // Guideline gravity: seconds per row.
  function gravityFor(level) {
    const l = Math.min(level, 20) - 1;
    return Math.pow(0.8 - l * 0.007, l);
  }

  const LINE_POINTS = [0, 100, 300, 500, 800];
  // st = { b2b: last clear was 4 lines, combo: -1 when no chain }
  function scoreClear(n, level, st) {
    if (!n) return { points: 0, b2b: st.b2b, combo: -1, labels: [] };
    const hard = n === 4;
    let points = LINE_POINTS[n] * level;
    const labels = [n === 1 ? '1 line' : n + ' lines'];
    if (hard && st.b2b) { points = Math.floor(points * 1.5); labels.push('Back to back'); }
    const combo = st.combo + 1;
    if (combo > 0) { points += 50 * combo * level; labels.push('Combo ' + combo); }
    return { points, b2b: hard, combo, labels };
  }

  function spawnPiece(type) {
    return { type, rot: 0, x: type === 'O' ? 4 : 3, y: type === 'I' ? TOP - 1 : TOP };
  }

  function dropDistance(board, p) {
    let d = 0;
    while (!collides(board, p.type, p.rot, p.x, p.y + d + 1)) d++;
    return d;
  }
  /* ===== LOGIC END ===== */

  /* ---------- config ---------- */
  const STEP = 1 / 120;          // fixed logic step, seconds
  const DAS = 0.17;
  const ARR = 0.05;
  const LOCK_DELAY = 0.5;
  const MAX_RESETS = 15;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CLEAR_T = reduceMotion ? 0.12 : 0.24;
  const QUEUE_LEN = 5;

  // Seven flat shades from the orange, white and grey family.
  const COLORS = {
    I: '#ffffff', O: '#c9cbd1', T: '#ea5426', S: '#ff7a4d', Z: '#b83f19', J: '#8a8f99', L: '#ffb08f',
  };
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  const EDGE = {};
  TYPES.forEach((t) => { EDGE[t] = shade(COLORS[t], 0.68); });
  const DEAD = '#3a3d44', DEAD_EDGE = '#2a2c31';
  const EMPTY = '#121418';
  const BOARD_BG = '#0b0c0f';

  /* ---------- DOM ---------- */
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const app = $('app'), leftCol = $('left'), rightCol = $('right');
  const boardEl = $('board'), cv = $('cv'), bctx = cv.getContext('2d');
  const holdBox = $('holdBox'), holdCv = $('holdCv'), hctx = holdCv.getContext('2d');
  const nextBox = $('nextBox'), nextCv = $('nextCv'), nctx = nextCv.getContext('2d');
  const statsEl = $('stats'), pauseBtn = $('pauseBtn'), titleEl = $('title'), pad = $('pad');
  const scoreEl = $('score'), levelEl = $('level'), linesEl = $('lines'), scoreBox = $('scoreBox');
  const popsEl = $('pops');
  const startOv = $('startOv'), pauseOv = $('pauseOv'), overOv = $('overOv');

  /* ---------- state ---------- */
  let board = emptyBoard();
  let piece = null;
  let holdType = null, holdUsed = false;
  let queue = [];
  let nextFromBag = makeBag(Math.random);
  let score = 0, level = 1, lines = 0, b2b = false, combo = -1;
  let state = 'start';          // start | play | paused | over
  let phase = 'piece';          // piece | clear
  let clearing = null, clearT = 0;
  let gravAcc = 0, lockTimer = 0, lockResets = 0, lowestY = 0;
  let actions = [];
  const held = { left: false, right: false };
  let softKey = false, softPad = false;
  let dasDir = null, dasT = 0, arrT = 0;
  let sideDirty = true;

    };
    b.addEventListener('pointerdown', press);
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('lostpointercapture', release);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  holdBox.addEventListener('click', () => { holdBox.blur(); if (state === 'play') actions.push('hold'); });
  pauseBtn.addEventListener('click', () => { pauseBtn.blur(); if (state === 'play' || state === 'paused') togglePause(); });
  $('playBtn').addEventListener('click', start);
  $('resumeBtn').addEventListener('click', resume);
  $('restartBtn').addEventListener('click', () => { start(); });
  $('againBtn').addEventListener('click', start);

  // No page scroll, pull to refresh or double-tap zoom.
  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', (e) => { e.preventDefault(); });
  document.addEventListener('pointerdown', (e) => {
    window.focus();
    if (e.pointerType === 'touch') markTouch();
  }, true);

  // The arcade pausing us freezes the run; the player resumes when ready.
  V.onPause((p) => { if (p) pause(); });

  /* ---------- main loop ---------- */
  let lastT = 0, acc = 0;
  function frame(t) {
    let dt = lastT ? (t - lastT) / 1000 : 0;
    lastT = t;
    if (dt > 0.25) dt = 0.25;
    if (dt < 0) dt = 0;
    if ((window.devicePixelRatio || 1) !== geo.dpr) layout();
    if (state === 'play') {
      acc += dt;
      while (acc >= STEP && state === 'play') { acc -= STEP; tick(STEP); }
    }
    renderBoard();
    if (sideDirty) renderSide();
    requestAnimationFrame(frame);
  }

  /* ---------- boot ---------- */
  if (window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches) root.classList.add('touch');
  reset();
  layout();
  app.classList.add('ready');
  requestAnimationFrame(frame);
  V.ready();
})();
</script>
</body>
</html>
