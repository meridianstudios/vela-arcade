<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Chess</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --faint: rgba(255, 255, 255, 0.35);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --light: #2a2d33;
    --dark: #16181c;
    --ink: #0b0c0f;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --S: 360px;
    --q: 45px;
    --side: 280px;
    --g: 8px;
    --move-ms: 200ms;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- layout ---------- */
  .game { display: grid; visibility: hidden; }
  .game.ready { visibility: visible; }
  .game.col { grid-template-columns: var(--S); row-gap: var(--g); }
  .game.row { grid-template-columns: var(--S) var(--side); column-gap: calc(var(--g) * 2.5); align-items: stretch; }
  .bcol { display: grid; grid-template-columns: var(--S); row-gap: var(--g); }

  /* ---------- player bars ---------- */
  .pbar {
    display: flex; align-items: center; gap: 0.6em;
    height: 2.4em; min-width: 0;
    color: var(--muted);
    transition: color 180ms var(--ease);
  }
  .pbar.on { color: var(--text); }
  .chip { width: 0.8em; height: 0.8em; flex: none; border: 1px solid var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .chip.w { background: #fff; }
  .chip.b { background: var(--brand); }
  .pname { font-weight: 600; font-size: 0.92em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .pname small { font-weight: 400; color: var(--muted); margin-left: 0.5em; font-size: 0.9em; }
  .caps { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; overflow: hidden; height: 100%; }
  .caps svg { width: 1.25em; height: 1.25em; flex: none; margin-right: -0.4em; }
  .caps .grp { display: flex; margin-right: 0.55em; }
  .caps .adv { font-size: 0.78em; font-weight: 600; color: var(--muted); margin-left: 0.3em; }
  .clock {
    flex: none; min-width: 4.4em; height: 100%;
    display: grid; place-items: center;
    padding: 0 0.6em;
    background: var(--surface); border: 1px solid var(--line);
    font: 600 1.05em/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .pbar.on .clock { background: var(--brand); border-color: var(--brand); color: #fff; }
  .pbar.on .clock.low { background: #fff; border-color: #fff; color: var(--ink); }
  .away { flex: none; font: 600 0.66em/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--brand-hover); }

  /* ---------- board ---------- */
  .board {
    position: relative;
    width: var(--S); height: var(--S);
    box-shadow: 0 0 0 1px var(--line);
    touch-action: none;
    outline: none;
  }
  .squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; background: var(--dark); }
  .sq.l { background: var(--light); }
  .sq::before { content: ""; position: absolute; inset: 0; background: var(--brand); opacity: 0; }
  .sq.last::before { opacity: 0.2; }
  .sq.sel::before { opacity: 0.38; }
  .sq.hover::before { opacity: 0.3; }
  .sq.check::before { opacity: 0.6; }
  .sq.check { box-shadow: inset 0 0 0 2px var(--brand-hover); }
  .sq .dot {
    position: absolute; left: 50%; top: 50%;
    width: 24%; height: 24%;
    transform: translate(-50%, -50%);
    background: var(--brand); opacity: 0.7;
  }
  .sq .ring { position: absolute; inset: 0; box-shadow: inset 0 0 0 calc(var(--q) * 0.07) var(--brand); opacity: 0.75; }
  .co {
    position: absolute; z-index: 1;
    font: 600 max(9px, calc(var(--q) * 0.2))/1 var(--font);
    color: var(--faint);
    pointer-events: none;
  }
  .co.r { left: 0.22em; top: 0.25em; }
  .co.f { right: 0.25em; bottom: 0.2em; }
  .pieces { position: absolute; inset: 0; pointer-events: none; }
  .pc {
    position: absolute; left: 0; top: 0;
    width: var(--q); height: var(--q);
    padding: calc(var(--q) * 0.06);
    will-change: transform;
  }
  .pc.anim { transition: transform var(--move-ms) var(--ease); }
  .pc.drag { z-index: 5; }
  .pc.drag svg { transform: scale(1.12); }
  .pc.fade { animation: fadeout 180ms ease-out forwards; }
  @keyframes fadeout { to { opacity: 0; transform: var(--at) scale(0.6); } }
  .pc svg { display: block; width: 100%; height: 100%; overflow: visible; transition: transform 120ms var(--ease); }
  .pw { --pc: #ffffff; }
  .pb { --pc: #ea5426; }
  svg .o { fill: var(--pc); stroke: var(--ink); stroke-width: 2px; stroke-linejoin: miter; }
  svg .f { fill: var(--pc); stroke: none; }
  svg .d { fill: var(--ink); stroke: none; }
  .board.mine { cursor: pointer; }

  /* promotion picker */
  .promo { position: absolute; inset: 0; z-index: 8; background: rgba(0, 0, 0, 0.45); }
  .promo .col { position: absolute; width: var(--q); display: flex; flex-direction: column; }
  .promo .col.up { flex-direction: column-reverse; }
  .promo button {
    width: var(--q); height: var(--q); padding: calc(var(--q) * 0.08);
    border: 1px solid var(--line); border-radius: 0;
    background: var(--surface-2); cursor: pointer;
    transition: background 150ms var(--ease);
  }
  .promo button:hover, .promo button:focus-visible { background: var(--brand-dark); outline: none; }
  .promo svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---------- side ---------- */
  .side { display: flex; flex-direction: column; gap: var(--g); min-width: 0; min-height: 0; }
  .game.row .side { height: 100%; }
  .status {
    min-height: 1.6em;
    display: flex; align-items: center; gap: 0.6em;
    font-size: 0.95em; font-weight: 600;
  }
  .status::before { content: ""; width: 0.55em; height: 0.55em; background: var(--brand); flex: none; }
  .status.idle::before { background: var(--faint); }
  .game.row .status { font-size: 1.15em; font-weight: 300; font-family: var(--font-display); min-height: 2.2em; }
  .moves {
    background: var(--surface); border: 1px solid var(--line);
    font-size: 0.86em; font-variant-numeric: tabular-nums;
    min-height: 0;
  }
  .game.row .moves { flex: 1 1 auto; overflow-y: auto; padding: 0.4em 0; display: grid; grid-template-columns: 3em 1fr 1fr; align-content: start; }
  .game.col .moves { height: 2.5em; overflow-x: auto; overflow-y: hidden; white-space: nowrap; display: flex; align-items: center; padding: 0 0.6em; scrollbar-width: none; }
  .game.col .moves::-webkit-scrollbar { display: none; }
  .moves .n { color: var(--faint); padding: 0.28em 0 0.28em 0.9em; }
  .moves .m { padding: 0.28em 0.5em; color: var(--muted); }
  .moves .m.cur { color: var(--text); background: var(--surface-2); box-shadow: inset 2px 0 0 var(--brand); }
  .game.col .moves .n { padding: 0 0.15em 0 0.5em; }
  .game.col .moves .n:first-child { padding-left: 0; }
  .game.col .moves .m { padding: 0.3em 0.35em; }
  .moves .empty { color: var(--faint); padding: 0.3em 0.9em; grid-column: 1 / -1; }
  .game.col .moves .empty { padding: 0; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4em; }
  .game.row .actions { grid-template-columns: 1fr 1fr; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.55em;
    height: 3.3em; padding: 0 1.1em; min-width: 0;
    border-radius: 0; border: 1px solid var(--outline);
    background: transparent;
    font: 600 0.74em var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; white-space: nowrap;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), opacity 180ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .btn svg { width: 1.35em; height: 1.35em; flex: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.armed, .btn.armed:hover { background: var(--surface); border-color: var(--brand); color: var(--brand-hover); }
  .actions .btn { padding: 0 0.4em; letter-spacing: 0.1em; }
  .narrow .actions .btn svg { display: none; }

  /* ---------- result card ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0; transition: opacity 220ms var(--ease);
  }
  .overlay.show { opacity: 1; }
  .card {
    width: min(86%, 20em);
    padding: 1.3em 1.3em 1.2em;
    background: var(--surface); border: 1px solid var(--line);
    transform: translateY(24px); transition: transform 300ms var(--ease);
  }
  .overlay.show .card { transform: none; }
  .card h2 { margin: 0; font: 300 2em/1.1 var(--font-display); }
  .card p { margin: 0.45em 0 0; color: var(--muted); font-size: 0.92em; }
  .card .btns { display: flex; gap: 0.5em; margin-top: 1.2em; flex-wrap: wrap; }
  .card .btns .btn { flex: 1 1 7em; }

  /* ---------- menu ---------- */
  .menu {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    overflow-y: auto;
    padding: 16px;
  }
  .panel { width: min(100%, 23em); margin: auto 0; display: flex; flex-direction: column; gap: 0.6em; }
  .panel h1 {
    margin: 0 0 0.1em;
    font: 300 2.6em/1 var(--font-display);
    display: flex; align-items: center; gap: 0.32em;
  }
  .panel h1::before { content: ""; width: 0.3em; height: 0.3em; background: var(--brand); flex: none; margin-top: 0.06em; }
  .panel h2 { margin: 0 0 0.2em; font: 300 1.9em/1.1 var(--font-display); }
  .panel .sub { margin: 0 0 0.9em; color: var(--muted); font-size: 0.92em; line-height: 1.45; }
  .lab {
    display: block; margin-top: 0.5em;
    font: 600 0.7em/1.2 var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .tile {
    display: flex; align-items: center; gap: 0.9em;
    height: 3.6em; padding: 0 1.1em;
    border: 1px solid var(--outline); border-radius: 0;
    background: var(--surface);
    font: 600 1em var(--font); text-align: left;
    cursor: pointer;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), transform 150ms var(--ease);
  }
  .tile::after { content: ""; margin-left: auto; width: 0.5em; height: 0.5em; border: solid var(--muted); border-width: 2px 2px 0 0; transform: rotate(45deg); }
  .tile:hover { background: var(--surface-2); border-color: var(--brand); }
  .tile:active { transform: scale(0.985); }
  .tile:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .tile.primary { background: var(--brand); border-color: var(--brand); }
  .tile.primary::after { border-color: #fff; }
  .tile.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .tile:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
  .tile small { font-weight: 400; color: var(--muted); }
  .tile.primary small { color: rgba(255, 255, 255, 0.85); }
  .note { margin: 0; color: var(--muted); font-size: 0.85em; }
  .seg { display: flex; }
  .seg button {
    flex: 1 1 0; height: 2.7em; min-width: 0;
    border: 1px solid var(--outline); border-radius: 0;
    background: transparent; cursor: pointer;
    font-weight: 600; font-size: 0.9em;
    transition: background 150ms var(--ease), border-color 150ms var(--ease);
  }
  .seg button + button { margin-left: -1px; }
  .seg button:hover { background: rgba(255, 255, 255, 0.06); }
  .seg button.on { background: var(--brand); border-color: var(--brand); position: relative; z-index: 1; }
  .seg button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; position: relative; z-index: 2; }
  .field {
    height: 2.9em; width: 100%; padding: 0 0.8em;
    border: 1px solid var(--outline); border-radius: 0;
    background: var(--surface); outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .field:focus { border-color: var(--brand); }
  .field.link { color: var(--muted); font-size: 0.85em; height: 2.6em; }
  .field.code { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 600; }
  .rowb { display: flex; gap: 0.5em; }
  .rowb > * { flex: 1 1 0; }
  .rowb .btn { height: 3.6em; }
  .block { border-top: 1px solid var(--line); padding-top: 0.6em; margin-top: 0.4em; display: flex; flex-direction: column; gap: 0.5em; }
  .err { margin: 0; min-height: 1.2em; color: var(--brand-hover); font-size: 0.88em; }
  .bigcode {
    font: 300 3.2em/1 var(--font-display);
    letter-spacing: 0.14em;
    padding: 0.35em 0 0.3em;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    user-select: text; -webkit-user-select: text;
  }
  .wait { display: flex; align-items: center; gap: 0.6em; color: var(--muted); font-size: 0.92em; }
  .wait i { width: 0.55em; height: 0.55em; background: var(--brand); animation: blink 1.2s steps(2, end) infinite; flex: none; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .card .btns .btn.wide { flex-basis: 100%; }

  /* ---------- review ---------- */
  .review {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .rv { display: grid; --S: 360px; --ew: 20px; --rside: 300px; }
  .rv.row { grid-template-columns: auto var(--rside); column-gap: calc(var(--g) * 2.5); align-items: stretch; }
  .rv.col { grid-template-columns: auto; grid-template-rows: auto minmax(0, 1fr); row-gap: var(--g); height: var(--rh); }
  .rv-left { display: grid; grid-template-columns: var(--ew) var(--S); column-gap: var(--g); row-gap: calc(var(--g) * 0.6); align-content: start; }
  .rv-name { grid-column: 2; display: flex; align-items: center; gap: 0.6em; height: 2em; min-width: 0; }
  .rv-name .pname { color: var(--text); }
  .rv-name .acc { margin-left: auto; font: 300 1.35em/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .rv-eval { grid-column: 1; grid-row: 2; position: relative; height: var(--S); background: var(--light); overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  .rv-eval i { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #fff; transition: height 300ms var(--ease); }
  .rv-eval.flip i { bottom: auto; top: 0; }
  .rv-eval span {
    position: absolute; left: 0; right: 0; text-align: center;
    font: 600 max(8px, calc(var(--ew) * 0.42))/1 var(--font); letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; z-index: 1;
  }
  .rv-eval span.lo { bottom: 0.5em; }
  .rv-eval span.hi { top: 0.5em; }
  .rv-eval span.dk { color: var(--ink); }
  .rv-eval span.lt { color: var(--text); }
  .rv-board {
    grid-column: 2; grid-row: 2;
    position: relative; width: var(--S); height: var(--S); --q: calc(var(--S) / 8);
    box-shadow: 0 0 0 1px var(--line); touch-action: none;
  }
  .rv-arrow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
  .rv-arrow path { fill: var(--brand-hover); opacity: 0.82; }
  .rv-board .rv-mark {
    position: absolute; left: 0; top: 0; z-index: 4;
    width: calc(var(--q) * 0.42); height: calc(var(--q) * 0.42);
    font-size: calc(var(--q) * 0.22);
    box-shadow: 0 0 0 1px var(--ink);
    transform: var(--at);
    animation: pop 220ms var(--ease);
  }
  @keyframes pop { from { transform: var(--at) scale(0.4); opacity: 0; } to { transform: var(--at); opacity: 1; } }
  .rv-side { display: flex; flex-direction: column; gap: var(--g); min-width: 0; min-height: 0; }
  .rv.row .rv-side { height: var(--lh); }
  .rv-head { display: flex; gap: 0.4em; height: 2.8em; flex: none; }
  .rv-head .btn { height: 100%; padding: 0 0.9em; }
  .rv-head .icon { width: 2.8em; padding: 0; }
  .rv-head .seg { flex: 1 1 auto; }
  .rv-head .seg button { height: 100%; font-size: 0.8em; letter-spacing: 0.1em; text-transform: uppercase; }
  .rv-nav { display: grid; grid-template-columns: 2.6em 2.6em minmax(0, 1fr) 2.6em 2.6em; gap: 0.4em; height: 3.2em; flex: none; }
  .rv-nav .btn { height: 100%; padding: 0; }
  .rv-cur {
    display: flex; flex-direction: column; justify-content: center; gap: 0.2em;
    min-width: 0; padding: 0 0.6em;
    background: var(--surface); border: 1px solid var(--line);
  }
  .rv-l1 { display: flex; align-items: center; gap: 0.45em; font-weight: 600; font-size: 0.92em; white-space: nowrap; overflow: hidden; }
  .rv-l1 .k { color: var(--muted); font-weight: 400; margin-left: auto; font-size: 0.86em; font-variant-numeric: tabular-nums; }
  .rv-l2 { display: flex; gap: 0.8em; min-height: 1.1em; color: var(--muted); font-size: 0.8em; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .rv-l2 b { color: var(--text); font-weight: 600; }
  .rv-graph {
    position: relative; flex: none; height: 4.6em;
    background: var(--surface); border: 1px solid var(--line);
    cursor: pointer; touch-action: none;
  }
  .rv.row .rv-graph { height: 5.6em; }
  .rv-graph svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .rv-graph .area { fill: #fff; opacity: 0.88; }
  .rv-graph .mid { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; }
  .rv-graph .now { stroke: var(--brand); stroke-width: 2; }
  .rv-graph .dot { fill: var(--brand); stroke: var(--ink); stroke-width: 1; }
  .rv-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); overscroll-behavior: contain; }
  .rv-prog { padding: 0.8em 0.9em; display: flex; flex-direction: column; gap: 0.55em; border-bottom: 1px solid var(--line); }
  .rv-prog .row { display: flex; align-items: center; justify-content: space-between; }
  .rv-prog .lab { margin: 0; }
  .rv-prog .n { font-size: 0.85em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rv-bar { height: 4px; background: var(--surface-2); }
  .rv-bar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width 260ms var(--ease); }
  .rv-sum { display: grid; grid-template-columns: minmax(0, 1fr) 3.6em 3.6em; align-items: center; padding: 0.6em 0.9em 0.8em; }
  .rv-sum > span { min-height: 1.9em; display: flex; align-items: center; }
  .rv-sum .c { justify-content: center; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.92em; }
  .rv-sum .c.z { color: var(--faint); font-weight: 400; }
  .rv-sum .h { justify-content: center; gap: 0.4em; font: 600 0.68em/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .rv-sum .k { gap: 0.55em; font-size: 0.9em; }
  .rv-sum .acc { justify-content: center; font: 300 1.55em/1 var(--font-display); font-variant-numeric: tabular-nums; min-height: 1.8em; }
  .rv-sum .sep { grid-column: 1 / -1; min-height: 0; height: 1px; background: var(--line); margin: 0.4em 0; }
  .rv-moves { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) minmax(0, 1fr); padding: 0.3em 0; font-size: 0.88em; font-variant-numeric: tabular-nums; }
  .rv-moves .n { color: var(--faint); padding: 0.32em 0 0.32em 0.9em; }
  .rv-m { display: flex; align-items: center; gap: 0.45em; padding: 0.32em 0.5em; color: var(--muted); cursor: pointer; min-width: 0; white-space: nowrap; }
  .rv-m:hover { background: rgba(255, 255, 255, 0.05); }

<script>
(function () {
  'use strict';

  const V = window.Vela || { embedded: false, ready() {}, score() {}, gameOver() { return false; }, best() { return 0; }, onPause() {} };

  /* ===== CORE START (rules; also runs inside the engine worker) ===== */
  function ChessCore() {
    'use strict';
    const PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
    const WHITE = 0, BLACK = 8;
    const CAP = 1, EP = 2, CASTLE = 4, DOUBLE = 8;
    const N_OFF = [-33, -31, -18, -14, 14, 18, 31, 33];
    const B_OFF = [-17, -15, 15, 17];
    const R_OFF = [-16, -1, 1, 16];
    const K_OFF = [-17, -16, -15, -1, 1, 15, 16, 17];
    const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
    const FILES = 'abcdefgh';

    // Zobrist keys: two 32-bit halves, fixed seed so every copy agrees.
    let seed = 0x2545f491;
    function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
    const ZL = new Int32Array(16 * 128), ZH = new Int32Array(16 * 128);
    for (let i = 0; i < ZL.length; i++) { ZL[i] = rnd(); ZH[i] = rnd(); }
    const ZCL = new Int32Array(16), ZCH = new Int32Array(16);
    for (let i = 0; i < 16; i++) { ZCL[i] = rnd(); ZCH[i] = rnd(); }
    const ZEL = new Int32Array(8), ZEH = new Int32Array(8);
    for (let i = 0; i < 8; i++) { ZEL[i] = rnd(); ZEH[i] = rnd(); }
    const ZSL = rnd(), ZSH = rnd();

    // Castling rights kept when a move touches a square (1 K, 2 Q, 4 k, 8 q).
    const CMASK = new Int8Array(128).fill(15);
    CMASK[0] = 13; CMASK[7] = 14; CMASK[4] = 12;
    CMASK[112] = 7; CMASK[119] = 11; CMASK[116] = 3;

    const sqName = (sq) => FILES[sq & 7] + ((sq >> 4) + 1);
    function sqFrom(s) {
      if (!/^[a-h][1-8]$/.test(s)) return -1;
      return (s.charCodeAt(1) - 49) * 16 + (s.charCodeAt(0) - 97);
    }

    function Pos() {
      this.b = new Int8Array(128);
      this.turn = WHITE; this.castle = 0; this.ep = -1; this.epk = 0;
      this.half = 0; this.full = 1;
      this.k = [4, 116];
      this.hl = 0; this.hh = 0;
      this.st = []; this.ns = [];
      this.kl = []; this.kh = [];
    }
    const P = Pos.prototype;

    P.attacked = function (sq, by) {
      const b = this.b;
      let s;
      if (by === WHITE) {
        s = sq - 15; if (!(s & 0x88) && b[s] === PAWN) return true;
        s = sq - 17; if (!(s & 0x88) && b[s] === PAWN) return true;
      } else {
        s = sq + 15; if (!(s & 0x88) && b[s] === (BLACK | PAWN)) return true;
        s = sq + 17; if (!(s & 0x88) && b[s] === (BLACK | PAWN)) return true;
      }
      const kn = by | KNIGHT, kg = by | KING, bi = by | BISHOP, ro = by | ROOK, qu = by | QUEEN;
      for (let i = 0; i < 8; i++) {
        s = sq + N_OFF[i]; if (!(s & 0x88) && b[s] === kn) return true;
        s = sq + K_OFF[i]; if (!(s & 0x88) && b[s] === kg) return true;
      }
      for (let i = 0; i < 4; i++) {
        let o = B_OFF[i]; s = sq + o;
        while (!(s & 0x88)) { const q = b[s]; if (q) { if (q === bi || q === qu) return true; break; } s += o; }
        o = R_OFF[i]; s = sq + o;
        while (!(s & 0x88)) { const q = b[s]; if (q) { if (q === ro || q === qu) return true; break; } s += o; }
      }
      return false;
    };
    P.inCheck = function () { return this.attacked(this.k[this.turn >> 3], this.turn ^ 8); };
    // After make(): did the side that just moved leave its own king attacked?
    P.illegal = function () { return this.attacked(this.k[(this.turn ^ 8) >> 3], this.turn); };

    function promos(out, from, to, fl) {
      for (let t = QUEEN; t >= KNIGHT; t--) out.push(from | to << 7 | t << 14 | fl << 17);
    }

    // Pseudo-legal moves. caps: captures and promotions only (quiescence).
    P.gen = function (out, caps) {
      const b = this.b, us = this.turn, them = us ^ 8;
      for (let sq = 0; sq < 120; sq++) {
        if (sq & 0x88) { sq += 7; continue; }
        const p = b[sq];
        if (!p || (p & 8) !== us) continue;
        const t = p & 7;
        if (t === PAWN) {
          const dir = us ? -16 : 16, r = sq >> 4, last = us ? 1 : 6, first = us ? 6 : 1;
          let to = sq + dir;
          if (!b[to]) {
            if (r === last) promos(out, sq, to, 0);
            else if (!caps) {
              out.push(sq | to << 7);
              if (r === first && !b[to + dir]) out.push(sq | (to + dir) << 7 | DOUBLE << 17);
            }
          }
          for (let i = -1; i <= 1; i += 2) {
            to = sq + dir + i;
            if (to & 0x88) continue;
            const q = b[to];
            if (q) { if ((q & 8) === them) { if (r === last) promos(out, sq, to, CAP); else out.push(sq | to << 7 | CAP << 17); } }
            else if (to === this.ep) out.push(sq | to << 7 | (CAP | EP) << 17);
          }
        } else if (t === KNIGHT || t === KING) {
          const offs = t === KNIGHT ? N_OFF : K_OFF;
          for (let i = 0; i < 8; i++) {
            const to = sq + offs[i];
            if (to & 0x88) continue;
            const q = b[to];
            if (!q) { if (!caps) out.push(sq | to << 7); }
            else if ((q & 8) === them) out.push(sq | to << 7 | CAP << 17);
          }
          if (t === KING && !caps && this.castle) {
            const home = us ? 116 : 4;
            if (sq === home) {
              const kb = us ? 4 : 1, qb = us ? 8 : 2, rook = us | ROOK;
              if ((this.castle & kb) && !b[home + 1] && !b[home + 2] && b[home + 3] === rook &&
                  !this.attacked(home, them) && !this.attacked(home + 1, them)) out.push(home | (home + 2) << 7 | CASTLE << 17);
              if ((this.castle & qb) && !b[home - 1] && !b[home - 2] && !b[home - 3] && b[home - 4] === rook &&
                  !this.attacked(home, them) && !this.attacked(home - 1, them)) out.push(home | (home - 2) << 7 | CASTLE << 17);
            }
          }
        } else {
          for (let pass = 0; pass < 2; pass++) {
            if (pass === 0 && t === ROOK) continue;
            if (pass === 1 && t === BISHOP) continue;
            const offs = pass === 0 ? B_OFF : R_OFF;
            for (let i = 0; i < 4; i++) {
              const o = offs[i];
              let to = sq + o;
              while (!(to & 0x88)) {
                const q = b[to];
                if (!q) { if (!caps) out.push(sq | to << 7); }
                else { if ((q & 8) === them) out.push(sq | to << 7 | CAP << 17); break; }
                to += o;
              }
            }
          }
        }
      }
      return out;
    };

    P.make = function (m) {
      const b = this.b, from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >>> 17;
      const p = b[from], us = this.turn, them = us ^ 8;
      let capSq = to;
      if (fl & EP) capSq = us === WHITE ? to - 16 : to + 16;
      const cap = b[capSq];
      this.st.push(m, cap, this.castle, this.ep, this.epk, this.half, this.hl, this.hh);
      this.kl.push(this.hl); this.kh.push(this.hh);
      let hl = this.hl, hh = this.hh;
      if (this.epk) { hl ^= ZEL[this.ep & 7]; hh ^= ZEH[this.ep & 7]; }
      hl ^= ZCL[this.castle]; hh ^= ZCH[this.castle];
      hl ^= ZL[p * 128 + from]; hh ^= ZH[p * 128 + from];
      if (cap) { hl ^= ZL[cap * 128 + capSq]; hh ^= ZH[cap * 128 + capSq]; b[capSq] = 0; }
      b[from] = 0;
      const np = promo ? (us | promo) : p;
      b[to] = np; hl ^= ZL[np * 128 + to]; hh ^= ZH[np * 128 + to];
      if (fl & CASTLE) {
        let rf, rt;
        if (to > from) { rf = from + 3; rt = from + 1; } else { rf = from - 4; rt = from - 1; }
        const r = b[rf]; b[rf] = 0; b[rt] = r;
        hl ^= ZL[r * 128 + rf] ^ ZL[r * 128 + rt]; hh ^= ZH[r * 128 + rf] ^ ZH[r * 128 + rt];
      }
      if ((p & 7) === KING) this.k[us >> 3] = to;
      this.castle &= CMASK[from] & CMASK[to];
      hl ^= ZCL[this.castle]; hh ^= ZCH[this.castle];
      this.ep = -1; this.epk = 0;
      if (fl & DOUBLE) {
        this.ep = (from + to) >> 1;
        const ep2 = them | PAWN;
        if ((!((to - 1) & 0x88) && b[to - 1] === ep2) || (!((to + 1) & 0x88) && b[to + 1] === ep2)) {
          this.epk = 1; hl ^= ZEL[this.ep & 7]; hh ^= ZEH[this.ep & 7];
        }
      }
      this.half = (cap || (p & 7) === PAWN) ? 0 : this.half + 1;
      if (us === BLACK) this.full++;
      this.turn = them;
      this.hl = hl ^ ZSL; this.hh = hh ^ ZSH;
    };

    P.unmake = function () {
      const st = this.st, b = this.b;
      this.hh = st.pop(); this.hl = st.pop(); this.half = st.pop(); this.epk = st.pop(); this.ep = st.pop(); this.castle = st.pop();
      const cap = st.pop(), m = st.pop();
      this.kl.pop(); this.kh.pop();
      const from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >>> 17;
      this.turn ^= 8;
      const us = this.turn;
      if (us === BLACK) this.full--;
      const p = promo ? (us | PAWN) : b[to];
      b[from] = p; b[to] = 0;
      if (fl & EP) b[us === WHITE ? to - 16 : to + 16] = cap; else b[to] = cap;
      if (fl & CASTLE) {
        let rf, rt;
        if (to > from) { rf = from + 3; rt = from + 1; } else { rf = from - 4; rt = from - 1; }
        b[rf] = b[rt]; b[rt] = 0;
      }
      if ((p & 7) === KING) this.k[us >> 3] = from;
    };

    // Passing the turn, for null-move pruning in the engine.
    P.makeNull = function () {
      this.ns.push(this.ep, this.epk, this.half, this.hl, this.hh);
      this.kl.push(this.hl); this.kh.push(this.hh);
      if (this.epk) { this.hl ^= ZEL[this.ep & 7]; this.hh ^= ZEH[this.ep & 7]; }
      this.ep = -1; this.epk = 0; this.half = 0;
      this.turn ^= 8; this.hl ^= ZSL; this.hh ^= ZSH;
    };
    P.unmakeNull = function () {
      const ns = this.ns;
      this.hh = ns.pop(); this.hl = ns.pop(); this.half = ns.pop(); this.epk = ns.pop(); this.ep = ns.pop();
      this.kl.pop(); this.kh.pop();
      this.turn ^= 8;
    };

    P.legal = function () {
      const ps = this.gen([], false), out = [];
      for (let i = 0; i < ps.length; i++) {
        this.make(ps[i]);
        if (!this.illegal()) out.push(ps[i]);
        this.unmake();
      }
      return out;
    };

    P.rehash = function () {
      let hl = 0, hh = 0;
      for (let sq = 0; sq < 120; sq++) {
        if (sq & 0x88) { sq += 7; continue; }
        const p = this.b[sq];
        if (p) { hl ^= ZL[p * 128 + sq]; hh ^= ZH[p * 128 + sq]; }
      }
      hl ^= ZCL[this.castle]; hh ^= ZCH[this.castle];
      if (this.epk) { hl ^= ZEL[this.ep & 7]; hh ^= ZEH[this.ep & 7]; }
      if (this.turn) { hl ^= ZSL; hh ^= ZSH; }
      this.hl = hl; this.hh = hh;
    };

    P.load = function (fen) {
      const parts = String(fen).trim().split(/\s+/);
      if (parts.length < 4) throw new Error('bad fen');

      html += resignBtn;
      html += btnHtml('flip', 'flip', 'Flip');
      html += btnHtml('leave', 'exit', armed === 'leave' ? 'Sure?' : 'Leave', armed === 'leave' ? 'armed' : '');
    } else {
      html += btnHtml('undo', 'undo', 'Undo');
      html += btnHtml('flip', 'flip', 'Flip');
      html += resignBtn;
      html += btnHtml('new', 'plus', 'New game', inPlay ? '' : 'primary');
    }
    actionsEl.innerHTML = html;
    const q = (a) => actionsEl.querySelector('[data-act="' + a + '"]');
    if (S.mode !== 'online') {
      q('undo').disabled = !game.moves.length || (S.result && S.result.reason === 'resign') || (S.mode === 'cpu' && !game.ucis.some((_, i) => (i % 2 === 0) === (S.my === 'w')));
      if (q('resign')) q('resign').disabled = !inPlay || !game.moves.length;
    } else if (ON.room) {
      const st = ON.room.state;
      if (q('resign')) q('resign').disabled = !inPlay;
      const d = q('draw'); if (d) d.disabled = !inPlay || !!st.drawOffer || game.moves.length < 2;
      const rm = q('rematch'); if (rm) rm.disabled = (st.rematch || []).includes(ON.me) || anyLeft();
    }
  }

  actionsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'flip') { S.flipped = !S.flipped; saveLocal(); closePromo(); render(); return; }
    if (a === 'undo') { disarm(); undo(); return; }
    if (a === 'new') { disarm(); openMenu('home'); return; }
    if (a === 'review') { disarm(); openReview('game'); return; }
    if (a === 'resign') {
      if (armed !== 'resign') { arm('resign'); return; }
      disarm();
      if (S.mode === 'online') onlineResign(); else resignLocal();
      return;
    }
    if (a === 'leave') {
      if (!S.result && armed !== 'leave') { arm('leave'); return; }
      disarm(); onlineLeave(); return;
    }
    if (a === 'draw') { onlineDraw('offer'); return; }
    if (a === 'accept') { onlineDraw('accept'); return; }
    if (a === 'rematch') { onlineRematch(); return; }
  });

  function render(anim) {
    legalNow = game.pos.legal();
    if (S.sel >= 0 && !legalNow.some((m) => (m & 127) === S.sel)) S.sel = -1;
    renderSquares();
    renderPieces(anim);
    renderBars();
    renderMoves();
    renderStatus();
    renderActions();
    board.classList.toggle('mine', canMove());
  }

  /* ---------- clocks (online) ---------- */
  function clockMs(color) {
    if (!ON.room || !ON.room.state.tc || !ON.room.state.clocks) return null;
    const st = ON.room.state;
    let ms = st.clocks[color];
    const turn = game.pos.turn ? 'b' : 'w';
    if (!st.result && ON.room.phase === 'play' && color === turn && st.uci.length >= 2 && game.ucis.length === st.uci.length) ms -= Date.now() - ON.turnStart;
    return ms;
  }
  function renderClocks() {
    if (S.mode !== 'online') return;
    document.querySelectorAll('.clock').forEach((el) => {
      const ms = clockMs(el.dataset.c);
      if (ms === null) return;
      el.textContent = fmtClock(ms);
      el.classList.toggle('low', ms < 20000);
    });
  }

  /* ---------- moving ---------- */
  function canMove() {
    if (S.result || !overlay.hidden) return false;
    const turn = game.pos.turn ? 'b' : 'w';
    if (S.mode === 'pass') return true;
    if (S.mode === 'cpu') return !thinking && turn === S.my;
    if (S.mode === 'online') return !!ON.room && ON.room.phase === 'play' && !ON.pending && turn === S.my;
    return false;
  }
  function ownPiece(p) { return p && ((p & 8) ? 'b' : 'w') === (game.pos.turn ? 'b' : 'w'); }

  function tryMove(from, to, dragged) {
    const ms = legalNow.filter((m) => (m & 127) === from && ((m >> 7) & 127) === to);
    if (!ms.length) return false;
    S.sel = -1;
    if (ms.length > 1) { openPromo(ms, dragged); return true; }
    commit(ms[0], legalNow, !dragged);
    return true;
  }

  function commit(m, legal, animate) {
    closePromo();
    disarm();
    const uci = game.pos.uci(m);
    game.play(m, legal);
    S.sel = -1;
    const st = game.status();
    if (S.mode === 'online') {
      ON.pending = true;
      render(animate ? m : 0);
      sendMove(uci);
      return;
    }
    if (st.over) S.result = { winner: st.winner, reason: st.reason };
    render(animate ? m : 0);
    saveLocal();
    if (S.result) { finishLocal(); return; }
    if (S.mode === 'cpu' && (game.pos.turn ? 'b' : 'w') !== S.my) askEngine();
  }

  function finishLocal() {
    stopEngine();
    store.set(SAVE_KEY, null);
    setTimeout(() => showResult(), reduceMotion ? 50 : 420);
  }

  function resignLocal() {
    if (S.result) return;
    stopEngine();
    const turn = game.pos.turn ? 'b' : 'w';
    const loser = S.mode === 'cpu' ? S.my : turn;
    S.result = { winner: loser === 'w' ? 'b' : 'w', reason: 'resign' };
    render();
    finishLocal();
  }

  function undo() {
    if (S.mode === 'online' || !game.moves.length) return;
    stopEngine();
    hideOverlay();
    closePromo();
    let n = game.ucis.length - 1;
    if (S.mode === 'cpu') {
      // back to the last position where it was my move, with one of my moves removed
      const myParity = S.my === 'w' ? 0 : 1;
      while (n > 0 && n % 2 !== myParity) n--;
      if (n % 2 !== myParity) return;
    }
    game = Game.fromUcis(game.ucis.slice(0, n)) || new Game();
    S.result = null; S.sel = -1;
    render();
    saveLocal();
  }

  /* ---------- promotion picker ---------- */
  let promoMoves = null;
  function openPromo(ms) {
    promoMoves = ms;
    const to = (ms[0] >> 7) & 127;
    const color = game.pos.turn;
    const i = indexOfSq(to), col = i & 7, row = i >> 3;
    const up = row === 7;
    promoEl.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'col' + (up ? ' up' : '');
    wrap.style.left = (col * layoutInfo.q) + 'px';
    if (up) wrap.style.bottom = '0'; else wrap.style.top = (row * layoutInfo.q) + 'px';
    for (const t of [C.QUEEN, C.KNIGHT, C.ROOK, C.BISHOP]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', ['', '', 'Knight', 'Bishop', 'Rook', 'Queen'][t]);
      b.innerHTML = pieceSvg(color | t);
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const m = ms.find((x) => ((x >> 14) & 7) === t);
        if (m) commit(m, legalNow, false);
      });
      wrap.appendChild(b);
    }
    promoEl.appendChild(wrap);
    promoEl.hidden = false;
    setTimeout(() => { const f = wrap.querySelector('button'); if (f) try { f.focus({ preventScroll: true }); } catch (_) {} }, 30);
  }
  function closePromo() {
    if (promoEl.hidden) return;
    promoEl.hidden = true; promoEl.innerHTML = ''; promoMoves = null;
    renderPieces(); renderSquares();
  }
  promoEl.addEventListener('pointerdown', (e) => {
    if (e.target === promoEl) { e.stopPropagation(); closePromo(); }
  });

  /* ---------- pointer input ---------- */
  let drag = null;
  board.addEventListener('pointerdown', (e) => {
    if (!promoEl.hidden || !overlay.hidden) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const sq = sqAt(e.clientX, e.clientY);
    if (sq < 0) return;
    const p = game.pos.b[sq];
    if (S.sel >= 0 && S.sel !== sq && legalNow.some((m) => (m & 127) === S.sel && ((m >> 7) & 127) === sq)) {
      tryMove(S.sel, sq, false);
      return;
    }
    if (canMove() && ownPiece(p)) {
      const was = S.sel === sq;
      S.sel = sq;
      renderSquares();
      const el = pieceEls.get(sq);
      drag = { id: e.pointerId, sq, el, x: e.clientX, y: e.clientY, moved: false, was, hover: -1 };
      try { board.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
      return;
    }
    if (S.sel >= 0) { S.sel = -1; renderSquares(); }
  });
  board.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < Math.max(4, layoutInfo.q * 0.12)) return;
    if (!drag.moved) { drag.moved = true; if (drag.el) { drag.el.classList.add('drag'); drag.el.classList.remove('anim'); } }
    const r = board.getBoundingClientRect();
    const half = layoutInfo.q / 2;
    if (drag.el) drag.el.style.transform = 'translate(' + (e.clientX - r.left - half) + 'px,' + (e.clientY - r.top - half) + 'px)';
    const over = sqAt(e.clientX, e.clientY);
    if (over !== drag.hover) {
      if (drag.hover >= 0) sqEls[indexOfSq(drag.hover)].classList.remove('hover');
      drag.hover = over;
      if (over >= 0 && over !== drag.sq && legalNow.some((m) => (m & 127) === drag.sq && ((m >> 7) & 127) === over)) sqEls[indexOfSq(over)].classList.add('hover');
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (d.hover >= 0) sqEls[indexOfSq(d.hover)].classList.remove('hover');
    if (d.el) d.el.classList.remove('drag');
    if (d.moved) {
      const to = e.type === 'pointerup' ? sqAt(e.clientX, e.clientY) : -1;
      if (to >= 0 && to !== d.sq && tryMove(d.sq, to, true)) {
        // dropped on a legal square; the promotion picker may be open
        if (!promoEl.hidden && d.el) placeEl(d.el, to);
        return;
      }
      if (d.el) { d.el.classList.add('anim'); placeEl(d.el, d.sq); }
      return;
    }
    // a plain tap on an already selected piece deselects it
    if (d.was) { S.sel = -1; renderSquares(); }
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);
  board.addEventListener('lostpointercapture', (e) => { if (drag && e.pointerId === drag.id) endDrag({ pointerId: e.pointerId, type: 'pointercancel' }); });
  board.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('touchmove', (e) => { if (!e.target.closest('.moves, .menu, .rv-panel')) e.preventDefault(); }, { passive: false });
  window.addEventListener('pointerdown', () => { window.focus(); }, true);

  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!reviewEl.hidden) { reviewKey(e); return; }
    if (!menu.hidden) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (S.mode !== 'online') undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') { if (!promoEl.hidden) closePromo(); else if (S.sel >= 0) { S.sel = -1; renderSquares(); } return; }
    if (e.key === 'f' || e.key === 'F') { S.flipped = !S.flipped; saveLocal(); closePromo(); render(); return; }
    if ((e.key === 'u' || e.key === 'U') && S.mode !== 'online') { undo(); return; }
  });

  /* ---------- result overlay ---------- */
  function showResult() {
    if (!S.result) return;
    const key = (ON.room ? ON.room.state.n : 0) + ':' + game.ucis.length + ':' + S.result.reason;
    if (S.lastShownResult === key) return;
    S.lastShownResult = key;
    recordFinished();
    $('ovTitle').textContent = resultTitle(S.result);
    $('ovText').textContent = resultText(S.result);
    const row = $('ovButtons');
    row.textContent = '';
    const btns = [];
    if (S.mode === 'online') btns.push({ label: 'Rematch', primary: true, onClick: () => { hideOverlay(); onlineRematch(); }, off: anyLeft() });
    else btns.push({ label: 'Play again', primary: true, onClick: () => { hideOverlay(); playAgain(); } });
    if (game.moves.length) btns.push({ label: 'Review', onClick: () => openReview('game') });
    btns.push({ label: 'View board', onClick: hideOverlay });
    if (btns.length > 2) btns[0].wide = true;
    let first = null;
    for (const b of btns) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn' + (b.primary ? ' primary' : '') + (b.wide ? ' wide' : '');
      el.textContent = b.label;
      el.disabled = !!b.off;
      el.addEventListener('click', b.onClick);
      row.appendChild(el);
      if (!first) first = el;
    }
    overlay.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));
    if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (_) {} }, 60);
    render();
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    overlay.hidden = true;
    board.classList.toggle('mine', canMove());
  }

  /* ---------- starting games ---------- */
  function startLocal(mode, opts) {
    stopEngine();
    hideOverlay(); closePromo(); disarm();
    S.mode = mode;
    S.result = null; S.sel = -1; S.lastShownResult = '';
    game = opts && opts.ucis ? (Game.fromUcis(opts.ucis) || new Game()) : new Game();
    if (mode === 'cpu') {
      S.level = opts.level;
      S.cpuPref = opts.cpuPref;
      S.my = opts.my || (opts.cpuPref === 'r' ? (Math.random() < 0.5 ? 'w' : 'b') : opts.cpuPref);
      S.flipped = opts.flipped !== undefined ? opts.flipped : S.my === 'b';
    } else {
      S.flipped = !!(opts && opts.flipped);
    }
    closeMenu();
    const st = game.status();
    if (st.over) S.result = { winner: st.winner, reason: st.reason };
    render();
    saveLocal();
    if (S.mode === 'cpu' && !S.result && (game.pos.turn ? 'b' : 'w') !== S.my) askEngine();
  }
  function playAgain() {
    if (S.mode === 'cpu') startLocal('cpu', { level: S.level, cpuPref: S.cpuPref });
    else startLocal('pass', {});
  }

  /* ---------- menu ---------- */
  function openMenu(view) {
    stopEngineIfLocalIdle();
    menu.hidden = false;
    showView(view || 'home');
  }
  function stopEngineIfLocalIdle() {
    // leaving a game for the menu: stop thinking, the save resumes it later
    if (S.mode === 'cpu') { stopEngine(); }
  }
  function closeMenu() { menu.hidden = true; }
  function showView(v) {
    menu.querySelectorAll('.panel').forEach((p) => { p.hidden = p.dataset.view !== v; });
    if (v === 'home') refreshHome();
    if (v === 'online') { $('nameIn').value = prefs.name || ''; $('onErr').textContent = onlineError; onlineError = ''; }
    const first = menu.querySelector('.panel:not([hidden]) button:not([hidden]):not(:disabled)');
    if (first && !('ontouchstart' in window)) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (_) {} }, 30);
  }
  function refreshHome() {
    const sv = store.get(SAVE_KEY);
    const ok = sv && (sv.mode === 'cpu' || sv.mode === 'pass') && Array.isArray(sv.ucis);
    $('contBtn').hidden = !ok;
    if (ok) $('contInfo').textContent = sv.mode === 'cpu' ? 'Vs computer, level ' + sv.level : 'Pass and play';
    const tile = $('onlineTile'), note = $('onlineNote');
    if (Rooms === undefined) { tile.disabled = true; note.hidden = true; }
    else if (!Rooms || !Rooms.available) { tile.disabled = true; note.hidden = false; note.textContent = Rooms ? 'Online play is not set up yet.' : 'Online play is not available right now.'; }
    else { tile.disabled = false; note.hidden = true; }
    $('reviewTile').hidden = !lastGame;
    if (lastGame) {
      const r = lastGame.result || {};
      const n = Math.ceil(lastGame.ucis.length / 2);
      $('reviewInfo').textContent = (r.winner ? colorName(r.winner) + ' wins' : 'Draw') + ', ' + n + (n === 1 ? ' move' : ' moves');
    }
  }

  function bindSeg(id, key, cast) {
    const el = $(id);
    const paint = () => el.querySelectorAll('button').forEach((b) => b.classList.toggle('on', String(prefs[key]) === b.dataset.v));
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      prefs[key] = cast ? cast(b.dataset.v) : b.dataset.v;
      store.set(PREF_KEY, prefs);
      paint();
    });
    paint();
  }
  bindSeg('segLevel', 'level', Number);
  bindSeg('segCpuColor', 'cpuColor');
  bindSeg('segOnColor', 'onColor');
  bindSeg('segClock', 'clock');

  menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (!b || b.disabled) return;
    const go = b.dataset.go;
    if (go === 'pass') { startLocal('pass', {}); return; }
    showView(go);
  });
  $('contBtn').addEventListener('click', () => {
    const sv = store.get(SAVE_KEY);
    if (!sv) { refreshHome(); return; }
    startLocal(sv.mode, sv.mode === 'cpu' ? { level: sv.level, cpuPref: sv.cpuPref, my: sv.my, ucis: sv.ucis, flipped: sv.flipped } : { ucis: sv.ucis, flipped: sv.flipped });
  });
  $('reviewTile').addEventListener('click', () => openReview('menu'));
  $('cpuStart').addEventListener('click', () => startLocal('cpu', { level: prefs.level, cpuPref: prefs.cpuColor }));

  /* ---------- online ---------- */
  let Rooms; // undefined while loading, null if it could not load
  const ON = { code: null, room: null, me: null, unsub: null, stopBeat: null, pending: false, turnStart: 0, n: -1, len: -1, synced: false, flagFor: '' };
  let onlineError = '';
  const CLOCKS = { none: null, '5+0': { base: 300000, inc: 0 }, '10+0': { base: 600000, inc: 0 }, '10+5': { base: 600000, inc: 5000 } };

  function friendly(e) {
    if (Rooms && e instanceof Rooms.RoomError) return e.message;
    return 'Could not reach the game server. Try again.';
  }
  function myName() {
    const v = $('nameIn').value.replace(/\s+/g, ' ').trim().slice(0, 20);
    if (v) { prefs.name = v; store.set(PREF_KEY, prefs); }
    return v || prefs.name || 'Player';
  }
  function setBusy(on) { ['createBtn', 'joinBtn'].forEach((id) => { $(id).disabled = on; }); }

  $('createBtn').addEventListener('click', async () => {
    if (!Rooms || !Rooms.available) return;
    $('onErr').textContent = '';
    setBusy(true);
    try {
      const tc = CLOCKS[prefs.clock] || null;
      const code = await Rooms.create({ game: 'chess', maxSeats: 2, name: myName(), state: { pref: prefs.onColor, tc } });
      enterRoom(code);
    } catch (e) { $('onErr').textContent = friendly(e); }
    setBusy(false);
  });
  async function joinRoom(code, quiet) {
    code = Rooms.normaliseCode(code);
    if (code.length !== 6) { $('onErr').textContent = 'Room codes are six letters and numbers.'; return; }
    if (quiet) { menu.hidden = false; showView('joining'); }
    $('onErr').textContent = '';
    setBusy(true);
    try {
      await Rooms.join(code, { game: 'chess', name: quiet ? (prefs.name || 'Player') : myName() });
      enterRoom(code);
    } catch (e) {
      store.set(ROOM_KEY, null);
      setUrlRoom(null);
      if (quiet === 'saved') showView('home');
      else { onlineError = friendly(e); showView('online'); }
    }
    setBusy(false);
  }
  $('joinBtn').addEventListener('click', () => joinRoom($('codeIn').value, false));
  $('codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom($('codeIn').value, false); });
  $('codeIn').addEventListener('input', (e) => { const v = Rooms ? Rooms.normaliseCode(e.target.value) : e.target.value; if (v !== e.target.value) e.target.value = v; });

  function setUrlRoom(code) {
    try {
      const u = new URL(location.href);
      if (code) u.searchParams.set('room', code); else u.searchParams.delete('room');
      history.replaceState(null, '', u.toString());
    } catch (_) {}
  }

  function enterRoom(code) {
    leaveRoomLocal();
    stopEngine();
    ON.code = code; ON.me = Rooms.uid(); ON.room = null; ON.pending = false; ON.n = -1; ON.len = -1; ON.synced = false;
    store.set(ROOM_KEY, { code, at: Date.now() });
    setUrlRoom(code);
    $('lobbyCode').textContent = code;
    $('lobbyLink').value = Rooms.inviteUrl('chess', code);
    $('lobbyWait').textContent = 'Connecting';
    $('lobbyInfo').textContent = '';
    menu.hidden = false;
    showView('lobby');
    ON.unsub = Rooms.watch(code, onRoom, () => {
      if (S.mode === 'online') showFlash('Connection lost. Reconnecting.');
      else $('lobbyWait').textContent = 'Reconnecting';
    });
    ON.stopBeat = Rooms.heartbeat(code);
  }
  function leaveRoomLocal() {
    if (ON.unsub) { try { ON.unsub(); } catch (_) {} }
    if (ON.stopBeat) ON.stopBeat();
    ON.unsub = null; ON.stopBeat = null; ON.code = null; ON.room = null; ON.pending = false;
  }

  function onRoom(room) {
    if (!ON.code) return;
    if (!room) {
      const wasPlaying = S.mode === 'online';
      leaveRoomLocal();
      store.set(ROOM_KEY, null);
      setUrlRoom(null);
      S.mode = null;
      onlineError = 'The room has closed.';
      hideOverlay();
      menu.hidden = false;
      showView(wasPlaying ? 'online' : 'online');
      return;
    }
    ON.room = room;
    if (room.phase === 'lobby') {
      const st = room.state || {};
      const host = room.hostUid === ON.me;
      const pref = st.pref === 'w' ? 'white' : st.pref === 'b' ? 'black' : null;
      const yourSide = host ? (pref ? 'You play ' + pref + '.' : 'Colours are picked at random.') : (pref ? 'You play ' + (pref === 'white' ? 'black' : 'white') + '.' : 'Colours are picked at random.');
      const tcName = st.tc ? (st.tc.base / 60000) + '+' + (st.tc.inc / 1000) : 'No clock';
      $('lobbyInfo').textContent = yourSide + ' ' + (st.tc ? 'Clock ' + tcName + '.' : 'No clock.');
      $('lobbyWait').textContent = room.seats.length >= 2 ? 'Starting' : 'Waiting for an opponent';
      if (S.mode === 'online') { S.mode = null; }
      menu.hidden = false;
      if (menu.querySelector('[data-view="lobby"]').hidden) showView('lobby');
      // the host starts the game; the guest steps in only if the host is gone
      clearTimeout(startTimer);
      if (room.seats.length >= 2 && room.seats.includes(ON.me)) {
        if (host) startTimer = setTimeout(startOnline, 900); else startTimer = setTimeout(() => { if (ON.room && ON.room.phase === 'lobby') startOnline(); }, 6000);
      }
      return;
    }
    if (!room.seats.includes(ON.me)) {
      leaveRoomLocal(); store.set(ROOM_KEY, null); setUrlRoom(null);
      onlineError = 'That game has already started.'; menu.hidden = false; showView('online');
      return;
    }
    syncOnline(room);
  }

  function freshState(prev, white, black, n) {
    const tc = prev.tc || null;
    return {
      pref: prev.pref || 'r', tc, white, black, n,

    const bottom = RV.flipped ? 'b' : 'w', top = bottom === 'w' ? 'b' : 'w';
    [[$('rvTop'), top], [$('rvBot'), bottom]].forEach(([el, c]) => {
      const lvl = g.cpu === c ? '<small>Level ' + g.level + '</small>' : '';
      const acc = d && d.done && d.acc[c] !== null ? '<span class="acc">' + d.acc[c].toFixed(1) + '</span>' : '';
      el.innerHTML = '<span class="chip ' + c + '"></span><span class="pname">' + esc(g.names[c] || colorName(c)) + lvl + '</span>' + acc;
    });
  }
  function rvRenderCur() {
    const k = RV.ply, el = $('rvCur');
    const ev = '<span class="k">' + evalText(RV.data && RV.data.evals[k], true) + '</span>';
    if (!k) { el.innerHTML = '<div class="rv-l1"><span>Start</span>' + ev + '</div><div class="rv-l2"></div>'; return; }
    const i = k - 1, info = RV.data && RV.data.moves[i];
    const l1 = (info ? badge(info.cls) : '') + '<span>' + moveNo(i) + ' ' + RV.prep.sans[i] + '</span>' + ev;
    let l2 = info ? '<span>' + RVW.LABEL[info.cls] + '</span>' : '';
    if (info && info.bestSan) l2 += '<span>Best <b>' + info.bestSan + '</b></span>';
    el.innerHTML = '<div class="rv-l1">' + l1 + '</div><div class="rv-l2">' + l2 + '</div>';
  }
  function rvRenderGraph() {
    const W = rvGraph.clientWidth, H = rvGraph.clientHeight;
    if (!W || !H || !RV.prep) return;
    const n = RV.prep.moves.length, d = RV.data;
    const X = (k) => (n ? k / n : 0) * (W - 2) + 1;
    const Y = (e) => (1 - e) * (H - 2) + 1;
    let svg = '<line class="mid" x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '"/>';
    const pts = [];
    if (d) for (let k = 0; k <= n; k++) { const ev = d.evals[k]; if (!ev) break; pts.push([X(k), Y(ev.e)]); }
    if (pts.length > 1) {
      svg = '<path class="area" d="M' + pts[0][0] + ' ' + H + pts.map((p) => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('') + 'L' + pts[pts.length - 1][0].toFixed(1) + ' ' + H + 'Z"/>' + svg;
      d.moves.forEach((m, i) => {
        if ((m.cls === 'mistake' || m.cls === 'blunder' || m.cls === 'miss') && pts[i + 1]) svg += '<circle class="dot" cx="' + pts[i + 1][0].toFixed(1) + '" cy="' + pts[i + 1][1].toFixed(1) + '" r="3"/>';
      });
    }
    const x = X(RV.ply).toFixed(1);
    svg += '<line class="now" x1="' + x + '" x2="' + x + '" y1="0" y2="' + H + '"/>';
    rvGraphSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    rvGraphSvg.innerHTML = svg;
  }
  function rvRenderPanel() {
    const n = RV.prep.moves.length, d = RV.data, have = RV.g.an.length;
    $('rvTabs').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.tab === RV.tab));
    $('rvProg').hidden = have >= n;
    $('rvProgN').textContent = Math.min(have, n) + ' / ' + n;
    $('rvProgBar').style.width = (n ? have / n * 100 : 100).toFixed(1) + '%';
    let html = '';
    if (RV.tab === 'summary') {
      if (d && d.done) {
        html += '<div class="rv-sum"><span></span><span class="h"><i class="chip w"></i>White</span><span class="h"><i class="chip b"></i>Black</span>';
        html += '<span class="k">Accuracy</span>';
        for (const c of ['w', 'b']) html += '<span class="acc">' + (d.acc[c] === null ? '' : d.acc[c].toFixed(1)) + '</span>';
        html += '<span class="sep"></span>';
        for (const cat of RVW.CATS) {
          html += '<span class="k">' + badge(cat) + RVW.LABEL[cat] + '</span>';
          for (const c of ['w', 'b']) { const v = d.counts[c][cat]; html += '<span class="c' + (v ? '' : ' z') + '">' + v + '</span>'; }
        }
        html += '</div>';
      }
    } else {
      html += '<div class="rv-moves">';
      for (let i = 0; i < n; i++) {
        if (i % 2 === 0) html += '<span class="n">' + (i / 2 + 1) + '.</span>';
        const info = d && d.moves[i];
        html += '<span class="rv-m' + (i === RV.ply - 1 ? ' cur' : '') + '" data-i="' + i + '">' + badge(info ? info.cls : '') + '<span>' + RV.prep.sans[i] + '</span></span>';
      }
      html += '</div>';
    }
    rvBody.innerHTML = html;
    if (RV.tab === 'moves') rvScrollCur();
  }
  function rvScrollCur() {
    const cur = rvBody.querySelector('.rv-m.cur');
    if (!cur) { if (RV.ply === 0) rvPanel.scrollTop = 0; return; }
    const pr = rvPanel.getBoundingClientRect(), cr = cur.getBoundingClientRect();
    if (cr.top < pr.top + 4) rvPanel.scrollTop += cr.top - pr.top - 8;
    else if (cr.bottom > pr.bottom - 4) rvPanel.scrollTop += cr.bottom - pr.bottom + 8;
  }
  function renderReview(dir, fromAnalysis) {
    if (reviewEl.hidden || !RV.prep) return;
    // a fresh grade only touches the board when it is for the move on show
    if (!fromAnalysis || RV.g.an.length === RV.ply) rvRenderBoard(fromAnalysis ? 0 : dir);
    rvRenderEval();
    rvRenderNames();
    rvRenderCur();
    rvRenderGraph();
    const keep = rvPanel.scrollTop;
    rvRenderPanel();
    if (fromAnalysis && RV.tab === 'moves') rvPanel.scrollTop = keep;
  }
  function setPly(k) {
    if (!RV.prep) return;
    k = Math.max(0, Math.min(RV.prep.moves.length, k));
    if (k === RV.ply) return;
    const dir = k - RV.ply === 1 ? 1 : k - RV.ply === -1 ? -1 : 0;
    RV.ply = k;
    rvRenderBoard(dir);
    rvRenderEval();
    rvRenderCur();
    rvRenderGraph();
    if (RV.tab === 'moves') {
      rvBody.querySelectorAll('.rv-m.cur').forEach((e) => e.classList.remove('cur'));
      const el = rvBody.querySelector('.rv-m[data-i="' + (k - 1) + '"]');
      if (el) el.classList.add('cur');
      rvScrollCur();
    }
  }
  function reviewKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowLeft') setPly(RV.ply - 1);
    else if (k === 'ArrowRight') setPly(RV.ply + 1);
    else if (k === 'Home' || k === 'ArrowUp') setPly(0);
    else if (k === 'End' || k === 'ArrowDown') setPly(Infinity);
    else if (k === 'Escape') closeReview();
    else if (k === 'f' || k === 'F') { RV.flipped = !RV.flipped; renderReview(0); }
    else return;
    e.preventDefault();
  }

  $('rvBack').addEventListener('click', closeReview);
  $('rvFlip').addEventListener('click', () => { RV.flipped = !RV.flipped; renderReview(0); });
  $('rvTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if (!b || b.dataset.tab === RV.tab) return;
    RV.tab = b.dataset.tab;
    rvPanel.scrollTop = 0;
    rvRenderPanel();
  });
  $('rvNav').addEventListener('click', (e) => {
    const b = e.target.closest('[data-nav]');
    if (!b) return;
    const a = b.dataset.nav;
    setPly(a === 'first' ? 0 : a === 'prev' ? RV.ply - 1 : a === 'next' ? RV.ply + 1 : Infinity);
  });
  rvBody.addEventListener('click', (e) => {
    const m = e.target.closest('.rv-m');
    if (m) setPly(+m.dataset.i + 1);
  });
  let graphDrag = -1;
  const graphAt = (e) => {
    const r = rvGraph.getBoundingClientRect(), n = RV.prep ? RV.prep.moves.length : 0;
    setPly(Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * n));
  };
  rvGraph.addEventListener('pointerdown', (e) => {
    graphDrag = e.pointerId;
    try { rvGraph.setPointerCapture(e.pointerId); } catch (_) {}
    graphAt(e);
  });
  rvGraph.addEventListener('pointermove', (e) => { if (e.pointerId === graphDrag) graphAt(e); });
  const graphUp = (e) => { if (e.pointerId === graphDrag) graphDrag = -1; };
  rvGraph.addEventListener('pointerup', graphUp);
  rvGraph.addEventListener('pointercancel', graphUp);
  reviewEl.addEventListener('contextmenu', (e) => e.preventDefault());

  function reviewLayout() {
    if (reviewEl.hidden) return;
    const vw = window.innerWidth, vh = window.innerHeight, m = Math.min(vw, vh);
    const pad = clamp(8, m * 0.03, 24);
    const fs = parseFloat(document.documentElement.style.fontSize) || 14;
    const g = clamp(6, m * 0.014, 12);
    rvWrap.style.setProperty('--g', g + 'px');
    const nameH = 2 * fs, lg = g * 0.6;
    const row = vw >= 640 && vw >= vh * 1.15;
    let S0, ew;
    if (row) {
      const side = clamp(250, vw * 0.28, 340);
      ew = clamp(16, vh * 0.032, 24);
      S0 = Math.min(vh - 2 * pad - 2 * nameH - 2 * lg, vw - 2 * pad - side - ew - g - g * 2.5);
      rvWrap.style.setProperty('--rside', side + 'px');
    } else {
      ew = clamp(14, vw * 0.045, 20);
      // header, nav, graph and at least a few rows of panel under the board
      const below = (2.8 + 3.2 + 4.6 + 9) * fs + 4 * g;
      S0 = Math.min(vw - 2 * pad - ew - g, vh - 2 * pad - 2 * nameH - 2 * lg - below);
    }
    S0 = Math.floor(clamp(160, S0, 900) / 8) * 8;
    rvWrap.classList.toggle('row', row);
    rvWrap.classList.toggle('col', !row);
    rvWrap.style.setProperty('--S', S0 + 'px');
    rvWrap.style.setProperty('--ew', ew + 'px');
    rvWrap.style.setProperty('--rh', (vh - 2 * pad) + 'px');
    rvWrap.style.setProperty('--lh', (S0 + 2 * nameH + 2 * lg) + 'px');
    RV.S = S0; RV.q = S0 / 8;
    rvRenderBoard(0);
    rvRenderGraph();
  }
  window.addEventListener('resize', () => { if (!reviewEl.hidden) reviewLayout(); });

  /* ---------- layout: everything sized from the viewport ---------- */
  const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
  const layoutInfo = { q: 45 };
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const m = Math.min(vw, vh);
    const pad = clamp(8, m * 0.03, 24);
    const fs = clamp(12, Math.min(vw / 30, vh / 44), 16);
    document.documentElement.style.fontSize = fs + 'px';
    const g = clamp(6, m * 0.014, 12);
    gameEl.style.setProperty('--g', g + 'px');
    const set = (S0) => { gameEl.style.setProperty('--S', S0 + 'px'); };

    // column: measure what is not board
    gameEl.classList.add('col'); gameEl.classList.remove('row', 'narrow');
    set(300);
    const extraCol = gameEl.offsetHeight - 300;
    const sCol = Math.min(vw - 2 * pad, vh - 2 * pad - extraCol);

    // row: board column beside a side panel
    const side = clamp(220, vw * 0.26, 300);
    gameEl.classList.add('row'); gameEl.classList.remove('col');
    gameEl.style.setProperty('--side', side + 'px');
    const extraRow = gameEl.querySelector('.bcol').offsetHeight - 300;
    const sRow = Math.min(vh - 2 * pad - extraRow, vw - 2 * pad - side - g * 2.5);

    const useRow = vw >= 600 && sRow > sCol * 1.05;
    let S0 = Math.floor(clamp(160, useRow ? sRow : sCol, 900) / 8) * 8;
    gameEl.classList.toggle('row', useRow);
    gameEl.classList.toggle('col', !useRow);
    gameEl.classList.toggle('narrow', !useRow && S0 < 400);
    set(S0);
    layoutInfo.q = S0 / 8;
    gameEl.style.setProperty('--q', layoutInfo.q + 'px');
    renderPieces();
    if (!promoEl.hidden && promoMoves) openPromo(promoMoves);
    renderMoves();
  }
  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout).catch(() => {});

  /* ---------- boot ---------- */
  render();
  layout();
  gameEl.classList.add('ready');
  showView('home');
  V.ready();

  import('../_shared/rooms.js').then((mod) => {
    Rooms = mod;
    refreshHome();
    if (!Rooms.available) return;
    const urlCode = Rooms.codeFromUrl();
    const saved = store.get(ROOM_KEY);
    if (urlCode) joinRoom(urlCode, 'url');
    else if (saved && saved.code && Date.now() - (saved.at || 0) < 1000 * 60 * 60 * 24) joinRoom(saved.code, 'saved');
  }).catch(() => {
    Rooms = null;
    refreshHome();
  });
})();
</script>
</body>
</html>
