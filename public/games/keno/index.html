<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Keno</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #000000;
    --bg-2: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --surface-3: #2a2e35;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --gap: 10px;
    --pad: 12px;
    --bw: 300px;
    --bh: 240px;
    --cs: 28px;
    --cg: 4px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; }

  /* ---------- layout ---------- */
  .app {
    position: fixed; inset: 0;
    margin: 0 auto;
    max-width: 1180px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "head" "stage" "panel";
    gap: var(--gap);
    padding: var(--pad);
    visibility: hidden;
  }
  .app.ready { visibility: visible; }
  .app.side {
    grid-template-columns: minmax(0, 1fr) clamp(17em, 30vw, 21em);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "stage head" "stage panel";
  }

  .head { grid-area: head; display: flex; gap: 0.5em; align-items: stretch; min-width: 0; }
  .brand { flex: 1 1 auto; align-self: center; min-width: 0; padding-right: 0.5em; }
  .brand h1 {
    margin: 0;
    font: 600 1.05em/1 var(--font);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .brand h1::before {
    content: "";
    display: inline-block;
    width: 0.62em; height: 0.62em;
    margin-right: 0.62em;
    background: var(--brand);
    vertical-align: 0.02em;
  }
  .head.nobrand .brand { display: none; }
  .head.nobrand .stat { flex: 1 1 0; }

  .stat {
    position: relative;
    min-width: 7.2em;
    padding: 0.5em 0.85em 0.55em;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .lab {
    display: block;
    font: 600 clamp(11px, 0.66em, 12px)/1.2 var(--font);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .num {
    display: block;
    font: 600 1.4em/1.15 var(--font-display);
    font-variant-numeric: tabular-nums;
    margin-top: 0.15em;
    white-space: nowrap;
    overflow: hidden;
    transform-origin: 0 60%;
    transition: color 300ms var(--ease);
  }
  .num.gain { color: var(--brand-hover); transition: none; }
  .num.bump { animation: bump 260ms var(--ease); }
  @keyframes bump { 35% { transform: scale(1.14); color: var(--brand-hover); } }
  .num.off { color: var(--muted); }

  /* ---------- stage ---------- */
  .stage {
    grid-area: stage;
    position: relative;
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--gap);
  }

  .bar {
    flex: none;
    width: var(--bw);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .bar > div { background: var(--surface); padding: 0.45em 0.7em 0.5em; min-width: 0; }
  .bar .num { font-size: 1.25em; }

  .bwrap {
    position: relative;
    flex: none;
    width: var(--bw); height: var(--bh);
  }
  .board {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    gap: var(--cg);
    touch-action: none;
  }
  .nt, .nt *, .nt *::before, .nt *::after { transition: none !important; animation: none !important; }

  .c {
    position: relative;
    display: grid; place-items: center;
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    border: 0;
    border-radius: 2px;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line);
    color: var(--muted);
    font: 600 calc(var(--cs) * 0.4)/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    cursor: default;
    transition: background 180ms var(--ease), box-shadow 180ms var(--ease), color 180ms var(--ease), transform 160ms var(--ease), opacity 200ms var(--ease);
  }
  .c:focus { outline: none; }
  .c:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 1px; z-index: 1; }
  .board.live .c { cursor: pointer; }
  @media (hover: hover) {
    .board.live .c:hover { background: var(--surface-3); color: #fff; }
    .board.live .c.p:hover { background: var(--surface-3); }
  }
  .board.live .c:active { transform: scale(0.92); }

  /* picked */
  .c.p { box-shadow: inset 0 0 0 2px var(--brand); color: var(--brand-hover); background: var(--surface); }
  /* drawn, not picked */
  .c.d { background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22); color: #fff; }
  /* hit */
  .c.h { background: var(--brand); box-shadow: none; color: #fff; z-index: 1; }
  .c.h::after {
    content: "";
    position: absolute; right: 12%; top: 12%;
    width: 16%; height: 16%;
    background: #fff;
  }
  /* round over: picks that missed fade back a little */
  .board.over .c.p:not(.h) { opacity: 0.6; }

  .c.in { animation: cin 300ms var(--ease); }
  @keyframes cin {
    0% { transform: scale(0.55); }
    55% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .c.h.in { animation: hin 420ms var(--ease); }
  @keyframes hin {
    0% { transform: scale(0.5); background: #fff; }
    40% { transform: scale(1.22); background: #fff; }
    70% { background: var(--brand-hover); }
    100% { transform: scale(1); background: var(--brand); }
  }
  .c.tap { animation: tap 220ms var(--ease); }
  @keyframes tap { 40% { transform: scale(0.86); } }

  .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 3; }
  .pt {
    position: absolute; left: 0; top: 0;
    background: var(--brand-hover);
    transition: transform 520ms var(--ease), opacity 520ms ease-in;
  }

  .result {
    position: absolute; left: 50%; top: 50%;
    z-index: 4;
    min-width: 9.5em;
    padding: 0.9em 1.3em 1em;
    background: var(--surface);
    border: 1px solid var(--brand);
    border-radius: 2px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.86);
    transition: opacity 200ms var(--ease), transform 300ms var(--ease);
  }
  .result.on { opacity: 1; transform: translate(-50%, -50%); }
  .result.lose { border-color: var(--outline); }
  .result .big {
    display: block;
    font: 300 2.6em/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .result.win .big { color: var(--brand-hover); }
  .result.lose .big { color: var(--muted); }
  .result .sub { margin-top: 0.55em; color: #fff; }
  .result .tag {
    display: inline-block;
    margin-top: 0.6em;
    padding: 0.45em 0.6em;
    background: var(--brand);
    color: #fff;
    font: 600 11px/1 var(--font);
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .result .tag[hidden] { display: none; }

  /* ---------- panel ---------- */
  .panel {
    grid-area: panel;
    min-width: 0;
    display: grid;
    gap: var(--gap);
    align-content: start;
  }

  .pay { min-width: 0; }
  .payhead { display: flex; justify-content: space-between; gap: 0.6em; margin-bottom: 0.4em; }
  .ptab {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .ptab > div {
    min-width: 0;
    background: var(--surface);
    display: flex; align-items: center;
    padding: 0 0.55em;
    font: 600 1em/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    transition: background 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
  }
  .ptab > div.hd { font: 600 clamp(11px, 0.66em, 12px)/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .ptab .o { color: var(--muted); font-weight: 400; font-size: 0.86em; }
  .ptab .x { color: #fff; }
  /* horizontal: a header column, then one column per paying hit count */
  .ptab.hz { grid-auto-flow: column; grid-template-rows: repeat(3, 1.75em); }
  .ptab.hz > div:not(.hd) { justify-content: center; padding: 0 0.2em; }
  /* vertical: header row, then one row per paying hit count */
  .ptab.vt { grid-template-columns: 1fr 1fr 1.4fr; grid-auto-rows: 2em; }
  .ptab.vt > div.hd { height: 2em; }
  .ptab.vt > div:nth-child(3n) { justify-content: flex-end; }
  .app.side.short .ptab.vt { grid-auto-rows: 1.5em; }
  .app.side.short .ptab.vt > div.hd { height: 1.5em; }
  .app.side.short .stp { height: 2.5em; }
  .app.side.short .acts { grid-auto-rows: 2.8em; }
  .app.side.short .payhead { margin-bottom: 0.3em; }
  .ptab .live { box-shadow: inset 0 0 0 1px var(--brand); color: var(--brand-hover); }
  .ptab .live.o { color: var(--brand-hover); }
  .ptab .win { background: var(--brand); color: #fff; box-shadow: none; }
  .ptab .win.o, .ptab .win.x { color: #fff; }
  .ptab .win.pop { animation: ppop 360ms var(--ease); }
  @keyframes ppop { 0% { background: #fff; } 100% { background: var(--brand); } }
  .ptab .none { justify-content: center; color: var(--muted); }

  .fields { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--gap); }
  .app.side .fields { grid-template-columns: minmax(0, 1fr); }
  .field .lab { margin-bottom: 0.4em; }
  .app.side.short .field { display: grid; grid-template-columns: 8em minmax(0, 1fr); align-items: center; }
  .app.side.short .field .lab { margin: 0; }
  .stp {
    display: grid;
    height: 2.9em;
    border: 1px solid var(--outline);
    border-radius: 2px;
  }
  .stp.bet { grid-template-columns: 1fr 1fr 2.2fr 1fr 1fr; }
  .stp.rd { grid-template-columns: 1fr 2fr 1fr; }
  .stp button {
    min-width: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    font: 600 1.05em/1 var(--font);
    cursor: pointer;
    transition: background 140ms var(--ease), opacity 140ms var(--ease);
  }
  .stp button.small { font-size: 0.82em; letter-spacing: 0.04em; }
  .stp > * + * { border-left: 1px solid var(--line); }
  .stp button:hover { background: rgba(255, 255, 255, 0.08); }
  .stp button:active { background: rgba(255, 255, 255, 0.14); }
  .stp button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: -2px; }
  .stp button:disabled { opacity: 0.3; cursor: default; background: transparent; }
  .stp .val {
    display: grid; place-items: center;
    min-width: 0;
    font: 600 1.15em/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
  }
  .stp.lock .val { color: var(--muted); }
  .stp.run .val { color: var(--brand-hover); }

  .acts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: 3.3em; gap: var(--gap); }
  .app.row4 .acts { grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 0.8fr) minmax(0, 1.4fr); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
    min-width: 0;
    padding: 0 0.8em;
    border-radius: 0;
    border: 1px solid var(--outline);
    background: transparent;
    font: 600 clamp(11px, 0.8rem, 13px) var(--font);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    transition: background 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease), opacity 160ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: 2px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn:disabled, .btn:disabled:hover { opacity: 0.3; cursor: default; background: transparent; border-color: var(--outline); transform: none; }
  .btn.primary:disabled { background: var(--brand); border-color: var(--brand); }
  .btn.stop { background: #fff; border-color: #fff; color: #000; }
  .btn.stop:hover { background: #e4e6ea; border-color: #e4e6ea; }
  .btn.stop:active { background: #c9ccd2; border-color: #c9ccd2; }
  .btn kbd { font: inherit; opacity: 0.55; }
  .app:not(.wide) .btn kbd { display: none; }

  /* ---------- overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding: 12px;
    overflow: auto;
    background: rgba(0, 0, 0, 0.72);
    opacity: 0;
    transition: opacity 220ms var(--ease);
  }
  .overlay[hidden] { display: none; }
  .overlay.show { opacity: 1; }
  .card {
    width: min(100%, 23em);
    padding: 1.4em 1.4em 1.3em;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 2px;
    transform: translateY(24px);
    transition: transform 300ms var(--ease);
  }
  .card[hidden] { display: none; }
  .overlay.show .card { transform: none; }
  .card h2 {
    margin: 0;
    font: 600 0.95em/1.1 var(--font);
    letter-spacing: 0.2em; text-transform: uppercase;
  }
  .card h2::before {
    content: "";
    display: inline-block;
    width: 0.62em; height: 0.62em;
    margin-right: 0.62em;
    background: var(--brand);
    vertical-align: 0.02em;
  }
  .card .line { margin: 0.7em 0 0; color: var(--muted); font-size: 0.9em; line-height: 1.45; }
  .ov-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    margin-top: 1.1em;
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .ov-stats > div { padding: 0.75em 0.85em 0.8em; min-width: 0; }
  .ov-stats > div + div { border-left: 1px solid var(--line); }
  .ov-stats .num { font-size: 2em; font-weight: 300; line-height: 1.1; }
  .card .btns { display: flex; gap: 0.5em; margin-top: 1.2em; }
  .card .btns .btn { flex: 1 1 8em; min-height: 3.3em; }

  @media (prefers-reduced-motion: reduce) {
    .c, .result, .overlay, .card, .num, .ptab > div { transition: none; }
    .c.in, .c.h.in, .c.tap, .num.bump, .ptab .win.pop { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="head" id="head">
    <div class="brand"><h1>Keno</h1></div>
    <div class="stat"><span class="lab">Bankroll</span><span class="num" id="cashNum">1,000</span></div>
  </header>

  <main class="stage" id="stage">
    <div class="bar" id="bar">
      <div><span class="lab">Spots</span><span class="num" id="sSpots">0</span></div>
      <div><span class="lab">Drawn</span><span class="num" id="sDrawn">0/20</span></div>
      <div><span class="lab">Hits</span><span class="num" id="sHits">0</span></div>
      <div><span class="lab">Win</span><span class="num" id="sWin">0</span></div>
    </div>
    <div class="bwrap" id="bwrap">
      <div class="board" id="board" role="grid" aria-label="Keno board"></div>
      <div class="fx" id="fx"></div>
      <div class="result" id="result" aria-live="polite">
        <span class="big" id="resBig"></span>
        <span class="lab sub" id="resSub"></span>
        <span class="tag" id="resTag" hidden>New best</span>
      </div>
    </div>
  </main>

  <aside class="panel" id="panel">
    <div class="pay">
      <div class="payhead"><span class="lab" id="payLab">Paytable</span><span class="lab" id="payRtp"></span></div>
      <div class="ptab hz" id="ptab"></div>
    </div>
    <div class="fields">
      <div class="field">
        <span class="lab">Stake</span>
        <div class="stp bet" id="betStp">
          <button type="button" class="small" id="betHalf" aria-label="Half stake">1/2</button>
          <button type="button" id="betDown" aria-label="Lower stake">-</button>
          <span class="val" id="betVal">10</span>
          <button type="button" id="betUp" aria-label="Raise stake">+</button>
          <button type="button" class="small" id="betDouble" aria-label="Double stake">2x</button>
        </div>
      </div>
      <div class="field">
        <span class="lab" id="rdLab">Auto rounds</span>
        <div class="stp rd" id="rdStp">
          <button type="button" id="rdDown" aria-label="Fewer rounds">-</button>
          <span class="val" id="rdVal">10</span>
          <button type="button" id="rdUp" aria-label="More rounds">+</button>
        </div>
      </div>
    </div>
    <div class="acts">
      <button class="btn" id="qpBtn" type="button">Quick pick <kbd>Q</kbd></button>
      <button class="btn" id="clrBtn" type="button">Clear <kbd>C</kbd></button>
      <button class="btn" id="autoBtn" type="button">Auto <kbd>A</kbd></button>
      <button class="btn primary" id="playBtn" type="button">Play <kbd>Space</kbd></button>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="startCard" role="dialog" aria-labelledby="startTitle" hidden>
    <h2 id="startTitle">Keno</h2>
    <p class="line">Tap 1 to 10 numbers, then Space or Play draws 20. Q quick pick, C clear, A auto.</p>
    <div class="ov-stats">
      <div><span class="lab">Bankroll</span><span class="num" id="stCash">1,000</span></div>
      <div><span class="lab">Best bankroll</span><span class="num" id="stBest">1,000</span></div>
    </div>
    <div class="btns"><button class="btn primary" id="goBtn" type="button">Play</button></div>
  </div>
  <div class="card" id="overCard" role="dialog" aria-labelledby="overTitle" aria-live="polite" hidden>
    <h2 id="overTitle">Game over</h2>
    <p class="line">Out of chips</p>
    <div class="ov-stats">
      <div><span class="lab">Bankroll</span><span class="num" id="ovCash">0</span></div>
      <div><span class="lab">Best bankroll</span><span class="num" id="ovBest">1,000</span></div>
    </div>
    <div class="btns"><button class="btn primary" id="againBtn" type="button">New bankroll</button></div>
  </div>
</div>

<script src="../_shared/bridge.js" data-game="keno"></script>
<script>
(function () {
  'use strict';

  const V = window.Vela || { embedded: false, ready() {}, score() {}, gameOver() { return false; }, best() { return 0; }, onPause() {} };

  /* ===== LOGIC START (pure, no DOM) ===== */
  const KN = (function () {
    const N = 80, DRAW = 20, MAX_SPOTS = 10, START = 1000, MAX_BET = 100000;
    // IGT video keno (Spot Keno pay table 4 in the Wizard of Odds keno pay table report).
    // Values are "pays for 1": the total returned per chip staked.
    const PAY = {
      1: { 1: 3 },
      2: { 2: 15 },
      3: { 2: 2, 3: 46 },
      4: { 2: 2, 3: 5, 4: 91 },
      5: { 3: 3, 4: 12, 5: 810 },
      6: { 3: 3, 4: 4, 5: 70, 6: 1600 },
      7: { 3: 1, 4: 2, 5: 21, 6: 400, 7: 7000 },
      8: { 4: 2, 5: 12, 6: 98, 7: 1652, 8: 10000 },
      9: { 4: 1, 5: 6, 6: 44, 7: 335, 8: 4700, 9: 10000 },
      10: { 5: 5, 6: 24, 7: 142, 8: 1000, 9: 4500, 10: 10000 },
    };

    function choose(n, k) {
      if (k < 0 || k > n) return 0;
      let c = 1;
      for (let i = 0; i < k; i++) c = c * (n - i) / (i + 1);
      return c;
    }
    // Chance of exactly h hits with k spots: C(k,h) C(80-k, 20-h) / C(80,20).
    function prob(k, h) {
      if (h < 0 || h > k) return 0;
      return choose(k, h) * choose(N - k, DRAW - h) / choose(N, DRAW);
    }
    function pays(k, h) { return (PAY[k] && PAY[k][h]) || 0; }
    function rtp(k) {
      let r = 0;
      for (let h = 0; h <= k; h++) r += prob(k, h) * pays(k, h);
      return r;
    }
    // Paying rows for k spots, lowest hit count first.
    function rows(k) {
      const out = [];
      if (!PAY[k]) return out;
      for (let h = 0; h <= k; h++) if (pays(k, h) > 0) out.push({ h, pays: pays(k, h), p: prob(k, h) });
      return out;
    }

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const rint = (rnd, n) => Math.min(n - 1, Math.floor(rnd() * n));

    function newState() {
      return { v: 1, cash: START, bet: 10, picks: [], qp: 10, rounds: 10, peak: START, rid: 0, round: null };
    }
    function drawing(S) { return !!(S.round && S.round.phase === 'draw'); }
    function maxBet(S) { return Math.min(MAX_BET, S.cash); }
    function isBroke(S) { return !drawing(S) && S.cash < 1; }

    function setBet(S, v) {
      if (drawing(S)) return false;
      v = clamp(Math.floor(v) || 1, 1, Math.max(1, maxBet(S)));
      if (v === S.bet) return false;
      S.bet = v;
      return true;
    }
    function fitBet(S) {
      if (!drawing(S) && S.bet > maxBet(S) && S.cash >= 1) { S.bet = maxBet(S); return true; }

    }

    // Returns 'add', 'remove', or '' when the tap does nothing (drawing, or already 10 spots).
    function toggle(S, n) {

    function clear(S) {
      if (drawing(S) || !S.picks.length) return false;
      S.picks = [];
      return true;
    }
    function sample(rnd, count) {
      const pool = [];

      for (let i = 0; i < count; i++) {
        const j = i + rint(rnd, N - i);

    // Quick pick keeps the current spot count, or the last one used when the board is empty.

      return true;
    }

      if (!Array.isArray(S.picks) || S.picks.length > MAX_SPOTS) return false;
      if (S.picks.some((n) => !Number.isInteger(n) || n < 1 || n > N) || new Set(S.picks).size !== S.picks.length) return false;
      if (!Number.isInteger(S.qp) || !Number.isInteger(S.rounds) || S.rounds < 1) return false;
      if (!Number.isInteger(S.peak) || !Number.isInteger(S.rid)) return false;
      const R = S.round;
      if (R) {
        if (!Array.isArray(R.picks) || !Array.isArray(R.drawn) || R.drawn.length !== DRAW || new Set(R.drawn).size !== DRAW) return false;
        if (R.picks.length < 1 || R.picks.length > MAX_SPOTS) return false;
        if (['draw', 'done'].indexOf(R.phase) < 0) return false;
        if (R.hits !== hitsOf(R.picks, R.drawn) || R.win !== R.bet * pays(R.picks.length, R.hits)) return false;
      }
      return true;
    }

      N, DRAW, MAX_SPOTS, START, MAX_BET, PAY, choose, prob, pays, rtp, rows, newState, drawing, maxBet, isBroke,
      setBet, fitBet, toggle, clear, quickPick, canPlay, hitsOf, start, settle, fresh, valid, sample,
    };
  })();
  /* ===== LOGIC END ===== */

  /* ---------- storage ---------- */
  const KEY = 'vela:keno:state';
  function load() {
    try {
      const S = JSON.parse(localStorage.getItem(KEY));
      return KN.valid(S) ? S : null;
    } catch (_) { return null; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} }

  /* ---------- helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const clamp = (lo, v, hi) => Math.max(lo, Math.min(hi, v));
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (function () {
    const c = window.crypto;
    if (c && c.getRandomValues) {

      return () => { c.getRandomValues(buf); return buf[0] / 4294967296; };
    }
    return Math.random;
  })();
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  function fmtOdds(p) {
    const x = 1 / p;
    if (x < 10) return x.toFixed(1);
    if (x < 10000) return fmt(x);
    if (x < 1e6) return (x / 1000).toFixed(x < 1e5 ? 1 : 0) + 'K';
    return (x / 1e6).toFixed(1) + 'M';
  }
  function fit(el) {
    el.style.fontSize = '';
    if (el.scrollWidth > el.clientWidth + 1 && el.clientWidth > 0) {
      const cur = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(9, Math.floor(cur * el.clientWidth / el.scrollWidth)) + 'px';
    }
  }
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ---------- DOM ---------- */
  const app = $('app'), head = $('head'), stage = $('stage'), bar = $('bar');
  const bwrap = $('bwrap'), board = $('board'), fx = $('fx'), result = $('result'), ptab = $('ptab');
  const overlay = $('overlay'), startCard = $('startCard'), overCard = $('overCard');
  const playBtn = $('playBtn'), autoBtn = $('autoBtn'), qpBtn = $('qpBtn'), clrBtn = $('clrBtn');

  const cells = [null];
  for (let n = 1; n <= KN.N; n++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'c';
    b.dataset.n = n;
    b.textContent = n;
    board.appendChild(b);
    cells.push(b);
  }

  let st = load() || KN.newState();
  let overlayOpen = false;
  let L = null;

  // What the board shows of the last round: how many balls are out, and whether
  // the marks are still up (they clear as soon as the picks change).
  let shown = 0;
  let view = false;
  let autoLeft = 0;     // rounds still to start in an auto run, 0 when not running
  let autoOn = false;

  /* ---------- timers (stop while the arcade pauses the game) ---------- */
  let token = 0;
  let paused = false;
  const timers = new Set();
  let held = [];
  function later(fn, ms) {
    const t = token;
    const id = setTimeout(() => {
      timers.delete(id);
      if (t !== token) return;
      if (paused) held.push(fn); else fn();
    }, ms);
    timers.add(id);
  }
  function clearTimers() { timers.forEach((id) => clearTimeout(id)); timers.clear(); held = []; }
  V.onPause((p) => {
    paused = !!p;
    if (!paused && held.length) {
      const run = held; held = [];
      const t = token;
      run.forEach((fn, i) => setTimeout(() => { if (t === token) fn(); }, 120 + i * 90));
    }
  });

  /* ---------- geometry ---------- */
  let payMode = '';
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight, m = Math.min(vw, vh);
    const fs = clamp(12, m / 42, 16);
    document.documentElement.style.fontSize = fs + 'px';
    const gap = Math.round(clamp(8, m * 0.018, 12));
    app.style.setProperty('--pad', Math.round(clamp(8, m * 0.025, 18)) + 'px');
    app.style.setProperty('--gap', gap + 'px');
    const side = vw >= 600 && vw >= vh * 1.15;
    app.classList.toggle('side', side);
    app.classList.toggle('narrow', !side && vw < 560);
    app.classList.toggle('row4', !side && vw >= 560);
    app.classList.toggle('short', side && vh < 520);
    app.classList.toggle('wide', vw >= 900 && vh >= 460);
    head.classList.remove('nobrand');
    if (head.scrollWidth > head.clientWidth + 1) head.classList.add('nobrand');

    const mode = side ? 'vt' : 'hz';
    if (mode !== payMode) { payMode = mode; payKey = ''; renderPay(); }

    const sw = stage.clientWidth, sh = stage.clientHeight;
    const barH = bar.offsetHeight || fs * 3.4;
    let cg = 4, cs = 20;
    for (let i = 0; i < 2; i++) {
      cs = Math.min((sw - cg * 9) / 10, (sh - barH - gap - cg * 7) / 8, 72);
      cs = Math.max(16, cs);
      cg = Math.max(3, Math.round(cs * 0.1));
    }
    cs = Math.floor(cs);
    const bw = cs * 10 + cg * 9, bh = cs * 8 + cg * 7;
    stage.style.setProperty('--bw', bw + 'px');
    stage.style.setProperty('--bh', bh + 'px');
    stage.style.setProperty('--cs', cs + 'px');
    stage.style.setProperty('--cg', cg + 'px');
    L = { cs, cg, bw, bh };
  }

  /* ---------- board ---------- */
  function drawnSet() {
    const R = st.round;
    if (!R || !view) return null;
    return new Set(R.drawn.slice(0, shown));
  }
  function paint(n, d) {
    const b = cells[n];
    const p = st.picks.indexOf(n) >= 0;
    const dr = !!(d && d.has(n));
    b.classList.toggle('p', p);
    b.classList.toggle('d', dr && !p);
    b.classList.toggle('h', dr && p);
    b.setAttribute('aria-label', n + (p ? ', picked' : '') + (dr ? (p ? ', hit' : ', drawn') : ''));
    b.setAttribute('aria-pressed', p ? 'true' : 'false');
  }
  function renderBoard() {
    const d = drawnSet();
    for (let n = 1; n <= KN.N; n++) paint(n, d);
    const R = st.round;
    board.classList.toggle('over', !!(R && view && R.phase === 'done'));
    board.classList.toggle('live', !KN.drawing(st) && !overlayOpen && !autoOn);
  }
  // Drop the last round's marks (picks stay) with no animation lag.
  function clearMarks() {
    if (!view) return;
    view = false;
    shown = 0;
    for (let n = 1; n <= KN.N; n++) cells[n].classList.remove('in');
    hideResult();
    renderBoard();
  }

  function center(n) {
    const i = n - 1, c = i % 10, r = Math.floor(i / 10);
    return { x: c * (L.cs + L.cg) + L.cs / 2, y: r * (L.cs + L.cg) + L.cs / 2 };
  }
  function burst(n, count, colors, reach) {
    if (reduceMotion || !L) return;
    const p = center(n);
    for (let k = 0; k < count; k++) {
      const d = document.createElement('div');
      d.className = 'pt';
      const s = Math.max(3, Math.round(L.cs * (0.1 + Math.random() * 0.08)));
      d.style.width = d.style.height = s + 'px';
      d.style.background = colors[k % colors.length];
      const a = (k / count) * Math.PI * 2 + Math.random() * 0.6;
      const r = L.cs * reach * (0.6 + Math.random() * 0.5);
      d.style.transform = 'translate(' + (p.x - s / 2) + 'px,' + (p.y - s / 2) + 'px)';
      fx.appendChild(d);
      d.getBoundingClientRect();
      d.style.transform = 'translate(' + (p.x - s / 2 + Math.cos(a) * r) + 'px,' + (p.y - s / 2 + Math.sin(a) * r) + 'px) rotate(' + Math.round(Math.random() * 180) + 'deg)';
      d.style.opacity = '0';
      setTimeout(() => d.remove(), 560);
    }
  }

  /* ---------- paytable ---------- */
  let payKey = '';
  let payCells = {};   // hit count -> cells in that row/column
  function renderPay() {
    const k = st.picks.length;
    $('payLab').textContent = k === 1 ? '1 spot' : k + ' spots';
    $('payRtp').textContent = k ? 'Return ' + (KN.rtp(k) * 100).toFixed(2) + '%' : '';
    const key = payMode + '|' + k;
    if (key === payKey) return;
    payKey = key;
    ptab.className = 'ptab ' + payMode;
    ptab.innerHTML = '';
    payCells = {};
    const rows = KN.rows(k);
    const add = (cls, text) => {
      const d = document.createElement('div');
      d.className = cls;
      d.textContent = text;
      ptab.appendChild(d);
      return d;
    };
    ['Hits', 'Pays', 'Odds 1 in'].forEach((t) => add('hd', payMode === 'hz' && t === 'Odds 1 in' ? '1 in' : t));
    ptab.style.gridTemplateColumns = payMode === 'hz' ? 'minmax(3.4em, auto) repeat(' + Math.max(1, rows.length) + ', minmax(0, 1fr))' : '';
    if (!rows.length) { add('none', '-'); add('none', '-'); add('none', '-'); return; }
    // Vertical lists the top prize first; horizontal reads left to right from the lowest.
    const list = payMode === 'vt' ? rows.slice().reverse() : rows;
    list.forEach((r) => {
      payCells[r.h] = [
        add('', String(r.h)),
        add('x', fmt(r.pays) + 'x'),
        add('o', fmtOdds(r.p)),
      ];
    });
  }
  function markPay(h, final) {
    Object.keys(payCells).forEach((key) => {
      const hh = Number(key);
      payCells[key].forEach((el) => {
        const isRow = hh === h;
        el.classList.toggle('live', isRow && !final);
        const was = el.classList.contains('win');
        el.classList.toggle('win', isRow && final);

        if (!(isRow && final)) el.classList.remove('pop');

  }

  /* ---------- panel ---------- */
  let cashShown = null, cashTween = 0, cashSnap = 0;
  function renderCash() {
    const el = $('cashNum'), v = st.cash;

    cashShown = v;
    if (from === null || reduceMotion || v < from) { el.textContent = fmt(v); el.classList.remove('gain'); fit(el); return; }
    el.classList.add('gain');
    const t0 = performance.now(), dur = 500;
    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);

  }

  let lastHits = -1;
  function renderStats() {
    const R = st.round, on = !!(R && view);
    const hits = on ? KN.hitsOf(R.picks, R.drawn.slice(0, shown)) : 0;
    const done = on && R.phase === 'done';
    const sS = $('sSpots'), sD = $('sDrawn'), sH = $('sHits'), sW = $('sWin');
    sS.textContent = st.picks.length + '/10';
    sD.textContent = (on ? shown : 0) + '/20';

  function renderControls() {
    const busy = KN.drawing(st) || autoOn;
    KN.fitBet(st);
    $('betVal').textContent = fmt(st.bet);
    fit($('betVal'));
    const mb = KN.maxBet(st);
    $('betHalf').disabled = busy || st.bet <= 1;
    $('betDown').disabled = busy || st.bet <= 1;
    $('betUp').disabled = busy || st.bet >= mb;

  function render() {
    renderCash();
    renderPay();
    renderStats();
    renderControls();
  }

  /* ---------- result ---------- */
  function showResult(R) {
    const win = R.win > 0;
    $('resBig').textContent = fmt(R.pays) + 'x';
    const net = R.win - R.bet;
    $('resSub').textContent = R.hits + (R.hits === 1 ? ' hit, ' : ' hits, ') + (net > 0 ? '+' + fmt(net) : net < 0 ? '-' + fmt(-net) : '0');

  /* ---------- rounds ---------- */

  }

  function play() {
    if (overlayOpen || !KN.canPlay(st)) return false;
    token++;
    clearTimers();
    hideResult();
    fx.innerHTML = '';
    for (let n = 1; n <= KN.N; n++) cells[n].classList.remove('in');
    const R = KN.start(st, rnd);
    if (!R) return false;
    view = true;
    shown = 0;
    lastHits = 0;
    save();
    renderBoard();

  }

  // Put balls out until `upto` are showing.
  function revealTo(upto) {
    const R = st.round;

    const many = fresh.length > 1;
    fresh.forEach((n) => {
      paint(n, d);
      const b = cells[n];

  }

  function finish() {
    const R = st.round;
    if (!R || R.phase !== 'draw') return;
    revealTo(KN.DRAW);
    KN.settle(st);
    report(R);
    save();
    renderBoard();
    render();
    showResult(R);
    if (R.win > 0 && !reduceMotion) {
      R.picks.forEach((n) => { if (R.drawn.indexOf(n) >= 0) burst(n, 6, ['#ff7a4d', '#ffffff'], 0.9); });

    if (autoOn) {
      if (autoLeft > 0 && KN.canPlay(st)) later(nextAuto, R.win > 0 ? 1000 : 560);

    }
    if (KN.isBroke(st)) later(checkBroke, 900);
  }

  function skip() {
    if (!KN.drawing(st) || autoOn) return;
    token++;
    clearTimers();
    finish();
  }

  /* ---------- auto ---------- */
  function startAuto() {
    if (autoOn || overlayOpen || !KN.canPlay(st)) return;
    autoOn = true;
    autoLeft = st.rounds;
    nextAuto();
  }
  function nextAuto() {
    if (!autoOn) return;
    if (autoLeft <= 0 || !KN.canPlay(st)) { stopAuto(); return; }
    autoLeft--;
    if (!play()) stopAuto();
    else renderControls();
  }
  function stopAuto() {
    if (!autoOn) return;
    autoOn = false;
    autoLeft = 0;
    // A round still drawing finishes on its own.
    renderControls();
    renderBoard();
  }

  function checkBroke() {
    if (KN.isBroke(st) && !overlayOpen) showOver();
  }

  /* ---------- picking ---------- */
  function tapCell(n) {
    if (overlayOpen || autoOn || KN.drawing(st)) return;
    clearMarks();
    const r = KN.toggle(st, n);
    if (!r) { restart(cells[n], 'tap'); return; }
    if (!reduceMotion) restart(cells[n], 'tap');
    save();
    renderBoard();
    render();
  }
  function quickPick() {
    if (overlayOpen || autoOn || KN.drawing(st)) return;
    clearMarks();
    if (!KN.quickPick(st, rnd)) return;
    save();
    renderBoard();
    if (!reduceMotion) st.picks.forEach((n, i) => setTimeout(() => restart(cells[n], 'in'), i * 30));
    render();
  }
  function clearPicks() {
    if (overlayOpen || autoOn || KN.drawing(st)) return;
    clearMarks();
    if (!KN.clear(st)) return;
    save();
    renderBoard();
    render();
  }

  const BET_STEPS = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000, 100000];
  const ROUND_STEPS = [5, 10, 25, 50, 100, 250, 500, 1000];
  function betStep(dir) {
    const b = st.bet;
    let v;
    if (dir > 0) { v = BET_STEPS.find((x) => x > b); if (v === undefined) v = KN.MAX_BET; }
    else { v = 1; for (const x of BET_STEPS) if (x < b) v = x; }
    return change(() => KN.setBet(st, Math.min(v, Math.max(1, KN.maxBet(st)))));
  }
  function roundStep(dir) {
    return change(() => {
      if (autoOn) return false;
      const r = st.rounds;
      let v;
      if (dir > 0) { v = ROUND_STEPS.find((x) => x > r); if (v === undefined) return false; }
      else { v = null; for (const x of ROUND_STEPS) if (x < r) v = x; if (v === null) return false; }
      st.rounds = v;
      return true;
    });
  }
  function change(fn) {
    if (overlayOpen || autoOn || KN.drawing(st)) return false;
    const ok = fn();
    if (ok) { save(); render(); }
    return ok;
  }

  /* ---------- overlay ---------- */
  function openOverlay(card) {
    startCard.hidden = card !== startCard;
    overCard.hidden = card !== overCard;
    overlayOpen = true;
    overlay.hidden = false;
    overlay.offsetWidth;
    overlay.classList.add('show');
    renderControls();
    setTimeout(() => { try { card.querySelector('.btn.primary').focus({ preventScroll: true }); } catch (_) {} }, 60);
  }
  function hideOverlay() {
    overlayOpen = false;
    overlay.classList.remove('show');
    overlay.hidden = true;
    renderControls();
  }
  const bestNow = () => fmt(Math.max(V.best(), st.peak, st.cash));
  function showStart() {
    $('stCash').textContent = fmt(st.cash);
    $('stBest').textContent = bestNow();
    openOverlay(startCard);
  }
  function showOver() {
    stopAuto();
    $('ovCash').textContent = fmt(st.cash);
    $('ovBest').textContent = bestNow();
    openOverlay(overCard);
  }

  /* ---------- input ---------- */
  board.addEventListener('click', (e) => {
    const b = e.target.closest('.c');
    if (b) tapCell(Number(b.dataset.n));
  });
  function mainAction() {
    if (overlayOpen) return;
    if (autoOn) { stopAuto(); return; }
    if (KN.drawing(st)) skip(); else play();
  }
  playBtn.addEventListener('click', mainAction);
  autoBtn.addEventListener('click', () => { if (autoOn) stopAuto(); else startAuto(); });
  qpBtn.addEventListener('click', quickPick);
  clrBtn.addEventListener('click', clearPicks);

  // Steppers repeat while held.
  function holdable(btn, fn) {
    let t = 0, fromPointer = false;
    const stop = () => { clearTimeout(t); t = 0; };
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || btn.disabled) return;
      fromPointer = true;
      fn();
      let delay = 380;
      const again = () => { if (btn.disabled || !fn()) { stop(); return; } delay = Math.max(50, delay * 0.8); t = setTimeout(again, delay); };
      t = setTimeout(again, delay);
    });
    ['pointerup', 'pointerleave', 'pointercancel', 'blur'].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener('click', () => { if (fromPointer) { fromPointer = false; return; } fn(); });
  }
  holdable($('betDown'), () => betStep(-1));
  holdable($('betUp'), () => betStep(1));
  holdable($('rdDown'), () => roundStep(-1));
  holdable($('rdUp'), () => roundStep(1));
  $('betHalf').addEventListener('click', () => change(() => KN.setBet(st, Math.max(1, Math.floor(st.bet / 2)))));
  $('betDouble').addEventListener('click', () => change(() => KN.setBet(st, Math.min(st.bet * 2, Math.max(1, KN.maxBet(st))))));

  $('goBtn').addEventListener('click', () => { hideOverlay(); renderBoard(); });
  $('againBtn').addEventListener('click', () => {
    if (KN.fresh(st)) { save(); }
    view = false; shown = 0;
    hideResult();
    hideOverlay();
    renderBoard();
    render();
  });

  document.addEventListener('pointerdown', () => { window.focus(); }, true);
  document.addEventListener('touchmove', (e) => {
    if (overlayOpen && overlay.contains(e.target)) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('contextmenu', (e) => { if (bwrap.contains(e.target)) e.preventDefault(); });
  document.addEventListener('dblclick', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const onBtn = e.target && e.target.tagName === 'BUTTON';
    if (overlayOpen) {
      if ((k === 'Enter' || k === ' ') && !onBtn) {
        e.preventDefault();
        (startCard.hidden ? $('againBtn') : $('goBtn')).click();
      }
      return;
    }
    if (e.repeat) return;
    if (k === ' ') { e.preventDefault(); mainAction(); return; }
    if (k === 'Enter') {
      if (onBtn) return;
      e.preventDefault();
      mainAction();
      return;
    }
    if (k === 'q') { e.preventDefault(); quickPick(); return; }
    if (k === 'c') { e.preventDefault(); clearPicks(); return; }
    if (k === 'a') { e.preventDefault(); if (autoOn) stopAuto(); else startAuto(); }
  });
  window.addEventListener('keyup', (e) => { if (e.key === ' ' && !overlayOpen) e.preventDefault(); });

  let raf = 0;
  function relayout() {
    layout();
    [$('sSpots'), $('sDrawn'), $('sHits'), $('sWin'), $('cashNum'), $('betVal')].forEach(fit);
  }
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(relayout); setTimeout(relayout, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout).catch(() => {});

  /* ---------- boot ---------- */
  // A round cut off mid-draw (page closed) is settled from its saved draw.
  if (KN.drawing(st)) {
    const R = st.round;
    KN.settle(st);
    report(R);
    save();
  }
  if (st.round && st.round.picks.length === st.picks.length && st.round.picks.every((n) => st.picks.indexOf(n) >= 0)) {
    view = true;
    shown = KN.DRAW;
  }
  KN.fitBet(st);
  layout();
  board.classList.add('nt');
  renderBoard();
  render();
  board.offsetWidth;
  board.classList.remove('nt');
  app.classList.add('ready');
  if (KN.isBroke(st)) showOver(); else showStart();
  V.ready();

})();
</script>
</body>
</html>
