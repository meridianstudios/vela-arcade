<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Basketball Manager</title>
<link rel="stylesheet" href="/fonts/type.css">
<style>
  :root {
    --bg: #0b0c0f;
    --surface: #16181c;
    --surface-2: #1f2227;
    --line: rgba(255, 255, 255, 0.1);
    --outline: rgba(255, 255, 255, 0.3);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.6);
    --faint: rgba(255, 255, 255, 0.35);
    --brand: #ea5426;
    --brand-hover: #ff7a4d;
    --brand-dark: #b83f19;
    --ease: cubic-bezier(0.1, 0.9, 0.2, 1);
    --pad: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { touch-action: manipulation; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num, td, th { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto auto 1fr; grid-template-columns: 100%; visibility: hidden; }
  .app.ready { visibility: visible; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px var(--pad); border-bottom: 1px solid var(--line); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand .sq { width: 10px; height: 10px; background: var(--brand); flex: none; }
  .brand .ab { font: 600 15px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; }
  .brand .rec { font: 300 20px/1 var(--font-display); }
  .brand .ph { font: 600 11px/1.2 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; flex: none; padding: 0; border: 1px solid var(--outline); border-radius: 0; background: transparent; transition: background 180ms var(--ease); }
  .icon-btn:hover { background: rgba(255,255,255,0.08); }
  .icon-btn svg { width: 18px; height: 18px; }

  .actions { display: flex; gap: 8px; padding: 10px var(--pad); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 0; min-width: 0; }
  .actions .msg { flex: 1 1 100%; font: 600 11px/1.2 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand-hover); }
  .actions .prog { flex: 1 1 100%; height: 2px; background: var(--line); position: relative; overflow: hidden; }
  .actions .prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); transition: width 160ms var(--ease); }

  .tabs { display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; height: 42px; padding: 0 14px; border: 0; background: transparent; color: var(--muted); font: 600 12px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; position: relative; white-space: nowrap; transition: color 150ms var(--ease); }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: var(--brand); }
  .tabs button .dot { display: inline-block; width: 6px; height: 6px; background: var(--brand); margin-left: 6px; vertical-align: 2px; }

  main { overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: var(--pad); min-height: 0; }
  main.enter > * { animation: rise 240ms var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (min-width: 900px) {
    .app { grid-template-columns: 200px 1fr; grid-template-rows: auto auto 1fr; }
    .top { grid-column: 1 / -1; }
    .actions { grid-column: 1 / -1; }
    .actions .btn { flex: 0 0 auto; min-width: 150px; }
    .tabs { grid-row: 3; grid-column: 1; flex-direction: column; overflow: auto; border-bottom: 0; border-right: 1px solid var(--line); padding: 8px 0; }
    .tabs button { height: 40px; text-align: left; padding: 0 var(--pad); }
    .tabs button[aria-selected="true"]::after { left: 0; right: auto; top: 8px; bottom: 8px; width: 3px; height: auto; }
    .tabs button[aria-selected="true"] { background: rgba(255,255,255,0.04); }
    main { grid-row: 3; grid-column: 2; padding: 20px 24px; }
  }

  /* ---------- blocks ---------- */
  .lab { font: 600 11px/1.2 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  h3 { margin: 22px 0 10px; font: 600 12px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  h3::before { content: ""; width: 8px; height: 8px; background: var(--brand); flex: none; }
  h3:first-child { margin-top: 0; }
  h3 .sp { flex: 1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .card { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
  .card .v { display: block; margin-top: 4px; font: 300 26px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.click { cursor: pointer; transition: background 150ms var(--ease); }
  .card.click:hover { background: var(--surface-2); }
  .meter { height: 6px; background: var(--line); margin-top: 8px; position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); }
  .meter.w i { background: #fff; }
  .meter b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #fff; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px 24px; }
  @media (min-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

  .seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--outline); margin-bottom: 12px; max-width: 100%; overflow-x: auto; }
  .seg button { height: 34px; padding: 0 14px; border: 0; background: transparent; font: 600 11px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; transition: background 150ms var(--ease); }
  .seg button + button { box-shadow: -1px 0 0 var(--line); }
  .seg button:hover { background: rgba(255,255,255,0.08); }
  .seg button[aria-pressed="true"] { background: var(--brand); box-shadow: none; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .sp { flex: 1; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 0; border: 1px solid var(--outline); background: transparent; font: 600 12px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; transition: background 160ms var(--ease), border-color 160ms var(--ease), transform 120ms var(--ease), opacity 160ms var(--ease); }
  .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.6); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.primary:active { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 11px; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn:focus-visible, .icon-btn:focus-visible, .tabs button:focus-visible, .seg button:focus-visible { outline: 1px solid var(--brand-hover); outline-offset: -2px; }

  /* ---------- tables ---------- */
  .tw { overflow: auto; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 0 9px; height: 34px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { height: 32px; font: 600 10.5px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface); position: sticky; top: 0; z-index: 1; user-select: none; }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--text); }
  th.on { color: var(--brand-hover); }
  th.l, td.l { text-align: left; }
  td.n, th.n { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  th.n { z-index: 2; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--surface-2); }
  tr.me td { color: #fff; }
  tr.me td.n { box-shadow: inset 3px 0 0 var(--brand); }
  tr.tot td { font-weight: 600; background: var(--surface-2); }
  tr.cut td { border-top: 1px solid var(--outline); }
  td.dim, span.dim { color: var(--faint); }
  td.hi { color: var(--brand-hover); }
  .tag { display: inline-block; padding: 3px 5px; background: var(--brand); color: #fff; font: 600 9.5px/1 var(--font); letter-spacing: 0.08em; text-transform: uppercase; vertical-align: 1px; }
  .tag.w { background: #fff; color: #000; }
  .tag.o { background: transparent; box-shadow: inset 0 0 0 1px var(--outline); color: var(--muted); }
  .r { display: inline-block; min-width: 26px; padding: 3px 0; text-align: center; font-weight: 600; }
  .r.a { background: var(--brand); color: #fff; }
  .r.b { background: rgba(234, 84, 38, 0.35); }
  .r.c { background: rgba(255, 255, 255, 0.08); }
  .r.d { color: var(--faint); }
  .ck { width: 16px; height: 16px; border: 1px solid var(--outline); display: inline-block; vertical-align: -3px; }
  .ck.on { background: var(--brand); border-color: var(--brand); box-shadow: inset 0 0 0 3px var(--surface); }

  .list { border: 1px solid var(--line); background: var(--surface); }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .li.click { cursor: pointer; transition: background 150ms var(--ease); }
  .li.click:hover { background: var(--surface-2); }
  .li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .d { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .wl { display: inline-block; width: 20px; text-align: center; font-weight: 700; }
  .wl.w { color: var(--brand-hover); }
  .wl.l { color: var(--faint); }

  .step { display: inline-flex; align-items: center; border: 1px solid var(--outline); }
  .step button { width: 30px; height: 28px; border: 0; background: transparent; font-size: 16px; line-height: 1; }
  .step button:hover { background: rgba(255,255,255,0.08); }
  .step span { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
  .arrows button { width: 28px; height: 28px; border: 1px solid var(--line); background: transparent; display: inline-grid; place-items: center; padding: 0; }
  .arrows button:hover { background: rgba(255,255,255,0.08); }
  .arrows svg { width: 14px; height: 14px; }

  /* bracket */
  .bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .bracket > div { display: flex; flex-direction: column; }
  .bcol { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
  .ser { border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: background 150ms var(--ease); }
  .ser:hover { background: var(--surface-2); }
  .ser div { display: flex; justify-content: space-between; padding: 7px 10px; gap: 8px; }
  .ser div + div { border-top: 1px solid var(--line); }
  .ser .win { color: var(--brand-hover); font-weight: 600; }
  .ser .me { box-shadow: inset 3px 0 0 var(--brand); }

  /* trade */
  .tside { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (min-width: 760px) { .tside { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .sum { margin-top: 14px; border: 1px solid var(--line); background: var(--surface); }
  .sum .li { padding: 8px 12px; }
  select.sel { height: 38px; padding: 0 10px; border: 1px solid var(--outline); border-radius: 0; background: var(--surface); }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,0.82); opacity: 0; transition: opacity 220ms var(--ease); }
  .overlay[hidden] { display: none; }
  .overlay.show { opacity: 1; }
  .sheet { width: min(100%, 26em); max-height: 100%; overflow: auto; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; transform: translateY(24px); transition: transform 300ms var(--ease); overscroll-behavior: contain; }
  .sheet.wide { width: min(100%, 980px); }
  .overlay.show .sheet { transform: none; }
  .sheet h2 { margin: 0; font: 600 14px/1.2 var(--font); letter-spacing: 0.18em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .sheet h2::before { content: ""; width: 10px; height: 10px; background: var(--brand); flex: none; }
  .sheet .line { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .shead { display: flex; align-items: center; gap: 10px; }
  .shead h2 { flex: 1; min-width: 0; }
  .btns { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btns .btn { flex: 1 1 8em; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); margin-top: 10px; }
  .slot .t { flex: 1; min-width: 0; }
  .slot .t b { display: block; font-weight: 600; }
  .slot .t span { color: var(--muted); font-size: 12px; }
  .pbig { display: flex; gap: 0; margin-top: 14px; border: 1px solid var(--line); }
  .pbig > div { flex: 1; padding: 10px 12px; min-width: 0; }
  .pbig > div + div { border-left: 1px solid var(--line); }
  .pbig .v { display: block; font: 300 30px/1.1 var(--font-display); }
  .bars { display: grid; grid-template-columns: 1fr; gap: 7px 22px; margin-top: 14px; }
  @media (min-width: 560px) { .bars { grid-template-columns: 1fr 1fr; } }
  .bar { display: grid; grid-template-columns: 74px 1fr 28px; align-items: center; gap: 10px; }
  .bar .meter { margin: 0; }
  .bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .toast { position: fixed; left: 50%; bottom: 20px; z-index: 30; padding: 12px 16px; background: #fff; color: #000; font: 600 12px/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 240ms var(--ease); white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .ov-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; border: 1px solid var(--line); }
  .ov-stats > div { padding: 10px 12px; }
  .ov-stats > div:nth-child(even) { border-left: 1px solid var(--line); }
  .ov-stats > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .ov-stats .n { display: block; margin-top: 2px; font: 300 28px/1.1 var(--font-display); }
  .teampick { margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <i class="sq"></i>
      <span class="ab" id="hAbbr"></span>
      <span class="rec" id="hRec"></span>
      <span class="ph" id="hPhase"></span>
    </div>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>
  <div class="actions" id="actions"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
</div>

<div class="overlay" id="ov" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="engine">
var BBM = (function () {
'use strict';

/* ---------------- rng ---------------- */
let R = 1;
function rnd() {
  R = (R + 0x6D2B79F5) | 0;
  let t = R;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function ri(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
function gauss(m, s) {
  let u = 0; while (!u) u = rnd();
  return (m || 0) + (s === undefined ? 1 : s) * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd());
}
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function wpick(a, wf) {
  let tot = 0;
  for (let i = 0; i < a.length; i++) tot += wf(a[i]);
  let x = rnd() * tot;
  for (let i = 0; i < a.length; i++) { x -= wf(a[i]); if (x <= 0) return a[i]; }
  return a[a.length - 1];
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

/* ---------------- constants ---------------- */
const CAP = 140000, TAX = 170000, MINPAY = 126000, MAXC = 49000, MINC = 1200;
const ROSTER_MAX = 15, ROSTER_MIN = 13;
const POS = ['PG', 'SG', 'SF', 'PF', 'C'];
const RK = ['ins', 'mid', 'tp', 'pas', 'reb', 'def', 'ath', 'sta'];
const RLABEL = { ins: 'Inside', mid: 'Mid', tp: 'Three', pas: 'Passing', reb: 'Rebound', def: 'Defence', ath: 'Athletic', sta: 'Stamina' };
const OFF = {
  PG: { ins: -8, mid: 2, tp: 5, pas: 13, reb: -16, def: 0, ath: 6, sta: 3 },
  SG: { ins: -4, mid: 5, tp: 7, pas: 3, reb: -11, def: 0, ath: 4, sta: 2 },
  SF: { ins: 0, mid: 2, tp: 2, pas: -2, reb: -3, def: 3, ath: 3, sta: 1 },
  PF: { ins: 6, mid: -2, tp: -6, pas: -7, reb: 9, def: 2, ath: 0, sta: 0 },
  C: { ins: 11, mid: -7, tp: -16, pas: -9, reb: 16, def: 4, ath: -3, sta: -2 },
};
const WT = {
  PG: { ins: 0.08, mid: 0.14, tp: 0.18, pas: 0.22, reb: 0.03, def: 0.12, ath: 0.15, sta: 0.08 },
  SG: { ins: 0.10, mid: 0.17, tp: 0.22, pas: 0.10, reb: 0.04, def: 0.14, ath: 0.15, sta: 0.08 },
  SF: { ins: 0.14, mid: 0.14, tp: 0.16, pas: 0.08, reb: 0.08, def: 0.17, ath: 0.15, sta: 0.08 },
  PF: { ins: 0.20, mid: 0.10, tp: 0.08, pas: 0.06, reb: 0.18, def: 0.17, ath: 0.13, sta: 0.08 },
  C: { ins: 0.24, mid: 0.05, tp: 0.04, pas: 0.05, reb: 0.24, def: 0.20, ath: 0.12, sta: 0.06 },
};
const ADJ = {};
POS.forEach((p) => { let s = 0; RK.forEach((k) => { s += WT[p][k] * OFF[p][k]; }); ADJ[p] = s; });
const HGT = { PG: [73, 1.6], SG: [76.5, 1.3], SF: [79, 1.2], PF: [81, 1.2], C: [83.5, 1.4] };
const DEV = { 19: 4.6, 20: 3.9, 21: 3.2, 22: 2.4, 23: 1.7, 24: 1.1, 25: 0.6, 26: 0.2, 27: -0.1, 28: -0.6, 29: -1.1, 30: -1.7, 31: -2.3, 32: -2.9, 33: -3.5, 34: -4.1 };
function devBase(age) { return age < 19 ? 5 : age > 34 ? -4.6 : DEV[age]; }
function growthLeft(age) { let s = 0; for (let a = age; a <= 26; a++) s += Math.max(0, devBase(a)); return s; }

const TEAMS = [
  // conf 0 = East, divisions 0..2 ; conf 1 = West, divisions 3..5
  ['Boston', 'Anchors', 'BOS', 0, 0, 4.9], ['New York', 'Skyline', 'NYS', 0, 0, 20], ['Brooklyn', 'Ironworks', 'BKN', 0, 0, 9],
  ['Philadelphia', 'Founders', 'PHI', 0, 0, 6.2], ['Toronto', 'Glaciers', 'TOR', 0, 0, 6.4],
  ['Chicago', 'Gale', 'CHI', 0, 1, 9.5], ['Detroit', 'Engines', 'DET', 0, 1, 4.4], ['Cleveland', 'Foundry', 'CLE', 0, 1, 2.1],
  ['Columbus', 'Explorers', 'CLB', 0, 1, 2.1], ['Milwaukee', 'Harbor', 'MIL', 0, 1, 1.6],
  ['Atlanta', 'Firebirds', 'ATL', 0, 2, 6.1], ['Miami', 'Barracudas', 'MIA', 0, 2, 6.1], ['Orlando', 'Manatees', 'ORL', 0, 2, 2.7],
  ['Charlotte', 'Copperheads', 'CHA', 0, 2, 2.7], ['Washington', 'Admirals', 'WAS', 0, 2, 6.3],

function blankRec() { return { w: 0, l: 0, hw: 0, hl: 0, cw: 0, cl: 0, pf: 0, pa: 0, str: 0, l10: [] }; }

function genDraftClass(y) {

/* ---------------- schedule ---------------- */
function makeSchedule() {
  const pairs = [];
  const add = (h, a, n) => { for (let i = 0; i < n; i++) pairs.push([h, a]); };
  const ts = S.teams;
  for (let i = 0; i < 30; i++) for (let j = i + 1; j < 30; j++) {
    const A = ts[i], B = ts[j];
    if (A.conf !== B.conf) { add(i, j, 1); add(j, i, 1); continue; }
    if (A.div === B.div) { add(i, j, 2); add(j, i, 2); continue; }
    // within conference, other division
    const dA = A.div % 3, dB = B.div % 3;
    let first = i, second = j, kf = (i % 5), ks = (j % 5);
    // ordered division pair: (0,1), (1,2), (2,0)
    if (!((dA === 0 && dB === 1) || (dA === 1 && dB === 2) || (dA === 2 && dB === 0))) { first = j; second = i; kf = j % 5; ks = i % 5; }
    const off = (((ks - kf) % 5) + 5) % 5;
    if (off <= 2) { add(first, second, 2); add(second, first, 2); }
    else if (off === 3) { add(first, second, 2); add(second, first, 1); }
    else { add(first, second, 1); add(second, first, 2); }
  }
  shuffle(pairs);
  const rem = new Array(30).fill(82);
  let left = pairs.slice();
  const sched = [];
  let d = 0;
  let lastPlayed = new Array(30).fill(-5);
  while (left.length) {
    const target = ri(5, 10);
    const busy = new Set();
    left.sort((x, y) => (rem[y[0]] + rem[y[1]]) - (rem[x[0]] + rem[x[1]]) + (rnd() - 0.5) * 30);
    const keep = [];
    let n = 0;
    for (const g of left) {
      if (n < target && !busy.has(g[0]) && !busy.has(g[1]) && !(lastPlayed[g[0]] === d - 1 && lastPlayed[g[1]] === d - 1 && rnd() < 0.7)) {
        busy.add(g[0]); busy.add(g[1]); n++;
        sched.push({ d, h: g[0], a: g[1], g: 0 });
        rem[g[0]]--; rem[g[1]]--;
        lastPlayed[g[0]] = d; lastPlayed[g[1]] = d;
      } else keep.push(g);
    }

function setupSeason() {

  S.lastDay = S.sched[S.sched.length - 1].d;

  S.games = [];

/* ---------------- lineup ---------------- */
const BASEMIN = [34, 33, 32, 31, 30, 23, 19, 15, 12, 7, 3, 1, 0, 0, 0];
function autoLineup(tid, apply) {

    // keep user order, append new players, drop gone ones
    const ids = new Set(ps.map((p) => p.id));
    t.depth = t.depth.filter((id) => ids.has(id));
    for (const p of ps) if (!t.depth.includes(p.id)) { t.depth.push(p.id); if (t.mins[p.id] == null) t.mins[p.id] = 0; }
    for (const k of Object.keys(t.mins)) if (!ids.has(+k)) delete t.mins[k];
    return;
  }
  const healthy = ps.filter((p) => !p.inj).sort((a, b) => b.ovr - a.ovr);
  const hurt = ps.filter((p) => p.inj).sort((a, b) => b.ovr - a.ovr);
  const order = healthy.slice();
  // starters: ensure a guard and a big in top 5
  const top = order.slice(0, 5);
  const isG = (p) => p.pos === 'PG' || p.pos === 'SG';
  const isB = (p) => p.pos === 'PF' || p.pos === 'C';
  const fix = (test) => {
    if (top.some(test) || order.length <= 5) return;

    if (!cand || cand.ovr < top[4].ovr - 7) return;
    const out = top.slice().reverse().find((p) => !test(p) && !(isG(p) && top.filter(isG).length === 1) && !(isB(p) && top.filter(isB).length === 1));

  const sum = raw.reduce((a, b) => a + b, 0) || 1;
  fin.forEach((p, i) => { t.mins[p.id] = Math.min(40, Math.round(raw[i] * 240 / sum)); });

/* ---------------- generic table ---------------- */
// cols: {k, l, v(row) -> sort value, f(row) -> html, c: class, ns: no sort}
function table(id, cols, rows, opt) {
  opt = opt || {};
  const st = sorts[id] || (opt.sort ? { k: opt.sort, d: opt.dir || -1 } : null);
  let rs = rows.slice();
  if (st) {
    const col = cols.find((c) => c.k === st.k);
    if (col) {
      const v = col.v || col.f;
      rs.sort((a, b) => {
        const x = v(a), y = v(b);
        if (typeof x === 'string' || typeof y === 'string') return String(x).localeCompare(String(y)) * st.d;
        return ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) * st.d;
      });
    }
  }
  if (opt.limit) rs = rs.slice(0, opt.limit);
  const head = cols.map((c) => `<th class="${c.c || ''}${c.ns ? '' : ' sort'}${st && st.k === c.k ? ' on' : ''}" ${c.ns ? '' : `data-sort="${id}:${c.k}"`}>${c.l}</th>`).join('');
  const body = rs.map((r) => {
    const attr = opt.click ? opt.click(r) : '';
    const cls = (opt.rowCls ? opt.rowCls(r) : '') + (attr ? ' click' : '');
    return `<tr class="${cls}" ${attr}>${cols.map((c) => `<td class="${c.c || ''}">${c.f(r)}</td>`).join('')}</tr>`;
  }).join('');
  const foot = opt.foot ? opt.foot : '';
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td class="l dim" colspan="${cols.length}">None</td></tr>`}${foot}</tbody></table></div>`;
}
function seg(key, opts, cur) {
  return `<div class="seg">${opts.map(([v, l]) => `<button type="button" data-seg="${key}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
}

/* ---------------- sim control ---------------- */
function simLoop(cond, done) {
  if (simming) return;
  simming = { stop: false };
  renderActions();
  const step = () => {
    if (!simming) return;
    if (paused) { setTimeout(step, 200); return; }
    const t0 = performance.now();
    let more = true;
    while (performance.now() - t0 < 28) {
      if (simming.stop || !cond()) { more = false; break; }
      B.simDay();
      if (S.fired) { more = false; break; }
    }
    renderHead();
    if (simming.stop) more = false;
    if (more && cond()) { renderActions(); setTimeout(step, 0); }
    else { simming = null; afterSim(); if (done) done(); }
  };
  setTimeout(step, 0);
}
function afterSim() {
  S = B.getState();
  render();
  save();
  checkEvents();
}
let lastTitleSeason = 0;
function checkEvents() {
  const h = S.hist[S.hist.length - 1];
  if (h && h.champ === S.user && h.y !== lastTitleSeason && S.phase === 'draft' && S.draft && S.draft.idx === 0) {
    lastTitleSeason = h.y;
    Vela.gameOver(S.career.titles);
    toast(`${S.season} Champions`);
  }
  if (S.fired) showFired();
}
function userGamesPlayed() { return S.games.filter((g) => g.h === S.user || g.a === S.user).length; }
function act(a) {
  if (simming && a !== 'stop') return;
  const ph = S.phase;
  if (a === 'stop') { if (simming) simming.stop = true; return; }
  if (a === 'next') {
    if (ph === 'regular') {
      const n0 = userGamesPlayed();
      simLoop(() => S.phase === 'regular' && userGamesPlayed() === n0, () => showLastResult(n0));
    } else if (ph === 'playoffs') {
      const n0 = userGamesPlayed();
      const alive = S.series.some((s) => s.r === B.curRound() && s.win < 0 && (s.hi === S.user || s.lo === S.user));
      if (alive) simLoop(() => S.phase === 'playoffs' && userGamesPlayed() === n0, () => showLastResult(n0));
      else { B.simDay(); afterSim(); }
    }
  } else if (a === 'week') { const d = S.day + 7; simLoop(() => S.phase === 'regular' && S.day < d); }
  else if (a === 'endreg') simLoop(() => S.phase === 'regular');
  else if (a === 'round') { const r = B.curRound(); simLoop(() => S.phase === 'playoffs' && B.curRound() === r); }
  else if (a === 'endpo') simLoop(() => S.phase === 'playoffs');
  else if (a === 'tomypick') { B.draftUntilUser(false); afterSim(); }
  else if (a === 'autopick') { B.draftUntilUser(true); afterSim(); }
  else if (a === 'enddraft') { B.draftUntilUser(true); afterSim(); }
  else if (a === 'tofa') { B.endResign(); tab = tab === 'draft' ? 'fa' : tab; afterSim(); }
  else if (a === 'faday') { B.faNextDay(); afterSim(); }
  else if (a === 'startseason') { if (!B.canStartSeason()) { B.startSeason(); tab = 'home'; afterSim(); } }
}
function showLastResult(n0) {
  const g = S.games.filter((x) => x.h === S.user || x.a === S.user).slice(n0).pop();
  if (!g) return;
  const home = g.h === S.user;
  const us = home ? g.hs : g.as, them = home ? g.as : g.hs;
  toast(`${us > them ? 'W' : 'L'} ${us}-${them} ${home ? 'vs' : 'at'} ${T(home ? g.a : g.h).abbr}`);
}

    { k: 'mv', l: '', f: (r) => `<span class="arrows"><button type="button" data-mv="${r.p.id}" data-d="-1" aria-label="Up">${ICON.up}</button> <button type="button" data-mv="${r.p.id}" data-d="1" aria-label="Down">${ICON.down}</button></span>`, ns: 1 },
  ], rows, { rowCls: (r) => (r.i === 5 ? 'cut' : '') });
  return h;
};

/* ----- games ----- */
VIEWS.games = function () {
  let h = `<div class="row">${seg('games', [['mine', 'My games'], ['league', 'League']], sub.games)}</div>`;
  if (sub.games === 'mine') {
    const played = S.games.filter((g) => g.h === S.user || g.a === S.user);
    const upcoming = S.phase === 'regular' ? S.sched.filter((g) => !g.g && (g.h === S.user || g.a === S.user)) : [];
    const rows = played.map((g) => ({ g, played: true })).concat(upcoming.map((g) => ({ g, played: false })));
    h += table('mygames', [
      { k: 'd', l: 'Day', c: 'l', f: (r) => (r.g.po ? `<span class="tag o">PO</span>` : r.g.d + 1), ns: 1 },
      { k: 'o', l: 'Opponent', c: 'n', f: (r) => (r.g.h === S.user ? 'vs ' : 'at ') + esc(tName(r.g.h === S.user ? r.g.a : r.g.h)), ns: 1 },
      { k: 'r', l: 'Result', f: (r) => { if (!r.played) return '<span class="dim">-</span>'; const home = r.g.h === S.user; const us = home ? r.g.hs : r.g.as, th = home ? r.g.as : r.g.hs; return `<span class="wl ${us > th ? 'w' : 'l'}">${us > th ? 'W' : 'L'}</span> ${us}-${th}${r.g.ot ? ' OT' : ''}`; }, ns: 1 },
      { k: 'rec', l: 'Opp', f: (r) => { const o = r.g.h === S.user ? r.g.a : r.g.h; return T(o).rec.w + '-' + T(o).rec.l; }, ns: 1 },
    ], rows, { click: (r) => (r.played ? `data-box="${r.g.id}"` : ''), rowCls: () => '' });
  } else {
    const days = [...new Set(S.games.map((g) => g.d))];
    if (!days.length) return h + '<div class="list"><div class="li"><span class="t dim">None</span></div></div>';
    if (!days.includes(leagueDay)) leagueDay = days[days.length - 1];
    const i = days.indexOf(leagueDay);
    const games = S.games.filter((g) => g.d === leagueDay);
    h += `<div class="row" style="margin-bottom:12px"><button class="btn sm" type="button" data-lday="${days[i - 1] ?? ''}" ${i <= 0 ? 'disabled' : ''}>Prev</button><span class="lab" style="min-width:80px;text-align:center">${games[0] && games[0].po ? 'Playoffs ' : ''}Day ${leagueDay + 1}</span><button class="btn sm" type="button" data-lday="${days[i + 1] ?? ''}" ${i >= days.length - 1 ? 'disabled' : ''}>Next</button></div>`;
    h += `<div class="list">${games.map((g) => `<div class="li click" data-box="${g.id}"><span class="t">${esc(T(g.a).abbr)} <b>${g.as}</b> at ${esc(T(g.h).abbr)} <b>${g.hs}</b>${g.ot ? ' OT' : ''}</span>${g.h === S.user || g.a === S.user ? '<span class="tag">You</span>' : ''}</div>`).join('')}</div>`;
  }
  return h;
};

/* ----- standings ----- */
VIEWS.stand = function () {
  const opts = [['0', 'East'], ['1', 'West']];
  if (S.series.length) opts.push(['po', 'Playoffs']);
  let h = `<div class="row">${seg('stand', opts, sub.stand)}</div>`;
  if (sub.stand === 'po' && S.series.length) return h + bracket();
  const c = +sub.stand || 0;
  const st = B.standings(c);
  const lead = st[0];
  const rows = st.map((t, i) => ({ t, i }));
  h += table('stand', [
    { k: 'i', l: '#', c: 'l', f: (r) => r.i + 1, ns: 1 },
    { k: 'n', l: 'Team', c: 'n', f: (r) => esc(r.t.city + ' ' + r.t.name), ns: 1 },
    { k: 'w', l: 'W', f: (r) => r.t.rec.w, ns: 1 },
    { k: 'l', l: 'L', f: (r) => r.t.rec.l, ns: 1 },
    { k: 'p', l: 'Pct', f: (r) => B.wp(r.t.rec).toFixed(3).replace(/^0/, ''), ns: 1 },
    { k: 'gb', l: 'GB', f: (r) => { const gb = ((lead.rec.w - r.t.rec.w) + (r.t.rec.l - lead.rec.l)) / 2; return gb ? gb.toFixed(1) : '-'; }, ns: 1 },
    { k: 'h', l: 'Home', f: (r) => r.t.rec.hw + '-' + r.t.rec.hl, ns: 1 },
    { k: 'a', l: 'Away', f: (r) => (r.t.rec.w - r.t.rec.hw) + '-' + (r.t.rec.l - r.t.rec.hl), ns: 1 },
    { k: 'c', l: 'Conf', f: (r) => r.t.rec.cw + '-' + r.t.rec.cl, ns: 1 },
    { k: 'l10', l: 'L10', f: (r) => { const a = r.t.rec.l10; const w = a.reduce((s, x) => s + x, 0); return a.length ? w + '-' + (a.length - w) : '-'; }, ns: 1 },
    { k: 'str', l: 'Strk', f: (r) => (r.t.rec.str > 0 ? 'W' + r.t.rec.str : r.t.rec.str < 0 ? 'L' + -r.t.rec.str : '-'), ns: 1 },
    { k: 'd', l: 'Diff', f: (r) => { const g = r.t.rec.w + r.t.rec.l; if (!g) return '-'; const d = (r.t.rec.pf - r.t.rec.pa) / g; return (d > 0 ? '+' : '') + d.toFixed(1); }, ns: 1 },
    { k: 'o', l: 'Ovr', f: (r) => B.teamOvr(r.t.tid), ns: 1 },
  ], rows, { rowCls: (r) => (r.t.tid === S.user ? 'me' : '') + (r.i === 8 ? ' cut' : ''), click: (r) => `data-team="${r.t.tid}"` });
  return h;
};
function bracket() {
  const col = (list) => `<div class="bcol">${list.map(serBox).join('')}</div>`;
  const by = (r, c) => S.series.filter((s) => s.r === r && s.c === c).sort((a, b) => a.slot - b.slot);
  const cols = [];
  cols.push(col(by(0, 0)), col(by(1, 0)), col(by(2, 0)), col(S.series.filter((s) => s.r === 3)), col(by(2, 1)), col(by(1, 1)), col(by(0, 1)));
  const heads = ['East R1', 'East R2', 'East final', 'Finals', 'West final', 'West R2', 'West R1'];
  return `<div class="bracket">${cols.map((c, i) => `<div><div class="lab" style="margin-bottom:8px">${heads[i]}</div>${c}</div>`).join('')}</div>`;
}
function serBox(s) {
  const row = (tid, seed, w) => `<div class="${s.win === tid ? 'win' : ''} ${tid === S.user ? 'me' : ''}"><span>${seed ? `<span class="dim">${seed}</span> ` : ''}${esc(T(tid).abbr)}</span><span>${w}</span></div>`;
  return `<div class="ser" data-series="${S.series.indexOf(s)}">${row(s.hi, s.hs, s.w[0])}${row(s.lo, s.ls, s.w[1])}</div>`;
}

/* ----- stats ----- */
VIEWS.stats = function () {
  let h = `<div class="row">${seg('stats', [['leaders', 'Leaders'], ['players', 'Players'], ['teams', 'Teams']], sub.stats)}</div>`;
  const po = S.phase === 'playoffs' && sub.statsPo;
  if (sub.stats === 'leaders') {
    const lines = S.players.filter((p) => p.tid !== -3).map((p) => ({ p, o: line(p, false) })).filter((x) => x.o && x.o.gp > 0);
    const maxG = Math.max(1, ...S.teams.map((t) => t.rec.w + t.rec.l));
    const q = lines.filter((x) => x.o.gp >= Math.max(1, maxG * 0.55));
    const cats = [
      ['Points', (x) => x.o.pts / x.o.gp, q], ['Rebounds', (x) => (x.o.orb + x.o.drb) / x.o.gp, q], ['Assists', (x) => x.o.ast / x.o.gp, q],
      ['Steals', (x) => x.o.stl / x.o.gp, q], ['Blocks', (x) => x.o.blk / x.o.gp, q], ['Minutes', (x) => x.o.min / x.o.gp, q],
      ['FG%', (x) => x.o.fgm / x.o.fga * 100, q.filter((x) => x.o.fgm >= x.o.gp * 3)], ['3P%', (x) => x.o.tpm / x.o.tpa * 100, q.filter((x) => x.o.tpm >= x.o.gp * 1)], ['FT%', (x) => x.o.ftm / x.o.fta * 100, q.filter((x) => x.o.fta >= x.o.gp * 1.5)],
    ];
    h += `<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${cats.map(([l, f, pool]) => {
      const top = pool.slice().sort((a, b) => f(b) - f(a)).slice(0, 5);
      return `<div class="card"><span class="lab">${l}</span>${top.map((x, i) => `<div class="li click" data-player="${x.p.id}" style="padding:6px 0;border-bottom:${i < 4 ? '1px solid var(--line)' : '0'}"><span class="t">${esc(short(x.p))} <span class="dim">${x.o.t >= 0 ? esc(T(x.o.t).abbr) : ''}</span></span><span class="num">${f(x).toFixed(1)}</span></div>`).join('') || '<span class="s">-</span>'}</div>`;
    }).join('')}</div>`;
  } else if (sub.stats === 'players') {
    h += `<div class="row">${seg('statsTeam', [['all', 'All'], ['mine', 'Mine']], sub.statsTeam)}</div>`;
    const rows = S.players.filter((p) => (sub.statsTeam === 'mine' ? p.tid === S.user : p.tid !== -3)).map((p) => ({ p, o: line(p, false) })).filter((x) => x.o && x.o.gp > 0);
    h += table('allstats', [
      { k: 'name', l: 'Player', c: 'n', f: (r) => esc(short(r.p)), v: (r) => r.p.ln },
      { k: 'tm', l: 'Team', c: 'l', f: (r) => (r.o.t >= 0 ? T(r.o.t).abbr : '-'), v: (r) => (r.o.t >= 0 ? T(r.o.t).abbr : 'ZZZ') },
      { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => B.POS.indexOf(r.p.pos) },
      { k: 'ovr', l: 'Ovr', f: (r) => rcell(r.p.ovr), v: (r) => r.p.ovr },
    ].concat(statCols()), rows, { sort: 'pts', limit: 150, click: (r) => `data-player="${r.p.id}"`, rowCls: (r) => (r.p.tid === S.user ? 'me' : '') });
  } else {
    const ts = teamStats();
    h += table('teamstats', [
      { k: 'n', l: 'Team', c: 'n', f: (r) => esc(T(r.tid).abbr), v: (r) => T(r.tid).abbr },
      { k: 'w', l: 'W', f: (r) => T(r.tid).rec.w, v: (r) => T(r.tid).rec.w },
      { k: 'pts', l: 'Pts', f: (r) => f1(r.pts / r.g), v: (r) => r.pts / r.g },
      { k: 'opp', l: 'Opp', f: (r) => f1(r.opp / r.g), v: (r) => r.opp / r.g },
      { k: 'fg', l: 'FG%', f: (r) => pct(r.fgm, r.fga), v: (r) => r.fgm / r.fga },
      { k: 'tpa', l: '3PA', f: (r) => f1(r.tpa / r.g), v: (r) => r.tpa / r.g },
      { k: 'tp', l: '3P%', f: (r) => pct(r.tpm, r.tpa), v: (r) => r.tpm / r.tpa },
      { k: 'ft', l: 'FT%', f: (r) => pct(r.ftm, r.fta), v: (r) => r.ftm / r.fta },
      { k: 'reb', l: 'Reb', f: (r) => f1((r.orb + r.drb) / r.g), v: (r) => (r.orb + r.drb) / r.g },
      { k: 'ast', l: 'Ast', f: (r) => f1(r.ast / r.g), v: (r) => r.ast / r.g },
      { k: 'stl', l: 'Stl', f: (r) => f1(r.stl / r.g), v: (r) => r.stl / r.g },
      { k: 'blk', l: 'Blk', f: (r) => f1(r.blk / r.g), v: (r) => r.blk / r.g },
      { k: 'tov', l: 'TO', f: (r) => f1(r.tov / r.g), v: (r) => r.tov / r.g },
    ], ts.rows, { sort: 'pts', rowCls: (r) => (r.tid === S.user ? 'me' : '') + (r.tid === -1 ? ' tot' : ''), foot: ts.avg ? `<tr class="tot"><td class="n">League</td><td></td><td>${f1(ts.avg.pts)}</td><td>${f1(ts.avg.pts)}</td><td>${pct(ts.avg.fgm, ts.avg.fga)}</td><td>${f1(ts.avg.tpa)}</td><td>${pct(ts.avg.tpm, ts.avg.tpa)}</td><td>${pct(ts.avg.ftm, ts.avg.fta)}</td><td>${f1(ts.avg.orb + ts.avg.drb)}</td><td>${f1(ts.avg.ast)}</td><td>${f1(ts.avg.stl)}</td><td>${f1(ts.avg.blk)}</td><td>${f1(ts.avg.tov)}</td></tr>` : '' });
  }
  return h;
};
function teamStats() {
  const F = B.F;
  const acc = S.teams.map((t) => ({ tid: t.tid, g: 0, pts: 0, opp: 0, fgm: 0, fga: 0, tpm: 0, tpa: 0, ftm: 0, fta: 0, orb: 0, drb: 0, ast: 0, stl: 0, blk: 0, tov: 0 }));
  for (const g of S.games) {
    if (g.po || !g.b) continue;
    [g.h, g.a].forEach((tid, side) => {
      const a = acc[tid]; a.g++; a.pts += side ? g.as : g.hs; a.opp += side ? g.hs : g.as;
      for (const l of g.b[side]) for (const k of ['fgm', 'fga', 'tpm', 'tpa', 'ftm', 'fta', 'orb', 'drb', 'ast', 'stl', 'blk', 'tov']) a[k] += l[1 + F[k]];
    });
  }
  const rows = acc.filter((a) => a.g);
  let avg = null;
  if (rows.length) {
    const G = rows.reduce((s, a) => s + a.g, 0);
    avg = {};
    for (const k of ['pts', 'fgm', 'fga', 'tpm', 'tpa', 'ftm', 'fta', 'orb', 'drb', 'ast', 'stl', 'blk', 'tov']) avg[k] = rows.reduce((s, a) => s + a[k], 0) / G;
  }
  return { rows, avg };
}

/* ----- trade ----- */
VIEWS.trade = function () {
  const closed = B.tradeOpen();
  if (trade.tid < 0 || trade.tid === S.user) trade.tid = S.user === 0 ? 1 : 0;
  const opts = S.teams.filter((t) => t.tid !== S.user).map((t) => `<option value="${t.tid}" ${t.tid === trade.tid ? 'selected' : ''}>${esc(t.city + ' ' + t.name)}  ${t.rec.w}-${t.rec.l}</option>`).join('');
  // prune stale selections
  const valid = (side, tid) => { const a = B.tradeAssets(tid); side.pids = side.pids.filter((id) => a.players.some((p) => p.id === id)); side.picks = side.picks.filter((id) => a.picks.some((p) => p.id === id)); };
  valid(trade.give, S.user); valid(trade.get, trade.tid);
  let h = `<div class="row" style="margin-bottom:12px"><select class="sel" id="tradeTeam" aria-label="Team">${opts}</select><span class="lab">${esc(T(trade.tid).strat === 'contend' ? 'Contending' : T(trade.tid).strat === 'rebuild' ? 'Rebuilding' : '')}</span><span class="sp"></span>${closed ? `<span class="lab" style="color:var(--brand-hover)">${esc(closed)}</span>` : ''}</div>`;
  h += `<div class="tside"><div><h3>You give</h3>${assetTable('tg', S.user, trade.give)}</div><div><h3>You get</h3>${assetTable('tr', trade.tid, trade.get)}</div></div>`;
  const yr = B.payYear();
  const sal = (ids) => ids.reduce((s, id) => s + (P(id).c.exp >= yr ? P(id).c.amt : 0), 0);
  const out = sal(trade.give.pids), inn = sal(trade.get.pids);
  const pu = B.payroll(S.user) - out + inn, pt = B.payroll(trade.tid) + out - inn;
  const ev = (trade.give.pids.length + trade.give.picks.length + trade.get.pids.length + trade.get.picks.length) ? B.evalTrade(trade.tid, trade.give, trade.get) : null;
  const ratio = ev && ev.vout > 0 ? Math.max(0, Math.min(2, (ev.vin || 0) / ev.vout)) : 0;
  h += `<div class="sum">
    <div class="li"><span class="lab t">Salary out / in</span><span class="num">${M(out)} / ${M(inn)}</span></div>
    <div class="li"><span class="lab t">Your payroll after</span><span class="num" style="color:${pu > B.CAP ? 'var(--brand-hover)' : ''}">${M(pu)}</span></div>
    <div class="li"><span class="lab t">${esc(T(trade.tid).abbr)} payroll after</span><span class="num">${M(pt)}</span></div>
    <div class="li"><span class="lab t">Roster after</span><span class="num">${B.rosterCount(S.user) - trade.give.pids.length + trade.get.pids.length} / ${B.rosterCount(trade.tid) + trade.give.pids.length - trade.get.pids.length}</span></div>
    <div class="li"><span class="lab" style="width:90px">Their view</span><div class="meter t" style="margin:0"><i style="width:${ratio * 50}%;${ratio >= 1 && ev && ev.ok ? '' : 'background:#fff'}"></i><b style="left:50%"></b></div></div>
  </div>`;
  h += `<div class="btns"><button class="btn" type="button" data-act2="balance" ${closed ? 'disabled' : ''}>What works</button><button class="btn" type="button" data-act2="tclear">Clear</button><button class="btn primary" type="button" data-act2="propose" ${closed || !ev ? 'disabled' : ''}>Propose</button></div>`;
  if (trade.msg) h += `<div class="lab" style="margin-top:12px;color:${trade.ok ? 'var(--text)' : 'var(--brand-hover)'}">${esc(trade.msg)}</div>`;
  else if (ev && !ev.ok && ev.reason !== 'Not enough value') h += `<div class="lab" style="margin-top:12px;color:var(--brand-hover)">${esc(ev.reason)}</div>`;
  return h;
};
function assetTable(id, tid, side) {
  const a = B.tradeAssets(tid);
  const rows = a.players.map((p) => ({ p })).concat(a.picks.map((k) => ({ k })));
  const sel = (r) => (r.p ? side.pids.includes(r.p.id) : side.picks.includes(r.k.id));
  return table(id, [
    { k: 'c', l: '', c: 'l', f: (r) => `<span class="ck ${sel(r) ? 'on' : ''}"></span>`, ns: 1 },
    { k: 'n', l: 'Asset', c: 'n', f: (r) => (r.p ? esc(short(r.p)) + injTag(r.p) : esc(B.pickName(r.k))), v: (r) => (r.p ? 0 : 1) },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => (r.p ? r.p.pos : ''), ns: 1 },
    { k: 'age', l: 'Age', f: (r) => (r.p ? B.age(r.p) : ''), v: (r) => (r.p ? B.age(r.p) : 99) },
    { k: 'ovr', l: 'Ovr', f: (r) => (r.p ? rcell(r.p.ovr) : ''), v: (r) => (r.p ? r.p.ovr : -1) },
    { k: 'pot', l: 'Pot', f: (r) => (r.p ? rcell(r.p.pot) : ''), v: (r) => (r.p ? r.p.pot : -1) },
    { k: 'sal', l: 'Salary', f: (r) => (r.p ? M(r.p.c.amt) : ''), v: (r) => (r.p ? r.p.c.amt : -1) },
    { k: 'exp', l: 'Thru', f: (r) => (r.p ? r.p.c.exp : ''), v: (r) => (r.p ? r.p.c.exp : 0) },
  ], rows, { sort: 'ovr', click: (r) => (r.p ? `data-tp="${id}:${r.p.id}"` : `data-tk="${id}:${r.k.id}"`), rowCls: (r) => (sel(r) ? 'me' : '') });
}

/* ----- free agents / re-sign ----- */

      { k: 'y', l: 'Yrs', f: (r) => B.prefYears(r.p), ns: 1 },

    ], ex.map((p) => ({ p })), { sort: 'ovr', click: (r) => `data-player="${r.p.id}"` });

  h += table('fa', [
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + injTag(r.p), v: (r) => r.p.ln },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => B.POS.indexOf(r.p.pos) },
    { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
    { k: 'ovr', l: 'Ovr', f: (r) => rcell(r.p.ovr), v: (r) => r.p.ovr },
    { k: 'pot', l: 'Pot', f: (r) => rcell(r.p.pot), v: (r) => r.p.pot },
    { k: 'ask', l: 'Ask', f: (r) => M(B.askFor(r.p, S.user, B.prefYears(r.p))), v: (r) => B.askFor(r.p, S.user, B.prefYears(r.p)) },
    { k: 'y', l: 'Yrs', f: (r) => B.prefYears(r.p), v: (r) => B.prefYears(r.p) },
    { k: 'ex', l: 'Last', c: 'l', f: (r) => (r.p.ex != null && r.p.ex >= 0 ? T(r.p.ex).abbr : ''), ns: 1 },
  ], fas.map((p) => ({ p })), { sort: 'ovr', limit: 120, click: (r) => `data-player="${r.p.id}"` });
  return h;
};

/* ----- draft ----- */
VIEWS.draft = function () {
  let h = '';
  const inDraft = S.phase === 'draft' && S.draft;
  const y = inDraft ? S.draft.y : S.season;
  const myPicks = S.picks.filter((p) => p.tid === S.user).sort((a, b) => a.s - b.s || a.rd - b.rd);
  h += `<div class="row" style="margin-bottom:12px">${seg('draft', [['board', 'Prospects'], ['order', 'Order']], sub.draft)}<span class="sp"></span><span class="lab">${y} Draft  Your picks ${myPicks.filter((p) => p.s === y).map((p) => (inDraft && S.draft.order.indexOf(p.id) >= 0 ? '#' + (S.draft.order.indexOf(p.id) + 1) : p.rd === 1 ? '1st' : '2nd')).join(' ') || 'none'}</span></div>`;
  const pk = inDraft ? B.onClock() : null;
  if (pk) h += `<div class="list" style="margin-bottom:12px"><div class="li"><span class="lab">On the clock</span><span class="t">#${S.draft.idx + 1} ${esc(tName(pk.tid))}</span>${pk.tid === S.user ? '<span class="tag">You</span>' : ''}</div></div>`;
  if (sub.draft === 'order') {
    let rows;
    if (inDraft) rows = S.draft.order.map((id, i) => { const made = S.draft.made.find((m) => m.n === i + 1); const pkk = S.picks.find((p) => p.id === id); return { n: i + 1, tid: made ? made.tid : pkk ? pkk.tid : -1, orig: Math.floor(id % 100), pid: made ? made.pid : null }; });
    else {
      const proj = S.teams.slice().sort((a, b) => B.wp(a.rec) - B.wp(b.rec) || (a.rec.pf - a.rec.pa) - (b.rec.pf - b.rec.pa));
      rows = proj.map((t, i) => { const p1 = S.picks.find((p) => p.s === y && p.rd === 1 && p.orig === t.tid); return { n: i + 1, tid: p1 ? p1.tid : t.tid, orig: t.tid, pid: null }; });
    }
    const lot = inDraft ? S.draft.lottery : null;
    h += table('dorder', [
      { k: 'n', l: 'Pick', c: 'l', f: (r) => r.n, ns: 1 },
      { k: 't', l: 'Team', c: 'n', f: (r) => (r.tid >= 0 ? esc(T(r.tid).abbr) : '-') + (r.orig !== r.tid && r.tid >= 0 ? ` <span class="dim">via ${esc(T(r.orig).abbr)}</span>` : ''), ns: 1 },
      { k: 'pre', l: lot ? 'Pre' : '', f: (r) => { if (!lot) return ''; const x = lot.find((l) => l.pick === r.n); return x ? x.pre : ''; }, ns: 1 },
      { k: 'p', l: 'Player', c: 'l', f: (r) => (r.pid ? `<span data-player="${r.pid}" style="cursor:pointer">${esc(name(P(r.pid)))}</span>` : ''), ns: 1 },
    ], rows, { rowCls: (r) => (r.tid === S.user ? 'me' : '') + (r.n === 31 ? ' cut' : '') });
    return h;
  }
  const pros = B.prospects();
  const userOn = pk && pk.tid === S.user;
  const cols = [
    { k: 'rk', l: '#', c: 'l', f: (r) => r.rk, v: (r) => r.rk },
    { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)), v: (r) => r.p.ln },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => B.POS.indexOf(r.p.pos) },
    { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
    { k: 'ovr', l: 'Ovr', f: (r) => rcell(scout(r.p).ovr), v: (r) => scout(r.p).ovr },
    { k: 'pot', l: 'Pot', f: (r) => rcell(scout(r.p).pot), v: (r) => scout(r.p).pot },
  ].concat(ratingCols(true));
  if (userOn) cols.unshift({ k: 'go', l: '', c: 'l', f: (r) => `<button class="btn sm primary" type="button" data-draft="${r.p.id}">Draft</button>`, ns: 1 });
  const ranked = pros.slice().sort((a, b) => (scout(b).pot * 0.6 + scout(b).ovr * 0.4) - (scout(a).pot * 0.6 + scout(a).ovr * 0.4)).map((p, i) => ({ p, rk: i + 1 }));
  h += table('pros', cols, ranked, { sort: 'rk', dir: 1, click: (r) => `data-player="${r.p.id}"` });
  return h;
};

/* ----- finances ----- */
VIEWS.fin = function () {
  const t = T(S.user);
  const pay = B.payroll(S.user);
  const yr = B.payYear();
  const scale = Math.max(B.TAX * 1.15, pay * 1.05);
  let h = `<div class="cards">${card('Payroll', M(pay), yr + ' season')}${card('Cap', M(B.CAP), pay > B.CAP ? 'Over by ' + M(pay - B.CAP) : 'Space ' + M(B.CAP - pay))}${card('Tax line', M(B.TAX), pay > B.TAX ? 'Tax ' + M((pay - B.TAX) * 1.5) : '')}${card('Cash', M(t.cash), '')}</div>`;
  h += `<div class="list" style="padding:14px 12px 10px;margin-top:-1px"><div class="meter" style="height:14px;margin:0"><i style="width:${Math.min(100, pay / scale * 100)}%"></i><b style="left:${B.CAP / scale * 100}%"></b><b style="left:${B.TAX / scale * 100}%"></b></div><div class="row" style="margin-top:8px"><span class="lab">Cap ${M(B.CAP)}</span><span class="sp"></span><span class="lab">Tax ${M(B.TAX)}</span></div></div>`;
  // owner
  const o = S.owner;
  const ob = (l, v) => `<div class="bar"><span class="lab">${l}</span><div class="meter${v < 0 ? ' w' : ''}"><i style="left:${v < 0 ? (50 + v / 3 * 50) : 50}%;width:${Math.abs(v) / 3 * 50}%"></i><b style="left:50%"></b></div><span>${(v > 0 ? '+' : '') + v.toFixed(1)}</span></div>`;
  h += `<div class="grid2"><div><h3>Owner</h3><div class="list" style="padding:12px"><div class="bars" style="grid-template-columns:1fr;margin:0">${ob('Wins', o.w)}${ob('Playoffs', o.p)}${ob('Finances', o.m)}${ob('Overall', o.w + o.p + o.m)}</div><div class="row" style="margin-top:12px"><span class="lab">Job security</span><span class="sp"></span><span class="num">${Math.round(jobSecurity() * 100)}%</span></div></div></div>`;
  // this season money
  const f = t.fin;
  const rev = f.gate + f.merch + f.tv + f.po, exp = f.sal + f.tax + f.ops;
  h += `<div><h3>${S.season} season</h3><div class="list">
    ${moneyLi('Tickets', f.gate)}${moneyLi('Merch and sponsors', f.merch)}${moneyLi('Media', f.tv)}${moneyLi('Playoffs', f.po)}${moneyLi('Salaries', -f.sal)}${moneyLi('Luxury tax', -f.tax)}${moneyLi('Operations', -f.ops)}
    <div class="li"><span class="lab t">Profit</span><span class="num" style="color:${rev - exp < 0 ? 'var(--brand-hover)' : ''}">${M(rev - exp)}</span></div>
    <div class="li"><span class="lab t">Attendance</span><span class="num">${f.hg ? Math.round(f.att / f.hg).toLocaleString('en-US') : '-'}</span></div>
    <div class="li"><span class="lab t">Ticket price</span><span class="step"><button type="button" data-ticket="-5" aria-label="Lower">-</button><span>$${t.ticket}</span><button type="button" data-ticket="5" aria-label="Higher">+</button></span></div>
  </div></div></div>`;
  // contracts by year
  const years = [0, 1, 2, 3, 4].map((i) => yr + i);
  const ps = B.teamPlayers(S.user).filter((p) => p.c.exp >= yr).sort((a, b) => b.c.amt - a.c.amt);
  const dead = S.dead.filter((d) => d.tid === S.user && d.exp >= yr);
  const rows = ps.map((p) => ({ p })).concat(dead.map((d) => ({ d })));
  const amt = (r, y) => { const c = r.p ? r.p.c : r.d; return c.exp >= y ? c.amt : 0; };
  const tot = years.map((y) => rows.reduce((s, r) => s + amt(r, y), 0));
  h += `<h3>Contracts</h3>` + table('contracts', [
    { k: 'n', l: 'Player', c: 'n', f: (r) => (r.p ? esc(short(r.p)) : esc(r.d.name) + ' <span class="tag o">Dead</span>'), ns: 1 },
  ].concat(years.map((y) => ({ k: 'y' + y, l: String(y), f: (r) => (amt(r, y) ? M(amt(r, y)) : '<span class="dim">-</span>'), ns: 1 }))), rows, {
    click: (r) => (r.p ? `data-player="${r.p.id}"` : ''),
    foot: `<tr class="tot"><td class="n">Total</td>${tot.map((x) => `<td style="color:${x > B.CAP ? 'var(--brand-hover)' : ''}">${M(x)}</td>`).join('')}</tr>`,
  });
  // history
  if (t.seasons.length) {
    h += `<h3>History</h3>` + table('finhist', [
      { k: 'y', l: 'Season', c: 'l', f: (r) => r.y, ns: 1 },
      { k: 'r', l: 'W-L', f: (r) => r.w + '-' + r.l, ns: 1 },
      { k: 'rev', l: 'Revenue', f: (r) => M(r.rev), ns: 1 },
      { k: 'exp', l: 'Expenses', f: (r) => M(r.exp), ns: 1 },
      { k: 'p', l: 'Profit', f: (r) => M(r.rev - r.exp), ns: 1 },
      { k: 'pay', l: 'Payroll', f: (r) => M(r.pay), ns: 1 },
      { k: 'att', l: 'Att', f: (r) => r.att.toLocaleString('en-US'), ns: 1 },
    ], t.seasons.slice().reverse());
  }
  return h;
};
function moneyLi(l, v) { return `<div class="li"><span class="lab t">${l}</span><span class="num">${v < 0 ? '-' : ''}${M(Math.abs(v))}</span></div>`; }

/* ----- history ----- */
VIEWS.hist = function () {
  let h = `<div class="row">${seg('hist', [['champs', 'Champions'], ['career', 'My career'], ['legends', 'Career leaders']], sub.hist)}</div>`;
  const aw = (a) => (a ? `<span data-player="${a.pid}" style="cursor:pointer">${esc(a.name)}</span> <span class="dim">${esc(T(a.tid).abbr)}</span>` : '-');
  if (sub.hist === 'champs') {
    h += table('champs', [
      { k: 'y', l: 'Season', c: 'l', f: (r) => r.y, ns: 1 },
      { k: 'c', l: 'Champion', c: 'n', f: (r) => esc(T(r.champ).abbr) + ` <span class="dim">${r.st[r.champ][0]}-${r.st[r.champ][1]}</span>`, ns: 1 },
      { k: 'r', l: 'Runner-up', c: 'l', f: (r) => esc(T(r.runner).abbr), ns: 1 },
      { k: 'mvp', l: 'MVP', c: 'l', f: (r) => aw(r.aw.mvp), ns: 1 },
      { k: 'fmvp', l: 'Finals MVP', c: 'l', f: (r) => aw(r.aw.fmvp), ns: 1 },
      { k: 'roy', l: 'Rookie', c: 'l', f: (r) => aw(r.aw.roy), ns: 1 },
      { k: 'dpoy', l: 'Defense', c: 'l', f: (r) => aw(r.aw.dpoy), ns: 1 },
      { k: 'smoy', l: 'Sixth man', c: 'l', f: (r) => aw(r.aw.smoy), ns: 1 },
    ], S.hist.slice().reverse(), { rowCls: (r) => (r.champ === S.user ? 'me' : '') });
  } else if (sub.hist === 'career') {
    const c = S.career;
    const cw = c.w, cl = c.l;
    h += `<div class="cards" style="margin-bottom:16px">${card('Seasons', c.seasons, '')}${card('Record', cw + '-' + cl, c.seasons ? (cw / Math.max(1, cw + cl)).toFixed(3).replace(/^0/, '') : '')}${card('Titles', c.titles, '')}${card('Playoffs', S.hist.filter((x) => x.user.po >= 0).length, '')}</div>`;
    h += table('career', [
      { k: 'y', l: 'Season', c: 'l', f: (r) => r.y, ns: 1 },
      { k: 't', l: 'Team', c: 'n', f: (r) => esc(T(r.user.tid).abbr), ns: 1 },
      { k: 'r', l: 'W-L', f: (r) => r.user.w + '-' + r.user.l, ns: 1 },
      { k: 'p', l: 'Result', c: 'l', f: (r) => (r.user.po === 4 ? '<span class="tag">Champion</span>' : r.user.po < 0 ? '<span class="dim">Missed playoffs</span>' : B.ROUNDS[r.user.po]), ns: 1 },
    ], S.hist.slice().reverse());
  } else {
    const rows = S.players.filter((p) => p.s.length).map((p) => {
      let gp = 0, pts = 0, reb = 0, ast = 0; const ys = new Set();
      for (const r of p.s) if (!r.po) { gp += r.gp; pts += r.pts; reb += r.orb + r.drb; ast += r.ast; ys.add(r.y); }
      return { p, gp, pts, reb, ast, yrs: ys.size, aw: p.aw.filter((a) => a.a !== 'champ').length, rings: p.aw.filter((a) => a.a === 'champ').length };
    }).filter((r) => r.gp > 0);
    h += table('legends', [
      { k: 'n', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + (r.p.tid === -2 ? ' <span class="tag o">Ret</span>' : ''), v: (r) => r.p.ln },
      { k: 'yrs', l: 'Yrs', f: (r) => r.yrs, v: (r) => r.yrs },
      { k: 'gp', l: 'GP', f: (r) => r.gp, v: (r) => r.gp },
      { k: 'pts', l: 'Pts', f: (r) => r.pts.toLocaleString('en-US'), v: (r) => r.pts },
      { k: 'ppg', l: 'PPG', f: (r) => f1(r.pts / r.gp), v: (r) => r.pts / r.gp },
      { k: 'reb', l: 'Reb', f: (r) => r.reb.toLocaleString('en-US'), v: (r) => r.reb },
      { k: 'ast', l: 'Ast', f: (r) => r.ast.toLocaleString('en-US'), v: (r) => r.ast },
      { k: 'aw', l: 'Awards', f: (r) => r.aw, v: (r) => r.aw },
      { k: 'rings', l: 'Titles', f: (r) => r.rings, v: (r) => r.rings },
    ], rows, { sort: 'pts', limit: 100, click: (r) => `data-player="${r.p.id}"`, rowCls: (r) => (r.p.tid === S.user ? 'me' : '') });
  }
  return h;
};

/* ---------------- overlays ---------------- */
let ovOpen = false, ovKind = '';
function openOv(html, wide, kind) {
  const ov = $('ov'), sh = $('sheet');
  sh.className = 'sheet' + (wide ? ' wide' : '');
  sh.innerHTML = html;
  ovKind = kind || '';
  if (!ovOpen) { ov.hidden = false; void ov.offsetWidth; ov.classList.add('show'); }
  sh.scrollTop = 0;
  ovOpen = true;
}
function closeOv() {
  if (!ovOpen) return;
  if (ovKind === 'start' || ovKind === 'fired' || ovKind === 'teams') return;
  forceClose();
}
function forceClose() {
  const ov = $('ov');
  ov.classList.remove('show');
  ovOpen = false; ovKind = '';
  setTimeout(() => { if (!ovOpen) ov.hidden = true; }, 220);
}
const closeBtn = `<button class="icon-btn" type="button" data-close aria-label="Close">${ICON.x}</button>`;

function showPlayer(id) {
  const p = P(id);
  if (!p) return;
  const sc = scout(p);
  const team = p.tid >= 0 ? tName(p.tid) : p.tid === -1 ? 'Free agent' : p.tid === -2 ? 'Retired' : `${p.dy} Draft prospect`;
  let h = `<div class="shead"><h2>${esc(name(p))}</h2>${closeBtn}</div>`;
  h += `<p class="line">${esc(team)}  ${p.pos}  ${hgt(p)}  Age ${B.age(p)}${p.dr && p.dr.p ? `  Pick ${p.dr.p} ${p.dr.y}` : ''}</p>`;
  h += `<div class="pbig"><div><span class="lab">Ovr</span><span class="v">${sc.ovr}</span></div><div><span class="lab">Pot</span><span class="v">${sc.pot}</span></div>`;
  if (p.tid >= -1 && p.tid !== -3) h += `<div><span class="lab">${p.tid === -1 ? 'Ask' : 'Salary'}</span><span class="v" style="font-size:22px">${p.tid === -1 ? M(B.askFor(p, S.user, B.prefYears(p))) : M(p.c.amt)}</span><span class="lab">${p.tid === -1 ? B.prefYears(p) + ' yrs' : 'Thru ' + p.c.exp}</span></div>`;
  h += `</div>`;
  if (p.inj) h += `<div class="lab" style="margin-top:10px;color:var(--brand-hover)">${esc(p.inj.t)}  ${p.inj.g} games</div>`;
  h += `<div class="bars">${B.RK.map((k) => { const v = p.r[k] + (p.tid === -3 ? p.fz : 0); return `<div class="bar"><span class="lab">${B.RLABEL[k]}</span><div class="meter"><i style="width:${v}%"></i></div><span>${v}</span></div>`; }).join('')}</div>`;
  // actions
  const btn = [];
  if (p.tid === S.user && !S.fired) {
    if (S.phase === 'resign' && p.c.exp <= S.season) btn.push(`<button class="btn primary" type="button" data-resign="${p.id}">Re-sign</button>`);
    btn.push(`<button class="btn" type="button" data-release="${p.id}">Release</button>`);
    if (!B.tradeOpen()) btn.push(`<button class="btn" type="button" data-tradeoff="${p.id}">Trade</button>`);
  } else if (p.tid >= 0 && !B.tradeOpen() && p.tid !== S.user) btn.push(`<button class="btn primary" type="button" data-tradefor="${p.id}">Trade for</button>`);
  else if (p.tid === -1 && (S.phase === 'fa' || S.phase === 'regular') && !S.fired) btn.push(`<button class="btn primary" type="button" data-offer="${p.id}">Offer contract</button>`);
  if (btn.length) h += `<div class="btns">${btn.join('')}</div>`;
  // awards
  if (p.aw.length) {
    const cnt = {};
    for (const a of p.aw) cnt[a.a] = (cnt[a.a] || []).concat(a.y);
    h += `<h3 style="margin-top:18px">Awards</h3><div class="list">${Object.keys(cnt).map((k) => `<div class="li"><span class="t">${B.AWARDS[k]}${cnt[k].length > 1 ? ' x' + cnt[k].length : ''}</span><span class="d">${cnt[k].join(' ')}</span></div>`).join('')}</div>`;
  }
  // stats
  if (p.s.length) {
    const rows = p.s.slice().sort((a, b) => a.y - b.y || a.po - b.po);
    const tot = { y: 'Career', t: -9, po: 0 }; for (const k of B.SF) tot[k] = 0;
    for (const r of rows) if (!r.po) for (const k of B.SF) tot[k] += r[k];
    const pg = (r, k) => (r.gp ? f1(r[k] / r.gp) : '-');
    h += `<h3 style="margin-top:18px">Stats</h3>` + table('pstats', [
      { k: 'y', l: 'Season', c: 'n', f: (r) => r.y + (r.po ? ' <span class="tag o">PO</span>' : ''), ns: 1 },
      { k: 't', l: 'Tm', c: 'l', f: (r) => (r.t >= 0 ? T(r.t).abbr : ''), ns: 1 },
      { k: 'gp', l: 'GP', f: (r) => r.gp, ns: 1 },
      { k: 'min', l: 'Min', f: (r) => pg(r, 'min'), ns: 1 },
      { k: 'pts', l: 'Pts', f: (r) => pg(r, 'pts'), ns: 1 },
      { k: 'reb', l: 'Reb', f: (r) => (r.gp ? f1((r.orb + r.drb) / r.gp) : '-'), ns: 1 },
      { k: 'ast', l: 'Ast', f: (r) => pg(r, 'ast'), ns: 1 },
      { k: 'stl', l: 'Stl', f: (r) => pg(r, 'stl'), ns: 1 },
      { k: 'blk', l: 'Blk', f: (r) => pg(r, 'blk'), ns: 1 },
      { k: 'fg', l: 'FG%', f: (r) => pct(r.fgm, r.fga), ns: 1 },
      { k: 'tp', l: '3P%', f: (r) => pct(r.tpm, r.tpa), ns: 1 },
      { k: 'ft', l: 'FT%', f: (r) => pct(r.ftm, r.fta), ns: 1 },
    ], rows, { foot: `<tr class="tot"><td class="n">Career</td><td></td><td>${tot.gp}</td><td>${pg(tot, 'min')}</td><td>${pg(tot, 'pts')}</td><td>${tot.gp ? f1((tot.orb + tot.drb) / tot.gp) : '-'}</td><td>${pg(tot, 'ast')}</td><td>${pg(tot, 'stl')}</td><td>${pg(tot, 'blk')}</td><td>${pct(tot.fgm, tot.fga)}</td><td>${pct(tot.tpm, tot.tpa)}</td><td>${pct(tot.ftm, tot.fta)}</td></tr>` });
  }
  if (p.h.length > 1) {
    h += `<h3 style="margin-top:18px">Ratings</h3>` + table('phist', [
      { k: 'y', l: 'Season', c: 'n', f: (r) => r[0], ns: 1 },
      { k: 'a', l: 'Age', f: (r) => r[0] - p.born, ns: 1 },
      { k: 'o', l: 'Ovr', f: (r) => rcell(r[1]), ns: 1 },
      { k: 'p', l: 'Pot', f: (r) => rcell(r[2]), ns: 1 },
    ], p.h.slice().reverse());
  }
  openOv(h, true, 'player');
}

function showBox(gid) {
  const g = S.games.find((x) => x.id === gid);
  if (!g) return;
  const F = B.F;
  let h = `<div class="shead"><h2>${esc(T(g.a).abbr)} ${g.as}  at  ${esc(T(g.h).abbr)} ${g.hs}${g.ot ? ' OT' : ''}</h2>${closeBtn}</div>`;
  h += `<p class="line">${g.po ? `${B.ROUNDS[S.series[g.sr] ? S.series[g.sr].r : 0]} Game ${g.gn || ''}` : 'Day ' + (g.d + 1)}</p>`;
  const per = g.q[0].length;
  const qh = Array.from({ length: per }, (_, i) => (i < 4 ? 'Q' + (i + 1) : 'OT' + (per > 5 ? i - 3 : '')));
  h += `<div style="margin-top:12px">` + table('lines', [
    { k: 't', l: 'Team', c: 'n', f: (r) => esc(T(r.tid).abbr), ns: 1 },
  ].concat(qh.map((l, i) => ({ k: 'q' + i, l, f: (r) => r.q[i], ns: 1 }))).concat([{ k: 'f', l: 'T', f: (r) => `<b>${r.s}</b>`, ns: 1 }]), [
    { tid: g.a, q: g.q[1], s: g.as }, { tid: g.h, q: g.q[0], s: g.hs },
  ]) + `</div>`;
  if (!g.b) { openOv(h, true, 'box'); return; }
  for (const side of [1, 0]) {
    const tid = side ? g.a : g.h;
    const lines = g.b[side].slice().sort((a, b) => b[1 + F.gs] - a[1 + F.gs] || b[1 + F.sec] - a[1 + F.sec]);
    const tot = new Array(17).fill(0);
    for (const l of lines) for (let i = 0; i < 17; i++) tot[i] += l[1 + i];
    const c = (l, k) => l[1 + F[k]];
    h += `<h3 style="margin-top:18px">${esc(tName(tid))}</h3>` + table('box' + side, [
      { k: 'n', l: 'Player', c: 'n', f: (l) => { const p = P(l[0]); return p ? `<span data-player="${p.id}" style="cursor:pointer">${esc(short(p))}</span>` + (c(l, 'gs') ? '' : '') : '-'; }, ns: 1 },
      { k: 'min', l: 'Min', f: (l) => Math.round(c(l, 'sec') / 60), ns: 1 },
      { k: 'pts', l: 'Pts', f: (l) => `<b>${c(l, 'pts')}</b>`, ns: 1 },
      { k: 'reb', l: 'Reb', f: (l) => c(l, 'orb') + c(l, 'drb'), ns: 1 },
      { k: 'ast', l: 'Ast', f: (l) => c(l, 'ast'), ns: 1 },
      { k: 'fg', l: 'FG', f: (l) => c(l, 'fgm') + '-' + c(l, 'fga'), ns: 1 },
      { k: 'tp', l: '3P', f: (l) => c(l, 'tpm') + '-' + c(l, 'tpa'), ns: 1 },
      { k: 'ft', l: 'FT', f: (l) => c(l, 'ftm') + '-' + c(l, 'fta'), ns: 1 },
      { k: 'orb', l: 'Orb', f: (l) => c(l, 'orb'), ns: 1 },
      { k: 'stl', l: 'Stl', f: (l) => c(l, 'stl'), ns: 1 },
      { k: 'blk', l: 'Blk', f: (l) => c(l, 'blk'), ns: 1 },
      { k: 'tov', l: 'TO', f: (l) => c(l, 'tov'), ns: 1 },
      { k: 'pf', l: 'PF', f: (l) => c(l, 'pf'), ns: 1 },
      { k: 'pm', l: '+/-', f: (l) => (c(l, 'pm') > 0 ? '+' : '') + c(l, 'pm'), ns: 1 },
    ], lines, { rowCls: (l) => (lines.indexOf(l) === 5 ? 'cut' : ''), foot: `<tr class="tot"><td class="n">Total</td><td>${Math.round(tot[F.sec] / 60)}</td><td>${tot[F.pts]}</td><td>${tot[F.orb] + tot[F.drb]}</td><td>${tot[F.ast]}</td><td>${tot[F.fgm]}-${tot[F.fga]}</td><td>${tot[F.tpm]}-${tot[F.tpa]}</td><td>${tot[F.ftm]}-${tot[F.fta]}</td><td>${tot[F.orb]}</td><td>${tot[F.stl]}</td><td>${tot[F.blk]}</td><td>${tot[F.tov]}</td><td>${tot[F.pf]}</td><td></td></tr><tr class="tot"><td class="n">Pct</td><td></td><td></td><td></td><td></td><td>${pct(tot[F.fgm], tot[F.fga])}</td><td>${pct(tot[F.tpm], tot[F.tpa])}</td><td>${pct(tot[F.ftm], tot[F.fta])}</td><td colspan="6"></td></tr>` });
  }
  openOv(h, true, 'box');
}
function showSeries(i) {
  const s = S.series[i];
  if (!s) return;
  let h = `<div class="shead"><h2>${esc(T(s.hi).abbr)} ${s.w[0]}  ${esc(T(s.lo).abbr)} ${s.w[1]}</h2>${closeBtn}</div><p class="line">${B.ROUNDS[s.r]}</p>`;
  h += `<div class="list" style="margin-top:12px">${s.g.map((gid, n) => { const g = S.games.find((x) => x.id === gid); return `<div class="li click" data-box="${gid}"><span class="d">G${n + 1}</span><span class="t">${esc(T(g.a).abbr)} ${g.as} at ${esc(T(g.h).abbr)} ${g.hs}${g.ot ? ' OT' : ''}</span></div>`; }).join('') || '<div class="li"><span class="t dim">None</span></div>'}</div>`;
  openOv(h, false, 'series');
}
function showTeam(tid) {
  const t = T(tid);
  const ps = B.teamPlayers(tid).map((p) => ({ p, o: line(p, false) }));
  let h = `<div class="shead"><h2>${esc(t.city + ' ' + t.name)}</h2>${closeBtn}</div><p class="line">${t.rec.w}-${t.rec.l}  Ovr ${B.teamOvr(tid)}  Payroll ${M(B.payroll(tid))}</p><div style="margin-top:12px">`;
  h += table('team-' + tid, [
    { k: 'name', l: 'Player', c: 'n', f: (r) => esc(short(r.p)) + injTag(r.p), v: (r) => r.p.ln },
    { k: 'pos', l: 'Pos', c: 'l', f: (r) => r.p.pos, v: (r) => B.POS.indexOf(r.p.pos) },
    { k: 'age', l: 'Age', f: (r) => B.age(r.p), v: (r) => B.age(r.p) },
    { k: 'ovr', l: 'Ovr', f: (r) => rcell(r.p.ovr), v: (r) => r.p.ovr },
    { k: 'pot', l: 'Pot', f: (r) => rcell(r.p.pot), v: (r) => r.p.pot },
    { k: 'sal', l: 'Salary', f: (r) => M(r.p.c.amt), v: (r) => r.p.c.amt },
    { k: 'exp', l: 'Thru', f: (r) => r.p.c.exp, v: (r) => r.p.c.exp },
    { k: 'pts', l: 'Pts', f: (r) => f1(perGame(r.o, 'pts')), v: (r) => perGame(r.o, 'pts') },
  ], ps, { sort: 'ovr', click: (r) => `data-player="${r.p.id}"` }) + '</div>';
  if (tid !== S.user && !B.tradeOpen()) h += `<div class="btns"><button class="btn primary" type="button" data-tradeteam="${tid}">Trade</button></div>`;
  openOv(h, true, 'team');
}
let offerState = null;
function showOffer(id, resignMode) {
  const p = P(id);
  if (!p) return;
  if (!offerState || offerState.id !== id) offerState = { id, y: B.prefYears(p), amt: B.askFor(p, S.user, B.prefYears(p)), msg: '', resign: !!resignMode };
  const o = offerState;
  const ask = B.askFor(p, S.user, o.y);
  if (o.resign) o.amt = ask;
  let h = `<div class="shead"><h2>${esc(name(p))}</h2>${closeBtn}</div><p class="line">${p.pos}  Age ${B.age(p)}  Ovr ${p.ovr}  Pot ${p.pot}</p>`;
  h += `<div class="group" style="margin-top:14px"><span class="lab">Years</span><div style="margin-top:6px">${seg('offy', [1, 2, 3, 4, 5].map((y) => [y, y]), o.y)}</div></div>`;
  h += `<div class="pbig" style="margin-top:4px"><div><span class="lab">Ask</span><span class="v">${M(ask)}</span></div><div><span class="lab">${o.resign ? 'Total' : 'Offer'}</span><span class="v">${o.resign ? M(ask * o.y) : M(o.amt)}</span></div></div>`;
  if (!o.resign) h += `<div class="row" style="margin-top:10px"><span class="step"><button type="button" data-amt="-1000">-</button><span>1M</span><button type="button" data-amt="1000">+</button></span><span class="step"><button type="button" data-amt="-100">-</button><span>0.1M</span><button type="button" data-amt="100">+</button></span><span class="sp"></span><button class="btn sm" type="button" data-amt="ask">Ask</button><button class="btn sm" type="button" data-amt="min">Min</button></div>`;
  const pay = B.payroll(S.user);
  h += `<div class="list" style="margin-top:12px"><div class="li"><span class="lab t">Payroll after</span><span class="num" style="color:${pay + o.amt > B.CAP ? 'var(--brand-hover)' : ''}">${M(pay + o.amt)}</span></div><div class="li"><span class="lab t">Cap</span><span class="num">${M(B.CAP)}</span></div></div>`;
  h += `<div class="btns"><button class="btn primary" type="button" data-act2="${o.resign ? 'doresign' : 'dooffer'}">${o.resign ? 'Re-sign' : 'Offer'}</button></div>`;
  if (o.msg) h += `<div class="lab" style="margin-top:12px;color:var(--brand-hover)">${esc(o.msg)}</div>`;
  openOv(h, false, 'offer');
}
function confirmBox(title, sub2, yes, act2) {
  openOv(`<div class="shead"><h2>${esc(title)}</h2>${closeBtn}</div>${sub2 ? `<p class="line">${esc(sub2)}</p>` : ''}<div class="btns"><button class="btn primary" type="button" data-act2="${act2}">${esc(yes)}</button><button class="btn" type="button" data-close>Cancel</button></div>`, false, 'confirm');
}

/* ----- start / slots ----- */
function showStart() {
  const m = readMeta();
  let h = `<h2>Basketball Manager</h2><p class="line">Tap tabs to manage the team, sim buttons to play games.</p>`;
  for (const n of SLOTS) {
    const s = m.slots[n];
    h += `<div class="slot"><div class="t">${s ? `<b>${esc(s.team)}</b><span>${s.season}  ${s.w}-${s.l}  Titles ${s.titles}${s.fired ? '  Fired' : ''}</span>` : `<b>Slot ${n}</b><span>Empty</span>`}</div>${s ? `<button class="btn sm primary" type="button" data-slot="${n}" data-sa="load">Continue</button><button class="btn sm" type="button" data-slot="${n}" data-sa="del">Delete</button>` : `<button class="btn sm primary" type="button" data-slot="${n}" data-sa="new">New</button>`}</div>`;
  }
  if (S) h += `<div class="btns"><button class="btn" type="button" data-sa="resume">Resume</button></div>`;
  openOv(h, false, 'start');
}
let pendingSlot = 0, preview = null;
function showTeams(n) {
  pendingSlot = n;
  if (!preview) { preview = { seed: (Math.random() * 2 ** 31) >>> 0 }; B.newLeague(0, preview.seed); preview.state = B.getState(); }
  const st = preview.state;
  B.setState(st);
  const rows = st.teams.map((t) => ({ t, o: B.teamOvr(t.tid) }));
  let h = `<div class="shead"><h2>Pick a team</h2><button class="icon-btn" type="button" data-sa="back" aria-label="Back">${ICON.x}</button></div>`;
  h += `<div class="teampick">` + table('pickteam', [
    { k: 'n', l: 'Team', c: 'n', f: (r) => esc(r.t.city + ' ' + r.t.name), v: (r) => r.t.city },
    { k: 'c', l: 'Conf', c: 'l', f: (r) => B.CONFS[r.t.conf], v: (r) => r.t.conf },
    { k: 'o', l: 'Ovr', f: (r) => r.o, v: (r) => r.o },
    { k: 'm', l: 'Market', c: 'l', f: (r) => (r.t.pop >= 6 ? 'Large' : r.t.pop >= 3 ? 'Mid' : 'Small'), v: (r) => r.t.pop },
    { k: 'p', l: 'Payroll', f: (r) => M(B.payroll(r.t.tid)), v: (r) => B.payroll(r.t.tid) },
  ], rows, { sort: 'o', click: (r) => `data-pickteam="${r.t.tid}"` }) + `</div>`;
  openOv(h, true, 'teams');
}
function startNew(tid) {
  const st = preview.state;
  B.setState(st);
  st.user = tid;
  st.career.teams = [tid];
  st.teams.forEach((t) => { t.auto = true; });
  B.autoLineup(tid, true);
  S = B.getState();
  slot = pendingSlot;
  preview = null;
  tab = 'home';
  sorts.__ = 0;
  lastTitleSeason = 0;
  save();
  forceClose();
  render(true);
}
function showFired() {
  const c = S.career;
  const isBest = Vela.gameOver(c.titles);
  let h = `<div class="shead"><h2>Game over</h2>${isBest && c.titles ? '<span class="tag">New best</span>' : ''}</div><p class="line">Fired by ${esc(tName(S.user))}</p>`;
  h += `<div class="ov-stats"><div><span class="lab">Titles</span><span class="n">${c.titles}</span></div><div><span class="lab">Most titles</span><span class="n">${Vela.best()}</span></div><div><span class="lab">Seasons</span><span class="n">${c.seasons}</span></div><div><span class="lab">Record</span><span class="n">${c.w}-${c.l}</span></div></div>`;
  const offers = B.jobOffers();
  h += `<h3 style="margin-top:18px">Job offers</h3><div class="list">${offers.map((tid) => `<div class="li click" data-job="${tid}"><span class="t">${esc(tName(tid))}</span><span class="d">${T(tid).rec.w}-${T(tid).rec.l}  Ovr ${B.teamOvr(tid)}</span></div>`).join('')}</div>`;
  h += `<div class="btns"><button class="btn primary" type="button" data-sa="again">Play again</button><button class="btn" type="button" data-sa="menu">Menu</button></div>`;
  openOv(h, false, 'fired');
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [data-player], [data-box], [data-team], [data-series], tr[data-tp], tr[data-tk], [data-job], th[data-sort], tr[data-pickteam]');
  if (!el) { if (e.target === $('ov')) closeOv(); return; }
  const d = el.dataset;
  if (d.close !== undefined) { forceClose(); return; }
  if (d.tab) { tab = d.tab; trade.msg = ''; render(true); return; }
  if (d.act) { act(d.act); return; }
  if (d.sa) { slotAction(d.sa, +d.slot); return; }
  if (d.pickteam) { startNew(+d.pickteam); return; }
  if (d.job) { B.newJob(+d.job); S = B.getState(); forceClose(); tab = 'home'; save(); render(true); return; }
  if (d.sort) {
    const [id, k] = d.sort.split(':');
    const cur = sorts[id];
    sorts[id] = cur && cur.k === k ? { k, d: -cur.d } : { k, d: -1 };
    if (ovOpen && ovKind === 'teams') showTeams(pendingSlot); else if (ovOpen && ovKind === 'team') showTeam(+id.split('-')[1]); else render();
    return;
  }
  if (d.seg) { segChange(d.seg, d.v); return; }
  if (d.tp || d.tk) {
    const [side, id] = (d.tp || d.tk).split(':');
    const s = side === 'tg' ? trade.give : trade.get;
    const arr = d.tp ? s.pids : s.picks;
    const i = arr.indexOf(+id); if (i >= 0) arr.splice(i, 1); else arr.push(+id);
    trade.msg = '';
    render();
    return;
  }
  if (d.player) { showPlayer(+d.player); return; }
  if (d.box) { showBox(+d.box); return; }
  if (d.team) { showTeam(+d.team); return; }
  if (d.series) { showSeries(+d.series); return; }
  if (d.min) { const t = T(S.user); B.setMins(+d.min, (t.mins[+d.min] || 0) + +d.d); render(); saveSoon(); return; }
  if (d.mv) { B.moveDepth(+d.mv, +d.d); render(); saveSoon(); return; }
  if (d.ticket) { const t = T(S.user); t.ticket = Math.max(20, Math.min(400, t.ticket + +d.ticket)); render(); saveSoon(); return; }
  if (d.resign) { offerState = null; showOffer(+d.resign, true); return; }
  if (d.offer) { offerState = null; showOffer(+d.offer, false); return; }
  if (d.release) { const p = P(+d.release); const dead = p.c.exp >= B.payYear(); confirmBox('Release ' + short(p), dead ? `${M(p.c.amt)} thru ${p.c.exp} stays on payroll` : '', 'Release', 'release:' + p.id); return; }
  if (d.tradefor) { const p = P(+d.tradefor); trade = { tid: p.tid, give: { pids: [], picks: [] }, get: { pids: [p.id], picks: [] }, msg: '', ok: null }; forceClose(); tab = 'trade'; render(true); return; }
  if (d.tradeoff) { const p = P(+d.tradeoff); trade.give = { pids: [p.id], picks: [] }; trade.msg = ''; forceClose(); tab = 'trade'; render(true); return; }
  if (d.tradeteam) { trade = { tid: +d.tradeteam, give: { pids: [], picks: [] }, get: { pids: [], picks: [] }, msg: '', ok: null }; forceClose(); tab = 'trade'; render(true); return; }
  if (d.draft) { B.draftPick(+d.draft); B.draftUntilUser(false); afterSim(); return; }
  if (d.amt) {
    const p = P(offerState.id);
    if (d.amt === 'ask') offerState.amt = B.askFor(p, S.user, offerState.y);
    else if (d.amt === 'min') offerState.amt = B.MINC;
    else offerState.amt = Math.max(B.MINC, Math.min(B.MAXC, offerState.amt + +d.amt));
    offerState.msg = '';
    showOffer(offerState.id);
    return;
  }
  if (d.act2) { act2(d.act2); return; }
  if (el.id === 'menuBtn') { if (!simming) { save(); showStart(); } return; }
  if (d.lday !== undefined && d.lday !== '') { leagueDay = +d.lday; render(); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'tradeTeam') { trade = { tid: +e.target.value, give: trade.give, get: { pids: [], picks: [] }, msg: '', ok: null }; render(); }
});
function segChange(key, v) {
  if (key === 'auto') { B.setAuto(v === '1'); if (v === '0') { T(S.user).auto = false; } render(); saveSoon(); return; }
  if (key === 'offy') { offerState.y = +v; offerState.amt = B.askFor(P(offerState.id), S.user, +v); offerState.msg = ''; showOffer(offerState.id); return; }
  sub[key] = v;
  render(true);
}
function act2(a) {
  if (a === 'propose') {
    const ev = B.doTrade(trade.tid, trade.give, trade.get);
    if (ev.ok) { trade.msg = 'Accepted'; trade.ok = true; trade.give = { pids: [], picks: [] }; trade.get = { pids: [], picks: [] }; toast('Trade accepted'); save(); }
    else { trade.msg = ev.reason === 'Not enough value' ? 'Rejected' : ev.reason; trade.ok = false; }
    render();
  } else if (a === 'balance') {
    const r = B.balanceTrade(trade.tid, trade.give, trade.get);
    trade.give = r.give;
    trade.msg = r.ok ? 'Balanced' : (r.reason || 'No deal');
    trade.ok = r.ok;
    render();
  } else if (a === 'tclear') { trade.give = { pids: [], picks: [] }; trade.get = { pids: [], picks: [] }; trade.msg = ''; render(); }
  else if (a === 'dooffer') {
    const o = offerState;
    const r = B.offer(o.id, o.amt, o.y);
    if (r.ok) { toast('Signed ' + short(P(o.id))); forceClose(); offerState = null; save(); render(); }
    else { o.msg = r.msg; showOffer(o.id); }
  } else if (a === 'doresign') {
    const o = offerState;
    const r = B.resign(o.id, o.y);
    if (r.ok) { toast('Re-signed ' + short(P(o.id))); forceClose(); offerState = null; save(); render(); }
    else { o.msg = r.msg || 'Failed'; showOffer(o.id, true); }
  } else if (a.startsWith('release:')) {
    B.release(+a.split(':')[1]); forceClose(); save(); render();
  }
}
function slotAction(a, n) {
  if (a === 'load') { if (loadSlot(n)) { lastTitleSeason = S.hist.length ? S.hist[S.hist.length - 1].y : 0; forceClose(); tab = 'home'; render(true); if (S.fired) showFired(); } else toast('Save unreadable'); }
  else if (a === 'new') { preview = null; showTeams(n); }
  else if (a === 'del') { if (n === slot) { S = null; slot = 0; } deleteSlot(n); showStart(); }
  else if (a === 'back') { preview = null; if (S) B.setState(S); showStart(); }
  else if (a === 'resume') { forceClose(); render(); }
  else if (a === 'again') { const n2 = slot; preview = null; showTeams(n2); }
  else if (a === 'menu') { save(); showStart(); }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ovOpen) { closeOv(); return; }
  if (ovOpen || !S || e.target.tagName === 'SELECT') return;
  if (e.key === ' ' || e.key === 'Enter') {
    const b = $('actions').querySelector('.btn.primary:not(:disabled)');
    if (b && document.activeElement && !document.activeElement.closest('main')) { e.preventDefault(); b.click(); }
  }
});
window.addEventListener('pointerdown', () => window.focus());
Vela.onPause((p) => { paused = p; });

/* ---------------- boot ---------------- */
document.fonts.ready.then(() => {
  $('app').classList.add('ready');
  const m = readMeta();
  if (m.last && m.slots[m.last] && loadSlot(m.last)) {
    lastTitleSeason = S.hist.length ? S.hist[S.hist.length - 1].y : 0;
    render(true);
    showStart();
  } else {
    showStart();
  }
  Vela.ready();
});
})();
</script>
</body>
</html>
